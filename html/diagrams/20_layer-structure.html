<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>D20 レイヤー構造</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0f15}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:324px;height:126px;border-radius:12px;overflow:hidden;background:#0b0f15}
#stage{position:absolute;inset:0;background:#151b23}
#stage::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.07) .8px,transparent 1.1px) 0 -2px/10.667px 10.667px}
#svg{position:absolute;left:0;top:0}
text{font-family:'Noto Sans TC',sans-serif}
</style></head><body><div id="card"><div id="stage"><svg id="svg" width="324" height="126" viewBox="0 0 324 126"></svg></div></div>
<script>
/* ================ 共用框架（掃光入場／角框＋中心點／掃光退場），各張共通 ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eo2=x=>1-Math.pow(1-x,2),ei=x=>x*x*x,eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
function tab(arr,p){const i=Math.floor(p),j=Math.min(arr.length-1,i+1),a=arr[cl(i,0,arr.length-1)];return a+(arr[j]-a)*(p-i)}
const NS='http://www.w3.org/2000/svg';
const SVG=document.getElementById('svg');
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||SVG).appendChild(e);return e}
const CYAN='#6ee7f9';
const gC=el('g',{},SVG);
/* 動作從第 0 幀起；SH＝動作第一個可見幀的內部 p 值；做完後停留到 LOOP 結束，硬切重播 */
const SH=20;
function render(f){
  f=Math.floor(f+1e-6)%CFG.LOOP;
  draw(Math.min(f+SH,84),f);
}
/* ===== CFG：D20 圖層結構（說明重疊的構成）===== */
const CFG={
  LOOP:120,                                   // 一輪幀數（30fps）
  layers:[['介面','01'],['邏輯','02'],['資料','03'],['基礎','04']], // 由上到下：[名稱, 編號]
  col:{plates:['#6ee6fd','#236478','#244f5f','#1e3a49'],edge:['#43b5c9','#000008','#000008','#000008'],text:'#eef1f5',top:'#6ee6fd',num:'#8a93a2',line:'#353c46'},
  fontChars:'介面邏輯資料基礎0123456789'
};
const C=CFG.col,CX=101.3;
/* 墜落＋彈跳曲線：相對定位高度的偏移（px），由第一塊板逐幀量測；每塊板晚 9 幀入場 */
const OFF=[-118.5,-83.5,-47.5,-2.5,-24.5,-33.5,-32.5,-19.5,-2.5,-8.5,-3.5,-1.5,0];
const FINAL_TOP=[4,29.5,55,80.5],ENTER=[47,38,29,20]; // 由上到下：定位後的頂點 y、入場幀
const LS=[59,50,41,32];                                // 各層標籤淡入開始幀
const rowY=[23,49,76,101];
const plates=[3,2,1,0].map(L=>{ // 先畫底層，後面的蓋在前面
  const g=el('g',{},gC);
  const eL=el('polygon',{fill:C.edge[L]},g),eR=el('polygon',{fill:C.edge[L]},g),face=el('polygon',{fill:C.plates[L]},g);
  return{g,eL,eR,face,idx:L}});
const gL=el('g',{},gC);
const labs=CFG.layers.map((lv,i)=>{
  const ln=el('line',{x1:175,x2:196,y1:rowY[i],y2:rowY[i],stroke:C.line,'stroke-width':1},gL);
  const t=el('text',{x:204,y:rowY[i]+6,'font-size':17,'font-weight':700,fill:i===0?C.top:C.text},gL);t.textContent=lv[0];
  const n=el('text',{x:295,y:rowY[i]+4,'font-size':10.5,'font-weight':700,fill:C.num},gL);n.textContent=lv[1];
  return{ln,t,n}});
const pts=a=>a.map(v=>v[0].toFixed(2)+','+v[1].toFixed(2)).join(' ');
function draw(p,f){
  plates.forEach(P=>{const k=P.idx,t=p-ENTER[k];
    if(t<0){P.g.style.display='none';return}P.g.style.display='';
    const top=FINAL_TOP[k]+(t>=OFF.length-1?0:tab(OFF,t));
    const hw=72,hh=19.5,ht=5.5,cy=top+hh;
    P.face.setAttribute('points',pts([[CX,top],[CX+hw,cy],[CX,cy+hh],[CX-hw,cy]]));
    P.eL.setAttribute('points',pts([[CX-hw,cy],[CX,cy+hh],[CX,cy+hh+ht],[CX-hw,cy+ht]]));
    P.eR.setAttribute('points',pts([[CX+hw,cy],[CX,cy+hh],[CX,cy+hh+ht],[CX+hw,cy+ht]]))});
  labs.forEach((L,i)=>{const s=LS[i],a=seg(p,s,s+7);
    L.t.style.opacity=a;L.n.style.opacity=seg(p,s+2,s+9);L.ln.style.opacity=seg(p,s-1,s+6)});
}

function start(){const T=q.get('t');if(T!==null){render(+T*30);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load('700 14px "Noto Sans TC"',CFG.fontChars||'').then(()=>document.fonts.load('900 14px "Noto Sans TC"',CFG.fontChars||'')).then(start,start);
</script></body></html>
