<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>D36 數字累計跳動</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0f15}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:324px;height:126px;border-radius:12px;overflow:hidden;background:#151b23;box-shadow:inset 0 0 0 1px #1c2430}
#card::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px) 0 0/12px 12px}
#stage{position:absolute;inset:0}
.lab{position:absolute;left:0;width:324px;top:8px;text-align:center;font-size:13px;font-weight:500;letter-spacing:1.5px;color:#a3a9b4;line-height:16px}
.num{position:absolute;left:0;width:297px;top:25px;text-align:center;font-size:54.5px;font-weight:900;color:#f4f5fa;line-height:55px;white-space:nowrap;font-variant-numeric:tabular-nums}
.unit{position:absolute;left:265px;top:53px;font-size:22px;font-weight:700;color:#5fe3ee;line-height:26px}
.ul{position:absolute;left:40px;top:88px;height:4px;border-radius:2px;background:#88e7fc;transform-origin:0 50%}
.chip{position:absolute;left:108px;top:100px;width:108px;height:24px;box-sizing:border-box;border-radius:12px;border:1.5px solid #8ad8e6;background:#06323c;color:#c8f5fa;font-size:11px;font-weight:700;line-height:21px;text-align:center;white-space:nowrap}
</style></head><body><div id="card"><div id="stage">
<div class="lab" id="lab"></div><div class="num" id="num"></div><div class="unit" id="unit"></div><div class="ul" id="ul"></div><div class="chip" id="chip"></div>
</div></div>
<script>
/* ===== CFG ===== */
const CFG={
  label:'累計業績', unit:'件', chip:'年增率 +128%',
  target:12480,
  cStart:10, cLen:38, pw:2.75,       // 數字 0→目標：緩出，冪次 2.75（量到的曲線）
  ulMax:244,                          // 底線最長（隨數字同步增長）
  labFade:[8,13], unitFade:[20,25],
  chipT0:50, chipScale:[.5,.82,1,1.1,1.12,1.1,1.05,1.01,1],   // 標籤彈出逐幀縮放（量到）
  S:6,   // 動作起始偏移：讓動作從第 0 幀開始，做完停留到結尾後硬切重播
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eoP=(x,p)=>1-Math.pow(1-x,p);
const $=id=>document.getElementById(id);
$('lab').textContent=CFG.label;$('unit').textContent=CFG.unit;$('chip').textContent=CFG.chip;
function render(f){
  f+=CFG.S;
  const t=seg(f,CFG.cStart,CFG.cStart+CFG.cLen),p=eoP(t,CFG.pw);
  $('lab').style.opacity=seg(f,...CFG.labFade);
  $('num').style.opacity=seg(f,6,10);
  $('num').textContent=Math.round(CFG.target*p).toLocaleString('en-US');
  $('unit').style.opacity=seg(f,...CFG.unitFade);
  $('ul').style.width=(CFG.ulMax*p)+'px';$('ul').style.opacity=f>=CFG.cStart?1:0;
  const k=Math.floor(f-CFG.chipT0);
  const sc=f<CFG.chipT0?0:CFG.chipScale[Math.min(CFG.chipScale.length-1,k)];
  $('chip').style.transform='scale('+sc+')';
}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load('900 55px "Noto Sans TC"','0123456789,').then(()=>document.fonts.load('500 13px "Noto Sans TC"','累計業績件年增率+128%')).then(start,start);
</script></body></html>
