<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>D23 4象限マップ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0f15}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:324px;height:126px;border-radius:12px;overflow:hidden;background:#0b0f15}
#stage{position:absolute;inset:0;background:#151b23}
#stage::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.07) .8px,transparent 1.1px) 0 -2px/10.667px 10.667px}
#svg{position:absolute;left:0;top:0}
text{font-family:'Noto Sans TC',sans-serif}
</style></head><body><div id="card"><div id="stage"><svg id="svg" width="324" height="126" viewBox="0 0 324 126"></svg></div></div>
<script>
/* ================ 共用框架（掃光入場／角框＋中心點／掃光退場），各張共通 ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eo2=x=>1-Math.pow(1-x,2),ei=x=>x*x*x,eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
function tab(arr,p){const i=Math.floor(p),j=Math.min(arr.length-1,i+1),a=arr[cl(i,0,arr.length-1)];return a+(arr[j]-a)*(p-i)}
const NS='http://www.w3.org/2000/svg';
const SVG=document.getElementById('svg');
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||SVG).appendChild(e);return e}
const CYAN='#6ee7f9';
const gC=el('g',{},SVG);
/* 動作從第 0 幀起；SH＝動作第一個可見幀的內部 p 值；做完後停留到 LOOP 結束，硬切重播 */
const SH=16;
function render(f){
  f=Math.floor(f+1e-6)%CFG.LOOP;
  draw(Math.min(f+SH,84),f);
}
/* ===== CFG：D23 四象限圖（定位一眼看清）===== */
const CFG={
  LOOP:120,                                   // 一輪幀數（30fps）
  labels:{top:'高品質',bottom:'低品質',left:'← 低價格',right:'高價格 →'},
  // 氣泡 [文字, x, y, 半徑, 開始幀, 是否本方(青色大圓)]
  dots:[['甲牌',87,40,15,31,0],['乙牌',249,37,16,37,0],['丙牌',82,93,13,43,0],['我方',232,84,21,49,1]],
  col:{axis:'#8d96a5',label:'#8a93a2',dot:'#384252',text:'#f1f4f8',cyan:'#6ee6fa',ctext:'#0b1a24',tint:'#6ee6fa'},
  fontChars:'高低品質價格甲乙丙牌我方←→'
};
const C=CFG.col;
const AX=[0,.106,.30,.458,.593,.703,.795,.861,.912,.949,.974,.989,1];                 // 軸線畫出比例 p16~28（量測，橫豎同曲線）
const S_C=[.42,.73,.93,1.06,1.13,1.14,1.11,1.07,1.04,1.0];                              // 一般氣泡彈出倍率
const ME=[125,448,831,1234,1440,1555,1589,1570,1518,1482,1466,1447,1390,1323,1271,1229,1143,1071,1010,977,945,929,920,919,930,956,1000].map(c=>Math.sqrt(c/1000)); // 本方圓：大幅過衝再慢慢回穩（由面積量測）
const TINT=[.05,.09,.08,.06,.05,.045,.04,.04,.04,.045,.05];                              // 右上象限色塊，p53 起
const tint=el('rect',{x:163,y:7,width:148,height:53,rx:6,fill:C.tint},gC);
const hl=el('line',{x1:25,y1:62.3,y2:62.3,stroke:C.axis,'stroke-width':2},gC),vl=el('line',{x1:162,x2:162,y1:6,stroke:C.axis,'stroke-width':2},gC);
const tx=(s,x,y,a)=>{const t=el('text',{x:x,y:y,'text-anchor':a,'font-size':9.5,'font-weight':700,fill:C.label},gC);t.textContent=s;return t};
const labs=[tx(CFG.labels.top,168,15.5,'start'),tx(CFG.labels.bottom,168,120.5,'start'),tx(CFG.labels.left,31,74.5,'start'),tx(CFG.labels.right,295,74.5,'end')];
const dots=CFG.dots.map(d=>{const g=el('g',{},gC);
  el('circle',{r:d[3],fill:d[5]?C.cyan:C.dot},g);
  const t=el('text',{x:0,y:d[5]?5.8:4.6,'text-anchor':'middle','font-size':d[5]?16:13,'font-weight':900,fill:d[5]?C.ctext:C.text},g);t.textContent=d[0];return g});
function draw(p,f){
  const a=p<16?0:tab(AX,p-16);
  hl.style.display=a<=0?'none':'';hl.setAttribute('x2',25+273*a);
  vl.style.display=a<=0?'none':'';vl.setAttribute('y2',6+112*a);
  const la=seg(p,30,34);labs.forEach(t=>t.style.opacity=la);
  tint.style.opacity=p<53?0:(p-53>=TINT.length?.05:tab(TINT,p-53));
  CFG.dots.forEach((d,i)=>{const t=p-d[4];let s=0;
    if(t>=0)s=d[5]?(t>=ME.length-1?1:tab(ME,t)):(t>=S_C.length-1?1:tab(S_C,t));
    dots[i].setAttribute('transform','translate('+d[1]+' '+d[2]+') scale('+s+')');dots[i].style.display=s<=.01?'none':''});
}

function start(){const T=q.get('t');if(T!==null){render(+T*30);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load('700 14px "Noto Sans TC"',CFG.fontChars||'').then(()=>document.fonts.load('900 14px "Noto Sans TC"',CFG.fontChars||'')).then(start,start);
</script></body></html>
