<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>D02 進度條解說</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0f15}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:324px;height:126px;border-radius:12px;overflow:hidden;background:#151b23;box-shadow:inset 0 0 0 1px #1d2530}
#card::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px) 0 0/12px 12px}
svg{position:absolute;left:0;top:0}
text{font-family:'Noto Sans TC',sans-serif}
</style></head><body><div id="card"><svg id="s" width="324" height="126" viewBox="0 0 324 126"></svg></div>
<script>
/* ===== CFG ===== */
const CFG={
  title:'PROGRESS',
  rows:[{name:'設計',pct:100,start:13},{name:'開發',pct:65,start:21},{name:'測試',pct:30,start:29}], // 各列目標與起始幀
  rowY:[37,69,101], barX:[75,231], growLen:24,
  doneFrame:33,            // 第一列補滿後變亮色的幀
  brightRows:[1],          // 一開始就是亮色填充的列
  totalText:'整體 65%', totalStart:49, checkStart:43, headStart:12,
  cyan:'#6ee5f8', dim:'#2a8ba5', trackC:'#232c38', white:'#f1f4f9',
  SH:12,                   // 幀偏移：render(0) 對應動作內部第 12 幀（動作從第 0 幀附近起跑）
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const NS='http://www.w3.org/2000/svg';const S=document.getElementById('s');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||S).appendChild(e);return e}
const root=el('g',{});
const head=el('text',{x:17,y:13,'font-size':8,'font-weight':900,fill:CFG.cyan,'letter-spacing':1.2},root);head.textContent=CFG.title;
const BW=CFG.barX[1]-CFG.barX[0];
const R=CFG.rows.map((r,i)=>{
  const y=CFG.rowY[i],g=el('g',{},root);
  const track=el('rect',{x:CFG.barX[0],y:y-7.5,width:BW,height:15,rx:7.5,fill:CFG.trackC},g);
  const fill=el('rect',{x:CFG.barX[0],y:y-7.5,width:0,height:15,rx:7.5,fill:CFG.dim},g);
  const nm=el('text',{x:17,y:y+5.5,'font-size':15,'font-weight':900,fill:CFG.white},g);nm.textContent=r.name;
  const pc=el('text',{x:302,y:y+6,'font-size':17,'font-weight':900,fill:CFG.white,'text-anchor':'end'},g);
  return{g,track,fill,nm,pc,r,y}
});
const chk=el('g',{},root);
el('circle',{cx:0,cy:0,r:7,fill:'#0f3f52'},chk);
el('path',{d:'M-3.2 .2L-1 2.5L3.4 -2.6',fill:'none',stroke:CFG.white,'stroke-width':1.8,'stroke-linecap':'round','stroke-linejoin':'round'},chk);
const tot=el('text',{x:302,y:120,'font-size':8,'font-weight':700,fill:'#7c8693','text-anchor':'end'},root);tot.textContent=CFG.totalText;
const POP=[.4,.75,1,1.15,1.05,1];
function render(F){
  F+=CFG.SH;
  head.setAttribute('opacity',seg(F,CFG.headStart,CFG.headStart+5));
  R.forEach((o,i)=>{
    const st=o.r.start;
    const a=seg(F,st,st+4),la=seg(F,st+4,st+8);
    o.track.setAttribute('opacity',a);
    const p=eo(seg(F,st,st+CFG.growLen));
    const w=F<st?0:Math.max(15*a,p*BW*o.r.pct/100);
    o.fill.setAttribute('width',w.toFixed(2));o.fill.setAttribute('opacity',a);
    const done=i===0?F>=CFG.doneFrame:false;
    o.fill.setAttribute('fill',(done||CFG.brightRows.includes(i))?CFG.cyan:CFG.dim);
    o.nm.setAttribute('opacity',la);o.pc.setAttribute('opacity',la);
    o.pc.textContent=Math.round(p*o.r.pct)+'%';
    o.pc.setAttribute('fill',done?CFG.cyan:CFG.white);
  });
  const cs=CFG.checkStart,t=F-cs,sc=t<0?0:POP[Math.min(5,Math.floor(t))];
  chk.setAttribute('transform',`translate(${CFG.barX[1]-10} ${CFG.rowY[0]}) scale(${sc})`);
  tot.setAttribute('opacity',seg(F,CFG.totalStart,CFG.totalStart+6));
}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load('900 15px "Noto Sans TC"','設計開發測試整體PROGRESS0123456789%').then(start,start);
</script></body></html>
