<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>D39 百分比強調</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0f15}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:324px;height:126px;border-radius:12px;overflow:hidden;background:#151b23;box-shadow:inset 0 0 0 1px #1c2430}
#card::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px) 0 0/12px 12px}
#stage{position:absolute;inset:0}
svg{position:absolute;left:0;top:0}
.num{position:absolute;left:43px;width:100px;top:44.5px;text-align:center;font-size:32px;font-weight:900;line-height:36px;color:#f6f7fb;white-space:nowrap}
.num::after{content:"%";font-size:11px;font-weight:900;color:#5fe3ee;margin-left:1px}
.l1{position:absolute;left:180px;top:23px;font-size:26px;font-weight:900;line-height:32px;color:#5fe3ee;white-space:nowrap}
.l2{position:absolute;left:180px;top:63px;font-size:12px;font-weight:500;line-height:16px;color:#97a0b0;white-space:nowrap}
.l3{position:absolute;left:180px;top:78px;font-size:23px;font-weight:900;line-height:28px;white-space:nowrap}
</style></head><body><div id="card"><div id="stage"><svg width="324" height="126" id="svg"></svg>
<div class="num" id="num"></div><div class="l1" id="l1"></div><div class="l2" id="l2"></div><div class="l3" id="l3"></div></div></div>
<script>
/* ===== CFG ===== */
const CFG={
  cx:93, cy:62.5, R:43, sw:12, target:78,
  track:'rgb(34,43,55)', arc:'rgb(104,226,246)',
  t0:8.5, len:29, pw:2.1,                 // 弧線與數字同步：緩出（量到）
  label:'達成率', small:'距離目標', big:'還差 22%',
  f1:[19.5,24.5], f2:[34.5,38.5], f3:[37.5,44],   // 三段文字淡入的幀區間
  off:6,                                  // 起點偏移：動作從第 0 幀附近開始
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eoP=(x,p)=>1-Math.pow(1-x,p);
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('svg'),$=id=>document.getElementById(id);
const el=(a)=>{const e=document.createElementNS(NS,'path');for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
const full=document.createElementNS(NS,'circle');[['cx',CFG.cx],['cy',CFG.cy],['r',CFG.R],['fill','none'],['stroke',CFG.track],['stroke-width',CFG.sw]].forEach(([k,v])=>full.setAttribute(k,v));svg.appendChild(full);
const arc=el({fill:'none',stroke:CFG.arc,'stroke-width':CFG.sw,'stroke-linecap':'round'});
$('l1').textContent=CFG.label;$('l2').textContent=CFG.small;$('l3').textContent=CFG.big;
function pathAt(deg){const t=deg*Math.PI/180;const x=CFG.cx+CFG.R*Math.sin(t),y=CFG.cy-CFG.R*Math.cos(t);
  return 'M'+CFG.cx+' '+(CFG.cy-CFG.R)+'A'+CFG.R+' '+CFG.R+' 0 '+(deg>180?1:0)+' 1 '+x+' '+y}
function render(f){
  const p=eoP(seg(f,CFG.t0,CFG.t0+CFG.len),CFG.pw);
  const deg=Math.max(.01,3.6*CFG.target*p);
  arc.setAttribute('d',pathAt(deg));
  $('num').textContent=Math.round(CFG.target*p);
  $('l1').style.opacity=seg(f,...CFG.f1);
  $('l2').style.opacity=seg(f,...CFG.f2);
  const g=seg(f,...CFG.f3);$('l3').style.opacity=g>0?Math.min(1,g*2):0;
  const c=Math.round(70+185*g);$('l3').style.color='rgb('+c+','+c+','+c+')';
}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP+CFG.off);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP+CFG.off);requestAnimationFrame(tick)})()}
document.fonts.load('900 40px "Noto Sans TC"','0123456789%').then(()=>document.fonts.load('900 26px "Noto Sans TC"','達成率還差 22%')).then(()=>document.fonts.load('500 12px "Noto Sans TC"','距離目標')).then(start,start);
</script></body></html>
