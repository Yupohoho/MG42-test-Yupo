<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>D16 D16 垂直堆疊步驟</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0f15}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
body.m{display:block;min-height:0}
#card{position:relative;width:324px;height:126px;border-radius:12px;overflow:hidden;background:#151b23;box-shadow:inset 0 0 0 1px #1b2029}
#card::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.07) .8px,transparent 1px) 0 0/12px 12px}
#svg{position:absolute;left:0;top:0;display:block}
</style></head><body><div id="card"><svg id="svg" width="324" height="126" viewBox="0 0 324 126"></svg></div>
<script>
/* ===== CFG ===== */
const CFG={
  steps:['準備','設計','執行','回顧'],
  go:'GO',
  cyan:'#6fe6f8',
  fontText:'準備設計執行回顧GO1234',
  A:-2, LOOP:120
};
/* ================ */

const q=new URLSearchParams(location.search);
const card=document.getElementById('card'),svg=document.getElementById('svg');
const Z=+q.get('z')||1;if(Z!=1)card.style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const NS='http://www.w3.org/2000/svg';
function E(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
const SANS='"Noto Sans TC",sans-serif',MONO='"Roboto Mono",monospace';
function T(p,str,x,y,sz,fill,o){o=o||{};const t=E('text',{x:x,y:y,'font-size':sz,fill:fill,'text-anchor':o.a||'middle','dominant-baseline':'central','font-weight':o.w||700,'font-family':o.f||SANS},p);if(o.ls)t.setAttribute('letter-spacing',o.ls);t.textContent=str;return t}
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const POP=[.45,.78,.98,1.09,1.12,1.10,1.05,1.02,1.0];
const pv=(arr,k)=>k<0?0:(k>=arr.length?1:arr[k]);
function setT(g,cx,cy,sx,sy,dx,dy){g.setAttribute('transform','translate('+(cx+(dx||0))+' '+(cy+(dy||0))+') scale('+sx+' '+sy+') translate('+(-cx)+' '+(-cy)+')')}
function show(e,v){e.style.display=v?'':'none'}
const CY=CFG.cyan,BG='#151b23',PANEL='#0b0f15';
const gC=E('g');
const SC=scene();
/* 動作從第 0 幀起（s=f+2，第 0 幀即第一個元素出現）；做完後停留到 LOOP 結束，硬切重播 */
function render(f){
  SC.draw(f-CFG.A);
}
function start(){
  const T0=q.get('t');
  if(T0!==null){render(Math.floor(+T0*30+1e-6)%CFG.LOOP);return}
  const t0=performance.now();
  (function tick(){render(Math.floor((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})();
}
const FONTTXT=CFG.fontText||'';
Promise.all([document.fonts.load('700 14px "Noto Sans TC"',FONTTXT),document.fonts.load('900 14px "Noto Sans TC"',FONTTXT),document.fonts.load('500 8px "Roboto Mono"','0123456789YESNO')]).then(start,start);


function scene(){
  const g=gC,TOP=[5,34.2,63.4,92.6],RH=26,RX=42,RW=240;
  const rS=[2,11,20,28],OFF=[-186,-29,-18.5,-12.5,-7.5,-4.5,-1,.5,0];
  const ckS=[35,41,46],ckD=7;
  const rows=[],dots=[];
  for(let i=0;i<4;i++){
    const last=i==3,gg=E('g',{},g),cy=TOP[i]+RH/2;
    const rc=E('rect',{x:RX,y:TOP[i],width:RW,height:RH,rx:7,fill:'#282d38'},gg);
    const cir=E('g',{},gg);
    const cc=E('circle',{cx:61,cy:cy,r:8,fill:CY},cir);
    const cn=T(cir,String(i+1),61,cy+.5,9,'#0b1f2a',{w:900});
    const tx=T(gg,CFG.steps[i],81,cy+.5,12,'#f2f5f9',{a:'start',w:900});
    let ck=null;
    if(!last)ck=E('path',{d:'M258.5 '+(cy)+' L262.2 '+(cy+3.8)+' L269.5 '+(cy-5),pathLength:1,fill:'none',stroke:CY,'stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':'1 1'},g);
    let go=null;if(last)go=T(gg,CFG.go,266,cy+.5,8,'#2a6a74',{f:MONO,w:700});
    rows.push({gg,cir,tx,ck,go,cy,rc,cc,cn});
    if(i<3)dots.push(E('circle',{cx:162,cy:TOP[i]+RH+2.1,r:1.4,fill:'#6f7a8a'},g));
  }
  const dS=[10,19,28],HS=ckS[2]+ckD;
  const mix=(a,b,u)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const x=p(a),y=p(b);return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*u)).join(',')+')'};
  return{draw(s){
    rows.forEach((r,i)=>{const k=s-rS[i];show(r.gg,k>=0);
      if(k>=0){const o=k>=OFF.length?0:OFF[k];r.gg.setAttribute('transform','translate('+o+' 0)');
        const ck2=s-(rS[i]+3);const sc=pv([.25,.55,.8,.95,1],ck2);show(r.cir,sc>0);if(sc>0)setT(r.cir,61,r.cy,sc,sc);
        r.tx.style.opacity=cl((s-rS[i]-1)/3)}
      if(r.ck){const p=cl((s-ckS[i])/ckD);show(r.ck,p>0);r.ck.setAttribute('stroke-dashoffset',1-p);const rowOff=0;}
      if(r.go){const u=cl((s-HS)/3),M=(c1,c2)=>mix(c1,c2,u);r.go.style.opacity=u;
        /* 前三項打勾全部完成後，第四項才變色 */
        r.rc.setAttribute('fill',M('#282d38',CY));r.cc.setAttribute('fill',M(CY,'#0b1f2a'));r.cn.setAttribute('fill',M('#0b1f2a',CY));r.tx.setAttribute('fill',M('#f2f5f9','#0b1f2a'))}});
    dots.forEach((d,i)=>show(d,s>=dS[i]));
  }}
}

</script></body></html>
