<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>N26 cart-badge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0a0d12}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
body.m{display:block;min-height:0}
#wrap{position:relative;width:324px;height:124px;transform-origin:center}
body.m #wrap{transform-origin:0 0}
#card{position:absolute;left:0;top:0;width:324px;height:124px;border-radius:12px;overflow:hidden;
 background:radial-gradient(130% 100% at 50% 0%,#1d1a2f 0%,#141824 55%,#0f131b 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
#card *{box-sizing:border-box}
.abs{position:absolute}

#btn{position:absolute;left:49px;top:47px;width:98px;height:36px;border-radius:18px;background:#ff64aa;color:#2a1030;font:900 11px/36px 'Noto Sans JP';text-align:center;white-space:nowrap}
#cart{position:absolute;left:210px;top:45px;width:40px;height:40px}
#bd{position:absolute;left:236px;top:34px;width:19px;height:19px;border-radius:50%;background:#8b7cf6;color:#fff;font:800 10.5px/19px Outfit;text-align:center;box-shadow:0 0 8px rgba(139,124,246,.6)}
#pt{position:absolute;width:8px;height:8px;background:#7dffc4;transform:rotate(45deg);box-shadow:0 0 8px #7dffc4;left:0;top:0}
#cur{position:absolute;left:0;top:0;width:12px;height:17px}
</style></head><body>
<div id="wrap"><div id="card"><div id="btn"></div><svg id="cart" viewBox="0 0 40 40"><path d="M3 6h5l4 18h19l3-13H10" fill="none" stroke="#f3f4f8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15" cy="32" r="2.6" fill="none" stroke="#f3f4f8" stroke-width="2.6"/><circle cx="28" cy="32" r="2.6" fill="none" stroke="#f3f4f8" stroke-width="2.6"/></svg><div id="bd">1</div><div id="pt"></div><div id="cur"></div></div></div>
<script>
// N26 カートバッジ / cart-badge
var LOOP=120; // frames @30fps (4s)
var CFG={button:"カートに追加",clicks:[12,32,52],press:[9,30,51],btnPress:[[-1,1],[0,.96],[1,.92],[3,.92],[4,.99],[5,1]],curPress:[[-1,1],[0,.88],[1,.8],[2,.78],[3,.8],[4,.97],[5,1]]};
var FONTS=[["800 40px Outfit","0123456789,.%¥"],["700 12px Outfit","SECONDS"],["700 12px 'Noto Sans JP'","カートに追加残り点あとわずか"]];

var FPS=30;
var q=new URLSearchParams(location.search);
function C(v,a,b){a=a==null?0:a;b=b==null?1:b;return Math.min(b,Math.max(a,v))}
var E={lin:function(x){return x},out:function(x){return 1-Math.pow(1-x,3)},inn:function(x){return x*x*x},
 io:function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},
 back:function(x){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
function seg(f,a,b,e){return (e||E.lin)(C((f-a)/(b-a)))}
function kf(f,a){if(f<=a[0][0])return a[0][1];for(var i=1;i<a.length;i++){if(f<a[i][0]){var p=a[i-1],n=a[i];return p[1]+(n[1]-p[1])*(f-p[0])/(n[0]-p[0])}}return a[a.length-1][1]}
function $(id){return document.getElementById(id)}
function mix(a,b,t){return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)]}
function rgb(c,al){return al==null?'rgb('+c[0]+','+c[1]+','+c[2]+')':'rgba('+c[0]+','+c[1]+','+c[2]+','+al+')'}
function comma(n){n=Math.round(n);var s=String(n);return s.length>3?s.slice(0,s.length-3)+','+s.slice(-3):s}
var CURSOR='<svg width="12" height="17" viewBox="0 0 12 17"><path d="M1 1v13l3.4-3.2 2.4 5 2.2-1-2.3-4.9H11z" fill="#fff" stroke="#1a1d26" stroke-width="1"/></svg>';
function boot(){
 if(q.get('m'))document.body.classList.add('m');
 var z=+q.get('z')||1;$('wrap').style.transform='scale('+z+')';
 if(typeof init==='function')init();
 if(q.has('t')){render(((+q.get('t')*FPS)%LOOP+LOOP)%LOOP);return}
 var t0=performance.now();
 (function tick(now){render(((now-t0)/1000*FPS)%LOOP);requestAnimationFrame(tick)})(t0);
}
Promise.all(FONTS.map(function(f){return document.fonts.load(f[0],f[1])})).then(boot,boot);


var AR=[20,40,60];
function init(){$('btn').textContent=CFG.button;$('cur').innerHTML=CURSOR}
function render(f){
 var cl=CFG.clicks,pr=0,g=0;
 for(var i=0;i<cl.length;i++){if(f>=cl[i]){pr=Math.max(pr,1-seg(f,cl[i],cl[i]+5,E.out));g=Math.max(g,f<cl[i]+12?1-seg(f,cl[i],cl[i]+12):0)}}
 var bs=1,cs=1;for(var i=0;i<CFG.press.length;i++){var d=f-CFG.press[i];if(d>=-1&&d<=5){bs=kf(d,CFG.btnPress);cs=kf(d,CFG.curPress)}}
 var b=$('btn');b.style.transform='scale('+bs+')';
 b.style.boxShadow='0 0 '+(4+18*g)+'px rgba(255,100,170,'+(.2+.55*g)+')';
 // badge count
 var n=0,A=0;for(var i=0;i<AR.length;i++){if(f>=AR[i]&&f<95){n=i+1;A=AR[i]}}
 var bd=$('bd');bd.textContent=n||1;
 var s=0;
 if(n===1)s=seg(f,A,A+7,E.back);else if(n>1)s=1+.5*(1-seg(f,A,A+8,E.out));
 if(f>=90)s=Math.min(s||1,1-seg(f,90,96,E.inn));
 if(f>=96)s=0;
 bd.style.transform='scale('+s+')';
 // cart tilt
 var rot=0;if(n){var age=f-A;if(age<16)rot=-14*Math.exp(-age/4)*Math.cos(age*.8)}
 $('cart').style.transform='rotate('+rot+'deg)';
 // particle
 var pt=$('pt');pt.style.opacity=0;
 for(var i=0;i<cl.length;i++){var u=(f-cl[i])/8;if(u>=0&&u<=1){
  var x=(1-u)*(1-u)*98+2*u*(1-u)*150+u*u*240,y=(1-u)*(1-u)*52+2*u*(1-u)*6+u*u*48;
  pt.style.left=(x-4)+'px';pt.style.top=(y-4)+'px';pt.style.opacity=1-.6*u*u;pt.style.transform='rotate(45deg) scale('+(1-.3*u)+')';}}
 // cursor
 var c=$('cur'),ox=0,oy=0,co=1;
 if(f<100){var k=seg(f,88,100,E.io);ox=60*k;oy=40*k;co=1-seg(f,92,100)}
 else{var k2=1-seg(f,108,118,E.out);ox=60*k2;oy=40*k2;co=seg(f,108,112)}
 c.style.left=(118+ox)+'px';c.style.top=(72+oy)+'px';c.style.opacity=co;c.style.transform='scale('+cs+')';
}

</script></body></html>
