<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N14 Seven Segment</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;height:100%;background:#090d13}
body{display:flex;align-items:center;justify-content:center;font-family:"Plus Jakarta Sans",sans-serif}
body.m{display:block}
#card{position:relative;width:322px;height:125px;border-radius:12px;overflow:hidden;flex:none;
 background:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 1.3px) 0 0/14px 14px,linear-gradient(180deg,#151b25,#11171f)}
#card::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
svg text{font-family:"Plus Jakarta Sans",sans-serif}
.lab{font-size:9px;font-weight:800;letter-spacing:2.2px;fill:#9aa3b8}
.big{font-weight:800}
</style></head><body>
<div id="card"><svg width="322" height="125" viewBox="0 0 322 125" style="position:absolute;left:0;top:0">
<text class="lab" x="161" y="24" text-anchor="middle">ENERGY&#160; kWh</text>
<g id="disp"></g>
</svg></div>
<script>
const q=new URLSearchParams(location.search);
const card=document.getElementById('card');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const outC=u=>1-Math.pow(1-clamp(u),3);
const ss=u=>{u=clamp(u);return u*u*(3-2*u)};
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'};
const NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
document.body.classList.toggle('m',q.get('m')==='1');
card.style.zoom=+q.get('z')||1;
function start(specs){
 const go=()=>{
  build();
  const t=q.get('t');
  if(t!==null){render(parseFloat(t)*30);document.body.dataset.ready='1';}
  else{const t0=performance.now();const loop=n=>{render(((n-t0)/1000*30)%LOOP);requestAnimationFrame(loop)};requestAnimationFrame(loop);}
 };
 Promise.all(specs.map(s=>document.fonts.load(s[0],s[1]))).then(go,go);
}

const CFG={target:48620,slots:6,x0:66.5,pitch:33.6,w:26,h:50,top:36,t:4.6,on:'#ff5fa8',hot:'#ffd1e6'};
const LOOP=120;
const MAP={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcdfg'};
let segs=[],grp;
function hexa(x0,x1,yc,t){return [[x0,yc],[x0+t/2,yc-t/2],[x1-t/2,yc-t/2],[x1,yc],[x1-t/2,yc+t/2],[x0+t/2,yc+t/2]]}
function hexv(xc,y0,y1,t){return [[xc,y0],[xc+t/2,y0+t/2],[xc+t/2,y1-t/2],[xc,y1],[xc-t/2,y1-t/2],[xc-t/2,y0+t/2]]}
function build(){
 grp=document.getElementById('disp');
 const w=CFG.w,h=CFG.h,t=CFG.t,g0=2.2;
 for(let s=0;s<CFG.slots;s++){
  const G=mk('g',{transform:'translate('+(CFG.x0+CFG.pitch*s)+' '+CFG.top+')'},grp);
  const geo={a:hexa(g0,w-g0,t/2,t),g:hexa(g0,w-g0,h/2,t),d:hexa(g0,w-g0,h-t/2,t),
   f:hexv(t/2,g0+.6,h/2-g0+.6,t),b:hexv(w-t/2,g0+.6,h/2-g0+.6,t),e:hexv(t/2,h/2+g0-.6,h-g0-.6,t),c:hexv(w-t/2,h/2+g0-.6,h-g0-.6,t)};
  const o={};
  for(const k in geo)o[k]=mk('polygon',{points:geo[k].map(p=>p.join(',')).join(' ')},G);
  segs.push(o);
 }
}
function val(f){
 if(f<1)return 0;
 if(f<100)return CFG.target*outC((f-1)/70);
 return CFG.target*(1-ss((f-100)/10.5));
}
function render(f){
 const v=Math.round(val(f));
 const s=String(v).padStart(CFG.slots,' ');
 const flash=ss((f-68)/5)*(1-ss((f-78)/10));
 const c=mix(CFG.on,CFG.hot,flash);
 for(let i=0;i<CFG.slots;i++){
  const on=MAP[s[i]]||'';
  for(const k in segs[i]){
   const lit=on.indexOf(k)>=0;
   segs[i][k].setAttribute('fill',lit?c:'rgba(255,95,168,.09)');
  }
 }
 grp.style.filter='drop-shadow(0 0 '+(3+flash*3)+'px rgba(255,90,160,'+(.75+.2*flash)+'))';
}
start([['700 12px "Plus Jakarta Sans"','ENERGYkWh']]);
</script></body></html>
