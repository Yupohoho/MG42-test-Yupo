<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>N18 Donut Share</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0a0d13}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
body.m{display:block}
#wrap{width:322px;height:126px;transform-origin:center center}
body.m #wrap{transform-origin:0 0}
#card{position:relative;width:322px;height:126px;border-radius:12px;overflow:hidden;background:#131921;font-family:'Montserrat','Noto Sans JP',sans-serif;color:#f3f4f8;-webkit-font-smoothing:antialiased}
#card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(244,114,182,.10),transparent 70%),radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px) 0 0/14px 14px}
#card::after{content:'';position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none;z-index:60}
#card>*{position:absolute}
svg{overflow:visible}
#g,#lg,#lbs,#rws,#bks{left:0;top:0;width:322px;height:126px}
#g>*,#lg>*,#lbs>*,#rws>*,#bks>*{position:absolute}

.lg{font:500 10px/14px Montserrat,sans-serif;color:#7a8291;left:212px;width:70px}
.vl{font:800 14px/16px Montserrat,sans-serif;right:15px;text-align:right;color:#f3f4f8}
.ct{left:50.5px;width:100px;top:46px;text-align:center;font:800 23px/26px Montserrat,sans-serif}
.tt{left:50.5px;width:100px;top:73px;text-align:center;font:700 6.5px/8px Montserrat,sans-serif;letter-spacing:1.4px;color:#7d8696}
</style></head>
<body><div id="wrap"><div id="card"><svg id="sv" width="322" height="126" style="left:0;top:0"></svg>
<div class="ct" id="ct">0</div><div class="tt">TOTAL %</div><div id="lg"></div></div></div>
<script>

const P=new URLSearchParams(location.search);
const FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo2=t=>{t=clamp(t);return 1-(1-t)*(1-t)};
const eo3=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const ei2=t=>{t=clamp(t);return t*t};
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const sst=t=>{t=clamp(t);return t*t*(3-2*t)};
const ebk=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const $=id=>document.getElementById(id);
function render(t){const c=(((t*FPS)%LOOP)+LOOP)%LOOP;draw(c)}
function boot(){
  if(P.get('m')==='1')document.body.classList.add('m');
  const z=+(P.get('z')||1);$('wrap').style.transform='scale('+z+')';
  const t0=P.get('t');
  if(t0!==null){render(+t0)}else{const s=performance.now();(function f(){render((performance.now()-s)/1000);requestAnimationFrame(f)})()}
}


/* 實測：右側數字到目標值時縮放(相對倍率，每幀1格，共14幀，以數字中心縮放)；dotx=圓點移到各列文字前方 */
const CFG={cx:100.5,cy:62,r:44,sw:10,total:100,dotx:200,pop:[1.056,1.11,1.167,1.167,1.167,1.11,1.11,1.11,1.083,1.083,1.056,1.056,1.056,1],popAt:[22,37,52.5],
  seg:[{n:'Mobile',v:60,col:'#f472b6',y:33,s:0,t0:-1,T:24},{n:'Desktop',v:25,col:'#a78bfa',y:62,s:60,t0:14.5,T:24},{n:'Tablet',v:15,col:'#6ee7b7',y:91,s:85,t0:30,T:22}]};
const LOOP=120;
const NS='http://www.w3.org/2000/svg';
const sv=$('sv');
function mk(tag,at){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);sv.appendChild(e);return e}
mk('circle',{cx:CFG.cx,cy:CFG.cy,r:CFG.r,fill:'none',stroke:'#1a212b','stroke-width':CFG.sw});
const arcs=CFG.seg.map(s=>mk('circle',{cx:CFG.cx,cy:CFG.cy,r:CFG.r,fill:'none',stroke:s.col,'stroke-width':CFG.sw,pathLength:100,transform:'rotate(-90 '+CFG.cx+' '+CFG.cy+')'}));
const dots=CFG.seg.map(s=>mk('circle',{cx:CFG.dotx,cy:s.y,r:3.2,fill:s.col}));
const rows=CFG.seg.map(s=>{
  const a=document.createElement('div');a.className='lg';a.textContent=s.n;a.style.top=(s.y-7.5)+'px';
  const b=document.createElement('div');b.className='vl';b.style.top=(s.y-9)+'px';
  $('lg').append(a,b);return b});
function draw(c){
  const ex=ei2((c-92)/16);
  CFG.seg.forEach((s,i)=>{
    const p=s.v*eo3((c-s.t0)/s.T)*(1-ex);
    const len=Math.max(0,p-0.9);
    arcs[i].setAttribute('stroke-dasharray',len+' 200');
    arcs[i].setAttribute('stroke-dashoffset',-(s.s+0.45));
    arcs[i].setAttribute('opacity',p>0.3?1:0);
    rows[i].textContent=Math.round(p)+'%';
    const q=c-CFG.popAt[i];let ps=1;if(q>=0&&q<13){const j=Math.floor(q);ps=lerp(CFG.pop[j],CFG.pop[j+1],q-j)}
    rows[i].style.transform='scale('+ps+')';
  });
  let tot=c<0?0:Math.min(100,(c+1)*1.9);
  if(c>89)tot=Math.max(0,100-5.5*(c-89));
  $('ct').textContent=Math.round(tot);
}

const FONT_LOADS=[document.fonts.load('800 20px Montserrat','0123456789+%¥.,'),document.fonts.load('700 12px Montserrat','AoiRenMikaSora'),document.fonts.load('500 12px Montserrat','MobileDesktopTablet'),document.fonts.load('700 12px "Noto Sans JP"','1月2月3月4月5月')];
Promise.race([Promise.all(FONT_LOADS),new Promise(r=>setTimeout(r,2500))]).then(boot,boot);

</script></body></html>
