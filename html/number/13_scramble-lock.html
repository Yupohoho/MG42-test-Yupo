<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N13 Scramble Lock</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;height:100%;background:#090d13}
body{display:flex;align-items:center;justify-content:center;font-family:"Plus Jakarta Sans",sans-serif}
body.m{display:block}
#card{position:relative;width:322px;height:125px;border-radius:12px;overflow:hidden;flex:none;
 background:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 1.3px) 0 0/14px 14px,linear-gradient(180deg,#151b25,#11171f)}
#card::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
svg text{font-family:"Plus Jakarta Sans",sans-serif}
.lab{font-size:9px;font-weight:800;letter-spacing:2.2px;fill:#9aa3b8}
.big{font-weight:800}
</style></head><body>
<div id="card"><svg width="322" height="125" viewBox="0 0 322 125" style="position:absolute;left:0;top:0">
<text class="lab" x="161" y="24" text-anchor="middle">ACCESS CODE</text>
<text id="ref" x="30" y="82" font-size="50" font-weight="800" opacity="0" style="font-variant-numeric:tabular-nums;letter-spacing:1px"></text>
<g id="chars"></g>
<rect id="ul" x="28" y="100" width="0" height="2.6" rx="1.3" fill="#ff5fa8" style="filter:drop-shadow(0 0 3px rgba(255,95,168,.7))"/>
</svg></div>
<script>
const q=new URLSearchParams(location.search);
const card=document.getElementById('card');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const outC=u=>1-Math.pow(1-clamp(u),3);
const ss=u=>{u=clamp(u);return u*u*(3-2*u)};
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'};
const NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
document.body.classList.toggle('m',q.get('m')==='1');
card.style.zoom=+q.get('z')||1;
function start(specs){
 const go=()=>{
  build();
  const t=q.get('t');
  if(t!==null){render(parseFloat(t)*30);document.body.dataset.ready='1';}
  else{const t0=performance.now();const loop=n=>{render(((n-t0)/1000*30)%LOOP);requestAnimationFrame(loop)};requestAnimationFrame(loop);}
 };
 Promise.all(specs.map(s=>document.fonts.load(s[0],s[1]))).then(go,go);
}

const CFG={text:'7,314,208',locks:{0:14,2:26,3:30,4:38,6:50,7:54,8:62},resetAt:96,gray:'#8c95a8',commaGray:'#5a6274',pink:'#ff5fa8'};
const LOOP=120;
let els=[],edge={},ul,cxs=[];
function build(){
 const ref=document.getElementById('ref');ref.textContent=CFG.text;
 const g=document.getElementById('chars');ul=document.getElementById('ul');
 for(let i=0;i<CFG.text.length;i++){
  const x=ref.getStartPositionOfChar(i).x;
  const t=mk('text',{x:x,y:82,'font-size':50,'font-weight':800,style:'font-variant-numeric:tabular-nums'},g);
  t.textContent=CFG.text[i];els.push(t);
  edge[i]=ref.getEndPositionOfChar(i).x-28;cxs.push((x+edge[i]+28)/2);
 }
}
function render(f){
 const on=f<CFG.resetAt;
 const order=Object.keys(CFG.locks).map(Number);
 els.forEach((t,i)=>{
  const ch=CFG.text[i];
  if(ch===','){
   const prev=on&&CFG.locks[i-1]!==undefined&&f>=CFG.locks[i-1];
   t.setAttribute('fill',prev?'#ffffff':CFG.commaGray);t.style.filter='none';return;
  }
  const L=CFG.locks[i];
  if(on&&f>=L){
   const a=clamp((f-L)/12);
   t.textContent=ch;
   t.setAttribute('fill',mix(CFG.pink,'#ffffff',ss((f-L-2)/9)));
   t.style.filter='drop-shadow(0 0 '+(7*(1-a))+'px rgba(255,95,168,'+(.95*(1-a))+'))';
   const sc=1+.2*(1-clamp((f-L-2)/12));
   t.setAttribute('transform','translate('+cxs[i].toFixed(2)+' 64.5) scale('+sc.toFixed(4)+') translate('+(-cxs[i]).toFixed(2)+' -64.5)');
  }else{
   t.textContent=Math.floor(rnd(i*13.7+Math.floor(f/3)*5.1)*10);
   t.setAttribute('fill',CFG.gray);t.style.filter='none';t.removeAttribute('transform');
  }
 });
 let w=0,prev=0;
 order.forEach(i=>{const L=CFG.locks[i];if(on&&f>=L){w=lerp(prev,edge[i],ss((f-L)/5));}prev=edge[i];});
 ul.setAttribute('width',on?w:0);
}
start([['800 50px "Plus Jakarta Sans"','0123456789,']]);
</script></body></html>
