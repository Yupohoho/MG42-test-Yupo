<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>N22 KPI Compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0a0d13}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
body.m{display:block}
#wrap{width:322px;height:126px;transform-origin:center center}
body.m #wrap{transform-origin:0 0}
#card{position:relative;width:322px;height:126px;border-radius:12px;overflow:hidden;background:#131921;font-family:'Montserrat','Noto Sans JP',sans-serif;color:#f3f4f8;-webkit-font-smoothing:antialiased}
#card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(244,114,182,.10),transparent 70%),radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px) 0 0/14px 14px}
#card::after{content:'';position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none;z-index:60}
#card>*{position:absolute}
svg{overflow:visible}
#g,#lg,#lbs,#rws,#bks{left:0;top:0;width:322px;height:126px}
#g>*,#lg>*,#lbs>*,#rws>*,#bks>*{position:absolute}

.pn{top:22px;width:129px;height:82px;border-radius:10px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.pn>*{position:absolute}
.lb{left:0;width:129px;top:8px;text-align:center;font:700 8.5px/13px Montserrat,sans-serif;letter-spacing:1.5px;color:#7a8291}
.vv{left:0;width:129px;top:27px;text-align:center;font:800 29px/34px Montserrat,sans-serif;white-space:nowrap}
.tr{left:14px;top:66px;width:101px;height:4px;border-radius:2px;background:#0d1219}
.fl{left:0;top:0;height:4px;border-radius:2px}
.bd{left:161px;top:57px;height:20px;padding:0 9px;border-radius:10px;background:#6ee7b7;color:#0b2a1f;font:800 10px/20px Montserrat,sans-serif;transform:translateX(-50%);box-shadow:0 0 12px rgba(110,231,183,.45);z-index:5;white-space:nowrap}
</style></head>
<body><div id="wrap"><div id="card"><div class="pn" id="p1" style="left:24px"><div class="lb">LAST MONTH</div><div class="vv" id="v1" style="color:#8f97a6"></div><div class="tr"><div class="fl" id="f1" style="background:#8892a2"></div></div></div>
<div class="pn" id="p2" style="left:168px"><div class="lb">THIS MONTH</div><div class="vv" id="v2" style="text-shadow:0 0 14px rgba(244,114,182,.55)"></div><div class="tr"><div class="fl" id="f2" style="background:#fb75b5;box-shadow:0 0 8px rgba(251,117,181,.6)"></div></div></div>
<div class="bd" id="bd">+0%</div></div></div>
<script>

const P=new URLSearchParams(location.search);
const FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo2=t=>{t=clamp(t);return 1-(1-t)*(1-t)};
const eo3=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const ei2=t=>{t=clamp(t);return t*t};
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const sst=t=>{t=clamp(t);return t*t*(3-2*t)};
const ebk=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const $=id=>document.getElementById(id);
function render(t){const c=(((t*FPS)%LOOP)+LOOP)%LOOP;draw(c)}
function boot(){
  if(P.get('m')==='1')document.body.classList.add('m');
  const z=+(P.get('z')||1);$('wrap').style.transform='scale('+z+')';
  const t0=P.get('t');
  if(t0!==null){render(+t0)}else{const s=performance.now();(function f(){render((performance.now()-s)/1000);requestAnimationFrame(f)})()}
}


/* 實測：數字到位時整個面板的縮放(每幀1格,14幀)、綠色膠囊彈出倍率(自第52幀起每幀1格) */
const CFG={last:1.2,now:1.8,max:2.0,unit:'M',cur:'¥',pop:[1.015,1.03,1.04,1.04,1.03,1.03,1.03,1.03,1.02,1.02,1.015,1.015,1.01,1],popAt:[20,38],
  bd:[.83,1.3,1.2,.96,.92,.98,1.07,1.03,.99,1],bd0:52};
function tab(a,t){if(t<0)return 1;if(t>=a.length-1)return a[a.length-1];const i=Math.floor(t);return lerp(a[i],a[i+1],t-i)}
const LOOP=120;
function draw(c){
  const ex=ei2((c-93)/13);
  const a=CFG.last*eo2((c+1)/26)*(1-ex), b=CFG.now*eo2((c-17)/26)*(1-ex);
  $('v1').textContent=CFG.cur+Math.max(0,a).toFixed(1)+CFG.unit;
  $('v2').textContent=CFG.cur+Math.max(0,b).toFixed(1)+CFG.unit;
  [$('p1'),$('p2')].forEach((p,i)=>{const q=c-CFG.popAt[i];p.style.transform=(q>=0&&q<13)?'scale('+tab(CFG.pop,q)+')':''});
  $('f1').style.width=(100*clamp(a/CFG.max))+'%';
  $('f2').style.width=(100*clamp(b/CFG.max))+'%';
  const pct=Math.min(50,Math.max(0,(c-53.2)*2.9));
  $('bd').textContent='+'+Math.round(pct)+'%';
  const s=(c<CFG.bd0?0:tab(CFG.bd,c-CFG.bd0))*(1-sst((c-90)/4));
  $('bd').style.opacity=c<CFG.bd0?0:clamp(s*2);
  $('bd').style.transform='translateX(-50%) scale('+Math.max(0,s)+')';
}

const FONT_LOADS=[document.fonts.load('800 20px Montserrat','0123456789+%¥.,'),document.fonts.load('700 12px Montserrat','AoiRenMikaSora'),document.fonts.load('500 12px Montserrat','MobileDesktopTablet'),document.fonts.load('700 12px "Noto Sans JP"','1月2月3月4月5月')];
Promise.race([Promise.all(FONT_LOADS),new Promise(r=>setTimeout(r,2500))]).then(boot,boot);

</script></body></html>
