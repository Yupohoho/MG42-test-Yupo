<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>N24 Total Blocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0a0d13}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
body.m{display:block}
#wrap{width:322px;height:126px;transform-origin:center center}
body.m #wrap{transform-origin:0 0}
#card{position:relative;width:322px;height:126px;border-radius:12px;overflow:hidden;background:#131921;font-family:'Montserrat','Noto Sans JP',sans-serif;color:#f3f4f8;-webkit-font-smoothing:antialiased}
#card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(244,114,182,.10),transparent 70%),radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px) 0 0/14px 14px}
#card::after{content:'';position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none;z-index:60}
#card>*{position:absolute}
svg{overflow:visible}
#g,#lg,#lbs,#rws,#bks{left:0;top:0;width:322px;height:126px}
#g>*,#lg>*,#lbs>*,#rws>*,#bks>*{position:absolute}

.trk{left:40px;top:110px;width:174px;height:2px;border-radius:1px;background:rgba(255,255,255,.1)}
.tl{left:212px;width:100px;top:23px;text-align:center;font:700 7px/9px Montserrat,sans-serif;letter-spacing:1.6px;color:#7d8696}
.tn{left:193px;width:100px;top:44px;text-align:right;font:800 44px/44px Montserrat,sans-serif;text-shadow:0 0 14px rgba(244,114,182,.55)}
.bk{width:35px;height:30px;border-radius:8px;text-align:center;font:800 11px/30px Montserrat,sans-serif;color:#1b1530}
</style></head>
<body><div id="wrap"><div id="card"><div class="trk"></div><div class="tl">TOTAL</div><div class="tn" id="tn"><span id="tns" style="display:inline-block;transform-origin:50% 50%">0</span></div><div id="bks"></div></div></div>
<script>

const P=new URLSearchParams(location.search);
const FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo2=t=>{t=clamp(t);return 1-(1-t)*(1-t)};
const eo3=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const ei2=t=>{t=clamp(t);return t*t};
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const sst=t=>{t=clamp(t);return t*t*(3-2*t)};
const ebk=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const $=id=>document.getElementById(id);
function render(t){const c=(((t*FPS)%LOOP)+LOOP)%LOOP;draw(c)}
function boot(){
  if(P.get('m')==='1')document.body.classList.add('m');
  const z=+(P.get('z')||1);$('wrap').style.transform='scale('+z+')';
  const t0=P.get('t');
  if(t0!==null){render(+t0)}else{const s=performance.now();(function f(){render((performance.now()-s)/1000);requestAnimationFrame(f)})()}
}


const CFG={base:109,h:30,x0:58,pitch:38.5,fall:7.5,appear:[4,24,45,66],
  blocks:[{t:'+12',a:12,col:'#f472b6'},{t:'+8',a:8,col:'#a78bfa'},{t:'+15',a:15,col:'#6ee7b7'},{t:'+5',a:5,col:'#f472b6'}]};
const LOOP=120;
const els=CFG.blocks.map((b,k)=>{const d=document.createElement('div');d.className='bk';d.textContent=b.t;d.style.left=(CFG.x0+k*CFG.pitch)+'px';d.style.background='linear-gradient(180deg,'+b.col+','+b.col+'dd)';d.style.boxShadow='0 0 12px '+b.col+'66';$('bks').appendChild(d);return d});
function bounce(tau){
  if(tau<0)return 0;
  if(tau<8)return 24*(1-Math.pow((tau-4)/4,2));
  if(tau<11)return 4.5*(1-Math.pow((tau-9.5)/1.5,2));
  return 0;
}
function draw(c){
  const ground=CFG.base-CFG.h;
  let tot=0,pop=0;
  CFG.blocks.forEach((b,k)=>{
    const A=CFG.appear[k],touch=A+CFG.fall,tau=c-touch;
    let y,vis=1;
    if(c<A){vis=0;y=-40}
    else if(tau<0){const u=(c-A)/CFG.fall;y=lerp(-40,ground,u*u)}
    else y=ground-bounce(tau);
    const fo=clamp((c-(97+3*k))/8);
    const d=els[k];
    d.style.opacity=vis*(1-fo);
    d.style.top=(y+4*fo)+'px';
    d.style.transform=(tau>=0&&tau<2.5)?'scaleY(.88)':'';
    d.style.transformOrigin='50% 100%';
    if(c>=touch){tot+=b.a;if(c-touch<6)pop=Math.max(pop,1-(c-touch)/6)}
  });
  if(c>94.5)tot=Math.max(0,40-2.75*(c-94.5));
  $('tns').textContent=Math.round(tot);
  $('tns').style.transform='scale('+(1+.1*Math.sin(pop*Math.PI))+')';
}

const FONT_LOADS=[document.fonts.load('800 20px Montserrat','0123456789+%¥.,'),document.fonts.load('700 12px Montserrat','AoiRenMikaSora'),document.fonts.load('500 12px Montserrat','MobileDesktopTablet'),document.fonts.load('700 12px "Noto Sans JP"','1月2月3月4月5月')];
Promise.race([Promise.all(FONT_LOADS),new Promise(r=>setTimeout(r,2500))]).then(boot,boot);

</script></body></html>
