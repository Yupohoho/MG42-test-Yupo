<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>N28 point-add</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0a0d12}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
body.m{display:block;min-height:0}
#wrap{position:relative;width:324px;height:124px;transform-origin:center}
body.m #wrap{transform-origin:0 0}
#card{position:absolute;left:0;top:0;width:324px;height:124px;border-radius:12px;overflow:hidden;
 background:radial-gradient(130% 100% at 50% 0%,#1d1a2f 0%,#141824 55%,#0f131b 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
#card *{box-sizing:border-box}
.abs{position:absolute}

#btn{position:absolute;left:33px;top:56px;width:104px;height:30px;border-radius:15px;background:#8b7cf6;color:#fff;font:900 10.5px/30px 'Noto Sans JP';text-align:center;white-space:nowrap}
#lab{position:absolute;left:0;width:464px;text-align:center;top:19px;font:700 6.5px 'Noto Sans JP';letter-spacing:.16em;color:#8a90a2}
#val{position:absolute;left:176px;width:112px;text-align:center;top:40px;font:800 31px/40px Outfit;color:#f4f6fb;white-space:nowrap}
#pl{position:absolute;left:0;top:0;width:60px;text-align:center;font:800 14px Outfit;color:#7dffc4;white-space:nowrap;text-shadow:0 0 8px rgba(125,255,196,.6)}
#cur{position:absolute;left:0;top:0;width:12px;height:17px}
</style></head><body>
<div id="wrap"><div id="card"><div id="btn"></div><div id="lab"></div><div id="val"></div><div id="pl"></div><div id="cur"></div></div></div>
<script>
// N28 ポイント加算 / point-add
var LOOP=120; // frames @30fps (4s)
var CFG={label:"POINTS",button:"ミッション達成",plus:"+100",launch:[12,33,54],arrive:[35,56,77],values:[1200,1300,1400,1500],reset:90,btnPress:[[-1,1],[0,.96],[1,.92],[3,.92],[4,.98],[5,1]],curPress:[[-1,1],[0,.88],[1,.8],[2,.78],[3,.8],[4,.97],[5,1]],valPop:[[0,1.14],[1,1.1],[2,1.08],[3,1.06],[4,1.04],[5,1.04],[7,1.02],[10,1.01],[13,1]],plX:[82.5,82.5,83.5,83.5,82.5,82.5,82.5,83.5,83,82.5,82,83,82.5,84.5,87.5,97.5,115,146.5,183.5,209,222.5],plY:[43,37.5,32,27,23,19.5,17,14,12.5,11.5,10,9.5,8.5,8,8,9,9,10,11.5,13.5,16],plS:[1.68,1.8,2,2.13,2.19,2.19,2.19,2.13,2.03,1.87,1.74,1.58,1.55,1.55,1.48,1.35,1.39,1.29,1.23,1.13,1.03]};
var FONTS=[["800 40px Outfit","0123456789,.%¥"],["700 12px Outfit","SECONDS"],["700 12px 'Noto Sans JP'","カートに追加残り点あとわずか"]];

var FPS=30;
var q=new URLSearchParams(location.search);
function C(v,a,b){a=a==null?0:a;b=b==null?1:b;return Math.min(b,Math.max(a,v))}
var E={lin:function(x){return x},out:function(x){return 1-Math.pow(1-x,3)},inn:function(x){return x*x*x},
 io:function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},
 back:function(x){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
function seg(f,a,b,e){return (e||E.lin)(C((f-a)/(b-a)))}
function kf(f,a){if(f<=a[0][0])return a[0][1];for(var i=1;i<a.length;i++){if(f<a[i][0]){var p=a[i-1],n=a[i];return p[1]+(n[1]-p[1])*(f-p[0])/(n[0]-p[0])}}return a[a.length-1][1]}
function $(id){return document.getElementById(id)}
function mix(a,b,t){return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)]}
function rgb(c,al){return al==null?'rgb('+c[0]+','+c[1]+','+c[2]+')':'rgba('+c[0]+','+c[1]+','+c[2]+','+al+')'}
function comma(n){n=Math.round(n);var s=String(n);return s.length>3?s.slice(0,s.length-3)+','+s.slice(-3):s}
var CURSOR='<svg width="12" height="17" viewBox="0 0 12 17"><path d="M1 1v13l3.4-3.2 2.4 5 2.2-1-2.3-4.9H11z" fill="#fff" stroke="#1a1d26" stroke-width="1"/></svg>';
function boot(){
 if(q.get('m'))document.body.classList.add('m');
 var z=+q.get('z')||1;$('wrap').style.transform='scale('+z+')';
 if(typeof init==='function')init();
 if(q.has('t')){render(((+q.get('t')*FPS)%LOOP+LOOP)%LOOP);return}
 var t0=performance.now();
 (function tick(now){render(((now-t0)/1000*FPS)%LOOP);requestAnimationFrame(tick)})(t0);
}
Promise.all(FONTS.map(function(f){return document.fonts.load(f[0],f[1])})).then(boot,boot);


function init(){$('btn').textContent=CFG.button;$('lab').textContent=CFG.label;$('pl').textContent=CFG.plus;$('cur').innerHTML=CURSOR;$('lab').style.left='-4px'}
function ai(a,d){var i=Math.floor(d),t=d-i;return a[i]+((a[i+1]!=null?a[i+1]:a[i])-a[i])*t}
var GRN=[125,255,196],WH=[244,246,251];
function render(f){
 var L=CFG.launch,A=CFG.arrive,V=CFG.values,vi=0,last=-99;
 for(var i=0;i<A.length;i++){if(f>=A[i]&&f<CFG.reset){vi=i+1;last=A[i]}}
 var g=last>-99?1-seg(f,last,last+16):0;
 var v=$('val');v.textContent=comma(V[vi]);
 v.style.color=rgb(mix(WH,GRN,g));
 v.style.transform='scale('+(last>-99?kf(f-last,CFG.valPop):1)+')';
 v.style.textShadow='0 0 '+(14*g)+'px '+rgb(GRN,.7*g);
 // button press/glow
 var gl=0,bs=1,cs=1;
 for(var i=0;i<L.length;i++){if(f>=L[i]-2){gl=Math.max(gl,f<L[i]+12?1-seg(f,L[i]-2,L[i]+12):0)}var d=f-(L[i]-3);if(d>=-1&&d<=5){bs=kf(d,CFG.btnPress);cs=kf(d,CFG.curPress)}}
 var b=$('btn');b.style.transform='scale('+bs+')';b.style.boxShadow='0 0 '+(4+14*gl)+'px rgba(139,124,246,'+(.2+.5*gl)+')';
 // floating +100
 var pl=$('pl');pl.style.opacity=0;
 for(var i=0;i<L.length;i++){
  var d=f-L[i];
  if(d>=0&&d<=20){
   pl.style.left=(ai(CFG.plX,d)-30)+'px';pl.style.top=(ai(CFG.plY,d)-9)+'px';pl.style.opacity=d>=20?1:kf(d,[[-1,0],[0,.85],[1,1],[20,1]]);
   pl.style.transform='scale('+ai(CFG.plS,d)+')';
  }
 }
 var c=$('cur'),ox=0,oy=0,co=1;
 if(f<100){var k=seg(f,88,100,E.io);ox=60*k;oy=40*k;co=1-seg(f,92,100)}
 else{var k2=1-seg(f,108,118,E.out);ox=60*k2;oy=40*k2;co=seg(f,108,112)}
 c.style.left=(124+ox)+'px';c.style.top=(78+oy)+'px';c.style.opacity=co;c.style.transform='scale('+cs+')';
}

</script></body></html>
