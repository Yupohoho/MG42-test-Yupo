<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>N05 数字の雨→集合</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0f16}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Montserrat',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:324px;height:122px;border-radius:12px;overflow:hidden;background:#131921;box-shadow:inset 0 0 0 1px #1c2330}
#bg{position:absolute;inset:0;background:#2b1a2e;opacity:0}
#card::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px) 0 0/12px 12px}
#cv{position:absolute;inset:0;z-index:2}
</style></head><body><div id="card"><div id="bg"></div><canvas id="cv" width="648" height="244" style="width:324px;height:122px"></canvas></div>
<script>
/* ===== CFG ===== */
const CFG={
  text:'1,000',textW:224,       // 組成的字與寬度
  cell:5,glyph:6.2,            // 取樣格距、小數字字級
  colors:['236,238,246','255,111,176','94,230,168'],weights:[.5,.3,.2],
  inDelay:14,inDur:22,         // 入場：延遲上限、落下幀數
  outAt:92,outDelay:10,outDur:14, // 退場
  tintIn:[26,38],tintOut:[100,112], // 背景泛紫的區間
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),ei=x=>x*x*x;
const cv=document.getElementById('cv'),g=cv.getContext('2d'),bg=document.getElementById('bg');
let sd=11;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
let P=[];
function build(){
  const o=document.createElement('canvas');o.width=324;o.height=122;const c=o.getContext('2d');
  let fs=80;c.font='900 '+fs+'px Montserrat';const w=c.measureText(CFG.text).width;fs=fs*CFG.textW/w;
  c.font='900 '+fs+'px Montserrat';c.textAlign='center';c.textBaseline='alphabetic';c.fillStyle='#fff';c.fillText(CFG.text,162,62+fs*.35);
  const d=c.getImageData(0,0,324,122).data,s=CFG.cell;
  for(let y=s/2;y<122;y+=s)for(let x=s/2;x<324;x+=s){
    if(d[((Math.floor(y))*324+Math.floor(x))*4+3]>140){
      const r=rnd();let acc=0,ci=0;for(let k=0;k<3;k++){acc+=CFG.weights[k];if(r<=acc){ci=k;break}}
      P.push({x,y,ch:Math.floor(rnd()*10),c:CFG.colors[ci],d:rnd()*CFG.inDelay,sy:-20-rnd()*140,sx:(rnd()-.5)*50,d2:rnd()*CFG.outDelay,ex:(rnd()-.5)*30})}}
}
function render(f){
  g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,324,122);
  g.font='700 '+CFG.glyph+'px Montserrat';g.textAlign='center';g.textBaseline='middle';
  const bgA=Math.max(seg(f,CFG.tintIn[0],CFG.tintIn[1])-seg(f,CFG.tintOut[0],CFG.tintOut[1]),0);
  bg.style.opacity=bgA;
  P.forEach(p=>{
    const a=eo(seg(f,p.d,p.d+CFG.inDur)),b=ei(seg(f,CFG.outAt+p.d2,CFG.outAt+p.d2+CFG.outDur));
    const x=p.x+p.sx*(1-a)+p.ex*b,y=p.y+(p.sy-p.y)*(1-a)+b*160;
    if(y<-4||y>126)return;
    g.fillStyle='rgba('+p.c+','+(1-b*.6)+')';g.fillText(p.ch,x,y);
  });
}
function start(){build();const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load('900 80px Montserrat','1,000').then(()=>document.fonts.load('700 6px Montserrat','0123456789')).then(start,start);
</script></body></html>
