<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>N17 Bar Chart Values</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0a0d13}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
body.m{display:block}
#wrap{width:322px;height:126px;transform-origin:center center}
body.m #wrap{transform-origin:0 0}
#card{position:relative;width:322px;height:126px;border-radius:12px;overflow:hidden;background:#131921;font-family:'Montserrat','Noto Sans JP',sans-serif;color:#f3f4f8;-webkit-font-smoothing:antialiased}
#card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(244,114,182,.10),transparent 70%),radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px) 0 0/14px 14px}
#card::after{content:'';position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none;z-index:60}
#card>*{position:absolute}
svg{overflow:visible}
#g,#lg,#lbs,#rws,#bks{left:0;top:0;width:322px;height:126px}
#g>*,#lg>*,#lbs>*,#rws>*,#bks>*{position:absolute}

.ax{left:28px;top:104px;width:266px;height:1px;background:#262e3a}
.bar{width:35px;border-radius:6px 6px 0 0;bottom:22px;box-shadow:0 0 14px rgba(244,114,182,.18)}
.bar.hi{box-shadow:0 0 14px rgba(110,231,183,.2)}
.val{width:50px;text-align:center;font:800 13px/16px Montserrat,sans-serif}
.lab{top:108px;width:35px;text-align:center;font:500 9px/16px 'Noto Sans JP',sans-serif;color:#6e7685}
</style></head>
<body><div id="wrap"><div id="card"><div class="ax"></div><div id="g"></div></div></div>
<script>

const P=new URLSearchParams(location.search);
const FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo2=t=>{t=clamp(t);return 1-(1-t)*(1-t)};
const eo3=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const ei2=t=>{t=clamp(t);return t*t};
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const sst=t=>{t=clamp(t);return t*t*(3-2*t)};
const ebk=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const $=id=>document.getElementById(id);
function render(t){const c=(((t*FPS)%LOOP)+LOOP)%LOOP;draw(c)}
function boot(){
  if(P.get('m')==='1')document.body.classList.add('m');
  const z=+(P.get('z')||1);$('wrap').style.transform='scale('+z+')';
  const t0=P.get('t');
  if(t0!==null){render(+t0)}else{const s=performance.now();(function f(){render((performance.now()-s)/1000);requestAnimationFrame(f)})()}
}


const CFG={labels:['1月','2月','3月','4月','5月'],values:[42,68,55,90,76],hi:3,unit:.745,x0:42,pitch:50.75,
  pink:['#f06cad','rgba(240,108,173,.45)'],green:['#74e7a4','rgba(116,231,164,.45)']};
const LOOP=120;
/* 實測(參考影片逐幀)：各棒起點、彈性曲線(相對最終高度, 每幀1格, 過衝約+7%後回彈)、退場起點與時長 */
const IN=[-3,1,6,10,15], EXS=[88,91,94,94,96], EXD=[14,13,11,13,12];
const CV=[0,.082,.268,.417,.561,.667,.767,.856,.924,.973,1,1.041,1.058,1.068,1.068,1.068,1.058,1.048,1.048,1.041,1.008,1,1,1,1,1];
function cv(t){if(t<=0)return 0;if(t>=25)return 1;const i=Math.floor(t);return lerp(CV[i],CV[i+1],t-i)}
const bars=[],vals=[];
CFG.values.forEach((v,k)=>{
  const x=CFG.x0+k*CFG.pitch;
  const b=document.createElement('div');b.className='bar'+(k===CFG.hi?' hi':'');b.style.left=x+'px';
  const col=k===CFG.hi?CFG.green:CFG.pink;b.style.background='linear-gradient(180deg,'+col[0]+','+col[1]+')';
  const n=document.createElement('div');n.className='val';n.style.left=(x-7.5)+'px';
  const l=document.createElement('div');l.className='lab';l.style.left=x+'px';l.textContent=CFG.labels[k];
  $('g').append(b,n,l);bars.push(b);vals.push(n);
});
function draw(c){
  CFG.values.forEach((v,k)=>{
    const cc=c>=112?c-120:c;
    const p=cv(cc-IN[k]), e=clamp((cc-EXS[k])/EXD[k]), pr=p*(1-e*e);
    const h=Math.max(0,v*CFG.unit*pr);
    bars[k].style.height=h+'px';
    vals[k].style.top=(104-h-19.3)+'px';
    vals[k].textContent=Math.round(v*Math.min(pr,1));
    vals[k].style.opacity=clamp(pr*8);
    vals[k].style.color=pr<.5?'#9aa1ad':'#f3f4f8';
  });
}

const FONT_LOADS=[document.fonts.load('800 20px Montserrat','0123456789+%¥.,'),document.fonts.load('700 12px Montserrat','AoiRenMikaSora'),document.fonts.load('500 12px Montserrat','MobileDesktopTablet'),document.fonts.load('700 12px "Noto Sans JP"','1月2月3月4月5月')];
Promise.race([Promise.all(FONT_LOADS),new Promise(r=>setTimeout(r,2500))]).then(boot,boot);

</script></body></html>
