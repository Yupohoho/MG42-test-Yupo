<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>N37 サイコロ (Dice Roll)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#090d13}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
body.m{display:block}
#wrap{transform-origin:center}
body.m #wrap{transform-origin:0 0}
#c{position:relative;width:324px;height:124px;border-radius:12px;overflow:hidden;font-family:Montserrat,sans-serif;color:#fff;
 background:radial-gradient(circle at 100% 0,rgba(140,80,170,.13),transparent 60%),radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.5px) 5px 5px/11px 11px,#131921;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
#c>*{position:absolute}
.cen{transform:translate(-50%,-50%);white-space:nowrap}
.big{font-family:Montserrat,sans-serif;font-weight:800}
.mn{font-family:Manrope,Montserrat,sans-serif}

#die{left:108px;top:66px;width:68px;height:68px;border-radius:15px;background:linear-gradient(145deg,#fff,#dfe3ec 70%,#c9cfdb);box-shadow:inset 0 -4px 6px rgba(0,0,0,.12),0 6px 10px rgba(0,0,0,.35);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11px;box-sizing:border-box;gap:0}
#die i{display:block;width:12px;height:12px;border-radius:50%;margin:auto;background:#14171d;visibility:hidden}
#die i.on{visibility:visible}
#sh{left:108px;top:104px;width:60px;height:8px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.5),transparent 70%)}
#rl{left:237px;top:28px;font:700 8px Montserrat;letter-spacing:.2em;color:#8d96ad}
#num{left:237px;top:70px;font-size:62px}

</style></head><body><div id="wrap"><div id="c">
<div class="cen" id="sh"></div><div class="cen" id="die"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="cen" id="rl">ROLL</div><div class="cen big" id="num">6</div>
</div></div>
<script>
/* CFG：示範用的數值、字、色都集中在這裡 */
const LOOP=120;
const FONTS=['800 20px Manrope','700 12px Montserrat'];
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
// 實測自參考：骰子離地高度(px)每幀、旋轉 540° 緩出(46幀,指數2.84)、數字/骰面每約2幀 +1 一次
const HY=[0.4,7.2,13.4,19.3,24.2,27.7,31.3,32.1,32.8,33.1,32.7,31.4,29.5,27.3,24,19.5,14.8,9.8,4.9,-0.1,2.5,6.5,9.9,12.8,15,16.6,17.5,17.8,17.4,16.5,15.3,13.5,11.4,9.2,7,4.6,2.4,0.3,-1.5,-1.3,-0.3,0.4,0.9,1.3,0.7,0.1,-0.6,-1.2];
const ROT_TOT=540,ROT_T=46,ROT_K=2.84;
const CH=[4,6,9,11,13,15,17,19,21,24,26,28,30,32,34,36,39,41,43,45,47];
// 落定(f48)：骰子壓扁回彈 [sx,sy]、結果數字縮放
const DSQ=[[48,1.217,.783],[49,1.145,.84],[50,1.087,.9],[51,1.058,.93],[52,1.043,.957],[53,1.03,.957],[54,1.014,.97],[55,1.014,.985],[56,1,.985],[57,1,1]];
const NSC=[[48,1.25],[49,1.17],[50,1.11],[51,1.07],[52,1.05],[53,1.02],[54,1.01],[55,1]];

const FPS=30;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3), ei=t=>Math.pow(clamp(t),3), eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
function kf(keys,f,smooth){
  if(f<=keys[0][0])return keys[0].slice(1);
  for(let i=1;i<keys.length;i++){if(f<=keys[i][0]){const a=keys[i-1],b=keys[i];let t=(f-a[0])/(b[0]-a[0]);if(smooth)t=t*t*(3-2*t);return a.slice(1).map((v,j)=>lerp(v,b[j+1],t))}}
  return keys[keys.length-1].slice(1)}
function rnd(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
const fmt=n=>Math.round(n).toLocaleString('en-US');
const $=id=>document.getElementById(id);
function mix(c1,c2,t){t=clamp(t);return 'rgb('+c1.map((v,i)=>Math.round(lerp(v,c2[i],t))).join(',')+')'}
function place(el,x,y,s,a){el.style.transform='translate(-50%,-50%) translate('+x+'px,'+y+'px) scale('+s+')';el.style.opacity=a}
const q=new URLSearchParams(location.search);
$('wrap').style.transform='scale('+(+q.get('z')||1)+')';
if(q.get('m')==='1')document.body.classList.add('m');
function start(){
  if(typeof setup==='function')setup();
  if(q.has('t')){render(+q.get('t')*FPS);}
  else{const st=performance.now();(function tick(){render(((performance.now()-st)/1000*FPS)%LOOP);requestAnimationFrame(tick)})()}
}
Promise.race([Promise.all(FONTS.map(f=>document.fonts.load(f,'0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ?,.'))),new Promise(r=>setTimeout(r,2500))]).then(start);


let shown=0;
function face(n){if(shown===n)return;shown=n;const is=$('die').children;for(let i=0;i<9;i++)is[i].className=PIPS[n].includes(i)?'on':''}
function render(f){
  let fv=6;if(f>=4&&f<48){let c=0;for(let i=0;i<CH.length;i++)if(CH[i]<=f)c=i+1;fv=((c-1)%6)+1}
  face(fv);
  const h=f<47?kf(HY.map((v,i)=>[i,v]),f)[0]:(f<48?lerp(HY[47],0,f-47):0);
  const r=ROT_TOT*(1-Math.pow(1-clamp(f/ROT_T),ROT_K));
  let sx=1,sy=1;if(f>=48&&f<57){const q=kf(DSQ,f);sx=q[0];sy=q[1]}
  $('die').style.transform='translate(-50%,-50%) translate(0,'+(-h)+'px) rotate('+r+'deg) scale('+sx+','+sy+')';
  $('sh').style.transform='translate(-50%,-50%) scale('+(1-h/70)+')';$('sh').style.opacity=1-h/60;
  const n=$('num');
  if(f<1){n.textContent=6;n.style.color='#f2f5f8';n.style.textShadow='none';n.style.transform='translate(-50%,-50%) scale(1)'}
  else if(f<48){n.textContent=fv;n.style.color='#5f6679';n.style.textShadow='none';n.style.transform='translate(-50%,-50%) scale(1)'}
  else{n.textContent=6;const g=1-clamp((f-50)/24);n.style.color=mix([242,245,248],[109,255,176],g);n.style.textShadow='0 0 '+(14*g)+'px rgba(109,255,176,'+(.7*g)+')';n.style.transform='translate(-50%,-50%) scale('+(f<55?kf(NSC,f)[0]:1)+')'}
}
</script></body></html>
