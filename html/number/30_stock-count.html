<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>N30 stock-count</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0a0d12}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
body.m{display:block;min-height:0}
#wrap{position:relative;width:324px;height:124px;transform-origin:center}
body.m #wrap{transform-origin:0 0}
#card{position:absolute;left:0;top:0;width:324px;height:124px;border-radius:12px;overflow:hidden;
 background:radial-gradient(130% 100% at 50% 0%,#1d1a2f 0%,#141824 55%,#0f131b 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
#card *{box-sizing:border-box}
.abs{position:absolute}

#pre{position:absolute;left:78.5px;top:60.5px;font:900 18px/18px 'Noto Sans JP';color:#b2bac8}
#post{position:absolute;left:186.5px;top:64px;font:900 24px/24px 'Noto Sans JP';color:#b2bac8}
#num{position:absolute;left:109.5px;width:70px;top:32.5px;height:56px;text-align:center;overflow:visible;font:800 75px/56px Outfit;color:#fff}
.dg{position:absolute;left:0;width:70px;text-align:center;top:0}
#track{position:absolute;left:50px;top:102px;width:226px;height:5px;border-radius:2.5px;background:#232838}
#bar{position:absolute;left:50px;top:102px;height:5px;border-radius:2.5px;width:226px}
#warn{position:absolute;left:204px;top:40.5px;width:75px;height:28px;border-radius:14px;border:1.5px solid #ff5a4a;color:#ff5a4a;font:900 11.5px/25px 'Noto Sans JP';text-align:center;white-space:nowrap;background:rgba(255,90,74,.06)}
</style></head><body>
<div id="wrap"><div id="card"><div id="pre"></div><div id="num"><div class="dg" id="d1"></div><div class="dg" id="d2"></div></div><div id="post"></div><div id="track"></div><div id="bar"></div><div id="warn"></div></div></div>
<script>
// N30 在庫カウント / stock-count
var LOOP=120; // frames @30fps (4s)
var CFG={pre:"残り",post:"点",warn:"あとわずか",steps:[[6,8],[17,7],[27,6],[36,5],[44,4],[50,3]],start:9,reset:94,numPop:[[0,1.19],[1,1.14],[2,1.12],[3,1.09],[4,1.07],[5,1.055],[6,1.05],[7,1.035],[9,1.02],[11,1]],capIn:[[49,.3],[50,.3],[51,1.2],[52,1.24],[53,.98],[54,.88],[55,1.01],[56,1.09],[57,1.06],[58,1.04],[62,1]],pulse:[62,24,.04,.04]};
var FONTS=[["800 40px Outfit","0123456789,.%¥"],["700 12px Outfit","SECONDS"],["700 12px 'Noto Sans JP'","カートに追加残り点あとわずか"]];

var FPS=30;
var q=new URLSearchParams(location.search);
function C(v,a,b){a=a==null?0:a;b=b==null?1:b;return Math.min(b,Math.max(a,v))}
var E={lin:function(x){return x},out:function(x){return 1-Math.pow(1-x,3)},inn:function(x){return x*x*x},
 io:function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},
 back:function(x){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
function seg(f,a,b,e){return (e||E.lin)(C((f-a)/(b-a)))}
function kf(f,a){if(f<=a[0][0])return a[0][1];for(var i=1;i<a.length;i++){if(f<a[i][0]){var p=a[i-1],n=a[i];return p[1]+(n[1]-p[1])*(f-p[0])/(n[0]-p[0])}}return a[a.length-1][1]}
function $(id){return document.getElementById(id)}
function mix(a,b,t){return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)]}
function rgb(c,al){return al==null?'rgb('+c[0]+','+c[1]+','+c[2]+')':'rgba('+c[0]+','+c[1]+','+c[2]+','+al+')'}
function comma(n){n=Math.round(n);var s=String(n);return s.length>3?s.slice(0,s.length-3)+','+s.slice(-3):s}
var CURSOR='<svg width="12" height="17" viewBox="0 0 12 17"><path d="M1 1v13l3.4-3.2 2.4 5 2.2-1-2.3-4.9H11z" fill="#fff" stroke="#1a1d26" stroke-width="1"/></svg>';
function boot(){
 if(q.get('m'))document.body.classList.add('m');
 var z=+q.get('z')||1;$('wrap').style.transform='scale('+z+')';
 if(typeof init==='function')init();
 if(q.has('t')){render(((+q.get('t')*FPS)%LOOP+LOOP)%LOOP);return}
 var t0=performance.now();
 (function tick(now){render(((now-t0)/1000*FPS)%LOOP);requestAnimationFrame(tick)})(t0);
}
Promise.all(FONTS.map(function(f){return document.fonts.load(f[0],f[1])})).then(boot,boot);


function init(){$('pre').textContent=CFG.pre;$('post').textContent=CFG.post;$('warn').textContent=CFG.warn}
var PK=[255,105,175],RD=[255,82,70];
function render(f){
 var st=CFG.steps,n=CFG.start,at=-99,pv=n;
 if(f<CFG.reset){for(var i=0;i<st.length;i++){if(f>=st[i][0]){pv=n;n=st[i][1];at=st[i][0]}}}
 else{n=CFG.start;at=CFG.reset;pv=3}
 var red=f<CFG.reset?seg(f,49,51):0;
 var col=mix(PK,RD,red);
 // digit slide
 var d1=$('d1'),d2=$('d2'),u=seg(f,at,at+4,E.out);
 d1.textContent=pv;d2.textContent=n;
 d1.style.opacity=0;d2.style.transform='none';d2.style.opacity=1;
 var PU=CFG.pulse,ph=.5-.5*Math.cos(2*Math.PI*(f-PU[0])/PU[1]);
 var ns=1;if(at>=0&&f-at<11)ns=kf(f-at,CFG.numPop);else if(f>=62&&f<CFG.reset)ns=1+PU[2]*ph;
 $('num').style.transform='scale('+ns+')';
 var nm=$('num');nm.style.color=red>0?rgb(mix([255,255,255],RD,red)):'#fff';
 nm.style.textShadow=red>0?'0 0 '+(14*red*(1+.4*(2*ph-1)))+'px '+rgb(RD,.55*red):'none';
 // bar: value n/9 eased from previous
 var from=pv/9,to=n/9,w=from+(to-from)*seg(f,at,at+6,E.out);
 if(at<0)w=1;
 var bar=$('bar');bar.style.width=(225*w)+'px';bar.style.background=rgb(col);
 bar.style.boxShadow='0 0 6px '+rgb(col,.5);
 var wn=$('warn');wn.style.opacity=f<CFG.reset&&f>=49?1:0;wn.style.transform='scale('+(f<62?kf(f,CFG.capIn):1+PU[3]*ph)+')';
}

</script></body></html>
