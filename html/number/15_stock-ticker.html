<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N15 Stock Ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;height:100%;background:#090d13}
body{display:flex;align-items:center;justify-content:center;font-family:"Plus Jakarta Sans",sans-serif}
body.m{display:block}
#card{position:relative;width:322px;height:125px;border-radius:12px;overflow:hidden;flex:none;
 background:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 1.3px) 0 0/14px 14px,linear-gradient(180deg,#151b25,#11171f)}
#card::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
svg text{font-family:"Plus Jakarta Sans",sans-serif}
.lab{font-size:9px;font-weight:800;letter-spacing:2.2px;fill:#9aa3b8}
.big{font-weight:800}

.row{position:absolute;left:22px;width:280px;height:30px;border-radius:9px;background:#1a2030;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden}
.row .tint{position:absolute;inset:0}
.row .nm{position:absolute;left:14px;top:0;line-height:30px;font-size:10px;font-weight:800;letter-spacing:.6px;color:#aab2c3}
.row .pr{position:absolute;right:77px;top:0;line-height:30px;font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff}
.row .pl{position:absolute;right:8px;top:5px;width:56px;height:20px;border-radius:6px;text-align:center;line-height:20px;font-size:9.5px;font-weight:700}
</style></head><body>
<div id="card"></div>
<script>
const q=new URLSearchParams(location.search);
const card=document.getElementById('card');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const outC=u=>1-Math.pow(1-clamp(u),3);
const ss=u=>{u=clamp(u);return u*u*(3-2*u)};
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'};
const NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
document.body.classList.toggle('m',q.get('m')==='1');
card.style.zoom=+q.get('z')||1;
function start(specs){
 const go=()=>{
  build();
  const t=q.get('t');
  if(t!==null){render(parseFloat(t)*30);document.body.dataset.ready='1';}
  else{const t0=performance.now();const loop=n=>{render(((n-t0)/1000*30)%LOOP);requestAnimationFrame(loop)};requestAnimationFrame(loop);}
 };
 Promise.all(specs.map(s=>document.fonts.load(s[0],s[1]))).then(go,go);
}

const CFG={names:['NIKKEI','USD/JPY','BTC'],tops:[10,47,84],up:'#5eea9f',down:'#9d8bf5',stateFrames:7.5,offset:3.5,
 states:[
 ['38,420.5','0.00',1,'151.36','1.03',1,'67,251','0.06',-1],
 ['38,477.2','0.15',1,'151.27','0.97',-1,'66,640','0.85',-1],
 ['38,515.6','0.25',1,'150.78','0.64',-1,'66,368','1.25',-1],
 ['38,525.9','0.27',1,'150.04','0.15',-1,'66,728','0.72',1],
 ['38,510.5','0.23',-1,'149.31','0.34',-1,'67,471','0.39',1],
 ['38,481.4','0.16',-1,'148.81','0.67',-1,'67,999','1.17',1],
 ['38,452.6','0.08',-1,'148.64','0.79',-1,'67,918','1.05',-1],
 ['38,432.7','0.03',-1,'148.75','0.71',1,'67,370','0.24',-1],
 ['38,420.5','0.00',-1,'148.98','0.56',1,'66,837','0.55',-1],
 ['38,408.3','0.03',-1,'149.19','0.42',1,'66,656','0.82',-1],
 ['38,388.4','0.08',-1,'149.31','0.34',1,'66,795','0.62',1],
 ['38,359.6','0.16',-1,'149.42','0.27',1,'67,038','0.26',1],
 ['38,330.5','0.23',-1,'149.62','0.13',1,'67,281','0.11',1],
 ['38,315.1','0.27',-1,'150.01','0.13',1,'67,544','0.50',1],
 ['38,325.4','0.25',1,'150.54','0.48',1,'67,759','0.82',1],
 ['38,363.8','0.15',1,'151.07','0.83',1,'67,704','0.73',-1]]};
const LOOP=120;
let rows=[];
function build(){
 CFG.names.forEach((n,i)=>{
  const r=document.createElement('div');r.className='row';r.style.top=CFG.tops[i]+'px';
  r.innerHTML='<div class="tint"></div><div class="nm">'+n+'</div><div class="pr"></div><div class="pl"></div>';
  card.appendChild(r);
  rows.push({r:r,tint:r.children[0],pr:r.children[2],pl:r.children[3]});
 });
}
function render(f){
 const T=((f+CFG.offset)%LOOP+LOOP)%LOOP;
 const k=Math.floor(T/CFG.stateFrames),age=T-k*CFG.stateFrames;
 const fl=Math.max(0,1-age/5);
 const st=CFG.states[k];
 rows.forEach((o,i)=>{
  const p=st[i*3],pc=st[i*3+1],sg=st[i*3+2];
  const col=sg>0?CFG.up:CFG.down;
  const rgb=hex(col).join(',');
  o.pr.textContent=p;
  o.pr.style.transform='scale('+(1+.06*fl)+')';
  o.pr.style.color=mix('#ffffff',col,Math.pow(fl,.6));
  o.pl.textContent=(sg>0?'▲ ':'▼ ')+pc+'%';
  o.pl.style.color=col;o.pl.style.background='rgba('+rgb+',.1)';
  o.tint.style.background='linear-gradient(90deg,rgba('+rgb+',0) 25%,rgba('+rgb+','+(.3*fl)+') 100%)';
 });
}
start([['800 15px "Plus Jakarta Sans"','0123456789.,']]);
</script></body></html>
