<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>N01 金額スライドイン</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0f16}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Montserrat',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:324px;height:122px;border-radius:12px;overflow:hidden;background:#131921;box-shadow:inset 0 0 0 1px #1c2330}
#card::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px) 0 0/12px 12px}
.lab{position:absolute;left:0;right:0;top:13px;text-align:center;font-size:8px;font-weight:700;letter-spacing:2px;color:#8d95a6}
.row{position:absolute;left:0;right:0;top:36px;height:46px;display:flex;justify-content:center;font-size:38px;font-weight:800;color:#f4f5fa}
.ch{position:relative;display:block;height:46px;line-height:46px;overflow:hidden;white-space:pre}
.ch span{position:absolute;left:0;top:0}
.ch i{visibility:hidden;font-style:normal}
.bar{position:absolute;left:30px;top:102px;height:2px;width:264px;border-radius:2px;background:linear-gradient(90deg,#a78bfa,#ff6fb0 55%,#5ee6a8);transform-origin:0 0}
</style></head><body><div id="card"><div class="lab">REVENUE / MONTH</div><div class="row" id="row"></div><div class="bar" id="bar"></div></div>
<script>
/* ===== CFG ===== */
const CFG={
  text:'¥1,280,000',      // 入場時的金額
  rollTo:{5:'4',7:'5'},   // 數字索引 → 滾動換成的新數字
  rollStart:{5:54,7:58},  // 滾動開始幀
  stagger:1.2,            // 入場每字間隔幀
  exitDelay:[3,5,4,6,2,0,6,1,3,2], // 退場每字延遲幀
  white:[244,245,250], pink:[255,111,176], green:[94,230,168],
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),ei=x=>x*x*x,eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';
const row=document.getElementById('row'),bar=document.getElementById('bar'),H=46;
const slots=[...CFG.text].map((c,i)=>{
  const d=document.createElement('div');d.className='ch';
  const ghost=document.createElement('i');ghost.textContent=c;d.appendChild(ghost);
  const a=document.createElement('span');a.textContent=c;d.appendChild(a);
  let b=null;if(CFG.rollTo[i]){b=document.createElement('span');b.textContent=CFG.rollTo[i];d.appendChild(b)}
  row.appendChild(d);return{a,b,i,c}
});
function render(f){
  slots.forEach(s=>{
    const enter=eo(seg(f,s.i*CFG.stagger,s.i*CFG.stagger+9));
    const ex=ei(seg(f,96+CFG.exitDelay[s.i],96+CFG.exitDelay[s.i]+10));
    const off=(1-enter)*H-ex*H;
    const base=s.c==='¥'?CFG.pink:CFG.white;
    let p=0;if(s.b)p=eio(seg(f,CFG.rollStart[s.i],CFG.rollStart[s.i]+8));
    s.a.style.transform='translateY('+(off-p*H)+'px)';
    s.a.style.color=mix(base,CFG.green,ex);
    if(s.b){s.b.style.transform='translateY('+(off+(1-p)*H)+'px)';s.b.style.color=mix(CFG.green,CFG.green,0)}
  });
  bar.style.transform='scaleX('+eo(seg(f,4,26))+')';
  bar.style.opacity=1-seg(f,96,108);
}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load('800 38px Montserrat','¥0123456789,').then(start,start);
</script></body></html>
