<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N16 Decimal Fast Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;height:100%;background:#090d13}
body{display:flex;align-items:center;justify-content:center;font-family:"Plus Jakarta Sans",sans-serif}
body.m{display:block}
#card{position:relative;width:322px;height:125px;border-radius:12px;overflow:hidden;flex:none;
 background:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 1.3px) 0 0/14px 14px,linear-gradient(180deg,#151b25,#11171f)}
#card::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
svg text{font-family:"Plus Jakarta Sans",sans-serif}
.lab{font-size:9px;font-weight:800;letter-spacing:2.2px;fill:#9aa3b8}
.big{font-weight:800}
</style></head><body>
<div id="card"><svg width="322" height="125" viewBox="0 0 322 125" style="position:absolute;left:0;top:0">
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="48" x2="275" y1="0" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
<text class="lab" x="161" y="24" text-anchor="middle">CONVERSION RATE</text>
<text id="it" class="big" x="143" y="88" text-anchor="middle" font-size="76" fill="#fff">0</text>
<text id="dc" class="big" x="187" y="91" font-size="40" fill="#ff6ea8">.00</text>
<text id="pc" class="big" x="255" y="91" font-size="25" fill="#aab2c3">%</text>
<rect x="48" y="105" width="227" height="3" rx="1.5" fill="rgba(255,255,255,.07)"/>
<rect id="fill" x="48" y="105" width="0" height="3" rx="1.5" fill="url(#g)"/>
</svg></div>
<script>
const q=new URLSearchParams(location.search);
const card=document.getElementById('card');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const outC=u=>1-Math.pow(1-clamp(u),3);
const ss=u=>{u=clamp(u);return u*u*(3-2*u)};
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'};
const NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
document.body.classList.toggle('m',q.get('m')==='1');
card.style.zoom=+q.get('z')||1;
function start(specs){
 const go=()=>{
  build();
  const t=q.get('t');
  if(t!==null){render(parseFloat(t)*30);document.body.dataset.ready='1';}
  else{const t0=performance.now();const loop=n=>{render(((n-t0)/1000*30)%LOOP);requestAnimationFrame(loop)};requestAnimationFrame(loop);}
 };
 Promise.all(specs.map(s=>document.fonts.load(s[0],s[1]))).then(go,go);
}

const CFG={target:87.36,pink:'#ff6ea8',green:'#6ee7a0'};
const LOOP=120;
let it,dc,fillr;
const popAt=f=>1+.05*ss((f-72)/4)*(1-ss((f-76)/18));
function build(){it=document.getElementById('it');dc=document.getElementById('dc');fillr=document.getElementById('fill');}
function val(f){
 if(f<98)return CFG.target*(1-Math.pow(1-clamp((f-2)/66),4));
 return CFG.target*(1-ss((f-98)/11));
}
function render(f){
 const v=val(f);
 const sp=Math.abs(val(f+.5)-val(f-.5));
 const bl=Math.min(3.6,sp*.75);
 const s=v.toFixed(2),i=s.split('.')[0],d=s.split('.')[1];
 it.textContent=i;dc.textContent='.'+d;const pp='translate(171 62.5) scale('+popAt(f).toFixed(4)+') translate(-171 -62.5) ';it.setAttribute('transform',pp+'translate(143 0) scale(.88 1) translate(-143 0)');dc.setAttribute('transform',pp);
 const gl='drop-shadow(0 0 6px rgba(255,255,255,.35)) drop-shadow(0 0 12px rgba(255,100,180,.4))';
 it.style.filter='blur('+bl+'px) '+gl;
 dc.style.filter='blur('+bl+'px) drop-shadow(0 0 8px rgba(255,100,180,.4))';
 const g=clamp((f-72)/3)*(1-clamp((f-75)/19)); // 與縮放(f72起)同幀變綠：3 幀升到頂，再線性退回粉紅（實測參考 f66 起變色、f69 最綠、f88 退完）
 dc.setAttribute('fill',mix(CFG.pink,CFG.green,g));
 fillr.setAttribute('width',227*v/CFG.target);
}
start([['800 76px "Plus Jakarta Sans"','0123456789.%']]);
</script></body></html>
