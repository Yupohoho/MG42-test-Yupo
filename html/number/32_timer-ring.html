<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>N32 timer-ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0a0d12}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
body.m{display:block;min-height:0}
#wrap{position:relative;width:324px;height:124px;transform-origin:center}
body.m #wrap{transform-origin:0 0}
#card{position:absolute;left:0;top:0;width:324px;height:124px;border-radius:12px;overflow:hidden;
 background:radial-gradient(130% 100% at 50% 0%,#1d1a2f 0%,#141824 55%,#0f131b 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
#card *{box-sizing:border-box}
.abs{position:absolute}

#ring{position:absolute;left:0;top:0}
#val{position:absolute;left:0;width:324px;text-align:center;top:46px;font:800 17px/20px Outfit;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.01em}
#un{position:absolute;left:0;width:324px;text-align:center;top:72px;font:700 5.5px 'Noto Sans JP';letter-spacing:.22em;color:#8a90a2}
</style></head><body>
<div id="wrap"><div id="card"><svg id="ring" width="324" height="124" viewBox="0 0 324 124"><circle cx="162" cy="62" r="46" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="4"/><circle id="arc" cx="162" cy="62" r="46" fill="none" stroke-width="4" stroke-linecap="round" transform="rotate(-90 162 62)"/><circle id="hd" r="3" fill="#fff"/></svg><div id="val"></div><div id="un"></div></div></div>
<script>
// N32 タイマーリング / timer-ring
var LOOP=120; // frames @30fps (4s)
var CFG={unit:"SECONDS",total:12.34,valPop:[[69,1],[70,1.03],[71,1.09],[72,1.1],[74,1.1],[78,1.09],[79,1.075],[80,1.06],[82,1.06],[83,1.045],[84,1.03],[87,1.03],[88,1.015],[89,1]],curve:[[0,0],[4,0.05],[8,0.18],[12,0.45],[16,0.91],[20,1.61],[24,2.60],[28,3.94],[32,5.67],[36,7.59],[40,9.11],[44,10.27],[48,11.12],[52,11.69],[56,12.05],[60,12.24],[64,12.32],[68,12.34],[88,12.34],[92,12.22],[96,9.18],[100,1.83],[104,0.01],[108,0],[120,0]]};
var FONTS=[["800 40px Outfit","0123456789,.%¥"],["700 12px Outfit","SECONDS"],["700 12px 'Noto Sans JP'","カートに追加残り点あとわずか"]];

var FPS=30;
var q=new URLSearchParams(location.search);
function C(v,a,b){a=a==null?0:a;b=b==null?1:b;return Math.min(b,Math.max(a,v))}
var E={lin:function(x){return x},out:function(x){return 1-Math.pow(1-x,3)},inn:function(x){return x*x*x},
 io:function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},
 back:function(x){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
function seg(f,a,b,e){return (e||E.lin)(C((f-a)/(b-a)))}
function kf(f,a){if(f<=a[0][0])return a[0][1];for(var i=1;i<a.length;i++){if(f<a[i][0]){var p=a[i-1],n=a[i];return p[1]+(n[1]-p[1])*(f-p[0])/(n[0]-p[0])}}return a[a.length-1][1]}
function $(id){return document.getElementById(id)}
function mix(a,b,t){return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)]}
function rgb(c,al){return al==null?'rgb('+c[0]+','+c[1]+','+c[2]+')':'rgba('+c[0]+','+c[1]+','+c[2]+','+al+')'}
function comma(n){n=Math.round(n);var s=String(n);return s.length>3?s.slice(0,s.length-3)+','+s.slice(-3):s}
var CURSOR='<svg width="12" height="17" viewBox="0 0 12 17"><path d="M1 1v13l3.4-3.2 2.4 5 2.2-1-2.3-4.9H11z" fill="#fff" stroke="#1a1d26" stroke-width="1"/></svg>';
function boot(){
 if(q.get('m'))document.body.classList.add('m');
 var z=+q.get('z')||1;$('wrap').style.transform='scale('+z+')';
 if(typeof init==='function')init();
 if(q.has('t')){render(((+q.get('t')*FPS)%LOOP+LOOP)%LOOP);return}
 var t0=performance.now();
 (function tick(now){render(((now-t0)/1000*FPS)%LOOP);requestAnimationFrame(tick)})(t0);
}
Promise.all(FONTS.map(function(f){return document.fonts.load(f[0],f[1])})).then(boot,boot);


function init(){$('un').textContent=CFG.unit}
var PK=[255,105,175],GR=[125,255,190];
function render(f){
 var v=kf(f,CFG.curve),p=v/CFG.total;
 var g=kf(f,[[66,0],[72,1],[78,1],[88,0]]);
 var col=mix(PK,GR,g);
 var L=2*Math.PI*46,arc=$('arc');
 arc.setAttribute('stroke-dasharray',(L*p)+' '+L);
 arc.setAttribute('stroke',rgb(col));
 arc.style.filter='drop-shadow(0 0 '+(2+4*g)+'px '+rgb(col,.5)+')';
 var a=-Math.PI/2+p*Math.PI*2;
 var h=$('hd');h.setAttribute('cx',162+46*Math.cos(a));h.setAttribute('cy',62+46*Math.sin(a));
 h.setAttribute('opacity',g>.5?0:1);
 var s=v.toFixed(2);if(s.length<5)s='0'+s;
 $('val').textContent=s;
 $('val').style.color=rgb(mix([255,255,255],GR,g));
 $('val').style.transform='scale('+kf(f,CFG.valPop)+')';
}

</script></body></html>
