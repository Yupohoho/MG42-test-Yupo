<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>N23 Sparkline KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0a0d13}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
body.m{display:block}
#wrap{width:322px;height:126px;transform-origin:center center}
body.m #wrap{transform-origin:0 0}
#card{position:relative;width:322px;height:126px;border-radius:12px;overflow:hidden;background:#131921;font-family:'Montserrat','Noto Sans JP',sans-serif;color:#f3f4f8;-webkit-font-smoothing:antialiased}
#card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(244,114,182,.10),transparent 70%),radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px) 0 0/14px 14px}
#card::after{content:'';position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none;z-index:60}
#card>*{position:absolute}
svg{overflow:visible}
#g,#lg,#lbs,#rws,#bks{left:0;top:0;width:322px;height:126px}
#g>*,#lg>*,#lbs>*,#rws>*,#bks>*{position:absolute}

.rv{left:35px;top:27px;font:700 7.5px/9px Montserrat,sans-serif;letter-spacing:1.6px;color:#7b8494}
.bg{left:33px;top:46px;font:800 31px/36px Montserrat,sans-serif;white-space:nowrap}
.sb{left:35px;top:88px;font:700 9px/12px 'Noto Sans JP',Montserrat,sans-serif;color:#6ee7b7}
</style></head>
<body><div id="wrap"><div id="card"><div class="rv">REVENUE</div><div class="bg" id="bg">+0.0%</div><div class="sb">▲ vs last month</div>
<svg id="sv" width="322" height="126" style="left:0;top:0"></svg></div></div>
<script>

const P=new URLSearchParams(location.search);
const FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo2=t=>{t=clamp(t);return 1-(1-t)*(1-t)};
const eo3=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const ei2=t=>{t=clamp(t);return t*t};
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const sst=t=>{t=clamp(t);return t*t*(3-2*t)};
const ebk=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const $=id=>document.getElementById(id);
function render(t){const c=(((t*FPS)%LOOP)+LOOP)%LOOP;draw(c)}
function boot(){
  if(P.get('m')==='1')document.body.classList.add('m');
  const z=+(P.get('z')||1);$('wrap').style.transform='scale('+z+')';
  const t0=P.get('t');
  if(t0!==null){render(+t0)}else{const s=performance.now();(function f(){render((performance.now()-s)/1000);requestAnimationFrame(f)})()}
}


/* 實測：折線前端/球的進度(0-1，自第11幀起每幀1格，末段漸緩到第52幀)；數字直接由此進度驅動 */
const CFG={target:12.4,sx:[0,0.0469,0.0807,0.1068,0.1328,0.1589,0.1797,0.2031,0.2344,0.2708,0.3125,0.3516,0.4089,0.4635,0.5339,0.5859,0.638,0.6719,0.7031,0.7344,0.763,0.7943,0.8177,0.8385,0.8568,0.8724,0.8932,0.9115,0.9271,0.9375,0.9479,0.9583,0.9688,0.9766,0.9828,0.9883,0.9922,0.9953,0.9977,0.9992,1,1],sx0:11,green:'#6ee7b7',pts:[[134,89],[147,88],[160,84],[173,86],[186,81],[198,78],[211,80],[224,74],[237,71],[249,73],[262,65]]};
const LOOP=120;
const NS='http://www.w3.org/2000/svg';
const sv=$('sv');
const ln=document.createElementNS(NS,'polyline');ln.setAttribute('fill','none');ln.setAttribute('stroke',CFG.green);ln.setAttribute('stroke-width',1.8);ln.setAttribute('stroke-linejoin','round');ln.setAttribute('stroke-linecap','round');sv.appendChild(ln);
const halo=document.createElementNS(NS,'circle');halo.setAttribute('fill','rgba(110,231,183,.25)');sv.appendChild(halo);
const dot=document.createElementNS(NS,'circle');dot.setAttribute('fill','#fff');dot.setAttribute('r',3.2);dot.setAttribute('stroke',CFG.green);dot.setAttribute('stroke-width',1);sv.appendChild(dot);
const P0=CFG.pts,N=P0.length-1;
function draw(c){
  const ex=ei2((c-94)/13);
  let pr=0;{const t=c-CFG.sx0,A=CFG.sx;if(t>=0)pr=t>=A.length-1?A[A.length-1]:lerp(A[Math.floor(t)],A[Math.floor(t)+1],t-Math.floor(t))}
  pr*=(1-ex);
  const v=CFG.target*pr;
  const g=clamp(v/CFG.target);
  $('bg').textContent='+'+Math.max(0,v).toFixed(1)+'%';
  $('bg').style.textShadow='0 0 '+(14*g)+'px rgba(110,231,183,'+(.65*g)+')';
  $('bg').style.color='rgb('+Math.round(lerp(243,214,g))+','+Math.round(lerp(244,250,g))+','+Math.round(lerp(248,232,g))+')';
  const s=pr;
  const L=s*N,f=Math.min(N-1,Math.floor(L));
  const pts=[];for(let k=0;k<=f;k++)pts.push(P0[k][0]+','+P0[k][1]);
  const a=P0[f],b=P0[f+1],u=L-f;const hx=lerp(a[0],b[0],u),hy=lerp(a[1],b[1],u);
  if(L>f)pts.push(hx+','+hy);
  ln.setAttribute('points',pts.join(' '));
  const vis=(c>=114?clamp((c-114)/6):1)*(c>=104&&c<114?1-clamp((c-104)/6):1);
  const pulse=.5+.5*Math.cos(2*Math.PI*(c-50)/24);
  dot.setAttribute('cx',hx);dot.setAttribute('cy',hy);dot.setAttribute('opacity',vis);
  halo.setAttribute('cx',hx);halo.setAttribute('cy',hy);halo.setAttribute('r',4.5+3.5*pulse);halo.setAttribute('opacity',vis*(.35+.65*pulse));
}

const FONT_LOADS=[document.fonts.load('800 20px Montserrat','0123456789+%¥.,'),document.fonts.load('700 12px Montserrat','AoiRenMikaSora'),document.fonts.load('500 12px Montserrat','MobileDesktopTablet'),document.fonts.load('700 12px "Noto Sans JP"','1月2月3月4月5月')];
Promise.race([Promise.all(FONT_LOADS),new Promise(r=>setTimeout(r,2500))]).then(boot,boot);

</script></body></html>
