<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>N02 オドメーター</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0f16}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Montserrat',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:324px;height:122px;border-radius:12px;overflow:hidden;background:#131921;box-shadow:inset 0 0 0 1px #1c2330}
#card::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.2px) 0 0/12px 12px}
.lab{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:8px;font-weight:700;letter-spacing:2px;color:#8d95a6}
#wheels{position:absolute;left:0;right:0;top:33px;height:56px}
.box{position:absolute;top:0;width:38px;height:56px;border-radius:6px;overflow:hidden;background:linear-gradient(#1b222d,#141a23);box-shadow:inset 0 0 0 1px #262e3b}
.strip{position:absolute;left:0;top:0;width:38px;will-change:transform}
.strip div{height:56px;line-height:56px;text-align:center;font-size:30px;font-weight:800;color:#f4f5fa}
.box::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(rgba(0,0,0,.35),transparent 28%,transparent 72%,rgba(0,0,0,.35));pointer-events:none}
.ring{position:absolute;inset:0;border-radius:6px;pointer-events:none;z-index:2}
.comma{position:absolute;top:49px;width:6px;height:9px}
</style></head><body><div id="card"><div class="lab">VIEWS</div><div id="wheels"></div></div>
<script>
/* ===== CFG ===== */
const CFG={
  digits:[0,1,2,4,8,0],        // 最終數字 012,480
  stop:[43,47,51,55,59,63],    // 各位數停住的幀（左→右，參考實測每格間隔4幀）
  pinkIn:6,pinkPeak:2,pinkHold:3,pinkOut:14, // 粉框：停住前6幀開始亮、停前2幀全亮、停後3幀開始退、再14幀退完（實測粉框比停住早約2-3幀達峰）
  revs:3,                      // 轉幾圈
  boxW:38,gap:4,commaGap:16,
  resetAt:112,                 // 此幀起整排歸零
  pink:'255,111,176',
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const W=document.getElementById('wheels'),H=56;
const total=6*CFG.boxW+4*CFG.gap+CFG.commaGap,x0=(324-total)/2;
const cols=[];let x=x0;
for(let i=0;i<6;i++){
  const b=document.createElement('div');b.className='box';b.style.left=x+'px';
  const s=document.createElement('div');s.className='strip';
  let h='';for(let k=0;k<44;k++)h+='<div>'+(k%10)+'</div>';s.innerHTML=h;b.appendChild(s);
  const r=document.createElement('div');r.className='ring';b.appendChild(r);W.appendChild(b);
  cols.push({s,r,b});x+=CFG.boxW+(i===2?CFG.commaGap:CFG.gap);
  if(i===2){const c=document.createElement('div');c.className='comma';c.style.left=(x-CFG.commaGap/2-3)+'px';c.innerHTML='<svg width="6" height="9" viewBox="0 0 6 9"><path d="M2.8 0.2a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2z M5 3 Q5 7.5 1.2 8.8 L0.6 7.6 Q3.2 6.5 3 4z" fill="#ff6fb0"/></svg>';W.appendChild(c)}
}
const pos=(i,f)=>{const s=CFG.stop[i],d=CFG.digits[i]+CFG.revs*10;return f>=s?d:d*eo(f/s)};
function render(f){
  cols.forEach((c,i)=>{
    let p,blur=0,flash=0;
    if(f>=CFG.resetAt){p=CFG.revs*10;} else {
      p=pos(i,f);blur=Math.min(2,Math.abs(pos(i,f+.5)-pos(i,f-.5))*H/9);
      {const st=CFG.stop[i];flash=seg(f,st-CFG.pinkIn,st-CFG.pinkPeak)*(1-seg(f,st+CFG.pinkHold,st+CFG.pinkHold+CFG.pinkOut))}
    }
    c.s.style.transform='translateY('+(-p*H)+'px)';
    c.s.style.filter=blur>.3?'blur('+blur.toFixed(2)+'px)':'none';
    c.r.style.boxShadow=flash>0?'inset 0 0 0 1px rgba('+CFG.pink+','+flash+')':'none';
  });
}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load('800 30px Montserrat','0123456789').then(start,start);
</script></body></html>
