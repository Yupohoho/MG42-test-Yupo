<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>N40 スライス切替 (Slice Switch)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#090d13}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
body.m{display:block}
#wrap{transform-origin:center}
body.m #wrap{transform-origin:0 0}
#c{position:relative;width:324px;height:124px;border-radius:12px;overflow:hidden;font-family:Montserrat,sans-serif;color:#fff;
 background:radial-gradient(circle at 100% 0,rgba(140,80,170,.13),transparent 60%),radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.5px) 5px 5px/11px 11px,#131921;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
#c>*{position:absolute}
.cen{transform:translate(-50%,-50%);white-space:nowrap}
.big{font-family:Montserrat,sans-serif;font-weight:800}
.mn{font-family:Manrope,Montserrat,sans-serif}

#yr{left:162px;top:4px;font:700 8px Montserrat;letter-spacing:.2em;color:#8d96ad}
.band{left:0;width:324px;overflow:hidden}
.band .t{position:absolute;left:0;width:324px;height:124px}
.band .t span{position:absolute;left:162px;top:63px;font-size:84px;line-height:84px;transform-origin:center;white-space:nowrap}

</style></head><body><div id="wrap"><div id="c">
<div class="cen" id="yr">YEAR</div><div id="bands" style="left:0;top:0;width:324px;height:124px"></div>
</div></div>
<script>
/* CFG：示範用的數值、字、色都集中在這裡 */
const LOOP=120;
const FONTS=['800 20px Manrope','700 12px Montserrat'];
const A_TXT='2025',B_TXT='2026',TARGET_W=195;
const OLD='#f6f4ff',NEW='#ff6eb4';
// 實測自參考：切成 4 條橫帶(分界 y=45/62/79)，每條整條水平環繞滑動一圈(週期 P=330px)，
// 第1、3條向右、第2、4條向左（第二次切換方向相反）；滑到半圈(位移>=165)時換字
const T1=9,T2=66,P=330;
const EDG=[0,45,62,79,124],DIRS=[1,-1,1,-1];
// 各條位移量(px)逐幀：[相對起點幀, 位移]
const D=[
 [[-1,0],[0,1],[1,5.5],[2,17],[3,39],[4,73],[5,124],[6,200],[7,252],[8,288],[9,311],[10,324],[11,329],[12,330]],
 [[1,0],[2,1],[3,7],[4,21],[5,44],[6,82],[7,137],[8,211],[9,261],[10,294],[11,314],[12,325],[13,329],[14,330]],
 [[3,0],[4,2],[5,9],[6,24],[7,51],[8,92],[9,150],[10,223],[11,269],[12,299],[13,317],[14,326],[15,329],[16,330]],
 [[5,0],[6,3],[7,11],[8,29],[9,58],[10,102],[11,164],[12,233],[13,276],[14,304],[15,320],[16,327],[17,330]]
];

const FPS=30;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3), ei=t=>Math.pow(clamp(t),3), eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
function kf(keys,f,smooth){
  if(f<=keys[0][0])return keys[0].slice(1);
  for(let i=1;i<keys.length;i++){if(f<=keys[i][0]){const a=keys[i-1],b=keys[i];let t=(f-a[0])/(b[0]-a[0]);if(smooth)t=t*t*(3-2*t);return a.slice(1).map((v,j)=>lerp(v,b[j+1],t))}}
  return keys[keys.length-1].slice(1)}
function rnd(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
const fmt=n=>Math.round(n).toLocaleString('en-US');
const $=id=>document.getElementById(id);
function mix(c1,c2,t){t=clamp(t);return 'rgb('+c1.map((v,i)=>Math.round(lerp(v,c2[i],t))).join(',')+')'}
function place(el,x,y,s,a){el.style.transform='translate(-50%,-50%) translate('+x+'px,'+y+'px) scale('+s+')';el.style.opacity=a}
const q=new URLSearchParams(location.search);
$('wrap').style.transform='scale('+(+q.get('z')||1)+')';
if(q.get('m')==='1')document.body.classList.add('m');
function start(){
  if(typeof setup==='function')setup();
  if(q.has('t')){render(+q.get('t')*FPS);}
  else{const st=performance.now();(function tick(){render(((performance.now()-st)/1000*FPS)%LOOP);requestAnimationFrame(tick)})()}
}
Promise.race([Promise.all(FONTS.map(f=>document.fonts.load(f,'0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ?,.'))),new Promise(r=>setTimeout(r,2500))]).then(start);


let SC=1;
function setup(){
  const host=$('bands');
  for(let b=0;b<4;b++){const d=document.createElement('div');d.className='band';d.style.position='absolute';d.style.top=EDG[b]+'px';d.style.height=(EDG[b+1]-EDG[b])+'px';
    const t=document.createElement('div');t.className='t';t.style.top=(-EDG[b])+'px';
    for(let k=0;k<3;k++){const s=document.createElement('span');s.className='big mn';s.style.transform='translate(-50%,-50%)';t.appendChild(s)}
    d.appendChild(t);host.appendChild(d)}
  const s=host.querySelector('span');s.textContent=A_TXT;SC=TARGET_W/s.offsetWidth;
}
function disp(tbl,t){if(t<=tbl[0][0])return 0;return kf(tbl,t)[0]}
function render(f){
  const bs=$('bands').children;
  for(let b=0;b<4;b++){
    const second=f>=T2-1;
    const d=disp(D[b],f-(second?T2:T1));
    const sign=second?-DIRS[b]:DIRS[b];
    const half=d>=P/2;
    const toB=second?!half:half;
    const txt=toB?B_TXT:A_TXT,col=toB?NEW:OLD;
    const sx=sign*(((d+P/2)%P)-P/2);
    const sp=bs[b].firstChild.children;
    for(let k=0;k<3;k++){const s=sp[k];s.textContent=txt;s.style.color=col;
      s.style.transform='translate(-50%,-50%) translate('+(sx+(k-1)*P)+'px,0) scaleX('+SC+')'}
  }
}
</script></body></html>
