<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>20 3D Orbit</title>
<style>
html,body{margin:0;background:#0b1118}
.card{position:relative;width:326px;height:158px;border-radius:12px;overflow:hidden;background:#000}
video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
</style>
</head>
<body>
<div class="card" id="card"><video src="media/ai20.mp4" muted loop autoplay playsinline preload="auto"></video></div>
<script>
// 此效果用影片生成模型產出，沒有 HTML 重現版；這個頁面只是播放示範影片（圖鑑卡片用）。
const qs = new URLSearchParams(location.search);
if (qs.get('z')) document.getElementById('card').style.zoom = qs.get('z');
if (!qs.get('m')) document.body.style.padding = '20px';
const v = document.querySelector('video');
if (qs.get('t') !== null) { v.pause(); v.addEventListener('loadeddata', () => { v.currentTime = parseFloat(qs.get('t')); }, { once: true }); }
</script>
</body>
</html>
