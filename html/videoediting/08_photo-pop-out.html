<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>08 Photo Pop Out</title>
<style>
html,body{margin:0;background:#0b1118}
.card{position:relative;width:326px;height:158px;border-radius:12px;overflow:hidden;background:#222}
video{position:absolute;object-fit:cover;object-position:50% 12%}
#bgb{left:0;top:0;width:100%;height:100%;transform:scale(1.5);filter:blur(7px) brightness(.72)}
#pol{position:absolute;background:#f7f3ea;box-shadow:0 8px 18px rgba(0,0,0,.5);will-change:transform,opacity}
#ph{position:absolute;overflow:hidden;background:#333}
#bg{left:0;top:0;width:100%;height:100%}
#cut{will-change:transform;transform-origin:50% 100%;z-index:2}
#tape{z-index:1;position:absolute;left:50%;top:-6px;width:38px;height:13px;margin-left:-19px;background:rgba(232,220,180,.88);transform:rotate(3deg);box-shadow:0 1px 2px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="card" id="card">
  <video id="bgb" src="media/base.mp4" muted loop playsinline preload="auto"></video>
  <div id="pol">
    <div id="ph"><video id="bg" src="media/base.mp4" muted loop playsinline preload="auto"></video></div>
    <video id="cut" src="media/cutout.webm" muted loop playsinline preload="auto"></video>
    <div id="tape"></div>
  </div>
</div>
<script>
// ===== 設定區 =====
// 底圖影片與人物去背透明影片是示範素材，使用時請替換。
const CFG = {
  W: 326, H: 158, FPS: 30, LOOP: 120,
  pol: { w: 118, h: 140, cx: 0.50, cy: 0.52, rot: -5 },   // 拍立得尺寸 px、中心（卡片比例）、最終傾斜角
  photo: { l: 9, t: 9, w: 100, h: 96 },                    // 相片視窗（拍立得內，px）
  inStart: 0, inEnd: 10,         // 拍立得入場
  colorStart: 14, colorEnd: 28,  // 黑白 → 彩色
  popStart: 24, popEnd: 46,      // 人物衝出相片
  popScale: 1.55                 // 人物放大倍率（以腳底為支點）
};
// ==================
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const card = $('card'), pol = $('pol'), ph = $('ph'), bg = $('bg'), cut = $('cut');
if (qs.get('z')) card.style.zoom = qs.get('z');
if (!qs.get('m')) document.body.style.padding = '20px';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const easeOutBack = x => { const c = 1.70158 + 0.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const P = CFG.pol, Ph = CFG.photo;
Object.assign(pol.style, { width: P.w + 'px', height: P.h + 'px', left: (CFG.cx !== undefined ? 0 : 0) + 'px' });
Object.assign(pol.style, { left: (P.cx * CFG.W - P.w / 2) + 'px', top: (P.cy * CFG.H - P.h / 2) + 'px' });
Object.assign(ph.style, { left: Ph.l + 'px', top: Ph.t + 'px', width: Ph.w + 'px', height: Ph.h + 'px' });
Object.assign(cut.style, { left: Ph.l + 'px', top: Ph.t + 'px', width: Ph.w + 'px', height: Ph.h + 'px' });

function render(t) {
  const f = (t * CFG.FPS) % CFG.LOOP;
  const a = clamp((f - CFG.inStart) / (CFG.inEnd - CFG.inStart), 0, 1);
  const e = easeOutBack(a);
  pol.style.opacity = clamp(a * 3, 0, 1);
  pol.style.transform = `rotate(${P.rot + (1 - e) * -10}deg) scale(${0.7 + 0.3 * e})`;
  const c = clamp((f - CFG.colorStart) / (CFG.colorEnd - CFG.colorStart), 0, 1);
  bg.style.filter = `grayscale(${1 - c}) contrast(${1.05 - 0.05 * c})`;
  const q = clamp((f - CFG.popStart) / (CFG.popEnd - CFG.popStart), 0, 1);
  cut.style.transform = `scale(${1 + (CFG.popScale - 1) * easeOutBack(q)})`;
  cut.style.visibility = f < CFG.popStart ? 'hidden' : 'visible';
}

const vids = [$('bgb'), bg, cut], main = vids[0];
const seekAll = t => vids.forEach(v => { if (Math.abs(v.currentTime - t) > 0.01) v.currentTime = t; });
const ready = () => Promise.all(vids.map(v => new Promise(r => v.readyState >= 2 ? r() : v.addEventListener('loadeddata', r, { once: true }))));
if (qs.get('t') !== null) {
  const t = parseFloat(qs.get('t')); vids.forEach(v => v.pause());
  ready().then(() => { seekAll(t); render(t); });
} else {
  const loop = () => { const t = main.currentTime; vids.forEach(v => { if (v !== main && Math.abs(v.currentTime - t) > 0.06) v.currentTime = t; }); render(t); requestAnimationFrame(loop); };
  vids.forEach(v => v.play()); requestAnimationFrame(loop);
}
</script>
</body>
</html>
