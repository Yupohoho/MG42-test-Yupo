<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>29 Speed Ramp</title>
<style>
html,body{margin:0;background:#0b1118}
.card{position:relative;width:326px;height:158px;border-radius:12px;overflow:hidden;background:#000}
video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.layer{position:absolute;left:0;top:0;width:100%;height:100%}
#b{visibility:hidden}
svg{position:absolute;width:0;height:0}
</style>
</head>
<body>
<div class="card" id="card">
  <svg><filter id="fa" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="ga" stdDeviation="0 0"/></filter>
  <filter id="fb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="gb" stdDeviation="0 0"/></filter></svg>
  <video id="a" muted playsinline preload="auto" style="filter:url(#fa)"></video>
  <video id="b" muted playsinline preload="auto" style="filter:url(#fb)"></video>
</div>
<script>
// ===== 設定區 =====
// 素材是示範，使用時請替換。A 畫面、B 畫面是兩段各自完整的影片（轉場形狀只決定新畫面露出的範圍），來源可在下方 A / B 自行更換。
const CFG = {
  W: 326, H: 158, FPS: 30, LOOP: 120,
  A: 'media/base.mp4', B: 'media/base2.mp4',  // 轉場前後的兩段畫面
  cut: 35,                                    // A 加速到極速、硬切到 B 的幀
  slow: 0.5, fast: 6,                         // A 起始慢動作倍速、切換瞬間的極速倍率
  rampFrom: 12,                               // A 開始加速的幀
  settle: 18,                                 // B 從極速減速回 1 倍所需幀數
  blur: 1.8,                                  // 水平動態模糊（px / 超出 1.5 倍的倍速）
  zoom: 0.14                                  // 速度感縮放（極速時放大比例）
};
// ==================
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const card = $('card');
if (qs.get('z')) card.style.zoom = qs.get('z');
if (!qs.get('m')) document.body.style.padding = '20px';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (f, a, b) => clamp((f - a) / (b - a), 0, 1);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x;
const easeInOut = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const frameOf = t => (t * CFG.FPS) % CFG.LOOP;
const A = $('a'), B = $('b');
const rateA = f => f < CFG.cut ? lerp(CFG.slow, CFG.fast, easeIn(seg(f, CFG.rampFrom, CFG.cut))) : 0;
const rateB = f => f < CFG.cut ? 0 : lerp(CFG.fast, 1, easeOut(seg(f, CFG.cut, CFG.cut + CFG.settle)));
// 倍速積分成時間：videoTime(f) = Σ rate / FPS，之後取影片長度的餘數
const cumA = [0], cumB = [0];
for (let i = 1; i <= CFG.LOOP + 1; i++) {
  cumA[i] = cumA[i - 1] + rateA(i - 1) / CFG.FPS;
  cumB[i] = cumB[i - 1] + rateB(i - 1) / CFG.FPS;
}
const at = (c, f) => { const i = Math.floor(f), r = f - i; return lerp(c[i], c[i + 1], r); };
const setT = (v, s) => { const d = v.duration || 4; const tt = ((s % d) + d) % d; if (Math.abs(v.currentTime - tt) > 0.005) v.currentTime = tt; };
function render(t) {
  const f = frameOf(t);
  const isB = f >= CFG.cut, v = isB ? B : A;
  A.style.visibility = isB ? 'hidden' : 'visible'; B.style.visibility = isB ? 'visible' : 'hidden';
  const r = isB ? rateB(f) : rateA(f);
  setT(v, at(isB ? cumB : cumA, f));
  const k = Math.max(0, r - 1.5) * CFG.blur;
  (isB ? $('gb') : $('ga')).setAttribute('stdDeviation', k.toFixed(2) + ' 0');
  v.style.transform = 'scale(' + (1 + CFG.zoom * clamp((r - 1) / (CFG.fast - 1), 0, 1)).toFixed(4) + ')';
}

// ===== 影片同步（時間重映射：video.currentTime = f(t)，不使用 playbackRate）=====
$('a').src = CFG.A; $('b').src = CFG.B;
const vids = [$('a'), $('b')];
const ready = () => Promise.all(vids.map(v => new Promise(r => v.readyState >= 2 ? r() : v.addEventListener('loadeddata', r, { once: true }))));
vids.forEach(v => v.pause());
if (qs.get('t') !== null) {
  const t = parseFloat(qs.get('t'));
  ready().then(() => render(t));
} else {
  const T0 = performance.now();
  const loop = () => { render(((performance.now() - T0) / 1000) % (CFG.LOOP / CFG.FPS)); requestAnimationFrame(loop); };
  ready().then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
