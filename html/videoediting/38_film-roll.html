<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>38 Film Roll</title>
<style>
html,body{margin:0;background:#0b1118}
.card{position:relative;width:326px;height:158px;border-radius:12px;overflow:hidden;background:linear-gradient(100deg,#2a313a 0%,#3a3e46 55%,#51433f 100%)}
#strip{position:absolute;top:0;height:100%;background:#16110d;box-shadow:0 0 12px rgba(0,0,0,.6)}
.perf{position:absolute;top:0;height:100%;width:6px;background-image:linear-gradient(to bottom,transparent 2px,#ece3cc 2px,#ece3cc 9px,transparent 9px);background-repeat:repeat-y}
.cell{position:absolute;left:0;width:100%;will-change:transform}
.cell video{position:absolute;object-fit:cover;object-position:50% 30%;background:#333}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur id="mbs" stdDeviation="0 0"/></filter></svg>
<div class="card" id="card"><div id="strip"></div></div>
<script>
// ===== 設定區 =====
// 四支底圖影片是示範素材（每格底片一支），使用時請替換；來源數量決定循環格數。
const CFG = {
  W: 326, H: 158, FPS: 30, LOOP: 120,
  srcs: ['media/base2.mp4', 'media/base.mp4', 'media/land.mp4', 'media/base3.mp4'],
  strip: { w: 130, pitch: 68, photoW: 106, photoH: 58, perf: 11, cy: 0.5 },   // 底片寬、每格間距、相片尺寸、孔距、結束時中央格的高度比例
  scroll: { k0: -0.55, k1: 3, start: 0, end: 84 },     // 捲動：起點／終點（以格為單位）、起訖幀
  blur: 0,                                             // 動態模糊強度（每幀位移 px × 此值）
  shake: 0.4,                                          // 捲動時底片左右顫動的最大幅度 px（隨捲動速度變化，停下來就不抖）
  expo: 0.07                                           // 捲動時的微微爆光（亮度閃爍）最大增量，隨捲動速度變化
};
// ==================
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const card = $('card'), strip = $('strip');
if (qs.get('z')) card.style.zoom = qs.get('z');
if (!qs.get('m')) document.body.style.padding = '20px';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const S = CFG.strip, N = CFG.srcs.length;
Object.assign(strip.style, { width: S.w + 'px', left: ((CFG.W - S.w) / 2) + 'px' });
const perfL = document.createElement('div'), perfR = document.createElement('div');
for (const [p, x] of [[perfL, 3], [perfR, S.w - 9]]) { p.className = 'perf'; p.style.left = x + 'px'; p.style.backgroundSize = `6px ${S.perf}px`; strip.append(p); }
const cells = CFG.srcs.map((src, i) => {
  const c = document.createElement('div'); c.className = 'cell'; c.style.height = S.pitch + 'px';
  const v = document.createElement('video'); v.src = src; v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
  Object.assign(v.style, { left: (S.w - S.photoW) / 2 + 'px', top: (S.pitch - S.photoH) / 2 + 'px', width: S.photoW + 'px', height: S.photoH + 'px' });
  c.append(v); strip.append(c); return { c, v };
});
const vids = cells.map(o => o.v), main = vids[0];

function render(t) {
  const f = (t * CFG.FPS) % CFG.LOOP, K = CFG.scroll;
  const x = clamp((f - K.start) / (K.end - K.start), 0, 1);
  const k = K.k0 + (K.k1 - K.k0) * easeOut(x);
  const speed = x >= 1 ? 0 : (K.k1 - K.k0) * 3 * Math.pow(1 - x, 2) / (K.end - K.start) * S.pitch;   // px／幀
  const cy = CFG.H * S.cy;
  cells.forEach((o, i) => {
    const m = ((((i - k + 2) % N) + N) % N) - 2;               // 循環位置：-2 ~ N-2 格
    o.c.style.transform = `translateY(${cy + m * S.pitch - S.pitch / 2}px)`;
  });
  const off = ((-k * S.pitch) % S.perf + S.perf) % S.perf + cy - S.pitch / 2;
  perfL.style.backgroundPositionY = perfR.style.backgroundPositionY = off + 'px';
  const b = speed * CFG.blur;
  const pk = (K.k1 - K.k0) * 3 / (K.end - K.start) * S.pitch, sn = clamp(speed / pk, 0, 1);   // 目前速度佔最高速的比例
  const nz = Math.sin(f * 1.7) * 0.6 + Math.sin(f * 3.9 + 1.3) * 0.3 + Math.sin(f * 6.3 + 0.4) * 0.1;   // 不規則的抖動（-1~1）
  const fl = 0.5 + 0.5 * (Math.sin(f * 3.7 + 0.8) * 0.6 + Math.sin(f * 7.1) * 0.4);   // 不規則的亮度閃爍（0~1）
  strip.style.transform = `translateX(${(nz * CFG.shake * sn).toFixed(2)}px)`;
  $('mbs').setAttribute('stdDeviation', `0 ${b.toFixed(2)}`);
  const ex = 1 + CFG.expo * sn * (0.35 + 0.65 * fl);
  strip.style.filter = (b > 0.15 ? 'url(#mb) ' : '') + `brightness(${ex.toFixed(3)}) contrast(${(1 + 0.06 * (ex - 1) / CFG.expo).toFixed(3)}) saturate(${(1 + 0.25 * (ex - 1) / CFG.expo).toFixed(3)})`;
}

const ready = () => Promise.all(vids.map(v => new Promise(r => v.readyState >= 2 ? r() : v.addEventListener('loadeddata', r, { once: true }))));
if (qs.get('t') !== null) {
  const t = parseFloat(qs.get('t')); vids.forEach(v => v.pause());
  ready().then(() => { vids.forEach(v => v.currentTime = t); render(t); });
} else {
  ready().then(() => {
    const loop = () => { const t = main.currentTime; vids.forEach(v => { if (v !== main && Math.abs(v.currentTime - t) > 0.06) v.currentTime = t; }); render(t); requestAnimationFrame(loop); };
    vids.forEach(v => v.play()); requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
