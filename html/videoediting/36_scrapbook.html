<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>36 Scrapbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap">
<style>
html,body{margin:0;background:#0b1118}
.card{position:relative;width:326px;height:158px;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 40% 35%,#e3cfa7,#c9ab7b 80%)}
.it{position:absolute;opacity:0;will-change:transform,opacity}
.pl{background:#fbf8f1;box-shadow:0 2px 6px rgba(60,40,10,.45)}
.ph{position:absolute;overflow:hidden;background:#444}
video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.tape{height:9px;opacity:.0;background:repeating-linear-gradient(45deg,rgba(120,200,235,.85) 0 3px,rgba(235,248,255,.85) 3px 6px);box-shadow:0 1px 1px rgba(0,0,0,.15)}
.lab{font:700 9px/1 'Montserrat',sans-serif;white-space:nowrap;display:flex;align-items:center;justify-content:center}
.star{width:13px;height:13px}
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
// ===== 設定區 =====
// 三支底圖影片與文字（日期、標題）都是示範，使用時請替換。
const CFG = {
  W: 326, H: 158, FPS: 30, LOOP: 120,
  photos: [   // 相片：來源、位置（左上 px）、尺寸、傾斜角、進場幀、相框邊寬(上左右/下)
    { src: 'media/base2.mp4', l: 8,   t: 10, w: 80,  h: 102, rot: -6,   start: 4,  pos: '60% 30%', b: [4, 17] },
    { src: 'media/base3.mp4', l: 240, t: 6,  w: 78,  h: 96,  rot: 4,    start: 14, pos: '97% 40%', b: [4, 15] },
    { src: 'media/land.mp4',  l: 95,  t: 15, w: 136, h: 98,  rot: -1.5, start: 20, pos: '50% 60%', b: [4, 4] }
  ],
  tapes: [    // 紙膠帶：位置、長度、角度、顏色、進場幀
    { l: 66,  t: 12,  w: 32, rot: -32, c: [120, 200, 235], start: 30 },
    { l: 150, t: 106, w: 30, rot: -14, c: [245, 160, 190], start: 34 },
    { l: 262, t: 2,   w: 28, rot: 6,   c: [245, 215, 110], start: 38 }
  ],
  labels: [   // 文字貼紙
    { text: 'SEASIDE DATE♡', l: 214, t: 102, w: 100, h: 30, rot: -2, bg: '#fffdf4', color: '#33384a', size: 10, start: 38 },
    { text: '2026.10.31', l: 12, t: 122, w: 68, h: 17, rot: -1.5, bg: '#2c3b50', color: '#fff', size: 9, start: 46 }
  ],
  stars: [    // 星星貼紙
    { l: 218, t: 76,  rot: 0,   c: '#4cc3ee', start: 52 },
    { l: 4,   t: 106, rot: -10, c: '#f27c9c', start: 56 },
    { l: 305, t: 120, rot: 12,  c: '#f6c84a', start: 60 }
  ],
  dy: 8,                          // 整體往下偏移 px（所有元素的上緣位置都加上這個值）
  popDur: 10                      // 一般進場幀數
};
// ==================
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const card = $('card');
if (qs.get('z')) card.style.zoom = qs.get('z');
if (!qs.get('m')) document.body.style.padding = '20px';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const easeOutBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const spring = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(11 * x);
const items = [], vids = [];
const mk = (cls, o, css) => { const d = document.createElement('div'); d.className = 'it ' + cls; Object.assign(d.style, css); card.append(d); return d; };
CFG.photos.forEach(p => {
  const d = mk('pl', p, { left: p.l + 'px', top: (p.t + CFG.dy) + 'px', width: p.w + 'px', height: p.h + 'px' });
  const ph = document.createElement('div'); ph.className = 'ph';
  Object.assign(ph.style, { left: p.b[0] + 'px', top: p.b[0] + 'px', width: (p.w - 2 * p.b[0]) + 'px', height: (p.h - p.b[0] - p.b[1]) + 'px' });
  const v = document.createElement('video'); v.src = p.src; v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto'; v.style.objectPosition = p.pos;
  ph.append(v); d.append(ph); vids.push(v);
  items.push({ el: d, rot: p.rot, start: p.start, kind: 'photo' });
});
CFG.tapes.forEach(p => {
  const d = mk('tape', p, { left: p.l + 'px', top: (p.t + CFG.dy) + 'px', width: p.w + 'px', transformOrigin: '0 50%',
    background: `repeating-linear-gradient(45deg,rgba(${p.c},.88) 0 3px,rgba(255,255,255,.7) 3px 6px)` });
  items.push({ el: d, rot: p.rot, start: p.start, kind: 'tape' });
});
CFG.labels.forEach(p => {
  const d = mk('lab', p, { left: p.l + 'px', top: (p.t + CFG.dy) + 'px', width: p.w + 'px', height: p.h + 'px', background: p.bg, color: p.color, fontSize: p.size + 'px', boxShadow: '0 1px 3px rgba(60,40,10,.4)' });
  d.textContent = p.text;
  items.push({ el: d, rot: p.rot, start: p.start, kind: 'label' });
});
CFG.stars.forEach(p => {
  const d = mk('star', p, { left: p.l + 'px', top: (p.t + CFG.dy) + 'px' });
  d.innerHTML = `<svg viewBox="-10 -10 20 20" width="13" height="13"><polygon fill="${p.c}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" paint-order="stroke fill" points="0,-9 2.6,-3 9,-2.8 4,1.6 5.6,8 0,4.6 -5.6,8 -4,1.6 -9,-2.8 -2.6,-3"/></svg>`;
  items.push({ el: d, rot: p.rot, start: p.start, kind: 'star' });
});

function render(t) {
  const f = (t * CFG.FPS) % CFG.LOOP;
  for (const it of items) {
    const q = clamp((f - it.start) / CFG.popDur, 0, 1);
    it.el.style.opacity = q > 0 ? clamp(q * 4, 0, 1) : 0;
    let tr;
    if (it.kind === 'photo') tr = `rotate(${it.rot + (1 - easeOutBack(q)) * -9}deg) scale(${1 + (1 - easeOutBack(q)) * 0.4})`;
    else if (it.kind === 'tape') tr = `rotate(${it.rot}deg) scaleX(${spring(q)})`;
    else if (it.kind === 'label') tr = `rotate(${it.rot}deg) translateY(${(1 - easeOutBack(q)) * 10}px) scale(${0.6 + 0.4 * easeOutBack(q)})`;
    else tr = `rotate(${it.rot + (1 - spring(q)) * 90}deg) scale(${spring(q)})`;
    it.el.style.transform = tr;
  }
}

const main = vids[0];
const ready = () => Promise.all(vids.map(v => new Promise(r => v.readyState >= 2 ? r() : v.addEventListener('loadeddata', r, { once: true }))));
const fontsReady = () => Promise.all([document.fonts.load("700 12px 'Montserrat'")]).catch(() => {}).then(() => document.fonts.ready);
if (qs.get('t') !== null) {
  const t = parseFloat(qs.get('t')); vids.forEach(v => v.pause());
  Promise.all([ready(), fontsReady()]).then(() => { vids.forEach(v => v.currentTime = t); render(t); });
} else {
  Promise.all([ready(), fontsReady()]).then(() => {
    const loop = () => { const t = main.currentTime; vids.forEach(v => { if (v !== main && Math.abs(v.currentTime - t) > 0.06) v.currentTime = t; }); render(t); requestAnimationFrame(loop); };
    vids.forEach(v => v.play()); requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
