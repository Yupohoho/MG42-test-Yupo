<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>78 Text Mosaic</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@800&family=Noto+Sans+JP:wght@900&family=RocknRoll+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@800&family=Reggae+One&family=Rampart+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; box-sizing:border-box; }
  #grid { position:absolute; display:grid; }
  .tile { position:relative; border-radius:6px; display:flex; align-items:center; justify-content:center; line-height:1; }
</style>
</head>
<body>
<div id="card"><div id="grid"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#f8c443',
  tile: '#ecb93c',          // 平常的格子底色
  lit: '#d6a12c',           // 輪到的格子底色（變深＝被點亮）
  cols: 4, pad: 6, gap: 4,
  fontSize: 36,
  // 每格一個字、一種字型；順序就是點亮順序（左上 → 右上 → 左下 → 右下）
  cells: [
    { ch: '愛', font: '"Dela Gothic One"', color: '#17171a' },
    { ch: '夢', font: '"Shippori Mincho B1"', weight: 800, color: '#7a5508' },
    { ch: '光', font: '"Noto Sans JP"', weight: 900, color: '#17171a' },
    { ch: '風', font: '"RocknRoll One"', color: '#7a5508' },
    { ch: '花', font: '"DotGothic16"', color: '#17171a' },
    { ch: '月', font: '"M PLUS Rounded 1c"', weight: 800, color: '#7a5508' },
    { ch: '海', font: '"Reggae One"', color: '#17171a', shadow: '2px 2px 0 #f6efe0, 3px 3px 0 #17171a' },
    { ch: '空', font: '"Rampart One"', color: '#7a5508' },
  ],
  each: .267,               // 每格亮多久（秒）
  fade: .07,                // 換格時淡入淡出的時間
};
CFG.loop = CFG.each * CFG.cells.length;
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), grid = document.getElementById('grid');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
const rows = Math.ceil(CFG.cells.length / CFG.cols);
Object.assign(grid.style, { left: CFG.pad+'px', top: CFG.pad+'px', right: CFG.pad+'px', bottom: CFG.pad+'px', gap: CFG.gap+'px',
  gridTemplateColumns: `repeat(${CFG.cols}, 1fr)`, gridTemplateRows: `repeat(${rows}, 1fr)` });
const tiles = CFG.cells.map(c => {
  const d = document.createElement('div'); d.className = 'tile'; d.textContent = c.ch;
  Object.assign(d.style, { fontFamily: c.font + ',sans-serif', fontWeight: c.weight || 400, fontSize: CFG.fontSize+'px',
    color: c.color, textShadow: c.shadow || 'none' });
  grid.appendChild(d); return d;
});
const hex = (h) => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const A = hex(CFG.tile), B = hex(CFG.lit);

function render(t) {
  tiles.forEach((el, i) => {
    // 這一格的點亮程度：輪到時 1，前後各用 fade 秒淡入淡出
    let d = t - i * CFG.each; if (d < -CFG.fade) d += CFG.loop;
    const k = d < 0 ? 1 + d / CFG.fade : d < CFG.each ? 1 : Math.max(0, 1 - (d - CFG.each) / CFG.fade);
    el.style.background = `rgb(${A.map((a, j) => Math.round(a + (B[j] - a) * k)).join(',')})`;
  });
}

Promise.all(CFG.cells.map(c => document.fonts.load(`${c.weight || 400} ${CFG.fontSize}px ${c.font}`, c.ch))).then(() => {
  if (q.has('t')) render(+q.get('t') % CFG.loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % CFG.loop); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
