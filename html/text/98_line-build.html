<!doctype html>
<html><head><meta charset="utf-8"><title>T98 Line Build</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#e9e7e3}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
body.m{display:block;min-height:0}
.card{position:relative;overflow:hidden}
canvas{display:block}
</style></head>
<body><div class="card" id="card"><canvas id="cv"></canvas></div>
<script>
// ===== CFG：可換內容集中在這裡 =====
const CFG={
  text:'BUILD',
  font:'"Oswald"', weight:'700',
  textBox:{x:32,y:25,w:57,h:19},          // 字停住時的墨跡框（左上角）
  frame:{x0:24.5,y0:14.5,x1:262.5,y1:141.5},// 外框
  square:{cx:213.6,cy:116.4,s:32},        // 右下角色塊
  bg:'#fcfcf9', ink:'#232631', accent:'#9575cd', guide:'#8c8c8a'
};
const LOOP=120; // 幀（30fps），動畫約 50 幀，其餘停住

// ===== 動態 =====
// 外框一筆畫：上→右→下（右往左）→左（下往上），畫到的比例（n=2 起）
const PB=[0,15,40,72,107,151,208,280,375,463,534,591,636,670,694,712,724,732,737,739,740].map(v=>v/740);
const HC=[0,5,11,17,27,41,61,87,123,158,184,204,218,228,234,238,240].map(v=>v/240);              // 橫中線（n=8 起，左→右）
const VC=[0,2,5,7,8,10,16,23,32,44,60,78,94,107,116,121,126,128,129].map(v=>v/129);              // 直中線（n=10 起，上→下）
const DG=[0,1,2,3,4,4,6,8,11,15,19,24,30,38,45,56,65,71,78,83,88,91,94,96,97,98,98,100].map(v=>v/100); // 對角線（n=6 起，左下→右上）
const TA=[.27,.41,.58,.69,.8,.87,.955,.963,.974,.98,.995,1];   // 字淡入（n=26 起）
const TY=[6,5,4,3,2,2,1,1,1,1,0];                              // 字往上滑（px）
const SS=[.24,.5,.7,.84,.96,1.05,1.12,1.155,1.17,1.17,1.16,1.14,1.12,1.09,1.05,1.03,1.02,1]; // 色塊彈出（n=32 起）
const SR=[25,18,15,8,0,-5,-10,-11,-12,-12,-10,-8,-6,-4.5,-3,-1.5,-.5,0];                     // 色塊轉正（度）
let L;
function init(){L=fitText(CFG.text,CFG.font,CFG.weight,CFG.textBox);}
function seg(x0,y0,x1,y1,p){if(p<=0)return;ctx.moveTo(x0,y0);ctx.lineTo(x0+(x1-x0)*p,y0+(y1-y0)*p);}
function render(n){
  const {x0,y0,x1,y1}=CFG.frame,W=x1-x0,H=y1-y0,P=2*(W+H);
  // 輔助線
  ctx.strokeStyle=CFG.guide;ctx.lineWidth=1.2;ctx.beginPath();
  seg(x0,(y0+y1)/2,x1,(y0+y1)/2,n>=8?tab(HC,n-8):0);
  seg((x0+x1)/2,y0,(x0+x1)/2,y1,n>=10?tab(VC,n-10):0);ctx.stroke();
  // 外框
  let d=(n>=2?tab(PB,n-2):0)*P;ctx.strokeStyle=CFG.ink;ctx.lineWidth=1.6;ctx.lineCap='square';ctx.beginPath();
  const sides=[[x0,y0,x1,y0,W],[x1,y0,x1,y1,H],[x1,y1,x0,y1,W],[x0,y1,x0,y0,H]];
  for(const [a,b,c,e,len] of sides){if(d<=0)break;seg(a,b,c,e,Math.min(1,d/len));d-=len;}
  ctx.stroke();ctx.lineCap='butt';
  // 對角線
  ctx.strokeStyle=CFG.accent;ctx.lineWidth=2.2;ctx.beginPath();seg(x0,y1,x1,y0,n>=6?tab(DG,n-6):0);ctx.stroke();
  // 字
  if(n>=26)drawText(L,CFG.ink,1,tab(TA,n-26),tab(TY,n-26));
  // 色塊
  if(n>=32){const {cx,cy,s}=CFG.square,k=tab(SS,n-32);ctx.save();ctx.translate(cx,cy);ctx.rotate(tab(SR,n-32)*Math.PI/180);
    ctx.fillStyle=CFG.accent;ctx.fillRect(-s*k/2,-s*k/2,s*k,s*k);ctx.restore();}
}

// ===== 共用 =====
const Q=new URLSearchParams(location.search),Z=+(Q.get('z')||1);
if(Q.get('m'))document.body.classList.add('m');
const CW=284,CH=158,DPR=window.devicePixelRatio||1;
const card=document.getElementById('card'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
card.style.cssText+=`width:${CW*Z}px;height:${CH*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width=CW*Z*DPR;cv.height=CH*Z*DPR;cv.style.width=CW*Z+'px';cv.style.height=CH*Z+'px';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tab=(A,i)=>A[clamp(Math.floor(i),0,A.length-1)];
const lerp=(a,b,p)=>a+(b-a)*p;
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,p)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*p)).join(',')})`};
// 文字依墨跡框定位：box={x,y,w,h}；w 省略時照字型原比例
function fitText(str,fam,wt,box){
  const c=document.createElement('canvas').getContext('2d');c.font=`${wt} 200px ${fam}`;
  const m=c.measureText(str),k=box.h/(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent);
  const nw=(m.actualBoundingBoxLeft+m.actualBoundingBoxRight)*k,sx=box.w?box.w/nw:1;
  return{str,font:`${wt} ${200*k}px ${fam}`,sx,ox:-(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2*k,
    nw,oy:(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2*k,cx:box.x+(box.w||0)/2,cy:box.y+box.h/2};
}
function drawText(L,color,s=1,alpha=1,dy=0){
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(L.cx,L.cy+dy);ctx.scale(s*L.sx,s);
  ctx.font=L.font;ctx.fillStyle=color;ctx.fillText(L.str,L.ox,L.oy);ctx.restore();
}
function frame(t){
  const n=Math.floor(t*30+1e-6)%LOOP;
  ctx.setTransform(Z*DPR,0,0,Z*DPR,0,0);ctx.globalAlpha=1;ctx.filter='none';
  ctx.fillStyle=CFG.bg;ctx.fillRect(0,0,CW,CH);render(n);
}
const T0=Q.get('t');
document.fonts.load(`400 60px "Archivo Black"`,'A').then(()=>document.fonts.load(`700 60px "Oswald"`,'A')).catch(()=>{}).then(()=>{
  init();
  if(T0!==null)frame(+T0);else{const st=performance.now();const lp=()=>{frame((performance.now()-st)/1000);requestAnimationFrame(lp)};lp();}
});
</script></body></html>
