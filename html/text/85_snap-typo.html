<!doctype html>
<html><head><meta charset="utf-8"><title>T85 Snap Typo</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#e9e7e3}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
body.m{display:block;min-height:0}
.card{position:relative;overflow:hidden}
canvas{display:block}
</style></head>
<body><div class="card" id="card"><canvas id="cv"></canvas></div>
<script>
// ===== CFG：可換內容集中在這裡 =====
const CFG={
  text:'NEXT', accentIdx:[3],
  font:'"Oswald"', weight:'700',
  box:{x:61,y:35,w:166,h:87},
  dirs:[[-1,0],[0,-1],[0,1],[1,0]],   // 各字飛入方向：左、上、下、右（依序循環）
  line:{x:66,y:138,h:4},
  bg:'#fcfcf9', ink:'#232631', accent:'#3d67f2'
};
const LOOP=120;

// ===== 共用 =====
const Q=new URLSearchParams(location.search),Z=+(Q.get('z')||1);
if(Q.get('m'))document.body.classList.add('m');
const CW=284,CH=158,DPR=window.devicePixelRatio||1;
const card=document.getElementById('card'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
card.style.cssText+=`width:${CW*Z}px;height:${CH*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width=CW*Z*DPR;cv.height=CH*Z*DPR;cv.style.width=CW*Z+'px';cv.style.height=CH*Z+'px';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),tab=(A,i)=>A[clamp(i,0,A.length-1)];
function layout(str,fam,wt,box){
  const c=document.createElement('canvas').getContext('2d'),f=s=>`${wt} ${s}px ${fam}`;c.font=f(200);
  const m=c.measureText(str),k=box.h/(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent);
  const sx=box.w/((m.actualBoundingBoxLeft+m.actualBoundingBoxRight)*k);
  const pen0=box.x+m.actualBoundingBoxLeft*k*sx,base=box.y+m.actualBoundingBoxAscent*k;
  const L=[...str].map((ch,i)=>({ch,pen:pen0+c.measureText(str.slice(0,i)).width*k*sx}));
  return{font:f(200*k),sx,base,L};
}
let LAY;
// ===== 動態 =====
// 每個字隔 3 幀「啪」地飛入定位（k=距離落地還有幾幀 → 位移 px），最後一字落地後整個字震一下，底線由左長出
const DISP={7:180,6:105,5:58,4:30,3:15,2:6,1:2,0:0};
const LAND0=6,GAP=3;
const SHAKE=[[-5,-3],[4,0],[-4,3],[3,-3],[-2,0],[1,3]];
const UW=[23,62,91,111,126,136,143,147,150,151,152];
function render(t){
  const n=Math.floor(t*30+1e-6)%LOOP;
  ctx.setTransform(Z*DPR,0,0,Z*DPR,0,0);ctx.fillStyle=CFG.bg;ctx.fillRect(0,0,CW,CH);
  const N=LAY.L.length,lastLand=LAND0+GAP*(N-1),s0=lastLand+4;
  const sh=(n>=s0&&n<s0+SHAKE.length)?SHAKE[n-s0]:[0,0];
  // 底線
  const u=n-(s0+3);if(u>=0){ctx.fillStyle=CFG.accent;ctx.fillRect(CFG.line.x,CFG.line.y,tab(UW,u),CFG.line.h);}
  ctx.font=LAY.font;
  LAY.L.forEach((l,i)=>{
    const k=LAND0+GAP*i-n;if(k>7)return;
    const dir=CFG.dirs[i%CFG.dirs.length],col=CFG.accentIdx.includes(i)?CFG.accent:CFG.ink;
    const draw=(d,a)=>{ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;ctx.translate(l.pen+dir[0]*d+sh[0],LAY.base+dir[1]*d+sh[1]);ctx.scale(LAY.sx,1);ctx.fillText(l.ch,0,0);ctx.restore()};
    if(k<=0){draw(0,1);return;}
    // 動態模糊：沿移動方向疊殘影
    const d=DISP[k],dp=DISP[k+1]??d*1.7,G=6;
    for(let g=G;g>=1;g--)draw(d+(dp-d)*0.6*g/G,0.14);
    draw(d,k>=2?0.6:0.9);
  });
}
const T0=Q.get('t');
document.fonts.load(`${CFG.weight} 60px ${CFG.font}`,CFG.text).then(()=>{
  LAY=layout(CFG.text,CFG.font,CFG.weight,CFG.box);
  if(T0!==null)render(+T0);else{const st=performance.now();const loop=()=>{render((performance.now()-st)/1000);requestAnimationFrame(loop)};loop();}
});
</script></body></html>
