<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>55 Gradient Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #w { position:absolute; left:0; top:0; line-height:1.15; white-space:nowrap; font-family:'Dela Gothic One',sans-serif;
       -webkit-background-clip:text; background-clip:text; color:transparent; }
</style>
</head>
<body>
<div id="card"><div id="w"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: '流れる色',
  W: 324, H: 106,
  bg: '#f4f0e6',
  colorA: '#ff6b4f',    // 漸層亮色
  colorB: '#241212',    // 漸層暗色
  fontSize: 58,
  cy: .55,
  period: 110,          // 一組「亮→暗→亮」的寬度（px）
  angle: 100,           // 漸層方向（度；90 = 水平，略大於 90 = 稍微斜）
  loop: 2.75,           // 漸層往右流過一組的秒數（等速）
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), w = document.getElementById('w');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
w.textContent = CFG.text;
const P = CFG.period;
Object.assign(w.style, { fontSize: CFG.fontSize+'px',
  backgroundImage: `repeating-linear-gradient(${CFG.angle}deg, ${CFG.colorA} 0px, ${CFG.colorB} ${P / 2}px, ${CFG.colorA} ${P}px)` });

function render(t) {
  w.style.transform = `translate(${(CFG.W - w.offsetWidth) / 2}px,${CFG.cy * CFG.H - w.offsetHeight / 2}px)`;
  // 漸層位置往右平移，一個循環剛好一組寬度，循環點不跳
  w.style.backgroundPosition = `${(t / CFG.loop) * P / Math.sin(CFG.angle * Math.PI / 180)}px 0`;
}

const start = () => {
  if (q.has('t')) render(+q.get('t') % CFG.loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % CFG.loop); requestAnimationFrame(f); })(t0); }
};
document.fonts.load(`${CFG.fontSize}px "Dela Gothic One"`, CFG.text).then(start);
</script>
</body>
</html>
