<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>46 Heartbeat Zoom</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #glow { position:absolute; inset:0; }
  #word { position:absolute; left:0; top:0; line-height:1; white-space:nowrap; font-family:'Dela Gothic One',sans-serif; }
  .ring { position:absolute; border-radius:50%; border-style:solid; }
</style>
</head>
<body>
<div id="card"><div id="glow"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: '鼓動',
  W: 324, H: 106,
  bg: '#c4f73c',
  color: '#121212',
  ringColor: 'rgba(18,18,18,.75)',
  fontSize: 64,
  cx: .5, cy: .55,
  beats: [0, 12],          // 一個循環裡兩下心跳（「咚、咚」）的起始幀
  ringStart: 18,           // 波紋從多大開始（px 半徑）
  ringGrow: 85,            // 波紋擴散到多大（px）
  ringFrames: 16,          // 波紋擴散並淡出的幀數
  loopFrames: 30,
};
// =================================
// 每下心跳的逐幀放大（從該下開始算）：一幀跳大 → 撐住 → 慢慢縮回
const BEAT1 = [1.24, 1.30, 1.30, 1.30, 1.29, 1.25, 1.20, 1.10, 1.04, 1.01, 1];
const BEAT2 = [1.15, 1.20, 1.20, 1.20, 1.20, 1.17, 1.13, 1.07, 1.03, 1.01, 1];
const FIRST = 4;           // 第一下心跳在第幾幀

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), glow = document.getElementById('glow');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
const word = document.createElement('div'); word.id = 'word'; word.textContent = CFG.text;
Object.assign(word.style, { fontSize: CFG.fontSize+'px', color: CFG.color });
const rings = CFG.beats.map(() => { const r = document.createElement('div'); r.className = 'ring'; card.appendChild(r); return r; });
card.appendChild(word);
const X0 = CFG.cx * CFG.W, Y0 = CFG.cy * CFG.H;

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  // 字的放大：取正在作用的那一下
  let s = 1, pulse = 0;
  CFG.beats.forEach((b, i) => {
    const d = f - FIRST - b, tab = i ? BEAT2 : BEAT1;
    if (d >= 0 && d < tab.length) { s = tab[d]; pulse = Math.max(pulse, (tab[d] - 1) / .3); }
  });
  const w = word.offsetWidth, h = word.offsetHeight;
  word.style.transform = `translate(${X0 - w/2}px,${Y0 - h/2}px) scale(${s})`;
  // 中央暗暈跟著心跳變濃
  glow.style.background = `radial-gradient(ellipse 45% 70% at ${CFG.cx*100}% ${CFG.cy*100}%, rgba(40,60,0,${.6*pulse}), transparent 70%)`;
  // 每下心跳放出一圈波紋，往外擴散淡出
  rings.forEach((r, i) => {
    const d = f - FIRST - CFG.beats[i];
    if (d < 0 || d >= CFG.ringFrames) { r.style.opacity = 0; return; }
    const k = d / CFG.ringFrames, R = CFG.ringStart + CFG.ringGrow * (1 - (1 - k) ** 2);
    Object.assign(r.style, { left: X0 - R + 'px', top: Y0 - R + 'px', width: 2*R + 'px', height: 2*R + 'px',
      borderWidth: 3.5 - 1.5 * k + 'px', borderColor: CFG.ringColor, opacity: 1 - k });
  });
}

const start = () => {
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function loop(now){ render((now - t0) / 1000); requestAnimationFrame(loop); })(t0); }
};
document.fonts.load(`${CFG.fontSize}px "Dela Gothic One"`, CFG.text).then(start);
</script>
</body>
</html>
