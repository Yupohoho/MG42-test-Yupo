<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>108 Perspective Fly-in</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Space+Mono:wght@700&display=block" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  svg { position:absolute; left:0; top:0; overflow:visible; }
</style>
</head>
<body>
<div id="card"><svg id="sv"><g id="g1"><text id="t1"></text></g><g id="g2"><text id="t2"></text></g><text id="t3"></text></svg></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 284, H: 158,
  bg: '#FCFCF9',
  ink: '#24242F',
  accent: '#EE7493',
  sub: '#6E6E73',
  // 第一行（深色）、第二行（強調色）、上方小字
  line1: { text: 'COMING', box: [24, 22, 263, 83], origin: [143.5, 52.5], start: 0, frames: 28 },
  line2: { text: 'SOON',   box: [63, 91, 223, 152], origin: [143, 110],  start: 5, frames: 31 },
  top:   { text: 'NEW DROP — 2026', box: [91, 8, 194, 14], fadeIn: [28, 38] },
  fromScale: 0.12,                      // 從遠處（很小）飛到眼前
};
const LOOP = 120;                       // 一輪幀數（30fps）
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), sv = document.getElementById('sv');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
sv.setAttribute('width', CFG.W); sv.setAttribute('height', CFG.H);
const cv = document.createElement('canvas').getContext('2d');
function fitText(t, str, font, box, mode) {
  cv.font = `${font.w} 100px ${font.f}`; const m = cv.measureText(str);
  const fs = (box[3]-box[1]) / (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) * 100, k = fs/100;
  const inkW = (m.actualBoundingBoxLeft + m.actualBoundingBoxRight) * k, bw = box[2]-box[0];
  t.textContent = str;
  Object.entries({ 'font-family': font.f.replace(/"/g,''), 'font-weight': font.w, 'font-size': fs,
    x: box[0] + m.actualBoundingBoxLeft*k, y: box[1] + m.actualBoundingBoxAscent*k }).forEach(([a,v]) => t.setAttribute(a, v));
  if (mode === 'ls') t.setAttribute('letter-spacing', (bw-inkW) / Math.max(1, [...str].length-1));
  else t.setAttribute('transform', `translate(${box[0]} 0) scale(${bw/inkW} 1) translate(${-box[0]} 0)`);
}
const $ = (id) => document.getElementById(id);
const clamp = (p) => Math.min(1, Math.max(0, p));

function build() {
  $('t1').setAttribute('fill', CFG.ink);    fitText($('t1'), CFG.line1.text, { f: '"Oswald"', w: 700 }, CFG.line1.box, 'ls');
  $('t2').setAttribute('fill', CFG.accent); fitText($('t2'), CFG.line2.text, { f: '"Oswald"', w: 700 }, CFG.line2.box, 'ls');
  $('t3').setAttribute('fill', CFG.sub);    fitText($('t3'), CFG.top.text, { f: '"Space Mono"', w: 700 }, CFG.top.box, 'ls');
}

function fly(g, L, f) {
  const p = clamp((f - L.start) / L.frames);
  const s = 1 - (1 - CFG.fromScale) * Math.pow(1 - p, 3);      // 減速放大到原尺寸
  const [ox, oy] = L.origin;
  g.setAttribute('transform', `translate(${ox} ${oy}) scale(${s}) translate(${-ox} ${-oy})`);
  g.setAttribute('opacity', 1 - Math.pow(1 - p, 4));
}

function render(t) {
  const f = ((t * 30) % LOOP + LOOP) % LOOP;
  fly($('g1'), CFG.line1, f);
  fly($('g2'), CFG.line2, f);
  const [a, b] = CFG.top.fadeIn;
  $('t3').setAttribute('opacity', clamp((f - a) / (b - a)));
}

Promise.all([document.fonts.load('700 50px "Oswald"', 'COMINGSOON'), document.fonts.load('700 10px "Space Mono"', CFG.top.text)]).then(() => {
  build();
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
