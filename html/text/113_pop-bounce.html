<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>113 Pop Bounce</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #row { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .c { display:inline-block; line-height:1; font-family:'Archivo Black',sans-serif; transform-origin:50% 50%; }
  .p { position:absolute; border-radius:50%; }
</style>
</head>
<body>
<div id="card"><div id="row"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'NEW!',
  W: 284, H: 158,
  bg: '#fcfcf9',
  ink: '#22232e',             // 字色
  shadow: '#6a967d',          // 偏移陰影（強調色）
  shadowX: 4, shadowY: 5,
  fontSize: 84,
  gap: 0,                     // 字距（px）
  offsetX: 2, offsetY: 0,
  stagger: 3,                 // 相鄰兩字彈出相差幾幀
  tilt: 22,                   // 彈出時左右交替傾斜（度，乘上放大量）
  wave: 7,                    // 落定後依序跳一下的高度（px）
  dots: ['#22232e', '#6a967d', '#9aa59f'],   // 迸出小圓點的顏色
};
// =================================
const FPS = 30, LOOP = 120;   // 一輪 120 幀：彈出→落定→跳兩次波浪→停住→淡出

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), row = document.getElementById('row');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
Object.assign(row.style, { transform: `translate(${CFG.offsetX}px,${CFG.offsetY}px)`, gap: CFG.gap+'px' });
const els = [...CFG.text].map(ch => {
  const s = document.createElement('span'); s.className = 'c'; s.textContent = ch;
  Object.assign(s.style, { fontSize: CFG.fontSize+'px', color: CFG.ink, textShadow: `${CFG.shadowX}px ${CFG.shadowY}px 0 ${CFG.shadow}` });
  row.appendChild(s); return s;
});
// 迸出的小圓點：從中心往外飛散後淡出
const dots = Array.from({ length: 14 }, (_, i) => {
  const d = document.createElement('div'); d.className = 'p';
  const r = 3 + (i * 7 % 4);
  Object.assign(d.style, { width: r+'px', height: r+'px', background: CFG.dots[i % CFG.dots.length] });
  card.appendChild(d);
  return { d, a: i / 14 * Math.PI * 2 + (i % 2) * .2, k: .8 + (i * 5 % 7) / 14, r };
});

// 表格內插 [[幀, 值], ...]
const key = (tab, u) => { if (u <= tab[0][0]) return tab[0][1]; for (let i = 1; i < tab.length; i++) if (u <= tab[i][0]) { const [a, va] = tab[i-1], [b, vb] = tab[i]; return va + (vb - va) * (u - a) / (b - a); } return tab[tab.length-1][1]; };
// 單字彈出：從下方小小冒出 → 往上彈到 1.4 倍 → 落回定位
const SCALE = [[0,.2],[2,.55],[4,.95],[7,1.4],[10,1.43],[13,1.3],[15,1.18],[18,1.07],[20,1]];
const LIFT  = [[0,60],[2,30],[4,6],[7,-16],[10,-19],[13,-15],[15,-13],[18,-5],[20,0]];
const hump = (u, len) => (u > 0 && u < len) ? Math.sin(Math.PI * u / len) : 0;

function render(f) {
  els.forEach((el, i) => {
    const u = f - i * CFG.stagger;
    if (u < 0) { el.style.opacity = 0; return; }
    el.style.opacity = 1;
    const s = key(SCALE, u), y = key(LIFT, u);
    const r = (i % 2 ? 1 : -1) * Math.max(0, s - 1) * CFG.tilt;
    // 落定後：由左到右各跳兩下（每下 19 幀，相鄰字差 4 幀）
    const w = -CFG.wave * (hump(f - 42 - i * 4, 19) + hump(f - 62 - i * 4, 19));
    el.style.transform = `translateY(${y + w}px) rotate(${r}deg) scale(${s})`;
  });
  dots.forEach(({ d, a, k, r }) => {
    const u = (f - 6) / 24;
    if (u < 0 || u > 1) { d.style.opacity = 0; return; }
    const e = 1 - Math.pow(1 - u, 2), R = (40 + 75 * e) * k;
    d.style.opacity = u < .7 ? 1 : (1 - u) / .3;
    d.style.left = (142 + Math.cos(a) * R * 1.25 - r / 2) + 'px';
    d.style.top = (79 + Math.sin(a) * R * .75 - r / 2) + 'px';
  });
  row.style.opacity = f < 110 ? 1 : Math.max(0, 1 - (f - 110) / 8);
}

document.fonts.load(`${CFG.fontSize}px "Archivo Black"`, CFG.text).then(() => {
  if (q.has('t')) render((+q.get('t') * FPS) % LOOP);
  else { const t0 = performance.now(); (function g(now){ render(Math.floor((now - t0) / 1000 * FPS) % LOOP); requestAnimationFrame(g); })(t0); }
});
</script>
</body>
</html>
