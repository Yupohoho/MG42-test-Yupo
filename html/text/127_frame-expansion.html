<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>127 Frame Expansion</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#f6f4f2; }
  /* ?z=2 放大觀看；?t=0.5 定格；?m=1 量測用（卡片貼左上） */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  svg { position:absolute; inset:0; }
</style>
</head>
<body>
<div id="card">
<svg id="sv" width="284" height="158" viewBox="0 0 284 158">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" id="g0"/><stop offset="1" id="g1"/>
    </linearGradient>
  </defs>
  <rect id="box" rx="3" fill="url(#fill)" stroke-width="2"/>
  <text id="title" x="143" y="96" text-anchor="middle"></text>
  <text id="sub" x="141.5" y="114.5" text-anchor="middle"></text>
</svg>
</div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 284, H: 158,
  bg: '#fbfaf7',
  fill: ['#fcfbf6', '#f6eedb'],   // 框內漸層（左上 → 右下）
  ink: '#22222b',
  accent: '#d0a43c',              // 金框
  title: 'CHECK',                 // Playfair Display 900 斜體
  sub: 'MAIN VISUAL — 2026',
  size: 52.5,
};
// =================================
const LOOP = 120;   // 幀（30fps）：約 1.4 秒播完，停住到 4 秒再重播

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), $ = id => document.getElementById(id);
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
$('g0').setAttribute('stop-color', CFG.fill[0]); $('g1').setAttribute('stop-color', CFG.fill[1]);
$('box').style.stroke = CFG.accent;
const title = $('title'), sub = $('sub');
title.textContent = CFG.title; sub.textContent = CFG.sub;
Object.assign(title.style, { font: `italic 900 ${CFG.size}px "Playfair Display"`, fill: CFG.ink });
Object.assign(sub.style, { font: '600 6.5px "JetBrains Mono"', letterSpacing: '2.1px', fill: '#8a8478' });

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
function tab(arr, s, f) { const i = f - s, n = arr.length - 1; if (i <= 0) return arr[0]; if (i >= n) return arr[n]; const k = Math.floor(i); return lerp(arr[k], arr[k + 1], i - k); }

// 量測值：金框寬、高（第 8 幀起；之前停在小框）
const BW = [85,85,87,89,91,94,100,106,117,129,149,177,205,225,237,249,253,259,263,265,267,269];
const BH = [49,51,51,51,53,55,57,61,67,74,83,99,113,123,131,135,139,143,143,145,146,147];
const T_OP = [0,.13,.29,.43,.51,.61,.69,.76,.81,.88,.91,.93,.96,.97,.98,1];      // 第 22 幀起
const T_DY = [7,6.5,6.2,6,5.5,5,4,3,2.5,2,1.5,1,.7,.4,.2,0];                     // 第 22 幀起：由下往上就定位

function render(t) {
  const f = t * 30;
  const w = tab(BW, 8, f), h = tab(BH, 8, f);
  const b = $('box');
  b.setAttribute('x', 141.5 - w / 2); b.setAttribute('y', 78 - h / 2); b.setAttribute('width', w); b.setAttribute('height', h);
  title.style.opacity = tab(T_OP, 22, f);
  title.setAttribute('transform', `translate(0,${tab(T_DY, 22, f)})`);
  const s = clamp((f - 34) / 8); sub.style.opacity = s * s * (3 - 2 * s);
}

Promise.all([
  document.fonts.load(`italic 900 ${CFG.size}px "Playfair Display"`, CFG.title),
  document.fonts.load('600 6.5px "JetBrains Mono"', CFG.sub),
]).then(() => {
  if (q.has('t')) render((+q.get('t') * 30 % LOOP) / 30);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000 * 30 % LOOP) / 30); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
