<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>76 Ink Bleed</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #w { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; line-height:1;
       font-family:'Dela Gothic One',sans-serif; white-space:nowrap; filter:url(#ink); }
</style>
</head>
<body>
<!-- 墨水暈開：先模糊再把透明度壓成硬邊（模糊越大，字越像一團團圓滾滾的墨），再用雜訊讓邊緣毛糙 -->
<svg width="0" height="0" style="position:absolute">
  <filter id="ink" x="-20%" y="-60%" width="140%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0" result="b"/>
    <feComponentTransfer in="b" result="th"><feFuncA type="linear" slope="18" intercept="-8"/></feComponentTransfer>
    <feTurbulence type="fractalNoise" baseFrequency=".18" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="th" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="card"><div id="w"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'にじむ墨',
  W: 324, H: 106,
  bg: '#14161c',
  ink: '#f3efe6',
  fade: '#7d7d7a',          // 消失前一瞬間的灰色
  fontSize: 54,
  offsetY: 2,
  blobMax: 5,               // 最暈開時的模糊半徑（px），越大越像一團
  rough: 1.5,                // 邊緣毛糙程度（px）
  inStart: .1, inEnd: .7,   // 從一團墨收斂成清楚字形
  outStart: 1.77, outEnd: 1.9,  // 再暈開成一團
  grayEnd: 1.97,            // 灰色殘影停到這裡，之後空白
  loop: 2.0,
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), w = document.getElementById('w');
const blur = document.querySelector('#ink feGaussianBlur'), disp = document.querySelector('#ink feDisplacementMap');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
Object.assign(w.style, { fontSize: CFG.fontSize+'px', color: CFG.ink, transform: `translateY(${CFG.offsetY}px)` });
w.textContent = CFG.text;

function render(t) {
  let b = 0, r = .4, op = 1, col = CFG.ink;
  if (t < CFG.inStart || t >= CFG.grayEnd) op = 0;
  else if (t < CFG.inEnd) {                       // 一出現就是一整團，越來越收斂（先快後慢）
    const k = (t - CFG.inStart) / (CFG.inEnd - CFG.inStart);
    b = CFG.blobMax * Math.pow(1 - k, 1.3); r = CFG.rough * (1 - k) + .4;
  } else if (t >= CFG.outStart && t < CFG.outEnd) {   // 邊緣先毛糙，再暈成一團
    const k = (t - CFG.outStart) / (CFG.outEnd - CFG.outStart);
    b = CFG.blobMax * k * k; r = CFG.rough * k + .4;
  } else if (t >= CFG.outEnd) { b = CFG.blobMax; r = CFG.rough; col = CFG.fade; }
  blur.setAttribute('stdDeviation', b.toFixed(2));
  disp.setAttribute('scale', r.toFixed(2));
  w.style.opacity = op; w.style.color = col;
}

document.fonts.load(`${CFG.fontSize}px "Dela Gothic One"`, CFG.text).then(() => {
  if (q.has('t')) render(+q.get('t') % CFG.loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % CFG.loop); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
