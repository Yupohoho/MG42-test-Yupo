<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>70 Checker Words</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  .tile { position:absolute; display:flex; align-items:center; justify-content:center; border-radius:5px;
          line-height:1; font-family:'Dela Gothic One',sans-serif; }
</style>
</head>
<body>
<div id="card"></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  ch: '文',
  W: 324, H: 106,
  bg: '#2cd8c0',
  // 兩種格子：A = 深色底配亮字、B = 淺色底配黑字，棋盤狀交錯
  A: { tile: '#00645c', ink: '#2cd8c0' },
  B: { tile: '#24c0ac', ink: '#0c1014' },
  cols: 10, rows: 3,
  x0: 8, y0: 13, pitchX: 31, pitchY: 30.6, tile: 27,
  fontSize: 18,
  // 翻牌波：每個格子水平壓扁成一條線、換成另一種再撐開
  waves: [9.5, 37.5],     // 一個循環內每道波從左上角開始的幀（30fps）
  colDelay: 1.8,          // 往右每一格晚幾幀
  rowDelay: 2,            // 往下每一列晚幾幀
  flipFrames: 4,          // 翻一次花幾幀
  loop: 2.1,              // 63 幀
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
const tiles = [];
for (let r = 0; r < CFG.rows; r++) for (let c = 0; c < CFG.cols; c++) {
  const d = document.createElement('div'); d.className = 'tile'; d.textContent = CFG.ch;
  Object.assign(d.style, { left: (CFG.x0 + c * CFG.pitchX)+'px', top: (CFG.y0 + r * CFG.pitchY)+'px',
    width: CFG.tile+'px', height: CFG.tile+'px', fontSize: CFG.fontSize+'px' });
  card.appendChild(d); tiles.push({ el: d, r, c, start: (r + c) % 2 });   // start 0 = B（黑字）、1 = A
}

function render(t) {
  const f = t * 30;
  tiles.forEach(T => {
    const delay = T.c * CFG.colDelay + T.r * CFG.rowDelay;
    let flips = 0, sx = 1;
    CFG.waves.forEach(w => {
      const m = w + delay;                               // 這格這一道波的翻轉中點
      const u = (f - (m - CFG.flipFrames / 2)) / CFG.flipFrames;
      if (u >= .5) flips++;                              // 過了中點就換成另一種
      if (u > 0 && u < 1) sx = Math.abs(Math.cos(Math.PI * u));
    });
    const s = (T.start + flips) % 2 ? CFG.A : CFG.B;
    T.el.style.background = s.tile; T.el.style.color = s.ink;
    T.el.style.transform = `scaleX(${Math.max(.04, sx)})`;
  });
}

const start = () => {
  if (q.has('t')) render(+q.get('t') % CFG.loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % CFG.loop); requestAnimationFrame(f); })(t0); }
};
document.fonts.load(`${CFG.fontSize}px "Dela Gothic One"`, CFG.ch).then(start);
</script>
</body>
</html>
