<!doctype html>
<html><head><meta charset="utf-8"><title>T82 Typo Explosion</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#e9e7e3}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
body.m{display:block;min-height:0}
.card{position:relative;overflow:hidden}
canvas{display:block}
</style></head>
<body><div class="card" id="card"><canvas id="cv"></canvas></div>
<script>
// ===== CFG：可換內容集中在這裡 =====
const CFG={
  text:'WOW!', accentIdx:[3],         // 第幾個字用強調色
  font:'"Archivo Black"', weight:'400',
  box:{x:21,y:53,w:244,h:51},
  bg:'#fcfcf9', ink:'#262632', accent:'#3d67f2',
  particles:36, seed:7
};
const LOOP=120;

// ===== 共用 =====
const Q=new URLSearchParams(location.search),Z=+(Q.get('z')||1);
if(Q.get('m'))document.body.classList.add('m');
const CW=284,CH=158,DPR=window.devicePixelRatio||1;
const card=document.getElementById('card'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
card.style.cssText+=`width:${CW*Z}px;height:${CH*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width=CW*Z*DPR;cv.height=CH*Z*DPR;cv.style.width=CW*Z+'px';cv.style.height=CH*Z+'px';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),eo3=p=>1-Math.pow(1-p,3);
const eoBack=p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function layout(str,fam,wt,box){
  const c=document.createElement('canvas').getContext('2d'),f=s=>`${wt} ${s}px ${fam}`;c.font=f(200);
  const m=c.measureText(str),k=box.h/(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent);
  const sx=box.w/((m.actualBoundingBoxLeft+m.actualBoundingBoxRight)*k);
  const pen0=box.x+m.actualBoundingBoxLeft*k*sx,base=box.y+m.actualBoundingBoxAscent*k;
  const L=[...str].map((ch,i)=>{const pre=c.measureText(str.slice(0,i)).width,mc=c.measureText(ch);
    const pen=pen0+pre*k*sx;return{ch,pen,cx:pen+(mc.actualBoundingBoxRight-mc.actualBoundingBoxLeft)/2*k*sx}});
  return{font:f(200*k),sx,base,L,cx:box.x+box.w/2,cy:box.y+box.h/2};
}
let LAY,PS;
// ===== 動態 =====
// 每個字的初始偏移（px）與旋轉（度），以指數衰減回到定位
const KICK=[[-34,-60,-32],[12,56,24],[22,-48,-26],[40,-58,38]];
function render(t){
  const n=Math.floor(t*30+1e-6)%LOOP;
  ctx.setTransform(Z*DPR,0,0,Z*DPR,0,0);ctx.fillStyle=CFG.bg;ctx.fillRect(0,0,CW,CH);
  // 碎片：從中心炸開、減速、下墜、淡出
  const fade=clamp(1-(n-16)/10,0,1);
  if(fade>0)for(const p of PS){
    const e=eo3(clamp(n/18,0,1)),x=LAY.cx+p.dx*p.r*e,y=LAY.cy+p.dy*p.r*e+0.035*n*n;
    ctx.save();ctx.globalAlpha=fade;ctx.translate(x,y);ctx.rotate(p.rot+n*p.spin);ctx.fillStyle=p.blue?CFG.accent:CFG.ink;
    const s=p.size*(0.5+0.5*fade);
    if(p.shape===1){ctx.beginPath();ctx.arc(0,0,s/2,0,Math.PI*2);ctx.fill()}
    else{if(p.shape===2)ctx.rotate(Math.PI/4);ctx.fillRect(-s/2,-s/2,s,s)}
    ctx.restore();}
  // 文字
  const d=n>=24?0:Math.exp(-n/5),sc=n>=5?1:eoBack(n/5);
  ctx.font=LAY.font;
  LAY.L.forEach((l,i)=>{const k=KICK[i%KICK.length];
    ctx.save();ctx.translate(l.cx+k[0]*d,LAY.cy+k[1]*d);ctx.rotate(k[2]*d*Math.PI/180);ctx.scale(sc,sc);
    ctx.translate(-l.cx,-LAY.cy);ctx.translate(l.pen,LAY.base);ctx.scale(LAY.sx,1);
    ctx.fillStyle=CFG.accentIdx.includes(i)?CFG.accent:CFG.ink;ctx.fillText(l.ch,0,0);ctx.restore();});
}
const T0=Q.get('t');
document.fonts.load(`${CFG.weight} 60px ${CFG.font}`,CFG.text).then(()=>{
  LAY=layout(CFG.text,CFG.font,CFG.weight,CFG.box);
  const R=rng(CFG.seed);PS=[];
  for(let i=0;i<CFG.particles;i++){const a=R()*Math.PI*2;
    PS.push({dx:Math.cos(a)*1.6,dy:Math.sin(a),r:55+R()*95,size:3+R()*5,shape:Math.floor(R()*3),blue:R()<0.4,rot:R()*6,spin:(R()-0.5)*0.3});}
  if(T0!==null)render(+T0);else{const st=performance.now();const loop=()=>{render((performance.now()-st)/1000);requestAnimationFrame(loop)};loop();}
});
</script></body></html>
