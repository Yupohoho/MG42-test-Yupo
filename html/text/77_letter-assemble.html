<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>77 Letter Assemble</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #row { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .c { display:inline-block; line-height:1; font-family:'Mochiy Pop One',sans-serif; transform-origin:50% 50%; }
</style>
</head>
<body>
<div id="card"><div id="row"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'あつまれ',
  W: 324, H: 106,
  bg: '#14161c',
  colors: ['#f3efe6', '#ffc93c'],   // 字色依序交替
  fontSize: 57,
  offsetX: -4, offsetY: 6,
  // 每個字：從哪裡飛進來 from、往哪裡散出去 to（相對最終位置的 [x, y, 旋轉度]）、幾秒開始飛入 at
  letters: [
    { from: [-45, -40, -18], to: [-120, -25, -70], at: .1 },
    { from: [-55,  28,  22], to: [ -40,  45,  25], at: .14 },
    { from: [-10, -35,  16], to: [  20, -15,  12], at: .2 },
    { from: [ 30,  14, -22], to: [  25,  18, -25], at: .24 },
  ],
  inDur: .37,               // 飛入花幾秒（ease-out：先快後慢落定）
  startScale: .55,          // 飛入起點的大小
  outAt: 1.68, outDur: .17, endScale: 1.3, // 散開消失（ease-in：越飛越快）
  loop: 2.0,
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), row = document.getElementById('row');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
row.style.transform = `translate(${CFG.offsetX}px,${CFG.offsetY}px)`;
const els = [...CFG.text].map((ch, i) => {
  const s = document.createElement('span'); s.className = 'c'; s.textContent = ch;
  Object.assign(s.style, { fontSize: CFG.fontSize+'px', color: CFG.colors[i % CFG.colors.length] });
  row.appendChild(s); return s;
});
const clamp = (v) => Math.max(0, Math.min(1, v));

function render(t) {
  els.forEach((el, i) => {
    const L = CFG.letters[i % CFG.letters.length];
    let x = 0, y = 0, r = 0, s = 1, o = 1;
    if (t < CFG.outAt) {
      const k = clamp((t - L.at) / CFG.inDur), e = 1 - Math.pow(1 - k, 3);
      x = L.from[0] * (1 - e); y = L.from[1] * (1 - e); r = L.from[2] * (1 - e);
      s = CFG.startScale + (1 - CFG.startScale) * e;
      o = t < L.at ? 0 : Math.min(1, .25 + k * 1.2);
    } else {
      const k = clamp((t - CFG.outAt) / CFG.outDur), e = k * k;
      x = L.to[0] * e; y = L.to[1] * e; r = L.to[2] * e; s = 1 + (CFG.endScale - 1) * e; o = 1 - k * k;
    }
    el.style.opacity = o;
    el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
  });
}

document.fonts.load(`${CFG.fontSize}px "Mochiy Pop One"`, CFG.text).then(() => {
  if (q.has('t')) render(+q.get('t') % CFG.loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % CFG.loop); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
