<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>73 Text Spiral</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  .c { position:absolute; left:0; top:0; width:100px; height:100px; line-height:100px; text-align:center;
       font-family:'Mochiy Pop One',sans-serif; font-size:100px; transform-origin:50% 50%; }
</style>
</head>
<body>
<div id="card"></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'うずまきのなかにすいこまれる',   // 沿螺旋重複排列的字
  W: 324, H: 106,
  bg: '#14161c',
  colors: ['#f3efe6', '#ffc93c'],   // 白字為主，每隔一段換強調色
  accentEvery: [4, 3],      // 每 4 個白字接 3 個強調色字
  cx: .47, cy: .5,          // 螺旋中心（畫面比例）
  count: 75,                // 螺旋上的字數（含內圈極小、外圈出畫面的）
  step: .42,                // 相鄰兩字的角度間隔（弧度），字距跟著半徑一起放大
  b: 3.4,                   // 螺旋鬆緊：半徑 = b × 角度（px）
  size: .21,                // 字高 = 半徑 × 此值
  dir: 1,                   // 1 = 字往中心吸入；-1 = 往外吐出
  charsPerLoop: 15,         // 每個循環吸入幾個字（約一圈）
  loop: 2.0,
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });

const chars = [...CFG.text];
const [nw, na] = CFG.accentEvery;
const els = Array.from({ length: CFG.count }, (_, i) => {
  const d = document.createElement('div'); d.className = 'c';
  d.textContent = chars[i % chars.length];
  d.style.color = CFG.colors[(i % (nw + na)) < nw ? 0 : 1];
  card.appendChild(d); return d;
});

function render(t) {
  const shift = CFG.dir * (t / CFG.loop) * CFG.charsPerLoop;   // 整條螺旋沿自身往中心移動
  els.forEach((el, i) => {
    let u = ((i - shift) % CFG.count + CFG.count) % CFG.count;    // 0 = 最內圈
    const th = 1.2 + u * CFG.step;
    const r = CFG.b * th;
    const x = CFG.cx * CFG.W + Math.cos(th) * r, y = CFG.cy * CFG.H + Math.sin(th) * r;
    const fs = Math.max(.5, r * CFG.size);
    const o = Math.min(1, u / 4);                                  // 最內圈淡出（被吸進去）
    el.style.opacity = o;
    el.style.transform = `translate(${x - 50}px,${y - 50}px) rotate(${th * 180 / Math.PI + 90}deg) scale(${fs / 100})`;
  });
}

document.fonts.load('100px "Mochiy Pop One"', CFG.text).then(() => {
  if (q.has('t')) render(+q.get('t') % CFG.loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % CFG.loop); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
