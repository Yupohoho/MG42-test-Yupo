<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>35 Text Mask Pattern</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #w { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; line-height:1;
       font-family:'Dela Gothic One','Noto Sans JP',sans-serif;
       color:transparent; -webkit-background-clip:text; background-clip:text; }
</style>
</head>
<body>
<div id="card"><div id="w"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: '夏祭',
  W: 324, H: 106,
  bg: '#f3efe6',
  fontSize: 88,
  letterSpacing: 8,
  yOffset: 6,                       // 文字中心往下偏移（px）
  stripeA: '#ff8a3d', stripeB: '#141414',
  stripeW: 14,                      // 每條寬度（px），一組 A+B = 28px
  angle: 135,                       // 條紋角度
  speed: 50,                        // 條紋沿水平方向流動速度（px/秒）
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
const w = document.getElementById('w');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
Object.assign(w.style, { fontSize: CFG.fontSize+'px', letterSpacing: CFG.letterSpacing+'px', top: CFG.yOffset+'px',
  backgroundImage: `repeating-linear-gradient(${CFG.angle}deg, ${CFG.stripeA} 0 ${CFG.stripeW}px, ${CFG.stripeB} ${CFG.stripeW}px ${CFG.stripeW*2}px)` });
w.textContent = CFG.text;

// 一組條紋在水平方向的週期 = 2*stripeW / sin(angle)
const PERIOD_X = CFG.stripeW * 2 / Math.abs(Math.sin(CFG.angle * Math.PI / 180));
const LOOP = PERIOD_X / CFG.speed;

function render(t) {
  w.style.backgroundPosition = `${(CFG.speed * t) % PERIOD_X}px 0`;
}

document.fonts.load(`${CFG.fontSize}px "Dela Gothic One"`, CFG.text).then(() => {
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % LOOP); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
