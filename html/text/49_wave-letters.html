<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>49 Wave Letters</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  .c { position:absolute; left:0; top:0; line-height:1; white-space:nowrap; font-family:'Mochiy Pop One',sans-serif; }
</style>
</head>
<body>
<div id="card"></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'うねる波',
  W: 324, H: 106,
  bg: '#14181e',
  colors: ['#f4efe4', '#ff6b4f'],   // 字色依序交替
  fontSize: 58,
  gap: 0,              // 字與字的間距（px）
  cy: .55,             // 基準線位置（畫面高比例）
  amp: 15,             // 上下擺幅（px）
  spread: 1.0,         // 第一個字到最後一個字相差幾個「半週期」（1 = 頭尾剛好相反）
  tilt: 14,            // 隨波面傾斜的最大角度（度）
  loop: 2.0,           // 一個起伏週期（秒）
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
const chars = [...CFG.text], N = chars.length;
const els = chars.map((ch, i) => {
  const d = document.createElement('div'); d.className = 'c'; d.textContent = ch;
  Object.assign(d.style, { fontSize: CFG.fontSize+'px', color: CFG.colors[i % CFG.colors.length] });
  card.appendChild(d); return d;
});

function render(t) {
  const ws = els.map(e => e.offsetWidth), total = ws.reduce((a, b) => a + b, 0) + CFG.gap * (N - 1);
  let x = (CFG.W - total) / 2;
  els.forEach((el, i) => {
    // 每個字相位往後錯開：字從左到右依序上下，看起來像波往左傳
    const ph = 2 * Math.PI * t / CFG.loop + Math.PI / 2 - i / Math.max(1, N - 1) * Math.PI * CFG.spread;
    const y = Math.sin(ph) * CFG.amp;                  // 往下為正；t=0 時第一個字最低、最後一個字最高
    const rot = -Math.cos(ph) * CFG.tilt;              // 隨波面斜率傾斜
    el.style.transform = `translate(${x}px,${CFG.cy * CFG.H - el.offsetHeight / 2 + y}px) rotate(${rot}deg)`;
    x += ws[i] + CFG.gap;
  });
}

const start = () => {
  if (q.has('t')) render(+q.get('t') % CFG.loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % CFG.loop); requestAnimationFrame(f); })(t0); }
};
document.fonts.load(`${CFG.fontSize}px "Mochiy Pop One"`, CFG.text).then(start);
</script>
</body>
</html>
