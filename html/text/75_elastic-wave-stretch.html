<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>75 Elastic Wave Stretch</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #row { position:absolute; left:0; right:0; display:flex; justify-content:center; align-items:flex-end; }
  .c { display:inline-block; line-height:1; font-family:'Dela Gothic One',sans-serif; transform-origin:50% 100%; }
</style>
</head>
<body>
<div id="card"><div id="row"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'のびる波',
  W: 324, H: 106,
  bg: '#f3efe6',
  colors: ['#17171a', '#7a5a10'],   // 字色依序交替
  fontSize: 44,
  baseline: .66,            // 字底部（伸縮的支點）在畫面高度的位置
  offsetX: -18,
  amp: .45,                 // 縱向伸縮幅度：字高在 1-amp ～ 1+amp 之間
  squash: .1,               // 拉長時橫向跟著變窄的比例（0 = 不變窄）
  lag: .9,                  // 相鄰兩字的相位差（弧度），波由左往右傳
  loop: 1.2,                // 一個波的週期
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), row = document.getElementById('row');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
Object.assign(row.style, { bottom: (1 - CFG.baseline) * CFG.H + 'px', transform: `translateX(${CFG.offsetX}px)` });
const els = [...CFG.text].map((ch, i) => {
  const s = document.createElement('span'); s.className = 'c'; s.textContent = ch;
  Object.assign(s.style, { fontSize: CFG.fontSize+'px', color: CFG.colors[i % CFG.colors.length] });
  row.appendChild(s); return s;
});

function render(t) {
  const a = t / CFG.loop * Math.PI * 2;
  els.forEach((el, i) => {
    const sy = 1 + CFG.amp * Math.sin(a - i * CFG.lag);
    const sx = 1 - CFG.squash * (sy - 1);
    el.style.transform = `scale(${sx},${sy})`;
  });
}

document.fonts.load(`${CFG.fontSize}px "Dela Gothic One"`, CFG.text).then(() => {
  if (q.has('t')) render(+q.get('t') % CFG.loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % CFG.loop); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
