<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>34 Glitch Slices</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  .band { position:absolute; left:0; top:0; width:100%; display:flex; justify-content:center; line-height:1;
          font-family:'Dela Gothic One','Noto Sans JP',sans-serif; white-space:nowrap; }
</style>
</head>
<body>
<div id="card"></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: '崩壊',
  W: 324, H: 106,
  bg: '#ff8a3d',
  fontSize: 76,
  yOffset: 6,                        // 文字中心相對畫面中心往下偏移（px）
  colors: { a: '#f6efe4', b: '#141414' },
  // 水平條帶（由上而下，字高的比例）：顏色 a/b、故障最大時的水平位移（px，正 = 往右）
  bands: [
    { to: .18, c: 'a', dx:  45 },
    { to: .26, c: 'b', dx: -36 },
    { to: .33, c: 'a', dx:  22 },
    { to: .41, c: 'b', dx: -40 },
    { to: .64, c: 'a', dx:  30 },
    { to: .84, c: 'b', dx: -47 },
    { to: 1.0, c: 'a', dx:  13 },
  ],
  // 每個循環故障兩次；第二次左右方向相反（dir = -1）
  glitches: [{ at: 0.067, dir: 1 }, { at: 0.933, dir: -1 }],
  // 故障強度逐幀（30fps）：每幀硬切、不補間 → 一格一格跳，才有卡頓的故障感
  env: [.35, .8, 1, 1, 1, 1, 1, .6, .3, .1, 0],
  stagger: 0.5,                       // 由上而下：每往下一條晚幾幀才開始裂（0.5 = 每兩條差一幀）
  jitter: 3,                          // 裂開期間每幀隨機抖動（px）
  loop: 1.733,
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });

// 字形墨水大約佔 line-height 1 的 8%–92%，把「字高比例」換成元素高度比例
const INK_TOP = .08, INK_H = .84;
const els = CFG.bands.map((b, i) => {
  const from = i ? CFG.bands[i-1].to : -0.2;
  const to = i === CFG.bands.length - 1 ? 1.2 : b.to;
  const d = document.createElement('div'); d.className = 'band'; d.textContent = CFG.text;
  const top = (INK_TOP + from * INK_H) * 100, bot = 100 - (INK_TOP + to * INK_H) * 100;
  Object.assign(d.style, { fontSize: CFG.fontSize+'px', color: CFG.colors[b.c], clipPath: `inset(${top}% -50% ${bot}% -50%)` });
  card.appendChild(d); return d;
});

const hash = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

// 第 i 條在時間 t 的位移：從上往下依序晚幾幀開始，強度逐幀跳（不補間），裂開時再加每幀抖動
function offset(t, i) {
  for (const g of CFG.glitches) {
    const f = Math.floor((t - g.at) * 30 + 1e-6) - Math.floor(i * CFG.stagger);
    if (f < 0 || f >= CFG.env.length) continue;
    const e = CFG.env[f];
    const jit = e > 0 ? (hash(f * 7 + i * 13 + g.at * 100) - .5) * 2 * CFG.jitter : 0;
    return g.dir * CFG.bands[i].dx * e + jit;
  }
  return 0;
}

function render(t) {
  els.forEach((el, i) => {
    const y = CFG.H / 2 - el.offsetHeight / 2 + CFG.yOffset;
    el.style.transform = `translate(${offset(t, i)}px,${y}px)`;
  });
}

document.fonts.load(`${CFG.fontSize}px "Dela Gothic One"`, CFG.text).then(() => {
  if (q.has('t')) render(+q.get('t') % CFG.loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % CFG.loop); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
