<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>39 Split Color Word</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  .layer { position:absolute; inset:0; }
  .w { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; line-height:1;
       font-family:'Noto Sans JP',sans-serif; font-weight:900; }
</style>
</head>
<body>
<div id="card">
  <div class="layer" id="A"><div class="w"></div></div>
  <div class="layer" id="B"><div class="w"></div></div>
</div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: '反転',
  W: 324, H: 106,
  light: '#f3efe6', dark: '#121318',   // 兩色：A 面 = 淺底深字，B 面 = 深底淺字
  fontSize: 82,
  yOffset: 6,
  slant: 100,          // 斜線邊界的水平偏移（px）：頂部比底部超前多少
  // 幀數（30fps）
  wipeFrames: 11,      // 每次掃過的幀數（ease-in-out）
  toDarkAt: 10,        // 開始由 A 掃成 B
  toLightAt: 37,       // 開始由 B 掃回 A
  loopFrames: 56,
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
const A = document.getElementById('A'), B = document.getElementById('B');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', transform: `scale(${+(q.get('z') || 1)})` });
A.style.background = CFG.light; A.firstChild.style.color = CFG.dark;
B.style.background = CFG.dark;  B.firstChild.style.color = CFG.light;
for (const l of [A, B]) Object.assign(l.firstChild.style, { fontSize: CFG.fontSize+'px', top: CFG.yOffset+'px' });
for (const l of [A, B]) l.firstChild.textContent = CFG.text;
const LOOP = CFG.loopFrames / 30;
const ease = k => k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;

// 斜線邊界從左掃到右：x 從 -slant 走到 W（頂部 = x + slant，底部 = x）
function edge(k) { return -CFG.slant + (CFG.W + CFG.slant) * ease(Math.min(1, Math.max(0, k))); }
const poly = x => `polygon(-1px -1px, ${x + CFG.slant}px -1px, ${x}px ${CFG.H + 1}px, -1px ${CFG.H + 1}px)`;

function render(t) {
  const f = (t % LOOP) * 30;
  if (f < CFG.toDarkAt) {                         // 全 A
    B.style.clipPath = 'inset(0 100% 0 0)'; B.style.zIndex = 2;
  } else if (f < CFG.toLightAt) {                 // B 從左覆蓋上來
    B.style.zIndex = 2; A.style.zIndex = 1;
    B.style.clipPath = poly(edge((f - CFG.toDarkAt) / CFG.wipeFrames));
  } else {                                        // A 從左覆蓋回來
    A.style.zIndex = 2; B.style.zIndex = 1; B.style.clipPath = 'none';
    A.style.clipPath = poly(edge((f - CFG.toLightAt) / CFG.wipeFrames));
  }
  if (f < CFG.toLightAt) A.style.clipPath = 'none';
}

document.fonts.load(`900 ${CFG.fontSize}px "Noto Sans JP"`, CFG.text).then(() => {
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
