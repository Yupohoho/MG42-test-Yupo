<!doctype html>
<html><head><meta charset="utf-8"><title>T103 Grid Assemble</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#e9e7e3}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
body.m{display:block;min-height:0}
.card{position:relative;overflow:hidden}
canvas{display:block}
</style></head>
<body><div class="card" id="card"><canvas id="cv"></canvas></div>
<script>
// ===== CFG：可換內容集中在這裡 =====
const CFG={
  cols:9, rows:5, x0:8, y0:6, pitch:30.5, cell:25, radius:4,
  // 亮色格組成的圖案（例如右箭頭）：每列一個字串，# 為亮色
  shape:[
    '.....#...',
    '......#..',
    '.#######.',
    '......#..',
    '.....#...',
  ],
  bg:'#fcfcf9', tile:'#eaeae7', on:'#9575cd'
};
const LOOP=120; // 幀（30fps），動畫約 30 幀，其餘停住

// ===== 動態 =====
const STEP=1.8, DUR=6;   // 從左上沿對角線依序出現：每條對角線晚 1.8 幀，每格 6 幀轉正放大
const eo3=p=>1-Math.pow(1-p,3);
const back=p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
function init(){}
function render(n){
  const c=CFG.cell;
  for(let j=0;j<CFG.rows;j++)for(let i=0;i<CFG.cols;i++){
    const p=clamp((n-STEP*(i+j))/DUR,0,1);if(p<=0)continue;
    const x=CFG.x0+CFG.pitch*i+c/2,y=CFG.y0+CFG.pitch*j+c/2;
    ctx.save();ctx.translate(x,y);ctx.rotate(-30*(1-eo3(p))*Math.PI/180);const s=back(p);ctx.scale(s,s);
    ctx.globalAlpha=clamp(p*2,0,1);ctx.fillStyle=CFG.shape[j][i]==='#'?CFG.on:CFG.tile;
    ctx.beginPath();ctx.roundRect(-c/2,-c/2,c,c,CFG.radius);ctx.fill();ctx.restore();
  }
}

// ===== 共用 =====
const Q=new URLSearchParams(location.search),Z=+(Q.get('z')||1);
if(Q.get('m'))document.body.classList.add('m');
const CW=284,CH=158,DPR=window.devicePixelRatio||1;
const card=document.getElementById('card'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
card.style.cssText+=`width:${CW*Z}px;height:${CH*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width=CW*Z*DPR;cv.height=CH*Z*DPR;cv.style.width=CW*Z+'px';cv.style.height=CH*Z+'px';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tab=(A,i)=>A[clamp(Math.floor(i),0,A.length-1)];
const lerp=(a,b,p)=>a+(b-a)*p;
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,p)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*p)).join(',')})`};
// 文字依墨跡框定位：box={x,y,w,h}；w 省略時照字型原比例
function fitText(str,fam,wt,box){
  const c=document.createElement('canvas').getContext('2d');c.font=`${wt} 200px ${fam}`;
  const m=c.measureText(str),k=box.h/(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent);
  const nw=(m.actualBoundingBoxLeft+m.actualBoundingBoxRight)*k,sx=box.w?box.w/nw:1;
  return{str,font:`${wt} ${200*k}px ${fam}`,sx,ox:-(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2*k,
    nw,oy:(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2*k,cx:box.x+(box.w||0)/2,cy:box.y+box.h/2};
}
function drawText(L,color,s=1,alpha=1,dy=0){
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(L.cx,L.cy+dy);ctx.scale(s*L.sx,s);
  ctx.font=L.font;ctx.fillStyle=color;ctx.fillText(L.str,L.ox,L.oy);ctx.restore();
}
function frame(t){
  const n=Math.floor(t*30+1e-6)%LOOP;
  ctx.setTransform(Z*DPR,0,0,Z*DPR,0,0);ctx.globalAlpha=1;ctx.filter='none';
  ctx.fillStyle=CFG.bg;ctx.fillRect(0,0,CW,CH);render(n);
}
const T0=Q.get('t');
document.fonts.load(`400 60px "Archivo Black"`,'A').then(()=>document.fonts.load(`700 60px "Oswald"`,'A')).catch(()=>{}).then(()=>{
  init();
  if(T0!==null)frame(+T0);else{const st=performance.now();const lp=()=>{frame((performance.now()-st)/1000);requestAnimationFrame(lp)};lp();}
});
</script></body></html>
