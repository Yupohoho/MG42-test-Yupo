<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>62 Word Pulse Grid</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  .c { position:absolute; left:0; top:0; line-height:1; font-family:'Dela Gothic One',sans-serif; white-space:nowrap; transform-origin:50% 50%; }
</style>
</head>
<body>
<div id="card"></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: '脈',              // 排成格子的字
  W: 324, H: 106,
  bg: '#9b7cff',
  dark: '#141418',         // 平常的字色
  light: '#f6efe4',        // 波經過時的字色
  cols: 9, rows: 4,
  x0: 27, dx: 34,          // 第一欄中心、欄距（px）
  y0: 18, dy: 24.4,        // 第一列中心、列距（px）
  fontSize: 12.5,          // 平常的字大小
  maxScale: 2.3,           // 波經過時放大倍率
  vScale: 2,               // 垂直距離的權重（> 1 = 波往上下擴散得比左右慢，形成橫向橢圓）
  delayPerPx: 0.221,       // 波每往外 1px 晚幾幀到達（30fps）
  delay0: 1.5,             // 波從中心出發的幀
  // 每格被波掃到後的變化（幀）：放大 → 變色 → 維持 → 變回 → 縮回
  grow: 6, toLight: [3, 6], hold: [15, 18], shrink: [17, 23],
  frames: 60,              // 一個循環幾幀（每循環一道波）
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
const hex = (h) => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const D = hex(CFG.dark), L = hex(CFG.light);
const cx = CFG.x0 + CFG.dx * (CFG.cols - 1) / 2, cy = CFG.y0 + CFG.dy * (CFG.rows - 1) / 2;
const cells = [];
for (let r = 0; r < CFG.rows; r++) for (let c = 0; c < CFG.cols; c++) {
  const d = document.createElement('div'); d.className = 'c'; d.textContent = CFG.text;
  d.style.fontSize = CFG.fontSize + 'px'; card.appendChild(d);
  const x = CFG.x0 + c * CFG.dx, y = CFG.y0 + r * CFG.dy;
  const dist = Math.hypot(x - cx, (y - cy) * CFG.vScale);
  cells.push({ el: d, x, y, onset: CFG.delay0 + dist * CFG.delayPerPx });
}

const ramp = (g, a, b) => Math.max(0, Math.min(1, (g - a) / (b - a)));
const ease = (k) => k * k * (3 - 2 * k);
// 某格在「被波掃到後第 g 幀」的放大量與變色量
function pulse(g) {
  if (g < 0 || g > CFG.shrink[1]) return { s: 0, m: 0 };
  const s = ease(ramp(g, 0, CFG.grow)) * (1 - ease(ramp(g, CFG.shrink[0], CFG.shrink[1])));
  const m = ramp(g, CFG.toLight[0], CFG.toLight[1]) * (1 - ramp(g, CFG.hold[0], CFG.hold[1]));
  return { s, m };
}

function render(t) {
  const f = t * 30;
  cells.forEach(c => {
    // 上一輪的波可能還沒結束（角落），取兩輪中較強的
    const a = pulse(f - c.onset), b = pulse(f + CFG.frames - c.onset);
    const p = a.s >= b.s ? a : b;
    const col = D.map((v, i) => Math.round(v + (L[i] - v) * p.m));
    const w = c.el.offsetWidth, h = c.el.offsetHeight;
    c.el.style.color = `rgb(${col})`;
    c.el.style.transform = `translate(${c.x - w / 2}px,${c.y - h / 2}px) scale(${1 + (CFG.maxScale - 1) * p.s})`;
  });
}

document.fonts.load(`${CFG.fontSize}px "Dela Gothic One"`, CFG.text).then(() => {
  const loop = CFG.frames / 30;
  if (q.has('t')) render(+q.get('t') % loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % loop); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
