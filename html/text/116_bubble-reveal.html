<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>116 Bubble Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #stage { position:absolute; inset:0; }
  .b { position:absolute; border-radius:50%; box-sizing:border-box; display:flex; align-items:center; justify-content:center; }
  .b span { line-height:1; font-family:'Archivo Black',sans-serif; position:relative; top:1px; }
  .b i { position:absolute; border-radius:50%; background:#fff; }
</style>
</head>
<body>
<div id="card"><div id="stage"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'HELLO',
  W: 284, H: 158,
  bg: '#fcfcf9',
  ink: '#22232e',
  fills: ['#cddbd3', '#e9eeec'],   // 泡泡底色交替（淡綠／淡灰）
  line: '#6a967d',                 // 泡泡外框（強調色）
  fontSize: 25,
  size: 50, step: 55,              // 泡泡直徑、間距
  cy: 79.5,
  stagger: 3,                      // 相鄰泡泡冒出相差幾幀
  bob: 7.5,                        // 上下浮動的高度（px）
  period: 40,                      // 浮動週期（幀），要能整除 120
};
// =================================
const FPS = 30, LOOP = 120;

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), stage = document.getElementById('stage');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
const chars = [...CFG.text], x0 = CFG.W / 2 - (chars.length - 1) * CFG.step / 2;
const bs = chars.map((ch, i) => {
  const b = document.createElement('div'); b.className = 'b';
  Object.assign(b.style, { width: CFG.size+'px', height: CFG.size+'px', left: x0 + i * CFG.step - CFG.size/2 + 'px', top: CFG.cy - CFG.size/2 + 'px',
    background: CFG.fills[i % CFG.fills.length], border: `2px solid ${CFG.line}` });
  const s = document.createElement('span'); s.textContent = ch; Object.assign(s.style, { fontSize: CFG.fontSize+'px', color: CFG.ink });
  // 右上角的反光
  const hl = document.createElement('i');
  Object.assign(hl.style, { width: CFG.size*.26+'px', height: CFG.size*.14+'px', right: CFG.size*.1+'px', top: CFG.size*.12+'px', opacity: .85, transform: 'rotate(40deg)' });
  b.append(hl, s); stage.appendChild(b); return b;
});

const key = (tab, u) => { if (u <= tab[0][0]) return tab[0][1]; for (let i = 1; i < tab.length; i++) if (u <= tab[i][0]) { const [a, va] = tab[i-1], [b, vb] = tab[i]; return va + (vb - va) * (u - a) / (b - a); } return tab[tab.length-1][1]; };
// 泡泡冒出：阻尼彈簧，平順脹到約 1.12 倍再回穩（約 12 幀）
const pop = (u) => 1 - Math.exp(-u / 3.2) * Math.cos(u * .42);

function render(f) {
  bs.forEach((b, i) => {
    const u = f - 2 - i * CFG.stagger;
    if (u < 0) { b.style.opacity = 0; return; }
    b.style.opacity = 1;
    const s = pop(u);
    // 冒出的同時就開始上下浮動（從 0 速度起步）；週期 40 幀＝一輪 120 幀剛好 3 次，頭尾無縫
    const y = -CFG.bob * (.5 - .5 * Math.cos(2 * Math.PI * u / CFG.period));
    b.style.transform = `translateY(${y}px) scale(${s})`;
  });
  stage.style.opacity = f < 110 ? 1 : Math.max(0, 1 - (f - 110) / 8);
}

document.fonts.load(`${CFG.fontSize}px "Archivo Black"`, CFG.text).then(() => {
  if (q.has('t')) render((+q.get('t') * FPS) % LOOP);
  else { const t0 = performance.now(); (function g(now){ render(Math.floor((now - t0) / 1000 * FPS) % LOOP); requestAnimationFrame(g); })(t0); }
});
</script>
</body>
</html>
