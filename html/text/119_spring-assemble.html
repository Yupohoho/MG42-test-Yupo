<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>119 Spring Assemble</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #stage { position:absolute; inset:0; }
  .pill { position:absolute; display:flex; align-items:center; justify-content:center; }
  .pill span { line-height:1; font-family:'Archivo Black',sans-serif; white-space:nowrap; position:relative; top:1px; }
  #line { position:absolute; height:3px; }
</style>
</head>
<body>
<div id="card"><div id="stage"><div id="line"></div></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 284, H: 158,
  bg: '#fcfcf9',
  // 三個零件 [文字, 底色, 字色, 左, 上, 寬, 高, 圓角]
  parts: [
    ['GO',  '#6a967d', '#ffffff', 12,  54, 88, 49, 12],
    ['NOW', '#22232e', '#ffffff', 107, 53, 110, 50, 12],
    ['!',   '#e4e8e8', '#22232e', 223, 53, 51, 51, 26],
  ],
  fontSize: 31,
  line: '#6a967d', lineX: 12, lineY: 111, lineW: 262,   // 底線
};
// =================================
const FPS = 30, LOOP = 120;

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), stage = document.getElementById('stage'), line = document.getElementById('line');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
Object.assign(line.style, { left: CFG.lineX+'px', top: CFG.lineY+'px', background: CFG.line });
const ps = CFG.parts.map(([t, bg, fg, x, y, w, h, r]) => {
  const p = document.createElement('div'); p.className = 'pill';
  Object.assign(p.style, { left: x+'px', top: y+'px', width: w+'px', height: h+'px', borderRadius: r+'px', background: bg });
  const s = document.createElement('span'); s.textContent = t; Object.assign(s.style, { fontSize: CFG.fontSize+'px', color: fg });
  p.appendChild(s); stage.appendChild(p); return p;
});

const key = (tab, u) => { if (u <= tab[0][0]) return tab[0][1]; for (let i = 1; i < tab.length; i++) if (u <= tab[i][0]) { const [a, va] = tab[i-1], [b, vb] = tab[i]; return va + (vb - va) * (u - a) / (b - a); } return tab[tab.length-1][1]; };
// 各零件的彈簧軌跡（逐幀位移，彈過頭再回穩）
const M = [
  { // GO：從左邊飛進來
    x: [[0,-150],[2,-90],[4,-45],[6,-22],[8,-14],[10,0],[12,6],[14,4],[16,0],[18,-2],[20,-2],[22,0]],
    y: [[0,0]],
    r: [[0,-25],[6,-10],[10,3],[12,0]] },
  { // NOW：從上面掉下來
    x: [[0,0]],
    y: [[0,-110],[3,-60],[6,-29],[8,13],[10,16],[12,7.5],[14,-2],[16,-4],[18,-2],[20,1],[22,2],[24,1],[26,0]],
    r: [[0,15],[6,10],[8,6],[10,2],[12,0]] },
  { // !：從左下轉著繞進來
    x: [[0,-90],[4,-60],[6,-43],[10,-26],[12,13],[14,20],[16,7],[18,-4],[20,-6],[22,-2],[24,1],[26,2],[28,0]],
    y: [[0,60],[4,40],[6,25],[10,15],[12,-8],[14,-12],[16,-5],[18,2],[20,3],[22,1],[24,-1],[26,-1],[28,0]],
    r: [[0,-360],[4,-240],[6,-150],[10,-60],[12,10],[14,12],[16,5],[18,0]],
    s: [[0,.3],[6,.8],[10,1]] },
];
// 底線由左往右畫出
const LINE = [[21,0],[24,.44],[26,.71],[30,.94],[34,1]];

function render(f) {
  ps.forEach((p, i) => {
    const m = M[i], u = f;
    p.style.transform = `translate(${key(m.x, u)}px,${key(m.y, u)}px) rotate(${key(m.r, u)}deg) scale(${m.s ? key(m.s, u) : 1})`;
  });
  line.style.width = CFG.lineW * key(LINE, f) + 'px';
  stage.style.opacity = f < 110 ? 1 : Math.max(0, 1 - (f - 110) / 8);
}

document.fonts.load(`${CFG.fontSize}px "Archivo Black"`, 'GONOW!').then(() => {
  if (q.has('t')) render((+q.get('t') * FPS) % LOOP);
  else { const t0 = performance.now(); (function g(now){ render(Math.floor((now - t0) / 1000 * FPS) % LOOP); requestAnimationFrame(g); })(t0); }
});
</script>
</body>
</html>
