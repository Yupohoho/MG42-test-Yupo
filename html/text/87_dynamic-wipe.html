<!doctype html>
<html><head><meta charset="utf-8"><title>T87 Dynamic Wipe</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#e9e7e3}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
body.m{display:block;min-height:0}
.card{position:relative;overflow:hidden}
canvas{display:block}
</style></head>
<body><div class="card" id="card"><canvas id="cv"></canvas></div>
<script>
// ===== CFG：可換內容集中在這裡 =====
const CFG={
  text:'HELLO',
  font:'"Archivo Black"', weight:'400',
  box:{x:44,y:58,w:198,h:41},
  slope:0.324,                         // 斜帶每往下 1px 往右偏多少
  stripeW:20,
  bg:'#fcfcf9', ink:'#262730', accent:'#3d67f2', stripe:'#23262f'
};
const LOOP=120;

// ===== 共用 =====
const Q=new URLSearchParams(location.search),Z=+(Q.get('z')||1);
if(Q.get('m'))document.body.classList.add('m');
const CW=284,CH=158,DPR=window.devicePixelRatio||1;
const card=document.getElementById('card'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
card.style.cssText+=`width:${CW*Z}px;height:${CH*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width=CW*Z*DPR;cv.height=CH*Z*DPR;cv.style.width=CW*Z+'px';cv.style.height=CH*Z+'px';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),tab=(A,i)=>A[clamp(i,0,A.length-1)];
function layout(str,fam,wt,box){
  const c=document.createElement('canvas').getContext('2d'),f=s=>`${wt} ${s}px ${fam}`;c.font=f(200);
  const m=c.measureText(str),k=box.h/(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent);
  const sx=box.w/((m.actualBoundingBoxLeft+m.actualBoundingBoxRight)*k);
  const pen0=box.x+m.actualBoundingBoxLeft*k*sx,base=box.y+m.actualBoundingBoxAscent*k;
  const L=[...str].map((ch,i)=>({ch,pen:pen0+c.measureText(str.slice(0,i)).width*k*sx}));
  return{font:f(200*k),sx,base,L};
}
function drawWord(lay,color){ctx.font=lay.font;ctx.fillStyle=color;
  for(const l of lay.L){ctx.save();ctx.translate(l.pen,lay.base);ctx.scale(lay.sx,1);ctx.fillText(l.ch,0,0);ctx.restore()}}
let LAY;
// ===== 動態 =====
// 逐幀「卡片頂端」的 x 位置（往下依 slope 右偏）。藍色寬帶在前、深色細條在後，細條掃過的左側露出文字
const LEAD =[-5,8,18,30,44,63,86,116,151,194,246,305,368,435,505,580];
const DARK =[-48,-45,-41,-37,-33,-25,-17,-3,13,35,61,94,134,182,237,300,370];
const TRAIL=[null,null,null,null,null,null,null,null,47,91,141,193,235,271,330,400,470]; // null=藍帶尾端還貼著細條
function band(x1,x2){const k=CFG.slope*CH;ctx.beginPath();ctx.moveTo(x1,0);ctx.lineTo(x2,0);ctx.lineTo(x2+k,CH);ctx.lineTo(x1+k,CH);ctx.closePath();}
function render(t){
  const n=Math.floor(t*30+1e-6)%LOOP;
  ctx.setTransform(Z*DPR,0,0,Z*DPR,0,0);ctx.fillStyle=CFG.bg;ctx.fillRect(0,0,CW,CH);
  const dl=tab(DARK,n),dr=dl+CFG.stripeW;
  // 文字：只露出細條左側
  ctx.save();band(-400,dl);ctx.clip();drawWord(LAY,CFG.ink);ctx.restore();
  if(n<DARK.length){
    const lead=n<LEAD.length?LEAD[n]:9999,tr=TRAIL[n];
    ctx.fillStyle=CFG.accent;
    if(tr===null){band(-400,dl);ctx.fill();band(dr,lead);ctx.fill();}
    else if(tr<lead){band(tr,lead);ctx.fill();}
    ctx.fillStyle=CFG.stripe;band(dl,dr);ctx.fill();
  }
}
const T0=Q.get('t');
document.fonts.load(`${CFG.weight} 60px ${CFG.font}`,CFG.text).then(()=>{
  LAY=layout(CFG.text,CFG.font,CFG.weight,CFG.box);
  if(T0!==null)render(+T0);else{const st=performance.now();const loop=()=>{render((performance.now()-st)/1000);requestAnimationFrame(loop)};loop();}
});
</script></body></html>
