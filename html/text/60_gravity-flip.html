<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>60 Gravity Flip</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  .c { position:absolute; left:0; top:0; line-height:1; font-family:'Dela Gothic One',sans-serif; white-space:nowrap; transform-origin:50% 50%; }
</style>
</head>
<body>
<div id="card"></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: '重力反転',
  W: 324, H: 106,
  bg: '#14161c',
  colors: ['#f3efe6', '#9b7cff'],   // 字色依序交替
  fontSize: 51,
  floorY: 62,              // 落在地板時字的中心高度（px）
  ceilY: 0,                // 黏在天花板時字的中心高度（px，0 = 字一半露在畫面上緣）
  offscreenY: -13,         // 每輪開始時字在畫面上方的位置
  // 每個字的延遲（幀）：左邊先動，越右越晚
  delays: [0, 0.4, 2, 3.5],
  // 每個字飛行時的傾斜（度）
  tilts: [-4, 6, -6, 8],
  // 時間軸（幀，30fps，以第一個字計）
  fallStart: 2, fallAcc: 2.66,      // 往下掉：開始幀、加速度（px/幀²）
  bounceDown: [[13, 5.6], [4, 3.6], [1.5, 2]],  // 落地後的彈跳：[高度 px, 幀數]
  riseStart: 29.9, riseAcc: 1.46,   // 重力反轉往上掉：開始幀、加速度
  bounceUp: [[15, 6.5], [4, 3.5], [1.2, 2]],    // 撞到天花板後往下彈
  exitStart: 62, exitAcc: 0.66,     // 循環尾：從天花板往上離開畫面（頂點在第 62 幀 = 下一輪第 2 幀）
  frames: 60,                       // 一個循環幾幀
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
const els = [...CFG.text].map((ch, i) => {
  const d = document.createElement('div'); d.className = 'c'; d.textContent = ch;
  Object.assign(d.style, { fontSize: CFG.fontSize+'px', color: CFG.colors[i % CFG.colors.length] });
  card.appendChild(d); return d;
});
function layout() {
  const ws = els.map(e => e.offsetWidth), total = ws.reduce((a, b) => a + b, 0);
  let x = (CFG.W - total) / 2;
  els.forEach((e, i) => { e._x = x; x += ws[i]; e._h = e.offsetHeight; });
}

// 一串彈跳：從 t=0 起，每段是一個拋物線，回傳離地高度
function bounces(list, g) {
  for (const [h, d] of list) { if (g < d) { const k = g / d; return 4 * h * k * (1 - k); } g -= d; }
  return 0;
}

// 單一字在第 g 幀的中心高度與是否在飛行中
function state(g) {
  const C = CFG;
  const landDown = C.fallStart + Math.sqrt((C.floorY - C.offscreenY) / C.fallAcc);
  const landUp = C.riseStart + Math.sqrt((C.floorY - C.ceilY) / C.riseAcc);
  if (g < C.fallStart) return { y: C.offscreenY, air: 0 };
  if (g < landDown) return { y: C.offscreenY + C.fallAcc * (g - C.fallStart) ** 2, air: 1 };
  if (g < C.riseStart) { const b = bounces(C.bounceDown, g - landDown); return { y: C.floorY - b, air: Math.min(1, b / 6) }; }
  if (g < landUp) return { y: C.floorY - C.riseAcc * (g - C.riseStart) ** 2, air: 1 };
  const b = bounces(C.bounceUp, g - landUp);
  const exit = C.offscreenY + C.exitAcc * (g - C.exitStart) ** 2;   // 往上離開的拋物線
  return { y: Math.min(C.ceilY + b, exit), air: Math.max(Math.min(1, b / 6), exit < C.ceilY ? 1 : 0) };
}

function render(t) {
  const f = t * 30;
  els.forEach((e, i) => {
    const g = ((f - CFG.delays[i]) % CFG.frames + CFG.frames) % CFG.frames;
    const s = state(g);
    e.style.transform = `translate(${e._x}px,${s.y - e._h / 2}px) rotate(${CFG.tilts[i] * s.air}deg)`;
  });
}

document.fonts.load(`${CFG.fontSize}px "Dela Gothic One"`, CFG.text).then(() => {
  layout();
  const loop = CFG.frames / 30;
  if (q.has('t')) render(+q.get('t') % loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % loop); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
