<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>23 Text Cube</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #scene { position:absolute; left:50%; top:50%; transform-style:preserve-3d; }
  #cube { position:absolute; transform-style:preserve-3d; }
  .f { position:absolute; display:flex; align-items:center; justify-content:center; backface-visibility:hidden;
       font-family:'Noto Serif JP',serif; font-weight:900; line-height:1; }
</style>
</head>
<body>
<div id="card"><div id="scene"><div id="cube"></div></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#f3efe6',
  size: 66,                       // 立方體邊長
  // 依序翻到正面的 4 面：text 為空 = 純色面
  faces: [
    { text: '冬', bg: '#0e6b62', color: '#111111' },
    { text: '',   bg: '#141414', color: '#111111' },
    { text: '夏', bg: '#0e6b62', color: '#111111' },
    { text: '',   bg: '#141414', color: '#111111' },
  ],
  fontSize: 46,
  perspective: 260,
  firstTurn: 0.2,                 // 第一次翻轉開始時間
  hold: 0.5,                      // 每面間隔（翻轉 + 停留）
  turnDur: 0.167,                 // 翻轉時間
  loop: 2.0,
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
const cube = document.getElementById('cube');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})`,
  perspective: CFG.perspective+'px' });
const S = CFG.size, h = S / 2;
// 面的位置：0 正面、1 上面、2 背面、3 下面 → 立方體往下翻時依序轉到正面
const place = [`translateZ(${h}px)`, `rotateX(90deg) translateZ(${h}px)`, `rotateX(180deg) translateZ(${h}px)`, `rotateX(-90deg) translateZ(${h}px)`];
CFG.faces.forEach((f, i) => {
  const d = document.createElement('div'); d.className = 'f'; d.textContent = f.text;
  Object.assign(d.style, { width: S+'px', height: S+'px', left: -h+'px', top: -h+'px', background: f.bg, color: f.color,
    fontSize: CFG.fontSize+'px', transform: place[i] });
  cube.appendChild(d);
});
const easeInOut = k => k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;

function render(t) {
  // 已完成幾次翻轉 + 目前翻轉進度
  const since = t - CFG.firstTurn;
  let n = Math.floor(since / CFG.hold), k = (since - n * CFG.hold) / CFG.turnDur;
  const turns = n + easeInOut(Math.min(1, Math.max(0, k)));
  // 每次翻轉 -90°（正面往下、上面轉到正面）；起始時正面是最後一面翻過來之前的狀態
  cube.style.transform = `rotateX(${-90 * (turns + 1)}deg)`;
}

const start = () => {
  if (q.has('t')) render(+q.get('t') % CFG.loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % CFG.loop); requestAnimationFrame(f); })(t0); }
};
document.fonts.load(`900 ${CFG.fontSize}px "Noto Serif JP"`, CFG.faces.map(f => f.text).join('')).then(start);
</script>
</body>
</html>
