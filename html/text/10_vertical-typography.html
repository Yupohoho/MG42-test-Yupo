<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>10 Vertical Typography</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  .col { position:absolute; top:0; display:flex; flex-direction:column; align-items:center; line-height:1; }
  .unit { flex:none; display:flex; flex-direction:column; align-items:center; font-family:'Noto Serif JP',serif; }
</style>
</head>
<body>
<div id="card"></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#f8c22c',
  // x = 欄中心；size = 字級；unit = 一組字（含下方留白）的高度；speed = 正往下、負往上（px/秒）；y0 = t=0 時第一組字頂端位置
  cols: [
    { text: '静寂', x: 49,  size: 40, weight: 900, color: '#1b1b1b', unit: 132, speed: -90, y0: 2 },
    { text: '静寂', x: 112, size: 21, weight: 700, color: '#a27b16', unit: 88,  speed:  90, y0: 42 },
    { text: '疾走', x: 212, size: 21, weight: 700, color: '#a27b16', unit: 72,  speed: -90, y0: 3 },
    { text: '疾走', x: 276, size: 40, weight: 900, color: '#1b1b1b', unit: 132, speed:  90, y0: 90 },
  ],
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });

const cols = CFG.cols.map(c => {
  const el = document.createElement('div'); el.className = 'col';
  const copies = Math.ceil(CFG.H / c.unit) + 2;
  for (let i = 0; i < copies; i++) {
    const u = document.createElement('div'); u.className = 'unit';
    u.innerHTML = [...c.text].map(ch => `<span>${ch}</span>`).join('');
    Object.assign(u.style, { height: c.unit+'px', fontSize: c.size+'px', fontWeight: c.weight, color: c.color });
    el.appendChild(u);
  }
  el.style.left = (c.x - c.size / 2) + 'px'; el.style.width = c.size + 'px';
  card.appendChild(el); return el;
});

function render(t) {
  CFG.cols.forEach((c, i) => {
    // 等速捲動，以一組高度取模，無縫循環
    const off = (((c.y0 + c.speed * t) % c.unit) + c.unit) % c.unit;
    cols[i].style.transform = `translateY(${off - c.unit}px)`;
  });
}

Promise.all(CFG.cols.map(c => document.fonts.load(`${c.weight} ${c.size}px "Noto Serif JP"`, c.text))).then(() => {
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
