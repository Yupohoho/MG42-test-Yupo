<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>48 Number Slam</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #num { position:absolute; left:0; top:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center;
         line-height:1; font-family:'Unbounded',sans-serif; font-weight:900; white-space:nowrap; transform-origin:50% 62%; }
  svg { position:absolute; inset:0; }
</style>
</head>
<body>
<div id="card"><div id="num"></div><svg id="ring"></svg></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#14161c',
  ring: '#c8ff3a',         // 中央圓圈與擴散波的顏色
  // 依序砸出的內容：at = 出現時間（秒），text 為 null = 空白（只剩圓圈）
  steps: [
    { at: 0.0, text: '3',   color: '#f3efe6', size: 66 },
    { at: 0.4, text: '2',   color: '#f3efe6', size: 66 },
    { at: 0.9, text: '1',   color: '#f3efe6', size: 66 },
    { at: 1.3, text: null },
    { at: 1.4, text: 'GO!', color: '#c8ff3a', size: 62 },
  ],
  // 砸入逐幀（30fps，由砸入那幀算起）：前 3 幀放大 3 倍多撐滿畫面，第 4 幀縮到 1.15，之後晃動逐幀衰減到 0
  slam: {
    scale: [3.2, 3.3, 3.0, 1.15, 1.04],
    rot:   [-5, -4, 6, -5, 3, -1.5, .8],        // 傾斜（度）
    dx:    [0, -6, 5, -3, 2, -1],               // 水平跳動（px）
    dy:    [10, 12, 6, -3, 2, -1],              // 垂直跳動（px）
  },
  baseR: 10,               // 中央小圓圈半徑
  waveSpeed: 150,          // 擴散波每秒擴大幾 px
  waveLife: 0.4,           // 擴散波持續秒數
  loop: 2.4,
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), num = document.getElementById('num'), svg = document.getElementById('ring');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
svg.setAttribute('width', CFG.W); svg.setAttribute('height', CFG.H);
const NS = 'http://www.w3.org/2000/svg', cx = CFG.W / 2, cy = CFG.H / 2;
const base = document.createElementNS(NS, 'circle'), wave = document.createElementNS(NS, 'circle');
[base, wave].forEach(c => { c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('fill', 'none'); c.setAttribute('stroke', CFG.ring); svg.appendChild(c); });
base.setAttribute('r', CFG.baseR); base.setAttribute('stroke-width', 1.5);

function render(t) {
  const u = t % CFG.loop;
  let step = CFG.steps[CFG.steps.length - 1];
  for (const s of CFG.steps) if (u >= s.at) step = s;
  const since = u - step.at, f = Math.floor(since * 30 + 1e-6);
  // 字：砸入後逐幀（硬切、不補間）放大、傾斜、跳動，再慢慢歸位
  if (step.text) {
    const S = CFG.slam, g = (a, d) => f < a.length ? a[f] : d;
    num.textContent = step.text;
    num.style.color = step.color; num.style.fontSize = step.size + 'px';
    num.style.transform = `translate(${g(S.dx, 0)}px,${g(S.dy, 0)}px) rotate(${g(S.rot, 0)}deg) scale(${g(S.scale, 1)})`;
    num.style.opacity = 1;
  } else num.style.opacity = 0;
  // 擴散波：從砸入後一幀開始，往外擴並淡出
  const w = since - 1 / 30;
  if (w > 0 && w < CFG.waveLife) {
    wave.setAttribute('r', CFG.baseR + CFG.waveSpeed * w);
    wave.setAttribute('stroke-width', 3 * (1 - w / CFG.waveLife) + 1);
    wave.setAttribute('opacity', Math.pow(1 - w / CFG.waveLife, 1.5));
  } else wave.setAttribute('opacity', 0);
}

const start = () => {
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
};
document.fonts.load('66px "Unbounded"', '3210GO!').then(start);
</script>
</body>
</html>
