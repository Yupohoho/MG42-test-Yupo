<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>24 Extrude Text</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  .w { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; line-height:1;
       font-family:'Dela Gothic One',sans-serif; white-space:nowrap; }
</style>
</head>
<body>
<div id="card"></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: '立体',
  W: 324, H: 106,
  bg: '#14161c',
  face: '#22d3c5',
  sideNear: '#f3efe6', sideFar: '#bdb8ad',   // 厚度側面：靠近正面亮、越遠越暗
  fontSize: 74,
  depth: 12,            // 厚度（px）
  startAngle: 45,       // t=0 時厚度朝向（度，0 = 右、90 = 下）
  loop: 2.0,            // 厚度方向轉一圈的秒數（順時針）
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
const mix = (a, b, k) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-k) + parseInt(b.substr(i,2),16)*k).toString(16).padStart(2,'0')).join('');
// 側面 = 同一個字往厚度方向逐 px 疊，最後放正面
const sides = Array.from({length: CFG.depth}, (_, i) => {
  const d = document.createElement('div'); d.className = 'w'; d.textContent = CFG.text;
  Object.assign(d.style, { fontSize: CFG.fontSize+'px', color: mix(CFG.sideNear, CFG.sideFar, (i + 1) / CFG.depth), zIndex: CFG.depth - i });
  card.appendChild(d); return d;
});
const face = document.createElement('div'); face.className = 'w'; face.textContent = CFG.text;
Object.assign(face.style, { fontSize: CFG.fontSize+'px', color: CFG.face, zIndex: 100 });
card.appendChild(face);

function render(t) {
  const a = (CFG.startAngle + 360 * t / CFG.loop) * Math.PI / 180;
  const dx = Math.cos(a), dy = Math.sin(a);
  // 正面完全固定不動，只有後面的厚度跟著方向轉
  sides.forEach((el, i) => { const k = i + 1; el.style.transform = `translate(${dx*k}px,${dy*k}px)`; });
}

const start = () => {
  if (q.has('t')) render(+q.get('t') % CFG.loop);
  else { const t0 = performance.now(); (function f(now){ render(((now - t0) / 1000) % CFG.loop); requestAnimationFrame(f); })(t0); }
};
document.fonts.load(`${CFG.fontSize}px "Dela Gothic One"`, CFG.text).then(start);
</script>
</body>
</html>
