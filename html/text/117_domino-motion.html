<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>117 Domino Motion</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #stage { position:absolute; inset:0; }
  .d { position:absolute; border-radius:2px; transform-origin:100% 100%; }
  #ground { position:absolute; height:1px; }
  #txt { position:absolute; left:50%; top:0; line-height:1; white-space:nowrap; font-family:'Archivo Black',sans-serif; }
</style>
</head>
<body>
<div id="card"><div id="stage"><div id="ground"></div><div id="txt"></div></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'NEXT',
  W: 284, H: 158,
  bg: '#fcfcf9',
  ink: '#22232e',             // 骨牌色
  accent: '#6a967d',          // 最後一張骨牌與字的顏色
  ground: '#e2e2dc',          // 地面細線
  count: 10,                  // 骨牌數（最後一張為強調色）
  left: 39.8, step: 22.24,    // 第一張左緣、間距
  bw: 12, bh: 70, base: 129,  // 骨牌寬、高、地面 y
  gravity: .07,               // 重力（越大倒得越快）
  hitAngle: 12,               // 倒到幾度時頂端撞到下一張
  rebound: .45,               // 最後一張倒地的回彈係數
  rest: 83,                   // 靠在下一張上的角度
  fontSize: 37, textY: 49,    // 字的大小與中心 y
};
// =================================
const FPS = 30, LOOP = 120;

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), stage = document.getElementById('stage');
const txt = document.getElementById('txt'), ground = document.getElementById('ground');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
Object.assign(ground.style, { left: '14px', right: '14px', top: CFG.base + 'px', background: CFG.ground });
Object.assign(txt.style, { fontSize: CFG.fontSize+'px', color: CFG.accent });
txt.textContent = CFG.text;
const ds = Array.from({ length: CFG.count }, (_, i) => {
  const d = document.createElement('div'); d.className = 'd';
  Object.assign(d.style, { width: CFG.bw+'px', height: CFG.bh+'px', left: CFG.left + i * CFG.step + 'px', top: CFG.base - CFG.bh + 'px',
    background: i === CFG.count - 1 ? CFG.accent : CFG.ink });
  stage.insertBefore(d, txt); return d;
});

const key = (tab, u) => { if (u <= tab[0][0]) return tab[0][1]; for (let i = 1; i < tab.length; i++) if (u <= tab[i][0]) { const [a, va] = tab[i-1], [b, vb] = tab[i]; return va + (vb - va) * (u - a) / (b - a); } return tab[tab.length-1][1]; };
// 物理模擬（載入時算好逐幀角度）：每張骨牌以右下角為支點，受重力加速倒下（角速度 += g·sinθ，越倒越快）；
// 倒到 hitAngle 時頂端撞上下一張：下一張帶著 90% 的速度被推倒、接著自己加速；
// 撞過的骨牌靠在下一張身上，角度跟著下一張走（不會穿過去）；最後一張倒平時小回彈，整排跟著輕輕一震。
const SIM = (() => {
  const N = CFG.count, D = Math.PI / 180, SUB = 8, frames = [];
  const th = Array(N).fill(0), w = Array(N).fill(0), act = Array(N).fill(false), hit = Array(N).fill(false);
  const lean = (t) => CFG.hitAngle + (CFG.rest - CFG.hitAngle) * Math.min(t, CFG.rest) / CFG.rest;
  act[0] = true; th[0] = 3 * D; w[0] = .6 * D / SUB;
  let lastLand = -1, bounce = 0;
  for (let f = 0; f <= LOOP; f++) {
    frames.push(th.map(t => t / D));
    for (let s = 0; s < SUB; s++) {
      for (let i = 0; i < N; i++) {
        if (!act[i] || hit[i]) continue;
        w[i] += CFG.gravity * Math.sin(Math.max(th[i], .02)) / SUB / SUB; th[i] += w[i];
        if (i < N - 1 && th[i] >= CFG.hitAngle * D) { hit[i] = act[i + 1] = true; th[i + 1] = .3 * D; w[i + 1] = w[i] * .9; }
        if (i === N - 1 && th[i] >= 90 * D) { th[i] = 90 * D; w[i] = bounce++ < 1 ? -w[i] * CFG.rebound : 0; if (lastLand < 0) lastLand = f; }
      }
      for (let i = N - 2; i >= 0; i--) if (hit[i]) th[i] = lean(th[i + 1] / D) * D;
    }
  }
  return { frames, lastLand };
})();
// 全部倒完後字彈出（稍微放大過頭再回穩）
const POP = [[0,0],[1,.2],[2,.44],[3,.66],[4,.85],[5,1],[6,1.08],[7,1.13],[8,1.15],[11,1.15],[12,1.13],[13,1.1],[14,1.07],[15,1.04],[16,1.02],[17,1]];

function render(f) {
  const fr = SIM.frames[Math.min(SIM.frames.length - 1, Math.floor(f))];
  ds.forEach((d, i) => { d.style.transform = `rotate(${fr[i]}deg)`; });
  const u = f - SIM.lastLand - 3;   // 最後一張倒地後 3 幀字開始彈出
  const s = key(POP, u);
  txt.style.opacity = u < 1 ? 0 : 1;
  txt.style.transform = `translate(-50%,-50%) translateY(${CFG.textY}px) scale(${s})`;
  stage.style.opacity = f < 110 ? 1 : Math.max(0, 1 - (f - 110) / 8);
}

document.fonts.load(`${CFG.fontSize}px "Archivo Black"`, CFG.text).then(() => {
  if (q.has('t')) render((+q.get('t') * FPS) % LOOP);
  else { const t0 = performance.now(); (function g(now){ render(Math.floor((now - t0) / 1000 * FPS) % LOOP); requestAnimationFrame(g); })(t0); }
});
</script>
</body>
</html>
