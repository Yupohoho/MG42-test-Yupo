<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>91 Flip Letter</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#e8e6e2; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  body.m { display:block; min-height:0; }
  /* ?z=2 放大觀看；?t=0.5 定格；?m=1 量測用（卡片貼左上） */
  #card { position:relative; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="card"><canvas id="cv"></canvas></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'HELLO',
  fillIndex: [0],                 // 哪幾格用強調色實心底（白字）
  W: 284, H: 158, radius: 12,
  bg: '#fcfbf8',
  ink: '#252633',                 // 字色與格子框線
  tile: '#ffffff',                // 格子底色
  accent: '#f08a54',
  font: '600 {S}px "Oswald"',
  fonts: ['600 30px "Oswald"'], fontText: 'HELLO',
  tileW: 44, tileH: 66, gap: 7.5, top: 45, round: 6,
  cap: 37,                        // 字高（大寫）
  start: 6, stagger: 3,           // 第一格開始翻的幀、每格間隔
};
const LOOP = 120;
// =================================

// ===== 共用 =====
const q = new URLSearchParams(location.search);
const Z = +(q.get('z') || 1);
if (q.get('m') === '1') document.body.classList.add('m');
const card = document.getElementById('card'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const DPR = Math.max(1, window.devicePixelRatio || 1) * Z;
cv.width = CFG.W * DPR; cv.height = CFG.H * DPR;
cv.style.width = CFG.W * Z + 'px'; cv.style.height = CFG.H * Z + 'px';
Object.assign(card.style, { width: CFG.W * Z + 'px', height: CFG.H * Z + 'px', background: CFG.bg, borderRadius: CFG.radius * Z + 'px' });

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const eOut3 = p => 1 - Math.pow(1 - clamp(p), 3);
const eOut4 = p => 1 - Math.pow(1 - clamp(p), 4);
const eInOut = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
// 逐幀表取值（u 為幀，可為小數；超出範圍取端點）
const tab = (arr, u) => { if (u <= 0) return arr[0]; const n = arr.length - 1; if (u >= n) return arr[n]; const i = Math.floor(u), k = u - i; return arr[i] + (arr[i + 1] - arr[i]) * k; };
// 把字塞進指定墨跡框 box=[左,上,右,下]；mode 'sx' 水平拉伸、'track' 用字距補寬
function fit(word, font, box, mode) {
  ctx.font = font.replace('{S}', 100);
  const m = ctx.measureText(word);
  const ih = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const size = 100 * (box[3] - box[1]) / ih, k = size / 100;
  ctx.font = font.replace('{S}', size);
  const chars = [...word], M = ctx.measureText(word);
  const inkW = (M.actualBoundingBoxLeft + M.actualBoundingBoxRight);
  let sx = 1, track = 0;
  if (mode === 'track' && chars.length > 1) track = ((box[2] - box[0]) - inkW) / (chars.length - 1);
  else sx = (box[2] - box[0]) / inkW;
  const base = box[1] + m.actualBoundingBoxAscent * k;
  const ox = box[0] + M.actualBoundingBoxLeft * sx;
  const letters = chars.map((ch, i) => {
    const pre = ctx.measureText(chars.slice(0, i).join('')).width, cm = ctx.measureText(ch);
    const x = ox + pre * sx + track * i;
    return { ch, x, cx: x + (cm.actualBoundingBoxRight - cm.actualBoundingBoxLeft) / 2 * sx, w: cm.width * sx };
  });
  return { font: font.replace('{S}', size), size, sx, base, letters };
}
// 在 (px,py) 為支點，水平 sx2、垂直 sy2 縮放、rot 度旋轉後畫一個字
function drawLetter(L, F, color, px, py, sx2 = 1, sy2 = 1, rot = 0, dx = 0, dy = 0) {
  ctx.save();
  ctx.translate(px + dx, py + dy); ctx.rotate(rot * Math.PI / 180); ctx.scale(sx2, sy2); ctx.translate(-px, -py);
  ctx.translate(L.x, F.base); ctx.scale(F.sx, 1);
  ctx.font = F.font; ctx.fillStyle = color; ctx.textBaseline = 'alphabetic';
  ctx.fillText(L.ch, 0, 0);
  ctx.restore();
}
function frame(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, CFG.W, CFG.H);
  render(t);
}

let size;
// 翻轉時格子的可見高度比例（由側面 0 翻到正面 1），逐幀
const FLIP = [0, .30, .55, .74, .86, .94, .97, .985, 1];
function setup() {
  ctx.font = CFG.font.replace('{S}', 100);
  size = 100 * CFG.cap / ctx.measureText('H').actualBoundingBoxAscent;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function render(t) {
  const f = t * 30, chars = [...CFG.text], n = chars.length;
  const total = n * CFG.tileW + (n - 1) * CFG.gap, x0 = (CFG.W - total) / 2;
  const cy = CFG.top + CFG.tileH / 2;
  chars.forEach((ch, i) => {
    const u = f - (CFG.start + i * CFG.stagger);
    if (u < 0) return;
    const h = tab(FLIP, u);
    if (h <= 0.01) return;
    const x = x0 + i * (CFG.tileW + CFG.gap), filled = CFG.fillIndex.includes(i);
    ctx.save();
    ctx.translate(0, cy + (1 - h) * 8); ctx.scale(1, h); ctx.translate(0, -cy);
    // 格子（淡淡的下方陰影）
    ctx.shadowColor = 'rgba(0,0,0,.13)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 2;
    rr(x, CFG.top, CFG.tileW, CFG.tileH, CFG.round);
    ctx.fillStyle = filled ? CFG.accent : CFG.tile; ctx.fill();
    ctx.shadowColor = 'transparent';
    if (!filled) { rr(x + .75, CFG.top + .75, CFG.tileW - 1.5, CFG.tileH - 1.5, CFG.round - .5); ctx.lineWidth = 1.5; ctx.strokeStyle = CFG.ink; ctx.stroke(); }
    // 字
    ctx.font = CFG.font.replace('{S}', size); ctx.textBaseline = 'alphabetic';
    const m = ctx.measureText(ch);
    ctx.fillStyle = filled ? '#ffffff' : CFG.ink;
    ctx.fillText(ch, x + CFG.tileW / 2 - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2, cy + CFG.cap / 2 + 3);
    ctx.restore();
  });
}

Promise.all(CFG.fonts.map(f => document.fonts.load(f, CFG.fontText))).then(() => {
  setup();
  if (q.has('t')) frame((+q.get('t') * 30) % LOOP / 30);
  else { const t0 = performance.now(); (function f(now) { frame(((now - t0) / 1000 * 30 % LOOP) / 30); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
