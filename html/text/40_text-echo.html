<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>40 Text Echo</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  .w { position:absolute; left:0; top:0; white-space:nowrap; line-height:1;
       font-family:'Dela Gothic One','Noto Sans JP',sans-serif; }
</style>
</head>
<body>
<div id="card"></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: '残像',
  W: 324, H: 106,
  bg: '#14161c',
  color: '#f6efe4',
  echoColor: '#ff8a3d',
  fontSize: 40,
  // 8 字形路徑（字中心，px）：x = cx + ax·sin(2π(t/loop) + phase)，y = cy + ay·sin(4π(t/loop))
  cx: 150, ax: 90, phase: 0.2,
  cy: 57,  ay: 25,
  loop: 2.0,
  echoes: 7,           // 殘影數量
  echoGap: 2.2,        // 每個殘影落後幾幀（30fps）
  echoOpacity: .6,     // 最新一個殘影的不透明度，越舊越淡
  echoBlur: 0.7,       // 殘影模糊（px），越舊越模糊
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });

// 殘影在下、主字在上；殘影由舊到新依序疊
const els = [];
for (let i = CFG.echoes; i >= 0; i--) {
  const d = document.createElement('div'); d.className = 'w'; d.textContent = CFG.text;
  d.style.fontSize = CFG.fontSize + 'px';
  if (i === 0) d.style.color = CFG.color;
  else {
    const k = i / CFG.echoes;
    Object.assign(d.style, { color: CFG.echoColor, opacity: CFG.echoOpacity * (1 - k * .85), filter: `blur(${CFG.echoBlur * (.5 + k)}px)` });
  }
  d.dataset.lag = i;
  card.appendChild(d); els.push(d);
}

const pos = t => {
  const p = 2 * Math.PI * t / CFG.loop;
  return [CFG.cx + CFG.ax * Math.sin(p + CFG.phase), CFG.cy + CFG.ay * Math.sin(2 * p)];
};

function render(t) {
  els.forEach(el => {
    const [x, y] = pos(t - el.dataset.lag * CFG.echoGap / 30);
    el.style.transform = `translate(${x - el.offsetWidth/2}px,${y - el.offsetHeight/2}px)`;
  });
}

document.fonts.load(`${CFG.fontSize}px "Dela Gothic One"`, CFG.text).then(() => {
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
