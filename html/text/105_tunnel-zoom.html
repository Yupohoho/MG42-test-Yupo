<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>105 Tunnel Zoom</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=block" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  svg { position:absolute; left:0; top:0; }
</style>
</head>
<body>
<div id="card"><svg id="sv"><g id="rects"></g><text id="tx"></text></svg></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'ENTER',
  W: 284, H: 158,
  bg: '#FCFCF9',
  ink: '#24242F',                       // 字色、深色框
  accent: '#EE7493',                    // 粉紅框
  font: { f: '"Oswald"', w: 700 },
  box: [76, 58, 207, 102],              // 字的墨跡框 [x0,y0,x1,y1]
  center: [142.5, 77.5],                // 框的中心
  aspect: 1.76,                         // 框的寬高比
  baseH: 101,                           // 週期起點時最外層深色框的高
  ratio: 1.6,                           // 相鄰兩層框的大小倍率
  period: 7.5,                          // 每 7.5 幀放大一層（×ratio）；LOOP 必須是 period 的偶數倍，深灰／粉紅才接得上
  stroke: 2,
};
const LOOP = 120;                       // 一輪幀數（30fps）：隧道持續推進 16 層，無縫循環
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), sv = document.getElementById('sv');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
sv.setAttribute('width', CFG.W); sv.setAttribute('height', CFG.H);
const NS = 'http://www.w3.org/2000/svg';
const cv = document.createElement('canvas').getContext('2d');
// 依墨跡框擺字：mode 'ls' 用字距撐寬、'sx' 用水平縮放
function fitText(t, str, font, box, mode) {
  cv.font = `${font.w} 100px ${font.f}`; const m = cv.measureText(str);
  const fs = (box[3]-box[1]) / (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) * 100, k = fs/100;
  const inkW = (m.actualBoundingBoxLeft + m.actualBoundingBoxRight) * k, bw = box[2]-box[0];
  t.textContent = str;
  Object.entries({ 'font-family': font.f.replace(/"/g,''), 'font-weight': font.w, 'font-size': fs,
    x: box[0] + m.actualBoundingBoxLeft*k, y: box[1] + m.actualBoundingBoxAscent*k }).forEach(([a,v]) => t.setAttribute(a, v));
  if (mode === 'ls') t.setAttribute('letter-spacing', (bw-inkW) / Math.max(1, [...str].length-1));
  else t.setAttribute('transform', `translate(${box[0]} 0) scale(${bw/inkW} 1) translate(${-box[0]} 0)`);
}

const rects = [];
for (let k = -2; k < 13; k++) {   // 涵蓋從中心冒出到推出畫面的所有層
  const r = document.createElementNS(NS, 'rect');
  Object.entries({ fill: 'none', stroke: (k & 1) ? CFG.accent : CFG.ink, 'stroke-width': CFG.stroke, rx: 2 }).forEach(([a,v]) => r.setAttribute(a, v));
  document.getElementById('rects').appendChild(r); rects.push([k, r]);
}

function render(t) {
  const f = ((t * 30) % LOOP + LOOP) % LOOP;
  // 每兩層一個顏色週期：放大兩層後畫面與起點完全相同，所以永遠往前推進、不停
  const grow = Math.pow(CFG.ratio, (f / CFG.period) % 2);
  const [cx, cy] = CFG.center;
  for (const [k, r] of rects) {
    // 每一層的大小：最外層 baseH，往內每層 ÷ratio；整體依時間等比放大（隧道往前推進）
    const h = CFG.baseH * Math.pow(CFG.ratio, -k) * grow, w = h * CFG.aspect;
    r.setAttribute('x', cx - w/2); r.setAttribute('y', cy - h/2);
    r.setAttribute('width', w); r.setAttribute('height', h);
    r.setAttribute('opacity', h < 4 ? 0 : Math.max(0, Math.min(1, (190 - h) / 40)));
  }
}

document.fonts.load(`700 50px "Oswald"`, CFG.text).then(() => {
  fitText(document.getElementById('tx'), CFG.text, CFG.font, CFG.box, 'ls');
  document.getElementById('tx').setAttribute('fill', CFG.ink);
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
