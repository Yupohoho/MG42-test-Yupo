<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>15 Parallax Columns</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  .col { position:absolute; top:0; display:flex; flex-direction:column; align-items:center; line-height:1; }
  .unit { flex:none; display:flex; flex-direction:column; align-items:center; }
</style>
</head>
<body>
<div id="card"></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#f2efe6',
  // 三層：遠（小、淡、慢）／中（中、金、中速）／近（大、黑、快）。相鄰欄方向相反
  // x = 欄中心；pitch = 字距；unit = 一組字（含下方留白）高度；speed = 正往下、負往上（px/秒）；y0 = t=0 時第一組字頂端
  cols: [
    { text: '夜雨街灯', layer: 'far',  x: 25,  y0: -7 },
    { text: '夜雨街灯', layer: 'mid',  x: 77,  y0: 5,  speed: -84 },
    { text: '雨音の夜', layer: 'near', x: 152, y0: 14 },
    { text: '眠る街',   layer: 'mid',  x: 238, y0: 4,  speed: -62 },
    { text: '夜雨街灯', layer: 'far',  x: 292, y0: -7 },
  ],
  layers: {
    far:  { font: 'Noto Serif JP',   weight: 500, size: 15, pitch: 19, unit: 96,  color: '#a8a498', speed: 45 },
    mid:  { font: 'Noto Serif JP',   weight: 700, size: 25, pitch: 28, unit: 140, color: '#a88f5c', speed: -84 },
    near: { font: 'Dela Gothic One', weight: 400, size: 46, pitch: 47, unit: 224, color: '#141414', speed: 112 },
  },
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });

const cols = CFG.cols.map(c => {
  const L = CFG.layers[c.layer];
  const el = document.createElement('div'); el.className = 'col';
  for (let i = 0; i < Math.ceil(CFG.H / L.unit) + 2; i++) {
    const u = document.createElement('div'); u.className = 'unit';
    u.innerHTML = [...c.text].map(ch => `<span style="height:${L.pitch}px">${ch}</span>`).join('');
    Object.assign(u.style, { height: L.unit+'px', fontFamily: `'${L.font}'`, fontWeight: L.weight, fontSize: L.size+'px', color: L.color });
    el.appendChild(u);
  }
  el.style.left = (c.x - L.size / 2) + 'px'; el.style.width = L.size + 'px';
  card.appendChild(el); return el;
});

function render(t) {
  CFG.cols.forEach((c, i) => {
    const L = CFG.layers[c.layer], v = c.speed ?? L.speed;
    const off = (((c.y0 + v * t) % L.unit) + L.unit) % L.unit;
    cols[i].style.transform = `translateY(${off - L.unit}px)`;
  });
}

Promise.all(Object.values(CFG.layers).map(L => document.fonts.load(`${L.weight} ${L.size}px "${L.font}"`, CFG.cols.map(c => c.text).join('')))).then(() => {
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
});
</script>
</body>
</html>
