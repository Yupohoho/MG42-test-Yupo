<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>OP25 3Dフリップ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#16171e;perspective:500px}
.sh{position:absolute;top:112px;width:60px;height:9px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.65),rgba(0,0,0,0) 70%);opacity:0}
.c{position:absolute;top:26px;width:64px;height:88px;transform-style:preserve-3d;transform-origin:50% 28%}
.f{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.back{background:linear-gradient(#f4505b,#e23845);font:700 13px 'Roboto Mono',monospace;color:#8f1f2b}
.front{background:#f7f5f3;color:#14151a;font:900 52px 'Noto Sans TC',sans-serif;transform:rotateY(180deg);line-height:1}
</style></head><body><div id="card"></div>
<script>
/* ===== CFG ===== */
const CFG={
  chars:['反','轉','世','界'],      // 四張卡片正面文字（背面為編號）
  xs:[20,93,166,240],               // 卡片左緣 x
  edge0:15,                         // 第一張卡翻到側面（90°）的幀
  stagger:6,                      // 相鄰卡片間隔幀
  half:8,                           // 側面前後各幾幀（一次翻面 8 幀）
  tilt:[-7,6,-6,7],                 // 翻面時的傾斜角（逐步回正）
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const card=document.getElementById('card');
const C=CFG.chars.map((ch,i)=>{
  const d=document.createElement('div');d.className='c';d.style.left=CFG.xs[i]+'px';
  d.innerHTML='<div class="f back">0'+(i+1)+'</div><div class="f front">'+ch+'</div>';
  const sh=document.createElement('div');sh.className='sh';sh.style.left=(CFG.xs[i]+2)+'px';card.appendChild(sh);d._sh=sh;   // 地面陰影（卡片浮起時變大變淡）
  card.appendChild(d);return d});
function render(F){
  C.forEach((d,i)=>{
    const e=CFG.edge0+CFG.stagger*i;
    const x=seg(F,e-CFG.half,e+CFG.half);
    const ang=180*(x*x*x*(x*(x*6-15)+10));   // 更滑順的 smootherstep（起步、收尾都柔和）
    const k=1-eo(seg(F,e+3,e+24));            // 翻面後的傾斜／放大逐步回正
        const tz=CFG.tilt[i]*k*(F>=e-CFG.half?1:0);
    const sc=1+0.07*k*(F>=e-CFG.half?1:0);
    /* 浮起：翻面進行中卡片往觀眾方向拉近、上移，翻完後慢慢落回（離地高度 lift 0→1→0） */
    const fx=seg(F,e-CFG.half-1,e+CFG.half+1),lift=Math.sin(Math.PI*fx)*(1-.35*seg(F,e+CFG.half,e+CFG.half+14))+.28*k*(F>=e-CFG.half?1:0);
    /* 以上半部為支點浮起：下緣往觀眾方向翻起（rotateX），像從下面把牌翻起來 */
    d.style.transform='translateZ('+(30*lift)+'px) rotateX('+(24*lift)+'deg) rotateZ('+tz+'deg) rotateY('+ang+'deg) scale('+sc+')';
    d._sh.style.opacity=Math.min(1,lift*1.3);d._sh.style.transform='scale('+(1+.5*lift)+','+(1+.3*lift)+')';
  });
}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load('900 52px "Noto Sans TC"','反轉世界').then(start,start);
</script></body></html>
