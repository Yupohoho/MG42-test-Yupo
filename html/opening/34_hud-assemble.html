<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>OP34 HUD組裝</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Roboto+Mono:wght@500;700&family=Anton&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#16171e}
canvas{display:block;width:322px;height:127px}
</style></head><body><div id="card"><canvas id="cv"></canvas></div>
<script>
/* ===== CFG ===== */
const CFG={
  text:'啟動', sub:'SYSTEM ONLINE',
  cream:'#f1ebe2', red:'#ff4757', grey:'#6b6f7a', bg:'#16171e',
  rows:[['CPU',77,0],['MEM',67,1],['NET',78,0],['PWR',91,0]],   // 名稱、%、是否紅色
  hex:['0x4F2A','0xB19E','0x07D3','0xFF00'],
  R0:80, LOOP:120
};
const FONTS=[['900 40px "Noto Sans TC"','啟動'],['500 9px "Roboto Mono"','CPUMEMNETPWR0123456789x ABCDEFSYTONLI']];
/* ================ */

const q=new URLSearchParams(location.search);const Z=+q.get('z')||1;
const card=document.getElementById('card');if(Z!=1)card.style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const tab=(r,T)=>{if(r<=T[0][0])return T[0][1];for(let i=1;i<T.length;i++)if(r<=T[i][0]){const a=T[i-1],b=T[i];return lerp(a[1],b[1],(r-a[0])/(b[0]-a[0]))}return T[T.length-1][1]};
const R=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const W=322,H=127,D=2*Z;
const cv=document.getElementById('cv');cv.width=W*D;cv.height=H*D;const c=cv.getContext('2d');
function off(){const o=document.createElement('canvas');o.width=W*D;o.height=H*D;const x=o.getContext('2d');x.setTransform(D,0,0,D,0,0);return[o,x]}
function render(F){c.setTransform(D,0,0,D,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.filter='none';c.shadowBlur=0;c.letterSpacing='0px';c.setLineDash([]);
  c.clearRect(0,0,W,H);c.fillStyle=CFG.bg;c.fillRect(0,0,W,H);draw(c,F+CFG.R0,F)}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
Promise.all(FONTS.map(f=>document.fonts.load(f[0],f[1]))).then(start,start);


function draw(c,r){
  const cx=161,cy=64;
  c.strokeStyle=CFG.cream;c.lineWidth=2;
  [[10,10,1,1],[312,10,-1,1],[10,117,1,-1],[312,117,-1,-1]].forEach(([x,y,sx,sy])=>{c.beginPath();c.moveTo(x,y+sy*14);c.lineTo(x,y);c.lineTo(x+sx*14,y);c.stroke()});
  // 左側儀表
  c.font='500 6.5px "Roboto Mono"';c.textAlign='left';c.textBaseline='alphabetic';
  CFG.rows.forEach((o,i)=>{
    const y=38+i*13.5,p=eo(seg(r,92+i*2,110+i*2));
    c.fillStyle=p>0?'#c9ccd4':CFG.grey;
    c.fillText(o[0]+' '+String(Math.round(p*o[1])).padStart(2,'0'),22,y);
    c.fillStyle='#2b2d36';c.fillRect(22,y+2.5,60,3);
    c.fillStyle=o[2]?CFG.red:CFG.cream;c.fillRect(22,y+2.5,60*p*o[1]/100,3);
  });
  // 右側紅線與十六進位
  c.textAlign='right';
  CFG.hex.forEach((h,i)=>{
    const y=50+i*13.5,p=eo(seg(r,94+i*2,106+i*2));
    c.fillStyle=p>0?'#a9adb8':'#4d515c';c.fillText(h,299,y-4);
    c.strokeStyle=CFG.red;c.lineWidth=1.2;
    if(p>0){c.beginPath();c.moveTo(237,y);c.lineTo(237+62*p,y);c.stroke()}
  });
  // 外環
  const p=eo(seg(r,80,94));
  if(p>0){c.strokeStyle=CFG.cream;c.lineWidth=2.6;c.beginPath();c.arc(cx,cy,56,-Math.PI/2,-Math.PI/2+p*6.2832);c.stroke()}
  const tk=seg(r,92,100);
  if(tk>0){c.globalAlpha=tk;c.strokeStyle=CFG.cream;c.lineWidth=.8;
    for(let i=0;i<90;i++){const a=i/90*6.2832+(r-80)*.5*Math.PI/180,r0=60,r1=i%5==0?66:63.5;c.beginPath();c.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);c.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);c.stroke()}
    c.globalAlpha=1}
  const th=seg(r,86,96);
  if(th>0){c.globalAlpha=th*.4;c.strokeStyle=CFG.cream;c.lineWidth=.8;c.beginPath();c.arc(cx,cy,45,0,6.2832);c.stroke();c.globalAlpha=1}
  const rd=seg(r,96,102);
  if(rd>0){c.globalAlpha=rd;c.strokeStyle=CFG.red;c.lineWidth=1.1;c.setLineDash([1.2,2.8]);c.lineDashOffset=.8*(r-80);c.beginPath();c.arc(cx,cy,50,0,6.2832);c.stroke();c.setLineDash([]);c.lineDashOffset=0;c.globalAlpha=1}
  // 文字
  const ta=seg(r,100,108),bl=6*(1-seg(r,102,116));
  const fk=r<112?(R(Math.floor(r)*7.3)>.4?1:.2):1;
  if(r>=100&&r<122){
    [[0,1],[3,.6]].forEach(([dl,k])=>{const p=seg(r,100+dl,118+dl);if(p<=0||p>=1)return;const e=1-Math.pow(1-p,2.4),rad=56+e*140;
      c.strokeStyle=k==1?CFG.cream:CFG.red;c.globalAlpha=(1-p)*k*.9;c.lineWidth=.6+(1-p)*1.2;c.beginPath();c.arc(cx,cy,rad,0,6.2832);c.stroke()});
    const fg=tab(r,[[100,0],[101,.5],[103,.15],[104,.4],[106,0],[200,0]]);if(fg>0){c.globalAlpha=fg;c.fillStyle='#fff';c.fillRect(0,0,W,H)}
    c.globalAlpha=1}
  if(ta>0){c.save();c.globalAlpha=ta*fk;if(bl>.1)c.filter='blur('+(bl*D)+'px)';
    c.font='900 40px "Noto Sans TC"';c.textAlign='center';c.textBaseline='middle';
    c.fillStyle='#0b0c11';c.fillText(CFG.text,cx+1.5,59+2);c.fillStyle=CFG.cream;c.fillText(CFG.text,cx,59);c.restore()}
  const sa=seg(r,118,124);
  if(sa>0){c.globalAlpha=sa;c.fillStyle=CFG.red;c.font='700 6px "Roboto Mono"';c.textAlign='center';c.letterSpacing='1.5px';c.fillText(CFG.sub,cx+.75,90);c.globalAlpha=1}
}
</script></body></html>
