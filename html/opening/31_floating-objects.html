<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>OP31 フローティングオブジェクト</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#16171e;perspective:500px}
svg{position:absolute;left:0;top:0}
text{font-family:'Noto Sans TC',sans-serif;text-anchor:middle}
#cw{position:absolute;left:0;top:0;width:322px;height:127px;perspective:360px;pointer-events:none}
#cube{position:absolute;left:23px;top:70px;width:52px;height:52px;transform-style:preserve-3d}
#cube div{position:absolute;inset:0;background:#ece9e3;border:1.6px solid #15151a;box-sizing:border-box}
</style></head><body><div id="card"><svg id="s" width="322" height="127" viewBox="0 0 322 127"></svg><div id="cw"><div id="cube"><div style="transform:translateZ(26px)"></div><div style="transform:rotateY(180deg) translateZ(26px)"></div><div style="transform:rotateY(90deg) translateZ(26px)"></div><div style="transform:rotateY(-90deg) translateZ(26px)"></div><div style="transform:rotateX(90deg) translateZ(26px)"></div><div style="transform:rotateX(-90deg) translateZ(26px)"></div></div></div></div>
<script>
/* ===== CFG ===== */
const CFG={
  title:'向上飛',                              // 標題文字（紅色立體字）
  red:'#f25b6b',redDark:'#a82739',gold:'#efc965',
  redBall:{x:50,y:42,r:25},                    // 紅球
  whiteBall:{x:278,y:78,r:18},                 // 白球（從下方升起）
  goldBall:{x:269,y:21,r:9},                   // 小金球
  ring:{x:248,y:36,rx:33,ry:7},                // 金環，長軸轉動
  cube:{x:49,y:97},                            // 方塊中心
  dot:{x:82,y:118,r:5},                        // 小紅點
  titleCenter:[162,67],titleTilt:0,titleIn:[91,100],
  SH:80,                                       // render(0) 對應參考第 80 幀
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const NS='http://www.w3.org/2000/svg',S=document.getElementById('s');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||S).appendChild(e);return e}
const defs=el('defs',{});
function rg(id,c0,c1,c2){const g=el('radialGradient',{id,cx:.35,cy:.3,r:.8},defs);el('stop',{offset:0,'stop-color':c0},g);el('stop',{offset:.6,'stop-color':c1},g);el('stop',{offset:1,'stop-color':c2},g)}
rg('gr','#ff8a94','#ee5463','#cf3b4a');rg('gw','#ffffff','#e9e9ea','#b4b4b9');rg('gg','#fbe39a','#eec866','#cfa23a');
const blur=el('filter',{id:'bl',x:'-20%',y:'-20%',width:'140%',height:'140%'},defs);el('feGaussianBlur',{stdDeviation:.9},blur);
const blur2=el('filter',{id:'bl2',x:'-100%',y:'-100%',width:'300%',height:'300%'},defs);el('feGaussianBlur',{stdDeviation:2},blur2);
const redB=el('circle',{r:CFG.redBall.r,fill:'url(#gr)'});
const whiteB=el('circle',{r:CFG.whiteBall.r,fill:'url(#gw)',filter:'url(#bl)'});
const goldB=el('circle',{r:CFG.goldBall.r,fill:'url(#gg)'});
const ring=el('ellipse',{rx:CFG.ring.rx,ry:CFG.ring.ry,fill:'none',stroke:CFG.gold,'stroke-width':2.2});
const dot=el('circle',{r:CFG.dot.r,fill:'#f0566a',filter:'url(#bl2)'});
const tg=el('g',{});
const t1=el('text',{x:0,y:12,'font-size':43,'font-weight':900,fill:CFG.redDark},tg);
const t2=el('text',{x:0,y:12,'font-size':43,'font-weight':900,fill:CFG.red,stroke:CFG.red,'stroke-width':1,'stroke-linejoin':'round'},tg);
[t1,t2].forEach(t=>t.textContent=CFG.title);
t1.setAttribute('transform','translate(0 4)');
const cube=document.getElementById('cube');
/* 所有物件都從畫面下方外面飛上來，漸緩到定位（不再用縮放出現）。fly(p)=0→1，BOT 為起點 y（畫面下緣之外） */
const BOT=160,fly=p=>1-Math.pow(1-p,3.4);
function render(F){
  const R=F+CFG.SH,C=CFG;
  const bob=(p,a)=>a*Math.sin((R-80)/45*Math.PI*2+p);
  // 紅球：從下方飛上來
  const rp=fly(seg(R,80,92));
  redB.setAttribute('transform','translate('+C.redBall.x+' '+(C.redBall.y+bob(0,3)+(BOT-C.redBall.y)*(1-rp))+')');
  // 白球
  const wp=fly(seg(R,82,95));
  whiteB.setAttribute('transform','translate('+C.whiteBall.x+' '+(C.whiteBall.y+bob(1.5,2.5)+(BOT-C.whiteBall.y)*(1-wp))+')');
  // 金球
  const gp=fly(seg(R,85,97));
  goldB.setAttribute('transform','translate('+C.goldBall.x+' '+(C.goldBall.y+bob(3,2)+(BOT-C.goldBall.y)*(1-gp))+')');
  // 金環：從下方飛上來，長軸邊飛邊轉向直立
  const ngp=fly(seg(R,87,100)),ra=-5-1.6*Math.max(0,R-88);   // 金環持續旋轉（不停下）
  ring.setAttribute('transform','translate('+C.ring.x+' '+(C.ring.y+bob(2,2)+(BOT+30-C.ring.y)*(1-ngp))+') rotate('+ra+')');
  ring.setAttribute('opacity',1);
  // 小紅點
  const dp=fly(seg(R,96,106));
  dot.setAttribute('transform','translate('+C.dot.x+' '+(C.dot.y+bob(.5,2)+(BOT-C.dot.y)*(1-dp))+')');
  // 標題：在中間縮放出現（不旋轉、不歪），接著順暢地慢慢往上移到定位
  const sp=seg(R,CFG.titleIn[0],CFG.titleIn[1]+4),ms=1-Math.pow(1-sp,3),mv=1-Math.pow(1-seg(R,CFG.titleIn[0],CFG.titleIn[1]+34),3);
  tg.setAttribute('transform','translate('+C.titleCenter[0]+' '+(C.titleCenter[1]+14*(1-mv))+') scale('+Math.max(.001,ms)+')');
  // 方塊：從下方飛上來並轉動
  const cp=fly(seg(R,85,98)),k=seg(R,88,106);
  cube.style.transform='translate('+(C.cube.x-49)+'px,'+((C.cube.y-97)+bob(2.5,2.5)+(BOT+30-C.cube.y)*(1-cp))+'px) rotateX('+(-24*(1-k)-4*Math.sin((R-100)/20))+'deg) rotateY('+(38*(1-k)+1.5*Math.max(0,R-100))+'deg) rotateZ('+(-4-10*seg(R,106,120)-.25*Math.max(0,R-120))+'deg)';
  cube.style.opacity=1;
}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load('900 43px "Noto Sans TC"',CFG.title).then(start,start);
</script></body></html>
