<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>OP02 衝擊波</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#16171e}
canvas{position:absolute;left:0;top:0;width:322px;height:127px}
</style></head><body><div id="card"><canvas id="c" width="644" height="254"></canvas></div>
<script>
/* ===== CFG ===== */
const CFG={
  word:'開幕',
  font:'900 78px "Noto Sans TC"',
  cx:161, cy:62,
  bg:'#16171e', red:'#ff4757', redDark:'#9c2432', white:'#f4f4f6', ring:'#c9cad2',
  // 文字 縮放(x,y,模糊px)：幀→值（量自參考的壓扁→拉長→回穩）
  tx:[[0,0,0,0],[2,1.2,.25,4],[3,1.15,.3,3],[6,.4,1.3,3],[9,1.12,1.1,2],[12,1.04,1,1],[15,1,1,0]],
  rings:[ // 起始幀、最大rx、ry比例、顏色(r紅/g灰)、持續幀
    {a:0,R:150,k:.55,c:'r',d:14},{a:3,R:200,k:.45,c:'g',d:16},{a:6,R:150,k:.5,c:'r',d:15},{a:9,R:190,k:.4,c:'g',d:16}],
  underlineF:9,
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const g=document.getElementById('c').getContext('2d');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a)),eo=x=>1-Math.pow(1-x,3);
function keys(T,F){if(F<=T[0][0])return T[0].slice(1);for(let i=1;i<T.length;i++)if(F<=T[i][0]){const a=T[i-1],b=T[i],t=(F-a[0])/(b[0]-a[0]);return a.slice(1).map((v,j)=>v+(b[j+1]-v)*t)}return T[T.length-1].slice(1)}
function render(F){
  g.setTransform(2,0,0,2,0,0);g.filter='none';
  g.fillStyle=CFG.bg;g.fillRect(0,0,322,127);
  const {cx,cy}=CFG;
  /* 放射線 */
  const rp=seg(F,0,12);
  if(rp>0&&F<16){
    g.strokeStyle='rgba(205,206,214,'+(.55*(1-seg(F,8,16)))+')';g.lineWidth=.8;
    for(let i=0;i<28;i++){const a=i/28*Math.PI*2+.1,r1=30+eo(rp)*90,r2=r1+40+eo(rp)*80;
      g.beginPath();g.moveTo(cx+Math.cos(a)*r1*1.3,cy+Math.sin(a)*r1*.6);g.lineTo(cx+Math.cos(a)*r2*1.3,cy+Math.sin(a)*r2*.6);g.stroke()}
  }
  /* 衝擊環 */
  CFG.rings.forEach(r=>{
    const t=(F-r.a)/r.d;if(t<0||t>1)return;
    const rr=eo(t)*r.R+4;
    g.strokeStyle=r.c=='r'?CFG.red:CFG.ring;g.globalAlpha=1-Math.pow(t,2.2);g.lineWidth=5-3.5*t;
    g.beginPath();g.ellipse(cx,cy,rr,rr*r.k,0,0,7);g.stroke();g.globalAlpha=1;
  });
  /* 文字 */
  const [sx,sy,bl]=keys(CFG.tx,F);
  if(sx>0.01){
    g.save();g.translate(cx,cy);g.scale(sx,sy);if(bl>0)g.filter='blur('+bl+'px)';
    g.font=CFG.font;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    g.fillStyle=CFG.redDark;g.fillText(CFG.word,3,3);
    g.fillStyle=CFG.white;g.fillText(CFG.word,-2,-2);
    g.fillStyle=CFG.red;g.strokeStyle=CFG.red;g.lineWidth=1.2;g.strokeText(CFG.word,0,0);g.fillText(CFG.word,0,0);
    g.restore();g.filter='none';
  }
  /* 底線 */
  const u=eo(seg(F,CFG.underlineF,CFG.underlineF+6));
  if(u>0){g.fillStyle=CFG.red;g.fillRect(cx-36*u,116,72*u,2.5)}
}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load(CFG.font,CFG.word).then(start,start);
</script></body></html>
