<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>OP32 スパイラルリビール</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#16171e}
svg{position:absolute;left:0;top:0}
text{font-family:'Noto Sans TC',sans-serif;text-anchor:middle}
</style></head><body><div id="card"><svg id="s" width="322" height="127" viewBox="0 0 322 127"></svg></div>
<script>
/* ===== CFG ===== */
const CFG={
  title:'旋渦的彼端',fs:40,pitch:54,         // 5 個字，字級與最終字距
  cx:161,cy:65,flat:.43,a:7.2,turns:6.4,     // 螺旋中心、壓扁比、半徑係數（r=a·φ）、圈數（π 的倍數）
  red:'#f04a5f',white:'#f4f2ee',
  // 主相位 φ（單位 π）隨參考幀；每個字依序多 0.4π 並沿螺旋內縮
  phi:[],                                     // 改用連續平滑曲線（見 PHI），不再逐段折線
  a0:-149,                                    // 角度偏移（度）
  line:[112,138],                             // 聚攏後慢慢展開排成一行（拉長、漸緩）
  ul:[126,144],ulW:78,ulY:108,
  spin:-.045,                               // 螺旋持續旋轉（弧度／幀），文字隨螺旋一起轉
  spiralFade:[116,142],
  SH:80,                                      // render(0) 對應參考第 80 幀
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const NS='http://www.w3.org/2000/svg',S=document.getElementById('s');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||S).appendChild(e);return e}
const defs=el('defs',{});const bf=el('filter',{id:'b',x:'-50%',y:'-50%',width:'200%',height:'200%'},defs);el('feGaussianBlur',{stdDeviation:2.2},bf);
const sp=el('path',{d:'',fill:'none',stroke:CFG.red,'stroke-width':1.2,'stroke-linecap':'round'});
const chars=[...CFG.title];
const ghosts=el('g',{filter:'url(#b)'});
const GH=[[2,.3],[4,.2],[6,.1]].map(([lag,op])=>({lag,op,t:chars.map(c=>{const e=el('text',{x:0,y:0,'font-size':CFG.fs,'font-weight':900,fill:CFG.red,opacity:0},ghosts);e.textContent=c;return e})}));
const T=chars.map(c=>{const e=el('text',{x:0,y:0,'font-size':CFG.fs,'font-weight':900,fill:CFG.white});e.textContent=c;return e});
const ul=el('rect',{x:0,y:CFG.ulY,width:0,height:2.5,fill:CFG.red});
/* 文字沿螺旋內縮：緩進緩出的連續曲線（smootherstep），不會在最後突然加速 */
function PHI(R){const u=seg(R,80,116),e=u*u*u*(u*(u*6-15)+10);return 7.4*(1-e)}
function pos(i,R){
  const C=CFG,phi=(PHI(R)+.4*i)*Math.PI,r=C.a*Math.max(0,phi),ang=phi+C.a0*Math.PI/180+C.spin*(R-80);
  return [C.cx+r*Math.cos(ang),C.cy+r*C.flat*Math.sin(ang)]}
function spiral(sc,R){
  const C=CFG,pts=[];for(let p=0;p<=C.turns*Math.PI+1e-6;p+=.18){const r=C.a*p*sc,ang=p+C.a0*Math.PI/180+C.spin*(R-80);pts.push((C.cx+r*Math.cos(ang)).toFixed(1)+' '+(C.cy+r*C.flat*Math.sin(ang)).toFixed(1))}
  return 'M'+pts.join('L')}
function render(F){
  const R=F+CFG.SH,C=CFG;
  const so=1-seg(R,C.spiralFade[0],C.spiralFade[1]),sc=1-.25*(()=>{const u=seg(R,96,124);return u*u*(3-2*u)})();
  sp.setAttribute('d',spiral(sc,R));sp.setAttribute('opacity',.85*so);
  const k=1-Math.pow(1-seg(R,C.line[0],C.line[1]),2.6);   // 展開：拉長 24 幀、更緩的緩出
  const place=(e,p,i,op)=>{
    const fx=C.cx+(i-(chars.length-1)/2)*C.pitch,fy=C.cy+C.fs*.34-2;
    e.setAttribute('x',p[0]+(fx-p[0])*k);e.setAttribute('y',p[1]+C.fs*.34+(fy-(p[1]+C.fs*.34))*k);
    if(op!==undefined)e.setAttribute('opacity',op)};
  T.forEach((e,i)=>place(e,pos(i,R),i));
  GH.forEach(g=>g.t.forEach((e,i)=>place(e,pos(i,R-g.lag),i,g.op*(1-k)*(R>82?1:0))));
  const u=eo(seg(R,C.ul[0],C.ul[1]));ul.setAttribute('width',C.ulW*u);ul.setAttribute('x',C.cx-C.ulW*u/2);
}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load('900 40px "Noto Sans TC"',CFG.title).then(start,start);
</script></body></html>
