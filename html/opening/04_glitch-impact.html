<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>OP04 故障衝擊</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#16171e}
canvas{position:absolute;left:0;top:0;width:322px;height:127px}
</style></head><body><div id="card"><canvas id="c" width="644" height="254"></canvas></div>
<script>
/* ===== CFG ===== */
const CFG={
  word:'覺醒', sub:'AWAKENING',
  font:'900 76px "Noto Sans TC"',
  cx:160, cy:62,
  bg:'#16171e', cream:'#f1ece8', red:'#ff4757', cyan:'#2fe3d2', redGhost:'#ff3b52', barGray:'#b8bac2',
  amp:[[0,14],[6,13],[9,7],[15,4],[21,1.5],[27,0]],  // 切片位移幅度（幀→px）
  split:[[0,6],[9,4],[18,2],[27,0]],                  // 紅青分色位移
  barUntil:16,                                        // 隨機色條存在到第幾幀
  scanF:[21,24],                                      // 白色橫掃線
  subLock:[1,2,4,7,9,11,14,16,17],                    // 副標各字鎖定的幀（量自參考）
  subSize:11, subPitch:18.9, subX0:84.3, subY:114,    // 副標字級、字距、第一字中心 x、基線 y（整組水平置中）
  strip:5,
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const g=document.getElementById('c').getContext('2d');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
function key(T,F){if(F<=T[0][0])return T[0][1];for(let i=1;i<T.length;i++)if(F<=T[i][0]){const a=T[i-1],b=T[i];return a[1]+(b[1]-a[1])*(F-a[0])/(b[0]-a[0])}return T[T.length-1][1]}
function h(a,b){let x=Math.imul(a*374761393+b*668265263,1274126177);x^=x>>>13;x=Math.imul(x,1103515245);return((x^x>>>16)>>>0)/4294967296}
let offM,offR,offC;
function mk(col){const c=document.createElement('canvas');c.width=322;c.height=127;const o=c.getContext('2d');
  o.font=CFG.font;o.textAlign='center';o.textBaseline='middle';o.lineJoin='round';o.fillStyle=col;o.strokeStyle=col;o.lineWidth=1.5;
  o.strokeText(CFG.word,CFG.cx,CFG.cy);o.fillText(CFG.word,CFG.cx,CFG.cy);
  /* 文字上的細橫紋 */
  o.globalCompositeOperation='destination-out';o.fillStyle='rgba(0,0,0,.07)';for(let y=0;y<127;y+=3)o.fillRect(0,y,322,1);
  return c}
function render(F){
  g.setTransform(2,0,0,2,0,0);
  g.fillStyle=CFG.bg;g.fillRect(0,0,322,127);
  const fi=Math.floor(F),amp=key(CFG.amp,F),sp=key(CFG.split,F),S=CFG.strip;
  for(let y=0;y<127;y+=S){
    const r=h(y,fi),on=amp>0.8?(r<.55?1:0):0;
    const dx=on?(h(y+9,fi)-.5)*2*amp:0;
    if(sp>.3){
      g.globalAlpha=.85;g.drawImage(offR,0,y,322,S,dx+sp,y,322,S);
      g.drawImage(offC,0,y,322,S,dx-sp,y,322,S);g.globalAlpha=1;
    }
    g.drawImage(offM,0,y,322,S,dx,y,322,S);
  }
  /* 隨機色條 */
  if(F<CFG.barUntil){
    for(let i=0;i<4;i++){const r=h(i+40,fi);if(r<.35)continue;
      g.fillStyle=h(i+70,fi)<.35?CFG.red:CFG.barGray;
      g.fillRect(h(i+1,fi)*300-10,18+h(i+2,fi)*80,16+h(i+3,fi)*50,2.5+h(i+4,fi)*3)}
  }
  /* 白色橫掃線 */
  if(F>=CFG.scanF[0]&&F<CFG.scanF[1]+3){
    const a=F<CFG.scanF[1]?.95:.35;g.fillStyle='rgba(245,245,250,'+a+')';g.fillRect(0,56+(F-CFG.scanF[0])*.5,322,3.5);
  }
  /* 副標：亂字＋打字機（長度由 3 字長到全長，前方逐字鎖定，尾端 3–4 字每幀亂跳；量自參考） */
  g.font='500 '+CFG.subSize+'px "Roboto Mono"';g.textBaseline='alphabetic';g.textAlign='center';
  const L=CFG.sub.length,ch='ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#@';
  const len=Math.min(L,3+Math.ceil(F/2));
  for(let i=0;i<len;i++){
    const locked=F>=CFG.subLock[i];
    g.globalAlpha=locked?1:.6;g.fillStyle=CFG.red;
    g.fillText(locked?CFG.sub[i]:ch[Math.floor(h(i+7,fi)*ch.length)],CFG.subX0+i*CFG.subPitch,CFG.subY);
  }
  g.globalAlpha=1;
}
function start(){offM=mk(CFG.cream);offR=mk(CFG.redGhost);offC=mk(CFG.cyan);
  const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
Promise.all([document.fonts.load(CFG.font,CFG.word),document.fonts.load('500 11px "Roboto Mono"','AWAKENING#@0123456789')]).then(start,start);
</script></body></html>
