<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>OP38 全像顯現</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Roboto+Mono:wght@500;700&family=Anton&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#16171e}
canvas{display:block;width:322px;height:127px}
</style></head><body><div id="card"><canvas id="cv"></canvas></div>
<script>
/* ===== CFG ===== */
const CFG={
  text:'立體影像', label:'HOLOGRAM',
  teal:'#7fe3d2', glow:'#4fd1be', grey:'#8b8f99', bg:'#16171e',
  baseY:101, textY:42,
  R0:80, LOOP:120
};
const FONTS=[['900 42px "Noto Sans TC"','立體影像'],['500 6px "Roboto Mono"','HOLOGRAM']];
/* ================ */

const q=new URLSearchParams(location.search);const Z=+q.get('z')||1;
const card=document.getElementById('card');if(Z!=1)card.style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const tab=(r,T)=>{if(r<=T[0][0])return T[0][1];for(let i=1;i<T.length;i++)if(r<=T[i][0]){const a=T[i-1],b=T[i];return lerp(a[1],b[1],(r-a[0])/(b[0]-a[0]))}return T[T.length-1][1]};
const R=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const W=322,H=127,D=2*Z;
const cv=document.getElementById('cv');cv.width=W*D;cv.height=H*D;const c=cv.getContext('2d');
function off(){const o=document.createElement('canvas');o.width=W*D;o.height=H*D;const x=o.getContext('2d');x.setTransform(D,0,0,D,0,0);return[o,x]}
function render(F){c.setTransform(D,0,0,D,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.filter='none';c.shadowBlur=0;c.letterSpacing='0px';c.setLineDash([]);
  c.clearRect(0,0,W,H);c.fillStyle=CFG.bg;c.fillRect(0,0,W,H);draw(c,F+CFG.R0,F)}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
Promise.all(FONTS.map(f=>document.fonts.load(f[0],f[1]))).then(start,start);


const TX=off();
function draw(c,r){
  const cx=161,by=CFG.baseY;
  const rs=.3+.7*eo(seg(r,80,87));
  // 光束
  const b=eo(seg(r,84,96));
  if(b>0){
    const top=by-b*64,tw=lerp(30,118,b);
    const g=c.createLinearGradient(0,by,0,top);g.addColorStop(0,'rgba(79,209,190,.5)');g.addColorStop(1,'rgba(79,209,190,.06)');
    c.fillStyle=g;c.beginPath();c.moveTo(cx-18,by-1);c.lineTo(cx+18,by-1);c.lineTo(cx+tw/2,top);c.lineTo(cx-tw/2,top);c.closePath();c.fill();
    // 光中浮游的粒子（向上飄、左右微擺、閃爍；整數圈無縫循環）
    c.save();c.beginPath();c.moveTo(cx-18,by-1);c.lineTo(cx+18,by-1);c.lineTo(cx+tw/2,top);c.lineTo(cx-tw/2,top);c.closePath();c.clip();
    const Fr=r-80,H2=64;
    for(let i=0;i<110;i++){
      const m=1+(i%2),ph=R(i*2.3),u=((ph+Fr*m/120)%1),y=by-u*H2,hw=lerp(18,59,u)*.9,sw=Math.sin(6.2832*(Fr*(1+i%3)/120+R(i*5.1)))*3;
      const x=cx+(R(i*7.7)*2-1)*hw+sw,tw2=.5+.5*Math.sin(6.2832*(Fr*(2+i%4)/120+R(i*9.1))),fd=Math.min(1,u*5)*Math.min(1,(1-u)*4);
      c.globalAlpha=b*fd*(.2+.5*tw2);c.fillStyle=i%5==0?'#ffffff':'#bff3ea';const sz=.22+R(i*3.3)*.28;c.beginPath();c.arc(x,y,sz,0,6.2832);c.fill();
    }
    c.restore();c.globalAlpha=1;
  }
  // 底環
  c.strokeStyle='#8fe3d6';c.lineWidth=.9;
  [[44,11,.9,2,0],[31,7.5,.8,3,.37],[17,4,.9,1,.71]].forEach(([rx,ry,a,m,ph])=>{const br=1+.07*Math.sin(6.2832*((r-80)*m/120+ph))*seg(r,88,96);c.globalAlpha=a*(.85+.15*Math.sin(6.2832*((r-80)*m/120+ph)));c.beginPath();c.ellipse(cx,by,rx*rs*br,ry*rs*br,0,0,6.2832);c.stroke()});
  c.globalAlpha=1;
  c.fillStyle=CFG.grey;c.font='500 6px "Roboto Mono"';c.textAlign='center';c.letterSpacing='4px';c.textBaseline='alphabetic';c.fillText(CFG.label,cx+2,121);c.letterSpacing='0px';
  // 文字
  let ta=seg(r,100,116);
  if(r<112)ta*=(R(r*3.7)>.18?1:.55);
  if(ta>0){
    const [o,x]=TX;x.setTransform(D,0,0,D,0,0);x.globalCompositeOperation='source-over';x.clearRect(0,0,W,H);x.shadowBlur=0;
    x.font='900 42px "Noto Sans TC"';x.textAlign='center';x.textBaseline='middle';
    x.fillStyle=CFG.teal;x.fillText(CFG.text,cx,CFG.textY);
    // 光暈與字底：不帶條紋，只有字形內部有螢幕滾動
    c.save();c.globalAlpha=ta*.4;c.font=x.font;c.textAlign='center';c.textBaseline='middle';c.shadowColor=CFG.glow;c.shadowBlur=12*D;c.fillStyle=CFG.teal;c.fillText(CFG.text,cx,CFG.textY);c.restore();
    const Fr=r-80;
    // 螢幕條紋：細橫紋往下滾動，另有一條亮帶緩緩掃過
    x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.55)';
    for(let y=-1.5+((Fr*.75)%1.5);y<H;y+=1.5)x.fillRect(0,y,W,.6);
    x.globalCompositeOperation='source-atop';
    const by2=((Fr*1.5)%60)+8,gg=x.createLinearGradient(0,by2-9,0,by2+9);gg.addColorStop(0,'rgba(255,255,255,0)');gg.addColorStop(.5,'rgba(235,255,250,.75)');gg.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=gg;x.fillRect(0,by2-9,W,18);x.globalCompositeOperation='source-over';
    c.save();c.globalAlpha=ta;c.setTransform(1,0,0,1,0,0);c.drawImage(o,0,0);c.restore();
  }
  // 掃描線
  const sp=seg(r,98,122),sa=1-seg(r,118,124);
  if(sp>0&&sa>0){const y=34+sp*42;c.globalAlpha=.7*sa;c.strokeStyle='#bff3ea';c.lineWidth=1;c.beginPath();c.moveTo(cx-67,y);c.lineTo(cx+67,y);c.stroke();c.globalAlpha=1}
}
</script></body></html>
