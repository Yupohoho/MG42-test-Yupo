<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>OP21 連續蓋章</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#f6efe8}
#card::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(60,40,30,.07) 1px,transparent 1.3px) 0 0/8px 8px}
svg{position:absolute;left:0;top:0}
text{font-family:'Noto Sans TC',sans-serif;font-weight:900;text-anchor:middle}
</style></head><body><div id="card"><svg id="s" width="322" height="127" viewBox="0 0 322 127"></svg></div>
<script>
/* ===== CFG ===== */
const CFG={
  stamps:[                                   // 中心、旋轉、字、大小(w,h)、實心與否、字級、入場幀（落地前一幀為殘影）
    {x:80.5,y:42.5,rot:-8, t:'合格',w:106,h:58,solid:0,fs:30,at:2},
    {x:244,  y:39,  rot:5,  t:'滿分',w:104,h:58,solid:0,fs:30,at:14},
    {x:161.5,y:97,  rot:-2, t:'決定',w:172,h:50,solid:1,fs:36,at:26}
  ],
  red:'#ff4954', paper:'#f6efe8',
  LOOP:120
};
/* 量自參考：k=0 起 4 幀由大縮小蓋下（面積比換算），k=-1 為極淡殘影 */
const SC=[[2.9,2.5,1.85,1.07,1],[2.9,2.5,1.85,1.07,1],[3.0,2.9,1.6,1.05,1]];
const AL=[.85,.9,.95,1,1];
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const NS='http://www.w3.org/2000/svg',S=document.getElementById('s');
let W=null;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||W).appendChild(e);return e}
W=document.createElementNS(NS,'g');S.appendChild(W);   // 整個畫面的根群組（落地時整個震動）
function mk(st,asGhost){
  const g=el('g',{});
  if(st.solid){
    el('rect',{x:-st.w/2,y:-st.h/2,width:st.w,height:st.h,rx:5,fill:CFG.red},g);
    el('rect',{x:-st.w/2+4,y:-st.h/2+4,width:st.w-8,height:st.h-8,rx:3,fill:'none',stroke:CFG.paper,'stroke-width':1.2,opacity:.55},g);
    const t=el('text',{x:0,y:st.fs*.36,'font-size':st.fs,fill:CFG.paper},g);t.textContent=st.t;
  }else{
    el('rect',{x:-st.w/2+2.5,y:-st.h/2+2.5,width:st.w-5,height:st.h-5,rx:6,fill:'none',stroke:CFG.red,'stroke-width':5},g);
    const t=el('text',{x:0,y:st.fs*.36,'font-size':st.fs,fill:CFG.red},g);t.textContent=st.t;
  }
  return g;
}
const G=CFG.stamps.map(st=>({ghost:mk(st),main:mk(st),
  /* 落地擴散波：沿著印章外框形狀（同旋轉、同圓角）往外擴 */
  wave:[0,1].map(()=>el('rect',{x:-st.w/2,y:-st.h/2,width:st.w,height:st.h,rx:st.solid?5:6,fill:'none',stroke:CFG.red}))}));
function render(F){
  F=Math.floor(F);
  /* 落地瞬間（k=3）整個畫面短促震動，快速衰減；最後那顆大章震得最大 */
  let sx=0,sy=0;CFG.stamps.forEach((st,i)=>{const kk=F-st.at-3;if(kk>=0&&kk<8){const a=(i==2?4.2:3.2)*Math.pow(1-kk/8,1.5);sx+=a*Math.sin(kk*2.6+i);sy+=a*.75*Math.cos(kk*3.1+i*2)}});
  W.setAttribute('transform',`translate(${sx.toFixed(2)} ${sy.toFixed(2)})`);
  CFG.stamps.forEach((st,i)=>{
    const k=F-st.at, m=G[i].main, gh=G[i].ghost;
    let sc=1,al=1,vis=k>=-1;
    if(k==-1){sc=3.3;al=.14}
    else if(k<5){sc=SC[i][k]??1;al=AL[k]}
    m.setAttribute('opacity',vis?al:0);
    m.setAttribute('transform',`translate(${st.x} ${st.y}) rotate(${st.rot}) scale(${sc})`);
    // 殘影：落地後以淡色偏移描邊，閃爍後淡出
    const kk=k-3;
    let ga=0;
    if(kk>=0&&kk<12)ga=.38*(1-kk/12)*(kk%2?.75:1);
    gh.setAttribute('opacity',ga);
    G[i].wave.forEach((w,j)=>{const t=(k-3-j*2)/9;
      if(t<0||t>=1){w.setAttribute('opacity',0);return}
      const e=1-Math.pow(1-t,3);w.setAttribute('opacity',(.6*(1-t)).toFixed(3));w.setAttribute('stroke-width',(3.2*(1-t)+.6).toFixed(2));
      w.setAttribute('transform',`translate(${st.x} ${st.y}) rotate(${st.rot}) scale(${(1+.32*e).toFixed(3)})`)});
    gh.setAttribute('transform',`translate(${st.x+4*Math.cos(kk*1.3)} ${st.y+3*Math.sin(kk*1.1)-1}) rotate(${st.rot+3*Math.sin(kk)}) scale(1.02)`);
  });
}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load('900 36px "Noto Sans TC"','合格滿分決定').then(start,start);
</script></body></html>
