<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>OP17 彈跳落地</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#ff4954}
svg{position:absolute;left:0;top:0}
text{font-family:'Noto Sans TC',sans-serif;font-weight:900;text-anchor:middle}
</style></head><body><div id="card"><svg id="s" width="322" height="127" viewBox="0 0 322 127"></svg></div>
<script>
/* ===== CFG ===== */
const CFG={
  words:['碰','咚','！'],        // 三個落下的字（第一個米白、第二個黑、第三個米白）
  cx:[93,163,231],               // 各字中心 x
  size:[68,56,70],               // 字級
  base:[99,97,99],               // 停穩時字底 y
  rot:[0,-9,0],                  // 停穩時旋轉角
  fill:['#f6efe8','#0b0c11','#f6efe8'],
  bg:'#ff4954', shadow:'#dc3e45', spark:'#f3c85c',
  start:[3,9,15],                // 各字進場幀（量自參考：字底剛進入畫面）
  stars:[[46,28,0],[296,40,5],[268,101,9],[190,16,13]], // x,y,相位
  LOOP:120
};
/* 字底 y 的逐幀值（量自參考，k=0 為字底剛露出的前一幀；落地後有小彈跳再緩緩落回） */
const FALL=[11,28,49,72,99];                                  // 下落 5 幀（字底 y）
const SETTLE=[[92,86,83,83,84,85,88,91,93,96,98,97,96,95,95,95,96,96,97,97,98,98,99],   // 碰，落地後逐幀
              [91,85,83,83,83,85,88,91,93,97,99,97,95,95,95,95,95,95,96,96,97,97],       // 咚
              [93,87,85,84,85,85,87,89,92,95,100,99,97,97,97,98,99]];                    // ！
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const NS='http://www.w3.org/2000/svg',S=document.getElementById('s');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||S).appendChild(e);return e}
const sh=CFG.cx.map(x=>el('ellipse',{cx:x,cy:115,rx:5,ry:3.6,fill:CFG.shadow}));
const T=CFG.words.map((w,i)=>{const g=el('g',{});const t=el('text',{x:0,y:0,'font-size':CFG.size[i],fill:CFG.fill[i]},g);t.textContent=w;return g});
const stars=CFG.stars.map(s=>el('path',{d:'M0 -1L.4 -.4L1 0L.4 .4L0 1L-.4 .4L-1 0L-.4 -.4Z',fill:CFG.spark}));
/* 字底 y：下落 → 落地彈跳 */
function bottomY(i,k){ // k = 該字進場後的幀（0 起算，字底 11 的那幀 = 0）
  if(k<0)return -80+ (k+4)*12;
  if(k<5)return FALL[k];
  const a=SETTLE[i],j=k-5;return j<a.length?a[j]:a[a.length-1];
}
function render(F){
  for(let i=0;i<3;i++){
    const k=Math.floor(F)-CFG.start[i];
    const b=bottomY(i,k), land=CFG.base[i];
    const vis=k>=0;
    const rest=CFG.base[i];
    /* 彈性：下落拉長 → 落地擠扁 → 彈起拉長 → 回彈 → 二次落地小擠壓（支點在字底，體積大致守恆） */
    let sx=1,sy=1;
    /* 連續阻尼彈簧：下落漸漸拉長；落地瞬間擠扁，之後以衰減的上下起伏回到 100%（支點在字底） */
    const spring=(t,A)=>1-A*Math.exp(-.3*t)*Math.cos(.85*t);
    if(k>=0&&k<4){sy=1+.03*(k+1)}
    else if(k>=4&&k<15){sy=spring(k-4,.2)}
    else if(k>=15){sy=spring(k-15,.08)}
    sx=1/Math.pow(sy,.7);
    const dy=b-rest;
    T[i].setAttribute('transform',`translate(${CFG.cx[i]} ${rest+dy-CFG.size[i]*.07}) rotate(${CFG.rot[i]}) scale(${sx} ${sy})`);
    T[i].setAttribute('opacity',vis?1:0);
    const h=Math.max(0,rest-b);                    // 離地高度（弱化：愈近愈大）
    const near=cl(1-h/110);
    const hw=(i<2&&F<3?4:5)+20*near*(i==2&&k<-2?.2:1);
    const sa=cl((F+1)/2);
    sh[i].setAttribute('rx',(F<0?0:hw*(1+Math.max(0,.3*(k==4?1:0)))).toFixed(2));
    sh[i].setAttribute('opacity',i==0?1:cl((F-[0,5,11][i]+1)/2));
    if(i>0)sh[i].setAttribute('rx',(F<[0,5,11][i]?0:hw));
  }
  stars.forEach((s,i)=>{
    const t=F-(CFG.start[2]+9)-CFG.stars[i][2]*.8;      // 最後一字落穩後陸續閃現
    const env=t<0?0:t<8?(t/8):1-.22*cl((t-8)/12);
    const tw=1+.16*Math.sin(F*.45+CFG.stars[i][2]);
    const r=5.6*env*tw;
    s.setAttribute('transform',`translate(${CFG.stars[i][0]} ${CFG.stars[i][1]}) scale(${r.toFixed(2)}) rotate(${(F*2).toFixed(1)})`);
  });
}
function start(){const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
document.fonts.load('900 60px "Noto Sans TC"','碰咚！').then(start,start);
</script></body></html>
