<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OP10 line-draw-open</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;900&family=Noto+Serif+JP:wght@600;900&family=Montserrat:wght@800&family=Playfair+Display:wght@400&family=Roboto+Mono:wght@500&display=swap">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#16171e}

</style></head><body><div id="wrap"><div id="card"></div></div>
<script>
const q=new URLSearchParams(location.search),Z=+q.get('z')||1;
document.getElementById('wrap').style.zoom=Z;if(q.get('m')==='1')document.body.className='m';
const card=document.getElementById('card');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),pr=(f,a,b)=>cl((f-a)/(b-a));
const eo=p=>1-Math.pow(1-p,3),eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,lerp=(a,b,p)=>a+(b-a)*p;
function kf(f,a){if(f<=a[0][0])return a[0][1];for(let i=1;i<a.length;i++){if(f<=a[i][0]){const p=(f-a[i-1][0])/(a[i][0]-a[i-1][0]);return lerp(a[i-1][1],a[i][1],p)}}return a[a.length-1][1]}
function el(css,txt,parent){const e=document.createElement('div');e.style.cssText='position:absolute;'+css;if(txt!=null)e.textContent=txt;(parent||card).appendChild(e);return e}
function fit(e,target,cx){e.style.letterSpacing='0px';const w0=e.offsetWidth,n=[...e.textContent].length;const ls=(target-w0)/(n-1);e.style.letterSpacing=ls+'px';e.style.left=(cx-target/2)+'px';return w0}

const CFG={text:'ATELIER',sub:'COLLECTION  2026'};
const LOOP=120,FPS=30;
const FONTS=['400 35px "Playfair Display"','500 8px "Roboto Mono"'],SAMPLE=CFG.text+CFG.sub;
let ml,rc,tx,sb,dots=[],LS=[];
function init(){
 card.style.background='#16171e';
 const ns='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(ns,'svg');svg.setAttribute('width',322);svg.setAttribute('height',127);svg.style.cssText='position:absolute;left:0;top:0';
 ml=document.createElementNS(ns,'line');ml.setAttribute('x1',0);ml.setAttribute('x2',322);ml.setAttribute('y1',64);ml.setAttribute('y2',64);ml.setAttribute('stroke','#b9bcc4');ml.setAttribute('stroke-width',1);
 rc=document.createElementNS(ns,'path');rc.setAttribute('d','M40.5 24.5H281.5V104.5H40.5Z');rc.setAttribute('fill','none');rc.setAttribute('stroke','#c8cad2');rc.setAttribute('stroke-width',1.5);
 svg.appendChild(ml);svg.appendChild(rc);card.appendChild(svg);
 tx=el('top:39px;font:400 35px/36px "Playfair Display",serif;color:#f1efe9;white-space:nowrap;',CFG.text);
 /* 大字逐字拆開：聚攏時外側的字從左下、右下往中間靠攏並上升 */
 LS=[...CFG.text].map(c=>{const e=document.createElement('span');e.style.cssText='display:inline-block';e.textContent=c;return e});tx.textContent='';LS.forEach(e=>tx.appendChild(e));fit(tx,193,161);
 sb=el('top:79px;font:500 8px/10px "Roboto Mono",monospace;color:#9a9ba5;white-space:nowrap;',CFG.sub);fit(sb,93,161);
 [[40.5,24.5],[281.5,24.5],[281.5,104.5],[40.5,104.5]].forEach(p=>dots.push(el('left:'+(p[0]-3)+'px;top:'+(p[1]-3)+'px;width:6px;height:6px;background:#ff4757;')));
}
function render(f){
 /* 1. 中心橫線由中間往左右展開（量自參考，每幀的線長 px） */
 const w=kf(f,[[0,2],[1,8],[2,18],[3,48],[4,93],[5,160],[6,225],[7,270],[8,322]]);
 ml.setAttribute('x1',161-w/2);ml.setAttribute('x2',161+w/2);
 /* 2. 矩形框從左上角順時針畫出（原本的逐幀線長，往後移 10 幀），橫線同時淡出 */
 ml.setAttribute('opacity',1-eio(pr(f,20,24)));
 const g=f-10,len=kf(g,[[1,0],[2,15],[4,74],[6,186],[8,368],[10,519],[12,642]]);rc.setAttribute('stroke-dasharray',len+' 1000');rc.setAttribute('opacity',g<1?0:1);
 /* 3. 大字淡入，小字在大字進行到一半時順接淡入（不等大字停穩） */
 const p=eo(pr(f,24,36));tx.style.opacity=p;{const n=LS.length;LS.forEach((e,i)=>{const u=(i-(n-1)/2)/((n-1)/2),k=Math.pow(1-pr(f,24,50),4);e.style.transform='translate('+(u*16*k)+'px,'+(6*(.8+.2*Math.abs(u))*k)+'px)'})}tx.style.color='rgb('+Math.round(lerp(90,241,p))+','+Math.round(lerp(91,239,p))+','+Math.round(lerp(98,233,p))+')';
 dots.forEach(d=>{const s=eo(pr(f,28,31));d.style.transform='scale('+s+')'});
 sb.style.opacity=eo(pr(f,29,41));
}
function start(){init();const tp=q.get('t');if(tp!==null){render(Math.round(+tp*FPS+1e-6)%LOOP);return}
const t0=performance.now();let last=-1;(function tick(){const f=Math.floor((performance.now()-t0)/1000*FPS)%LOOP;if(f!==last){last=f;render(f)}requestAnimationFrame(tick)})()}
Promise.all(FONTS.map(f=>document.fonts.load(f,SAMPLE))).catch(()=>{}).then(start);
</script></body></html>
