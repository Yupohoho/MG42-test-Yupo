<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>OP03 文字爆裂組字</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#16171e}
canvas{position:absolute;left:0;top:0;width:322px;height:127px}
</style></head><body><div id="card"><canvas id="c" width="644" height="254"></canvas></div>
<script>
/* ===== CFG ===== */
const CFG={
  word:'新登場', sub:'NEW ARRIVAL',
  font:'900 72px "Noto Sans TC"',
  cx:160, cy:62,
  bg:'#16171e', cream:'#f2ede8', red:'#ff4757', gray:'#9a9ca6',
  N:170,                 // 碎片數
  fly:[0,16],            // 碎片飛入幀區間
  blockReveal:[9,24],    // 馬賽克塊組字的幀區間
  block:6,               // 塊大小 px
  ringF:21,              // 紅色橢圓環起始幀
  lineF:22, subF:27,
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const g=document.getElementById('c').getContext('2d');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a)),eo=x=>1-Math.pow(1-x,3);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7);
const P=[];let off,blocks=[];
function build(){
  off=document.createElement('canvas');off.width=322;off.height=127;
  const o=off.getContext('2d');o.font=CFG.font;o.textAlign='center';o.textBaseline='middle';o.lineJoin='round';
  o.fillStyle=CFG.cream;o.strokeStyle=CFG.cream;o.lineWidth=1.5;o.strokeText(CFG.word,CFG.cx,CFG.cy);o.fillText(CFG.word,CFG.cx,CFG.cy);
  const d=o.getImageData(0,0,322,127).data,B=CFG.block;
  for(let y=0;y<127;y+=B)for(let x=0;x<322;x+=B){let on=0;for(let j=0;j<B&&!on;j++)for(let i=0;i<B;i++){if(d[((y+j)*322+x+i)*4+3]>40){on=1;break}}
    if(on)blocks.push({x,y,t:CFG.blockReveal[0]+R()*(CFG.blockReveal[1]-CFG.blockReveal[0]),dx:(R()-.5)*14,dy:(R()-.5)*14})}
  for(let i=0;i<CFG.N;i++){
    const side=R();let sx,sy;
    if(side<.5){sx=R()<.5?R()*70:252+R()*70;sy=R()*127}else{sx=R()*322;sy=R()<.5?R()*25:102+R()*25}
    P.push({sx,sy,tx:54+R()*212,ty:34+R()*56,s:2+R()*3.2,red:R()<.3,rot:R()*6,keep:R()<.08,del:R()*5})
  }
}
function render(F){
  g.setTransform(2,0,0,2,0,0);
  g.fillStyle=CFG.bg;g.fillRect(0,0,322,127);
  /* 馬賽克塊組字 */
  blocks.forEach(b=>{
    const t=F-b.t;if(t<0)return;
    const j=t<4?1-t/4:0;
    g.drawImage(off,b.x,b.y,CFG.block,CFG.block,b.x+b.dx*j,b.y+b.dy*j,CFG.block,CFG.block);
  });
  /* 碎片 */
  P.forEach(p=>{
    const t=eo(seg(F,CFG.fly[0]+p.del*.4,CFG.fly[1]));
    const x=p.sx+(p.tx-p.sx)*t,y=p.sy+(p.ty-p.sy)*t;
    const a=p.keep?(F>CFG.fly[1]+8?0:1):1-seg(F,CFG.fly[1]-2,CFG.fly[1]+8);
    if(a<=0)return;
    g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(p.rot+t*3);
    g.fillStyle=p.red?CFG.red:'#f5f5f7';g.fillRect(-p.s/2,-p.s/2,p.s,p.s);g.restore();
  });
  /* 紅色橢圓環 */
  const rt=(F-CFG.ringF)/14;
  if(rt>0&&rt<1){g.strokeStyle='rgba(255,71,87,'+(.9*(1-rt))+')';g.lineWidth=2;g.beginPath();g.ellipse(CFG.cx,60,30+eo(rt)*130,14+eo(rt)*45,0,0,7);g.stroke()}
  /* 底線與副標 */
  const u=eo(seg(F,CFG.lineF,CFG.lineF+6));
  if(u>0){g.fillStyle=CFG.red;g.fillRect(160-70*u,108,140*u,2)}
  const sa=seg(F,CFG.subF,CFG.subF+6);
  if(sa>0){g.globalAlpha=sa;g.fillStyle=CFG.gray;g.font='500 6.5px "Roboto Mono"';g.textAlign='center';g.textBaseline='alphabetic';
    if('letterSpacing' in g)g.letterSpacing='3px';g.fillText(CFG.sub,161,121);if('letterSpacing' in g)g.letterSpacing='0px';g.globalAlpha=1}
}
function start(){build();const T=q.get('t');if(T!==null){render((+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}
Promise.all([document.fonts.load(CFG.font,CFG.word),document.fonts.load('500 7px "Roboto Mono"','NEW')]).then(start,start);
</script></body></html>
