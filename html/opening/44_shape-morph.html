<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>OP44 形狀變身</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#16171e}
svg,canvas{position:absolute;left:0;top:0}
text{font-family:'Noto Sans TC',sans-serif;text-anchor:middle}
</style></head><body><div id="card"><svg id="s" width="322" height="127" viewBox="0 0 322 127"></svg></div>
<script>
/* ===== CFG ===== */
const CFG={
  text:'變身',label:'TITLE',ink:'#14151a',
  red:'#ff4954',cream:'#f4ede6',yellow:'#f3c85c',
  cx:161,cy:57,
  // 形狀：[名稱,色,轉場起,轉場止,頂點外徑...] 由 shapes() 定義；時間為幀
  steps:[['CIRCLE',0,0,0,'#ff4954'],['SQUARE',1,4,11,'#f4ede6'],['TRIANGLE',2,14,21,'#f3c85c'],['STAR',3,24,31,'#ff4954'],['HEXAGON',4,34,41,'#f4ede6']],
  rect:{w:198,h:72,from:46,to:62,a0:100,a1:0,s0:1.5},
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=(x,s=1.6)=>{const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'};
const NS='http://www.w3.org/2000/svg';
const S=document.getElementById('s');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||S).appendChild(e);return e}
function start(){const T=q.get('t');if(T!==null){render(Math.round(+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(Math.floor((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}

const N=360;   // 取樣加密到每 1°，星形尖角才不會被削掉
function polyR(poly,th){ // 由中心射線與多邊形交點求半徑
  const dx=Math.cos(th),dy=Math.sin(th);let best=1e9;
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length];
    const ex=b[0]-a[0],ey=b[1]-a[1],den=dx*ey-dy*ex;
    if(Math.abs(den)<1e-9)continue;
    const t=(a[0]*ey-a[1]*ex)/den*-1,u=(a[0]*dy-a[1]*dx)/den*-1;
    // 解 t*d = a + u*e
    const tt=(a[0]*ey-a[1]*ex)/den, uu=(a[0]*dy-a[1]*dx)/den;
    if(tt>0&&uu>=-1e-6&&uu<=1+1e-6)best=Math.min(best,tt);
  }
  return best;
}
const ngon=(n,R,ph)=>Array.from({length:n},(_,i)=>[R*Math.cos(ph+i*2*Math.PI/n),R*Math.sin(ph+i*2*Math.PI/n)]);
const star=(Ro,Ri)=>Array.from({length:10},(_,i)=>{const a=-Math.PI/2+i*Math.PI/5,r=i%2?Ri:Ro;return[r*Math.cos(a),r*Math.sin(a)]});
// 形狀改用「沿周長等分取點」再逐點內插（不是由中心射線取半徑），變形過程中星的尖角不會被削掉
const POLY=[null,ngon(4,42,0),ngon(3,48,0),star(48,20),ngon(6,40,0)];
function sampleShape(poly){
  let pts;
  if(!poly){pts=Array.from({length:N},(_,i)=>[34*Math.cos(TH[i]),34*Math.sin(TH[i])])}
  else{
    const dense=[],K=4000;let per=0;const L=[];
    for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);L.push(l);per+=l}
    for(let k=0;k<K;k++){let d=k/K*per,i=0;while(d>L[i]){d-=L[i];i++}const a=poly[i],b=poly[(i+1)%poly.length],u=d/L[i];dense.push([lerp(a[0],b[0],u),lerp(a[1],b[1],u)])}
    // 轉到從正上方（-90°）開始，順時針
    let best=0,bd=1e9;dense.forEach((p,k)=>{const dd=Math.abs(Math.atan2(p[1],p[0])+Math.PI/2);if(dd<bd){bd=dd;best=k}});
    pts=Array.from({length:N},(_,i)=>dense[(best+Math.round(i*K/N))%K]);
  }
  return pts}

const TH=Array.from({length:N},(_,i)=>-Math.PI/2+i*2*Math.PI/N);
const PT=POLY.map(sampleShape);
const shape=el('path',{});
const rg=el('g',{});
const rect=el('rect',{x:-CFG.rect.w/2,y:-CFG.rect.h/2,width:CFG.rect.w,height:CFG.rect.h,fill:CFG.red},rg);
const tg=el('g',{});   // 文字獨立一層：矩形轉一圈時文字保持正位不跟著轉
const rt=el('text',{x:0,y:2,'font-size':44,'font-weight':900,'dominant-baseline':'central',fill:CFG.ink,stroke:CFG.ink,'stroke-width':.9,'stroke-linejoin':'round'},tg);   // 黑體 900 再加同色描邊，筆畫更粗厚
rt.textContent=CFG.text;
const lb=el('text',{x:161,y:116,'font-size':6.5,'font-weight':700,'letter-spacing':3.2,fill:'#7b7f8c'});
function path(rs){return 'M'+rs.map(p=>(CFG.cx+p[0]).toFixed(1)+' '+(CFG.cy+p[1]).toFixed(1)).join('L')+'Z'}
function render(F){
  // 目前形狀與前一個形狀混合
  let cur=0,t=1,col=CFG.steps[0][4],prev=0,pcol=col,name='CIRCLE';
  for(let i=1;i<CFG.steps.length;i++){const s=CFG.steps[i];if(F>=s[2]){prev=CFG.steps[i-1][1];pcol=CFG.steps[i-1][4];cur=s[1];col=s[4];t=(x=>x*x*(3-2*x))(seg(F,s[2],s[3]));name=F<(s[2]+s[3])/2?CFG.steps[i-1][0]:s[0]}}
  const rs=PT[cur].map((p,i)=>[lerp(PT[prev][i][0],p[0],t),lerp(PT[prev][i][1],p[1],t)]);
  const R=CFG.rect;
  const showRect=F>=R.from;
  // 六邊形 → 紅（轉入色帶前變粉）
  let c=cur==0&&F<CFG.steps[1][2]?CFG.steps[0][4]:mix(pcol,col,t);
  if(F>=CFG.steps[4][3]+3)c=mix(CFG.cream,CFG.red,seg(F,CFG.steps[4][3]+3,R.from));
  shape.setAttribute('d',path(rs));shape.setAttribute('fill',c);shape.setAttribute('stroke',c);
  shape.setAttribute('stroke-width',3);shape.setAttribute('stroke-linejoin','round');
  shape.setAttribute('opacity',showRect?0:1);
  const rot=cur>=1?90*(cur-1+t):0;   // 有節奏：每次變形都重新順時針轉 90°（緩起緩停），轉完停一拍再下一次
  shape.setAttribute('transform','rotate('+rot.toFixed(2)+' '+CFG.cx+' '+CFG.cy+')');
  const p=eo(seg(F,R.from,R.to));
  rg.setAttribute('transform','translate('+CFG.cx+' '+(CFG.cy+3)+') rotate('+lerp(R.a0,R.a1,(x=>lerp(x*x*(3-2*x),1-Math.pow(1-x,3),.7))(seg(F,R.from,R.to))).toFixed(2)+') scale('+lerp(R.s0,1,p).toFixed(3)+')');
  rg.setAttribute('opacity',showRect?1:0);
  tg.setAttribute('transform','translate('+CFG.cx+' '+(CFG.cy+3)+') scale('+lerp(R.s0,1,p).toFixed(3)+')');tg.setAttribute('opacity',showRect?1:0);
  lb.textContent=showRect?CFG.label:name;
}
document.fonts.load('900 44px "Noto Sans TC"','變身TITLE').then(start,start);

</script></body></html>
