<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>OP48 動態拼貼</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0b0c11}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Noto Sans TC',sans-serif}
body.m{display:block;min-height:0}
#card{position:relative;width:322px;height:127px;border-radius:12px;overflow:hidden;background:#f4ede6}
svg,canvas{position:absolute;left:0;top:0}
text{font-family:'Noto Sans TC',sans-serif;text-anchor:middle}
</style></head><body><div id="card"><svg id="s" width="322" height="127" viewBox="0 0 322 127"></svg></div>
<script>
/* ===== CFG ===== */
const CFG={
  chars:['拼','貼','藝','術','展'],sub:'COLLAGE / 2026',
  red:'#ff4954',black:'#14151a',yellow:'#f3c85c',cream:'#f4ede6',paper:'#ece4d8',
  // 字磚：[中心x,中心y,邊長,旋轉,底色,字色,起跑幀]
  tiles:[[55,53,50,-7,'#ff4954','#f4ede6',12],[113,53,48,4,'#14151a','#f4ede6',14],[167,52,52,-4,'#f3c85c','#14151a',16],[220,54,48,5,'#f4ede6','#14151a',18],[267,50,50,-8,'#ff4954','#f4ede6',20]],
  LOOP:120
};
/* ================ */
const q=new URLSearchParams(location.search);
const Z=+q.get('z')||1;if(Z!=1)document.getElementById('card').style.zoom=Z;
if(q.get('m'))document.body.classList.add('m');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(f,a,b)=>cl((f-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=(x,s=1.6)=>{const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'};
const NS='http://www.w3.org/2000/svg';
const S=document.getElementById('s');
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||S).appendChild(e);return e}
function start(){const T=q.get('t');if(T!==null){render(Math.round(+T*30)%CFG.LOOP);return}
  const t0=performance.now();(function tick(){render(Math.floor((performance.now()-t0)/1000*30)%CFG.LOOP);requestAnimationFrame(tick)})()}

const defs=el('defs',{});
const dots=el('pattern',{id:'dots',width:6,height:6,patternUnits:'userSpaceOnUse'},defs);
el('circle',{cx:3,cy:3,r:1.5,fill:CFG.red},dots);
const hz=el('pattern',{id:'hz',width:12,height:12,patternUnits:'userSpaceOnUse',patternTransform:'rotate(-45)'},defs);
el('rect',{x:0,y:0,width:6,height:12,fill:CFG.black},hz);
const sh=el('filter',{id:'sh',x:'-20%',y:'-20%',width:'140%',height:'150%'},defs);
el('feDropShadow',{dx:2,dy:3,stdDeviation:1.5,'flood-color':'#000','flood-opacity':.3},sh);
// 背景構件
const gD=el('g',{});el('rect',{x:0,y:0,width:100,height:78,fill:'url(#dots)'},gD);
const gK=el('g',{});el('rect',{x:198,y:0,width:130,height:52,fill:CFG.black},gK);
const gC=el('g',{});el('circle',{cx:282,cy:106,r:40,fill:CFG.yellow},gC);
const gH=el('g',{});el('rect',{x:0,y:88,width:140,height:14,fill:CFG.cream},gH);el('rect',{x:0,y:88,width:140,height:14,fill:'url(#hz)'},gH);
// 字磚
const TL=CFG.tiles.map((t,i)=>{
  const g=el('g',{});
  const m=el('g',{filter:'url(#sh)'},g);
  el('rect',{x:-t[2]/2,y:-t[2]/2,width:t[2],height:t[2],fill:t[4]},m);
  const tx=el('text',{x:0,y:2,'font-size':t[2]*.68,'font-weight':900,'dominant-baseline':'central',fill:t[5]},m);
  tx.textContent=CFG.chars[i];
  if(i==0){el('rect',{x:-t[2]/2-6,y:-t[2]/2-3,width:30,height:9,fill:CFG.yellow,opacity:.95,transform:'rotate(-32 '+(-t[2]/2+8)+' '+(-t[2]/2)+')'},g)}
  return g;
});
const star=el('path',{d:'M0-8L2.4-2.6L8.2-2.4L3.6 1.2L5.2 6.8L0 3.6L-5.2 6.8L-3.6 1.2L-8.2-2.4L-2.4-2.6Z',fill:CFG.red});
const arrow=el('path',{d:'M32 112L52 112M46 107L52 112L46 117',stroke:CFG.red,'stroke-width':2.4,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'});
const sub=el('text',{x:185,y:113,'font-size':6.6,'font-weight':700,'letter-spacing':2.4,fill:CFG.black});sub.textContent=CFG.sub;
// 彈性：阻尼彈簧（有一點過衝再回彈），讓每個貼上去的東西俏皮、有彈跳感
const spr=(u,dk=8,fq=14)=>u<=0?0:u>=1?1:1-Math.exp(-dk*u)*Math.cos(u*fq)*(1-u*u*.0);
// 每個字磚的進場：[起點x,起點y,起跑幀,起始旋轉]（從畫面四面八方飛來，順序打散，不是由左到右）
const FROM=[[-70,150,9,-110],[120,-80,18,95],[170,200,3,70],[360,-60,21,-100],[400,70,15,120]];
const DUR=16;
function render(F){
  // 背景裝飾色塊錯落進場（不同時）：斜紋帶 → 黑塊 → 紅點 → 黃圓，各從不同方向
  const Dd=spr((F-0)/18),B=spr((F-6)/18),A=spr((F-12)/18),Cc=spr((F-24)/16);
  gD.setAttribute('transform','translate('+(-20*(1-A)).toFixed(1)+' '+(-110*(1-A)).toFixed(1)+')');
  gK.setAttribute('transform','translate('+(70*(1-B)).toFixed(1)+' '+(-50*(1-B)).toFixed(1)+') rotate('+(8*(1-B))+' 262 26)');
  gC.setAttribute('transform','translate(282 106) scale('+Math.max(.001,Cc).toFixed(3)+') translate(-282 -106)');
  gH.setAttribute('transform','translate('+(-150*(1-Dd)).toFixed(1)+' 0)');
  CFG.tiles.forEach((t,i)=>{
    const f=FROM[i],u=(F-f[2])/DUR,p=spr(u);
    const x=lerp(f[0],t[0],p),y=lerp(f[1],t[1],p),rot=t[3]+(1-p)*f[3],sc=Math.max(.01,.35+.65*p);
    TL[i].setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+rot.toFixed(1)+') scale('+sc.toFixed(3)+')');
    TL[i].setAttribute('opacity',F<f[2]?0:1);
  });
  const sp=spr((F-33)/12,7,16);
  star.setAttribute('transform','translate('+(CFG.tiles[4][0]+22)+' '+(CFG.tiles[4][1]-30)+') rotate('+(18+(1-sp)*90)+') scale('+Math.max(.001,sp)+')');
  star.setAttribute('opacity',F<33?0:1);
  // 箭頭、小字也用彈簧「貼上去」：箭頭從左下彈入並擺動，小字從右下翻轉彈入
  const ap=spr((F-27)/14,7,15),sq=spr((F-30)/14,7,15);
  arrow.setAttribute('opacity',F<27?0:1);arrow.setAttribute('transform','translate('+(42-60*(1-ap)).toFixed(1)+' '+(112+40*(1-ap)).toFixed(1)+') rotate('+(-70*(1-ap)).toFixed(1)+') scale('+Math.max(.01,.4+.6*ap).toFixed(3)+') translate(-42 -112)');
  sub.setAttribute('opacity',F<30?0:1);sub.setAttribute('transform','translate('+(232+70*(1-sq)).toFixed(1)+' '+(110+34*(1-sq)).toFixed(1)+') rotate('+(25*(1-sq)).toFixed(1)+') scale('+Math.max(.01,.4+.6*sq).toFixed(3)+') translate(-232 -110)');
}
document.fonts.load('900 34px "Noto Sans TC"','拼貼藝術展').then(start,start);

</script></body></html>
