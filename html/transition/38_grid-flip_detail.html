<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>S38 Grid Flip (Detail)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0f1015;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  #card{position:relative;width:324px;height:106px;border-radius:12px;overflow:hidden;transform-origin:center;}
  .abs{position:absolute;left:0;top:0;width:324px;height:106px;}
  .letter{display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-weight:700;}
</style>
</head>
<body>
<div id="card">
  <div class="abs" id="aBg"></div>
  <div class="abs letter" id="aLet"></div>
  <div class="abs" id="bBg"></div>
  <div class="abs letter" id="bLet"></div>
</div>
<script>
/* ========== CFG：可換內容集中在這裡 ========== */
const CFG = {
  sceneA: { img:'img/A_scene.jpg', bg:'#fd7a3d', letter:'A', color:'#14181e' },   // 轉場前的畫面（底色＋字，或圖）
  sceneB: { img:'img/B_scene.jpg', bg:'#f4f0e6', letter:'B', color:'#fd7a3d' },   // 轉場後的畫面
  fontSize: 50
};
/* ========== 動態參數（30fps 幀為單位）==========
   一輪 = 50 幀。兩幕直接切換，沒有過場色塊：卡片分成 3 欄 × 3 列的九宮格（每格 108 × 35.3），每一格都是一張翻牌——
   正面是舊畫面的那一格、背面是新畫面的那一格，沿該格的垂直軸翻 180°（軸不在正中，在該格由左算起 32% 的位置，偏左；強透視 perspective(150px) rotateY，翻的過程中格子是梯形：靠軸的左邊比較高、遠離軸的右邊比較矮，右半邊甩得比較大），翻到 90° 時立起來看不見，後面是深色底（BACK），
   過 90° 後露出背面（新畫面）。每格翻 DUR ＝ 9 幀（緩入緩出，一次只翻半圈 180°），翻動順序從左上往右下斜向傳：第（欄 col，列 row）格的起始幀 ＝ 3 ×（col ＋ row），約第 21 幀全部翻完。
   入場（c<27）：每格由正面翻到背面（0° → 180°），露出 B；退場（c≥27）：同樣的順序晚 27 幀，每格往回翻 180°（180° → 0°，轉回原本的方向、不繼續轉圈），翻回正面，露出 A。 */
const LOOP = 50, EXIT = 27, W = 324, H = 106, NC = 3, NR = 3, CW = W/NC, CH = H/NR;
const DUR = 9, STEP = 3, PERSP = 150, BACK = '#0b0d12', AX = 0.32;   // AX：翻轉軸在該格由左算起的位置（0.5 是正中，0.32 是偏左）
function lerpTab(tab, x){
  if (x <= tab[0][0]) return tab[0][1];
  for (let i=1;i<tab.length;i++) if (x <= tab[i][0]){ const a=tab[i-1], b=tab[i]; return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); }
  return tab[tab.length-1][1];
}
const $ = id => document.getElementById(id);
const SC = { a:{bg:$('aBg'), let:$('aLet')}, b:{bg:$('bBg'), let:$('bLet')} };
const EMPTY = 'polygon(0 0,0 0,0 0)';
function stage(topKey, clip){
  const top = SC[topKey], base = SC[topKey==='b' ? 'a' : 'b'];
  base.bg.style.zIndex = 1; base.let.style.zIndex = 2;
  top.bg.style.zIndex = 4;  top.let.style.zIndex = 6;
  top.bg.style.clipPath = top.let.style.clipPath = clip;
  base.bg.style.clipPath = base.let.style.clipPath = 'none';
}
const cells = [];
let ready = false;
function slice(src, q, r){
  const wrap = document.createElement('div'); wrap.style.cssText = 'position:absolute;left:0;top:0;width:'+(CW+0.6)+'px;height:'+(CH+0.6)+'px;overflow:hidden';
  const inner = document.createElement('div'); inner.style.cssText = 'position:absolute;left:'+(-q*CW)+'px;top:'+(-r*CH)+'px;width:'+W+'px;height:'+H+'px';
  const b = src.bg.cloneNode(false), l = src.let.cloneNode(true);
  for (const e of [b, l]){ e.removeAttribute('id'); }
  b.style.cssText = src.bg.style.cssText; l.style.cssText = src.let.style.cssText;
  b.style.zIndex = l.style.zIndex = ''; b.style.clipPath = l.style.clipPath = 'none';
  inner.appendChild(b); inner.appendChild(l); wrap.appendChild(inner); return wrap;
}
function init(){
  $('card').style.background = BACK;
  for (let r = 0; r < NR; r++) for (let q = 0; q < NC; q++){
    const cell = document.createElement('div');
    cell.style.cssText = 'position:absolute;left:'+(q*CW)+'px;top:'+(r*CH)+'px;width:'+(CW+0.6)+'px;height:'+(CH+0.6)+'px;transform-origin:'+(AX*100)+'% 50%';
    const fa = slice(SC.a, q, r), fb = slice(SC.b, q, r);
    cell.appendChild(fa); cell.appendChild(fb); $('card').appendChild(cell);
    cells.push({ cell, fa, fb, t0: STEP*(q + r) });
  }
  for (const k of ['a', 'b']){ SC[k].bg.style.display = SC[k].let.style.display = 'none'; }
  ready = true;
}
const smooth = u => u*u*(3 - 2*u);
function render(t){
  if (!ready) init();
  const c = ((t*30) % LOOP + LOOP) % LOOP;
  for (const k of cells){
    let ang;
    if (c < EXIT) ang = 180*smooth(Math.min(1, Math.max(0, (c - k.t0)/DUR)));
    else          ang = 180 - 180*smooth(Math.min(1, Math.max(0, (c - EXIT - k.t0)/DUR)));
    const a = ang % 360, showA = a < 90 || a >= 270, rot = showA ? (a >= 270 ? a - 360 : a) : a - 180;
    k.fa.style.display = showA ? '' : 'none'; k.fb.style.display = showA ? 'none' : '';
    k.cell.style.transform = 'perspective('+PERSP+'px) rotateY('+rot.toFixed(2)+'deg)';
  }
}
/* ========== 外殼 ========== */
(function(){
  const q = new URLSearchParams(location.search);
  const card = $('card');
  if (q.has('m')) { document.body.style.display='block'; document.body.style.minHeight='0'; } // 量測用：卡片貼左上
  card.style.background = CFG.sceneA.bg;
  for (const [bg, let_, s] of [['aBg','aLet',CFG.sceneA],['bBg','bLet',CFG.sceneB]]){
    const useImg = q.has('img') && s.img;   // ?img=1：兩幕改用圖片
    $(bg).style.background = useImg ? 'url('+s.img+') center/cover no-repeat' : s.bg;
    const e = $(let_); e.textContent = useImg ? '' : s.letter; e.style.color = s.color; e.style.fontSize = CFG.fontSize+'px';
  }
  const z = parseFloat(q.get('z')||'1'); if (z !== 1) card.style.transform = 'scale('+z+')';
  const start = () => {
    if (q.has('t')) { render(parseFloat(q.get('t'))); document.title += ' ready'; return; }
    const t0 = performance.now();
    (function loop(){ render((performance.now()-t0)/1000); requestAnimationFrame(loop); })();
  };
  document.fonts.load('700 50px "Roboto Mono"', 'AB').then(start, start);
})();
</script>
</body>
</html>
