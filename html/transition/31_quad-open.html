<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>S31 Quad Open</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0f1015;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  #card{position:relative;width:324px;height:106px;border-radius:12px;overflow:hidden;transform-origin:center;}
  .abs{position:absolute;left:0;top:0;width:324px;height:106px;}
  .letter{display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-weight:700;}
</style>
</head>
<body>
<div id="card">
  <div class="abs" id="aBg"></div>
  <div class="abs letter" id="aLet"></div>
  <div class="abs" id="bBg"></div>
  <div class="abs letter" id="bLet"></div>
</div>
<script>
/* ========== CFG：可換內容集中在這裡 ========== */
const CFG = {
  sceneA: { img:'img/A_scene.jpg', bg:'#8f7cfe', letter:'A', color:'#f4f0e6' },   // 轉場前的畫面（底色＋字，或圖）
  sceneB: { img:'img/B_scene.jpg', bg:'#f4f0e6', letter:'B', color:'#14181e' },   // 轉場後的畫面
  fontSize: 50
};
/* ========== 動態參數（30fps 幀為單位）==========
   一輪 = 46.4 幀。新畫面在原位不動；舊畫面沿著中線十字裂成四塊（各 162×53），四塊各往自己的角落退開，退開的縫（垂直縫寬 w、水平縫高 h）露出新畫面，
   每塊移動 (±w/2, ±h/2)，舊畫面的內容跟著各塊一起移動。w、h 逐幀見 GAP 表（越往後越快），第 9 幀縫寬超過卡片，四塊移出畫面。
   入場（c<27）：第 0 幀起十字縫張開，約第 9 幀全開；退場（c≥27）：同一張表倒著放，四塊從四個角落收回，闔上露出舊畫面。 */
const LOOP = 46.4, EXIT = 27, W = 324, H = 106;
const GAP = [[-1,0,0],[0,4,4],[1,5,4],[2,9,5],[3,17,8],[4,32,16],[5,55,28],[6,88,40],[7,135,60],[8,210,86],[9,330,110]];   // [幀, 垂直縫寬 w, 水平縫高 h]
function lerpTab(tab, x){
  if (x <= tab[0][0]) return tab[0][1];
  for (let i=1;i<tab.length;i++) if (x <= tab[i][0]){ const a=tab[i-1], b=tab[i]; return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); }
  return tab[tab.length-1][1];
}
const $ = id => document.getElementById(id);
const SC = { a:{bg:$('aBg'), let:$('aLet')}, b:{bg:$('bBg'), let:$('bLet')} };
const EMPTY = 'polygon(0 0,0 0,0 0)';
function stage(topKey, clip){
  const top = SC[topKey], base = SC[topKey==='b' ? 'a' : 'b'];
  base.bg.style.zIndex = 1; base.let.style.zIndex = 2;
  top.bg.style.zIndex = 4;  top.let.style.zIndex = 6;
  top.bg.style.clipPath = top.let.style.clipPath = clip;
  base.bg.style.clipPath = base.let.style.clipPath = 'none';
}
const aBg0 = $('aBg'), aLet0 = $('aLet');
const quads = [];   // 四塊舊畫面：[左上, 右上, 左下, 右下]
const QCLIP = ['inset(0 50% 50% 0)', 'inset(0 0 50% 50%)', 'inset(50% 50% 0 0)', 'inset(50% 0 0 50%)'];
const QDIR = [[-1,-1],[1,-1],[-1,1],[1,1]];
let ready = false;
function init(){
  for (let i = 0; i < 4; i++){
    const q = document.createElement('div'); q.className = 'abs'; q.style.cssText += ';z-index:4;clip-path:'+QCLIP[i];
    const b = aBg0.cloneNode(false), l = aLet0.cloneNode(true); b.removeAttribute('id'); l.removeAttribute('id');
    b.style.cssText = aBg0.style.cssText; l.style.cssText = aLet0.style.cssText; b.style.zIndex = l.style.zIndex = '';
    q.appendChild(b); q.appendChild(l); $('card').appendChild(q); quads.push(q);
  }
  ready = true;
}
function gap(c){ return [lerpTab(GAP.map(r => [r[0], r[1]]), c), lerpTab(GAP.map(r => [r[0], r[2]]), c)]; }
function render(t){
  if (!ready) init();
  const c = ((t*30) % LOOP + LOOP) % LOOP;
  const cc = c < EXIT ? c : GAP[GAP.length-1][0] - (c - EXIT);   // 入場照表；退場倒著放
  const [w, h] = (c < EXIT || c - EXIT <= GAP[GAP.length-1][0] + 1) ? gap(cc) : [0, 0];
  // B 在原位不動；舊畫面：沒有縫時直接顯示原本的 A，有縫時用四塊
  $('bBg').style.zIndex = 1; $('bLet').style.zIndex = 2; $('bBg').style.clipPath = $('bLet').style.clipPath = 'none';
  const closed = w < 0.05 && h < 0.05;
  aBg0.style.zIndex = 4; aLet0.style.zIndex = 6;
  aBg0.style.display = aLet0.style.display = closed ? '' : 'none';
  quads.forEach((q, i) => { q.style.display = closed ? 'none' : ''; q.style.transform = 'translate('+(QDIR[i][0]*w/2)+'px,'+(QDIR[i][1]*h/2)+'px)'; });
}
/* ========== 外殼 ========== */
(function(){
  const q = new URLSearchParams(location.search);
  const card = $('card');
  if (q.has('m')) { document.body.style.display='block'; document.body.style.minHeight='0'; } // 量測用：卡片貼左上
  card.style.background = CFG.sceneA.bg;
  for (const [bg, let_, s] of [['aBg','aLet',CFG.sceneA],['bBg','bLet',CFG.sceneB]]){
    const useImg = q.has('img') && s.img;   // ?img=1：兩幕改用圖片
    $(bg).style.background = useImg ? 'url('+s.img+') center/cover no-repeat' : s.bg;
    const e = $(let_); e.textContent = useImg ? '' : s.letter; e.style.color = s.color; e.style.fontSize = CFG.fontSize+'px';
  }
  const z = parseFloat(q.get('z')||'1'); if (z !== 1) card.style.transform = 'scale('+z+')';
  const start = () => {
    if (q.has('t')) { render(parseFloat(q.get('t'))); document.title += ' ready'; return; }
    const t0 = performance.now();
    (function loop(){ render((performance.now()-t0)/1000); requestAnimationFrame(loop); })();
  };
  document.fonts.load('700 50px "Roboto Mono"', 'AB').then(start, start);
})();
</script>
</body>
</html>
