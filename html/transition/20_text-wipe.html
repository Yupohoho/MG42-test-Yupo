<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>S20 Text Wipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0f1015;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  #card{position:relative;width:324px;height:106px;border-radius:12px;overflow:hidden;transform-origin:center;}
  .abs{position:absolute;left:0;top:0;width:324px;height:106px;}
  .letter{display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-weight:700;}
</style>
</head>
<body>
<div id="card">
  <div class="abs" id="aBg"></div>
  <div class="abs letter" id="aLet"></div>
  <div class="abs" id="bBg"></div>
  <div class="abs letter" id="bLet"></div>
</div>
<script>
/* ========== CFG：可換內容集中在這裡 ========== */
const CFG = {
  sceneA: { img:'img/A_scene.jpg', bg:'#14181e', letter:'A', color:'#f4f0e6' },   // 轉場前的畫面（底色＋字，或圖）
  sceneB: { img:'img/B_scene.jpg', bg:'#ffc831', letter:'B', color:'#14181e' },   // 轉場後的畫面
  word: 'WIPE',               // 當遮罩的單字
  fontSize: 50
};
/* ========== 動態參數（30fps 幀為單位）==========
   一輪 = 50 幀。兩幕直接切換，沒有過場色塊：單字 WIPE 當遮罩，字形的範圍就是新畫面露出的範圍。
   字以「I」的中心為焦點，從小（字高約 26 px）逐幀放大，放大倍率見 S 表，約第 10 幀字形放大到蓋滿整張卡片。
   入場（c<27）：A 在下，B 從字形露出；退場（c≥27）：同樣的放大再來一次（晚 27 幀），這次從字形露出 A。
   兩幕預設是底色＋字，網址加 ?img=1 改用風景圖。 */
const LOOP = 50, EXIT = 27, W = 324, H = 106, FS = 37, CY = 53;
const S = [[0,1],[1,1.23],[2,1.46],[3,1.92],[4,2.7],[5,3.85],[6,5.6],[7,8.5],[8,13],[9,24],[10,70],[11,200]];
function lerpTab(tab, x){
  if (x <= tab[0][0]) return tab[0][1];
  for (let i=1;i<tab.length;i++) if (x <= tab[i][0]){ const a=tab[i-1], b=tab[i]; return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); }
  return tab[tab.length-1][1];
}
const $ = id => document.getElementById(id);
const SC = { a:{bg:$('aBg'), let:$('aLet')}, b:{bg:$('bBg'), let:$('bLet')} };
const EMPTY = 'polygon(0 0,0 0,0 0)';
function stage(topKey, clip){
  const top = SC[topKey], base = SC[topKey==='b' ? 'a' : 'b'];
  base.bg.style.zIndex = 1; base.let.style.zIndex = 2;
  top.bg.style.zIndex = 4;  top.let.style.zIndex = 6;
  top.bg.style.clipPath = top.let.style.clipPath = clip;
  base.bg.style.clipPath = base.let.style.clipPath = 'none';
}
const NS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('width', 0); svg.setAttribute('height', 0); svg.style.position = 'absolute';
const cp = document.createElementNS(NS, 'clipPath'); cp.id = 'wordClip'; cp.setAttribute('clipPathUnits', 'userSpaceOnUse');
const txt = document.createElementNS(NS, 'text');
txt.setAttribute('x', W/2); txt.setAttribute('y', CY + FS*0.36); txt.setAttribute('text-anchor', 'middle');
txt.setAttribute('font-family', "'Archivo Black', Impact, sans-serif"); txt.setAttribute('font-size', FS); txt.textContent = CFG.word;
cp.appendChild(txt); svg.appendChild(cp); document.body.appendChild(svg);
let FX = W/2, FY = CY;
function focus(){ try { const b = txt.getExtentOfChar(1); FX = b.x + b.width/2; FY = b.y + b.height/2; } catch(e){} }
function render(t){
  const c = ((t*30) % LOOP + LOOP) % LOOP;
  const inn = c < EXIT, cc = inn ? c : c - EXIT, s = lerpTab(S, cc);
  txt.setAttribute('transform', 'translate('+FX+' '+FY+') scale('+s+') translate('+(-FX)+' '+(-FY)+')');
  stage(inn ? 'b' : 'a', 'url(#wordClip)');
}
/* ========== 外殼 ========== */
(function(){
  const q = new URLSearchParams(location.search);
  const card = $('card');
  if (q.has('m')) { document.body.style.display='block'; document.body.style.minHeight='0'; } // 量測用：卡片貼左上
  card.style.background = CFG.sceneA.bg;
  for (const [bg, let_, s] of [['aBg','aLet',CFG.sceneA],['bBg','bLet',CFG.sceneB]]){
    const useImg = q.has('img') && s.img;   // ?img=1：兩幕改用圖片
    $(bg).style.background = useImg ? 'url('+s.img+') center/cover no-repeat' : s.bg;
    const e = $(let_); e.textContent = useImg ? '' : s.letter; e.style.color = s.color; e.style.fontSize = CFG.fontSize+'px';
  }
  const z = parseFloat(q.get('z')||'1'); if (z !== 1) card.style.transform = 'scale('+z+')';
  const start = () => {
    if (q.has('t')) { render(parseFloat(q.get('t'))); document.title += ' ready'; return; }
    const t0 = performance.now();
    (function loop(){ render((performance.now()-t0)/1000); requestAnimationFrame(loop); })();
  };
  Promise.all([document.fonts.load('700 50px "Roboto Mono"', 'AB'), document.fonts.load('400 37px "Archivo Black"', 'WIPE')]).then(() => { focus(); start(); }, () => { focus(); start(); });
})();
</script>
</body>
</html>
