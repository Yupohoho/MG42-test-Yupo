<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>S30 Diagonal Ribbons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0f1015;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  #card{position:relative;width:324px;height:106px;border-radius:12px;overflow:hidden;transform-origin:center;}
  .abs{position:absolute;left:0;top:0;width:324px;height:106px;}
  .letter{display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-weight:700;}
</style>
</head>
<body>
<div id="card">
  <div class="abs" id="aBg"></div>
  <div class="abs letter" id="aLet"></div>
  <div class="abs" id="bBg"></div>
  <div class="abs letter" id="bLet"></div>
</div>
<script>
/* ========== CFG：可換內容集中在這裡 ========== */
const CFG = {
  sceneA: { img:'img/A_scene.jpg', bg:'#8f7cfe', letter:'A', color:'#14181e' },   // 轉場前的畫面（底色＋字，或圖）
  sceneB: { img:'img/B_scene.jpg', bg:'#14181e', letter:'B', color:'#8f7cfe' },   // 轉場後的畫面
  fontSize: 50
};
/* ========== 動態參數（30fps 幀為單位）==========
   一輪 = 50 幀。兩幕直接切換，沒有過場色塊：卡片被斜向的緞帶切成 7 條（緞帶軸線往右上傾約 23°，邊線每往下 1 px 往左偏 2.3 px，每條橫向寬 93 px、垂直於緞帶方向寬約 37 px），
   新畫面的緞帶分成兩組、分時進場：偶數條（第 0、2、4、6 條）一組，從右上端沿著緞帶往左下滑進來；奇數條（第 1、3、5 條）一組，晚 5 幀，從左下端往右上滑進來。
   每組的每條是獨立的一條物件，依序錯開 3 幀接連進入（不是整組同時），每條滑 10 幀、先快後慢（ease-out 二次），約第 21 幀全部到位、蓋滿整張。
   緞帶範圍就是新畫面。第 j 條的右邊線在 y=0 的 x = 51 + 93×j。
   入場（c<27）：A 在下，B 在上；退場（c≥27）：同樣的動作晚 27 幀再來一次，露出 A。 */
const LOOP = 50, EXIT = 27, W = 324, H = 106, SL = 2.3, BW = 93, DUR = 10, STAG = 3;
const NORM = Math.hypot(1, SL);                       // 軸線方向 d = (−SL, 1)/NORM（往左下），法線 n = (1, SL)/NORM
const D = [-SL/NORM, 1/NORM], N = [1/NORM, SL/NORM];
const A_MIN = -340, A_MAX = 70;                       // 沿緞帶方向的座標範圍（涵蓋整張卡片）
const GROUPS = [ { js: [0, 2, 4, 6], start: 0, from: 'end' }, { js: [1, 3, 5], start: 5, from: 'begin' } ];
function lerpTab(tab, x){
  if (x <= tab[0][0]) return tab[0][1];
  for (let i=1;i<tab.length;i++) if (x <= tab[i][0]){ const a=tab[i-1], b=tab[i]; return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); }
  return tab[tab.length-1][1];
}
const $ = id => document.getElementById(id);
const SC = { a:{bg:$('aBg'), let:$('aLet')}, b:{bg:$('bBg'), let:$('bLet')} };
const EMPTY = 'polygon(0 0,0 0,0 0)';
function stage(topKey, clip){
  const top = SC[topKey], base = SC[topKey==='b' ? 'a' : 'b'];
  base.bg.style.zIndex = 1; base.let.style.zIndex = 2;
  top.bg.style.zIndex = 4;  top.let.style.zIndex = 6;
  top.bg.style.clipPath = top.let.style.clipPath = clip;
  base.bg.style.clipPath = base.let.style.clipPath = 'none';
}
const rect = (x0, y0, x1, y1) => 'M'+x0.toFixed(2)+' '+y0.toFixed(2)+'L'+x1.toFixed(2)+' '+y0.toFixed(2)+'L'+x1.toFixed(2)+' '+y1.toFixed(2)+'L'+x0.toFixed(2)+' '+y1.toFixed(2)+'Z';
const poly = pts => 'M'+pts.map(p => p[0].toFixed(2)+' '+p[1].toFixed(2)).join('L')+'Z';
const clipOf = d => d ? "path('"+d+"')" : EMPTY;
const easeOut = p => 1 - Math.pow(1 - p, 2);
function ribbon(j, a0, a1){   // 第 j 條，沿軸線座標 a0～a1 的一段
  const b0 = (51 + BW*j - BW)/NORM - 0.4, b1 = (51 + BW*j)/NORM + 0.4;
  const pt = (a, b) => [a*D[0] + b*N[0], a*D[1] + b*N[1]];
  return poly([pt(a0, b0), pt(a1, b0), pt(a1, b1), pt(a0, b1)]);
}
function shape(c){
  let d = '';
  for (const g of GROUPS) g.js.forEach((j, i) => {
    const p = Math.min(1, Math.max(0, (c - g.start - i*STAG)/DUR));
    if (p <= 0) return;
    const e = easeOut(p);
    if (g.from === 'end') d += ribbon(j, A_MIN, A_MIN + (A_MAX - A_MIN)*e);     // 從右上端往左下長
    else                  d += ribbon(j, A_MAX - (A_MAX - A_MIN)*e, A_MAX);     // 從左下端往右上長
  });
  return clipOf(d);
}
function render(t){
  const c = ((t*30) % LOOP + LOOP) % LOOP;
  if (c < EXIT) stage('b', shape(c));
  else          stage('a', shape(c - EXIT));
}
/* ========== 外殼 ========== */
(function(){
  const q = new URLSearchParams(location.search);
  const card = $('card');
  if (q.has('m')) { document.body.style.display='block'; document.body.style.minHeight='0'; } // 量測用：卡片貼左上
  card.style.background = CFG.sceneA.bg;
  for (const [bg, let_, s] of [['aBg','aLet',CFG.sceneA],['bBg','bLet',CFG.sceneB]]){
    const useImg = q.has('img') && s.img;   // ?img=1：兩幕改用圖片
    $(bg).style.background = useImg ? 'url('+s.img+') center/cover no-repeat' : s.bg;
    const e = $(let_); e.textContent = useImg ? '' : s.letter; e.style.color = s.color; e.style.fontSize = CFG.fontSize+'px';
  }
  const z = parseFloat(q.get('z')||'1'); if (z !== 1) card.style.transform = 'scale('+z+')';
  const start = () => {
    if (q.has('t')) { render(parseFloat(q.get('t'))); document.title += ' ready'; return; }
    const t0 = performance.now();
    (function loop(){ render((performance.now()-t0)/1000); requestAnimationFrame(loop); })();
  };
  document.fonts.load('700 50px "Roboto Mono"', 'AB').then(start, start);
})();
</script>
</body>
</html>
