<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>S01 Color Wipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0f1015;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  #card{position:relative;width:324px;height:106px;border-radius:12px;overflow:hidden;transform-origin:center;}
  .abs{position:absolute;left:0;top:0;width:324px;height:106px;}
  .letter{display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-weight:700;}
</style>
</head>
<body>
<div id="card">
  <div class="abs" id="aBg"></div>
  <div class="abs letter" id="aLet"></div>
  <div class="abs" id="g" style="z-index:3"></div>
  <div class="abs" id="l" style="z-index:3"></div>
  <div class="abs" id="bBg"></div>
  <div class="abs letter" id="bLet"></div>
</div>
<script>
/* ========== CFG：可換內容集中在這裡 ========== */
const CFG = {
  sceneA: { img:'img/A_scene.jpg', bg:'#14181e', letter:'A', color:'#f1f1ea' },   // 轉場前的畫面（底色＋字）
  sceneB: { img:'img/B_scene.jpg', bg:'#fe5c8f', letter:'B', color:'#16151a' },   // 轉場後的畫面（底色＋字）
  layerG: '#8f8f8f',      // 過場層 1（深灰，先掃過；多色過場用灰階）
  layerL: '#e6e6e6',      // 過場層 2（淺灰）
  layerGExit: '#8f8f8f',  // 退場時過場層 1 的色
  fontSize: 50
};
/* ========== 動態參數（30fps 幀為單位）==========
   一輪 = 52.5 幀。兩幕都是完整畫面：A 在下，B 在上，B 只在「粉色層」掃過的範圍內露出。
   過場層 灰、淺粉 夾在 A 與 B 之間，領先 B 掃過去（延遲 0 / 3.5 / 7 幀）。
   入場：三層各自由左往右掃，右緣位置表 ENTER。
   退場：右緣由右往左縮回，B 與淺粉從 c=27 起、灰從 c=34 起，縮回後露出 A。 */
const LOOP = 52.5, W = 324;
const ENTER = [0, 12, 54, 129, 223, 279, 308, 320, 324];
const EXIT  = [324, 311, 271, 195, 101, 45, 15, 0];
function interp(tab, x){
  if (x <= 0) return tab[0];
  if (x >= tab.length-1) return tab[tab.length-1];
  const i = Math.floor(x), f = x - i;
  return tab[i] + (tab[i+1]-tab[i]) * f;
}
function enterEdge(u){
  if (u <= -0.29) return 0;
  if (u < 0) return 12 * (u + 0.29) / 0.29;
  return interp(ENTER.slice(1), u);
}
function exitEdge(v){
  if (v < -1) return W;
  return interp(EXIT, v + 1);
}
const $ = id => document.getElementById(id);
const SC = { a:{bg:$('aBg'), let:$('aLet')}, b:{bg:$('bBg'), let:$('bLet')} };
function stage(topKey, clip){   // topKey 的那一幕疊在上面，只在 clip 範圍內露出
  const top = SC[topKey], base = SC[topKey==='b' ? 'a' : 'b'];
  base.bg.style.zIndex = 1; base.let.style.zIndex = 2;
  top.bg.style.zIndex = 4;  top.let.style.zIndex = 6;
  top.bg.style.clipPath = top.let.style.clipPath = clip;
  base.bg.style.clipPath = base.let.style.clipPath = 'none';
}
function render(t){
  const c = ((t*30) % LOOP + LOOP) % LOOP;
  const gIn = enterEdge(c),  lIn = enterEdge(c - 3.5), pIn = enterEdge(c - 7);
  const pOut = exitEdge(c - 27), gOut = exitEdge(c - 34);
  const g = c < 30 ? gIn : gOut;
  const p = c < 27 ? pIn : pOut;
  const l = c < 27 ? lIn : pOut;
  $('g').style.width = g + 'px';
  $('l').style.width = l + 'px';
  $('g').style.background = c >= 34 ? CFG.layerGExit : CFG.layerG;
  $('l').style.background = CFG.layerL;
  stage('b', 'inset(0 ' + (W - p) + 'px 0 0)');
}
/* ========== 外殼 ========== */
(function(){
  const q = new URLSearchParams(location.search);
  const card = $('card');
  if (q.has('m')) { document.body.style.display='block'; document.body.style.minHeight='0'; } // 量測用：卡片貼左上
  card.style.background = CFG.sceneA.bg;
  for (const [bg, let_, s] of [['aBg','aLet',CFG.sceneA],['bBg','bLet',CFG.sceneB]]){
    const useImg = q.has('img') && s.img;   // ?img=1：兩幕改用圖片
    $(bg).style.background = useImg ? 'url('+s.img+') center/cover no-repeat' : s.bg;
    const e = $(let_); e.textContent = useImg ? '' : s.letter; e.style.color = s.color; e.style.fontSize = CFG.fontSize+'px';
  }
  const z = parseFloat(q.get('z')||'1'); if (z !== 1) card.style.transform = 'scale('+z+')';
  const start = () => {
    if (q.has('t')) { render(parseFloat(q.get('t'))); document.title += ' ready'; return; }
    const t0 = performance.now();
    (function loop(){ render((performance.now()-t0)/1000); requestAnimationFrame(loop); })();
  };
  document.fonts.load('700 50px "Roboto Mono"', 'AB').then(start, start);
})();
</script>
</body>
</html>
