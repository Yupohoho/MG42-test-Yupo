<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>S19 Ripple Wipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0f1015;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  #card{position:relative;width:324px;height:106px;border-radius:12px;overflow:hidden;transform-origin:center;}
  .abs{position:absolute;left:0;top:0;width:324px;height:106px;}
  .letter{display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-weight:700;}
</style>
</head>
<body>
<div id="card">
  <div class="abs" id="aBg"></div>
  <div class="abs letter" id="aLet"></div>
  <div class="abs" id="bBg"></div>
  <div class="abs letter" id="bLet"></div>
</div>
<script>
/* ========== CFG：可換內容集中在這裡 ========== */
const CFG = {
  sceneA: { img:'img/A_scene.jpg', bg:'#f4f0e6', letter:'A', color:'#14181e' },   // 轉場前的畫面（底色＋字，或圖）
  sceneB: { img:'img/B_scene.jpg', bg:'#7a5400', letter:'B', color:'#f4f0e6' },   // 轉場後的畫面
  fontSize: 50
};
/* ========== 動態參數（30fps 幀為單位）==========
   一輪 = 50 幀。有過場色塊的類型。像兩顆水滴先後落下的波紋，輕輕往外擴：每個落點各自先擴出兩圈圓環波
   （寬 14 px，半透明，第一圈 0.45、第二圈 0.22，第二圈晚 4 幀出發，半徑每幀 +26 px），圓環擴散約 9 幀後，圓才從落點長出來（半徑見 FILL 表，第 9 幀出現、第 16 幀蓋到 265）：
   ① 第一個波（落點 1）：圓環是淺灰色，長出來的圓是真的色塊物件（白色圓盤，邊緣一圈淺灰環，單一色塊用白、多色用灰階），蓋住舊畫面；
   ② 第二個波（落點 2，晚 4.5 幀）：圓環用新畫面的底色，長出來的圓就是新畫面，擴大到蓋滿整張（約第 20.5 幀）。
   入場（c<27）：A 在下，白色物件蓋住 A，露出 B，落點 1 在左（95,45）、落點 2 在右下（235,62）；
   退場（c≥27）：同樣的兩個波晚 27 幀再來一次，白色物件蓋住 B，落點左右對調（1：229,45；2：89,62），露出 A。 */
const LOOP = 50, EXIT = 27, W = 324, H = 106, RW = 14, EW = 10;
const DROPS_IN  = [[95, 45, 0], [235, 62, 4.5]];     // [x, y, 出發延遲幀]；第 1 個是色塊物件、第 2 個是新畫面
const DROPS_OUT = [[229, 45, 0], [89, 62, 4.5]];
const FILL = [[9,0],[10,20],[11,45],[12,80],[13,120],[14,165],[15,215],[16,265]];
const ringR = k => 8 + 26*k;
const RING_LAG = [0, 4], RING_OP = [0.45, 0.22];
const OBJ = ['#ffffff', '#cfcfcf'];                  // 物件：圓盤、邊緣環
function lerpTab(tab, x){
  if (x <= tab[0][0]) return tab[0][1];
  for (let i=1;i<tab.length;i++) if (x <= tab[i][0]){ const a=tab[i-1], b=tab[i]; return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); }
  return tab[tab.length-1][1];
}
const $ = id => document.getElementById(id);
const SC = { a:{bg:$('aBg'), let:$('aLet')}, b:{bg:$('bBg'), let:$('bLet')} };
const EMPTY = 'polygon(0 0,0 0,0 0)';
function stage(topKey, clip){
  const top = SC[topKey], base = SC[topKey==='b' ? 'a' : 'b'];
  base.bg.style.zIndex = 1; base.let.style.zIndex = 2;
  top.bg.style.zIndex = 4;  top.let.style.zIndex = 6;
  top.bg.style.clipPath = top.let.style.clipPath = clip;
  base.bg.style.clipPath = base.let.style.clipPath = 'none';
}
const circle = (x, y, r) => 'M'+(x-r).toFixed(2)+' '+y+'a'+r.toFixed(2)+' '+r.toFixed(2)+' 0 1 0 '+(2*r).toFixed(2)+' 0a'+r.toFixed(2)+' '+r.toFixed(2)+' 0 1 0 '+(-2*r).toFixed(2)+' 0Z';
const ringPath = (x, y, r, w) => "path(evenodd,'"+circle(x, y, r)+(r - w > 0 ? circle(x, y, r - w) : '')+"')";
const IMG = new URLSearchParams(location.search).has('img');
function mk(color, z, op){ const e = document.createElement('div'); e.className = 'abs'; e.style.cssText += ';pointer-events:none;z-index:'+z+';background:'+color+(op != null ? ';opacity:'+op : ''); $('card').appendChild(e); return e; }
const disc = mk(OBJ[0], 3), edge = mk(OBJ[1], 3);     // 色塊物件：夾在舊畫面（z1/2）和新畫面（z4/6）之間
const ov = [];   // 圓環：[落點1圈0, 落點1圈1, 落點2圈0, 落點2圈1]
for (let i = 0; i < 4; i++) ov.push(mk('#fff', 7, RING_OP[i % 2]));
function render(t){
  const c = ((t*30) % LOOP + LOOP) % LOOP;
  const inn = c < EXIT, cc = inn ? c : c - EXIT, topKey = inn ? 'b' : 'a', drops = inn ? DROPS_IN : DROPS_OUT;
  // 第一個波：色塊物件（白色圓盤）
  { const [x, y, lag] = drops[0], k = cc - lag;
    if (k >= FILL[0][0]){ const r = lerpTab(FILL, k);
      disc.style.clipPath = "path('"+circle(x, y, r)+"')"; edge.style.clipPath = ringPath(x, y, r, EW);
    } else disc.style.clipPath = edge.style.clipPath = EMPTY; }
  // 第二個波：新畫面
  { const [x, y, lag] = drops[1], k = cc - lag;
    stage(topKey, k >= FILL[0][0] ? "path('"+circle(x, y, lerpTab(FILL, k))+"')" : EMPTY); }
  // 兩個落點各兩圈圓環
  const tint = [ '#b5b5b5', IMG ? '#ffffff' : CFG['scene'+topKey.toUpperCase()].bg ];
  drops.forEach(([x, y, lag], i) => RING_LAG.forEach((rl, j) => {
    const k = cc - lag - rl, r = ringR(k), e = ov[i*2 + j];
    e.style.background = tint[i];
    e.style.clipPath = (k >= 0 && r - RW < 280) ? ringPath(x, y, r, RW) : EMPTY;
  }));
}
/* ========== 外殼 ========== */
(function(){
  const q = new URLSearchParams(location.search);
  const card = $('card');
  if (q.has('m')) { document.body.style.display='block'; document.body.style.minHeight='0'; } // 量測用：卡片貼左上
  card.style.background = CFG.sceneA.bg;
  for (const [bg, let_, s] of [['aBg','aLet',CFG.sceneA],['bBg','bLet',CFG.sceneB]]){
    const useImg = q.has('img') && s.img;   // ?img=1：兩幕改用圖片
    $(bg).style.background = useImg ? 'url('+s.img+') center/cover no-repeat' : s.bg;
    const e = $(let_); e.textContent = useImg ? '' : s.letter; e.style.color = s.color; e.style.fontSize = CFG.fontSize+'px';
  }
  const z = parseFloat(q.get('z')||'1'); if (z !== 1) card.style.transform = 'scale('+z+')';
  const start = () => {
    if (q.has('t')) { render(parseFloat(q.get('t'))); document.title += ' ready'; return; }
    const t0 = performance.now();
    (function loop(){ render((performance.now()-t0)/1000); requestAnimationFrame(loop); })();
  };
  document.fonts.load('700 50px "Roboto Mono"', 'AB').then(start, start);
})();
</script>
</body>
</html>
