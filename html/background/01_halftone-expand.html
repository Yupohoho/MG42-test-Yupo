<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B01 Halftone Expand</title>
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格；?m=1 量測用（卡片貼左上，本檔預設就貼左上） */
  #card { position:relative; overflow:hidden; transform-origin:0 0; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="card"><canvas id="cv"></canvas></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#14181e',            // 底色
  dot: '#ff4d87',           // 網點色
  x0: 3.6, px: 13.3,        // 網點格：第一欄 x、欄距
  y0: 2.8, py: 12.65,       // 第一列 y、列距
  center: [163.2, 53.4],    // 擴散中心（正好在一顆網點上）
  baseR: 1.0,               // 靜止時的小點半徑
  maxR: 7.0,                // 擴散後的大點半徑（比格距的一半大，點與點相碰，只剩菱形小縫）
  startFrame: 8.5,          // 中心開始擴散的幀
  speed: 4.3,               // 波前速度（px／幀）
  lead: 10, soft: 24,       // 波前柔邊：波前前 lead px 開始長大，經 soft px 長到最大
  // 擴散到邊緣後整片網點一起縮小回小點：[幀, 保留比例]
  shrink: [[48, 1], [51, .9], [54, .65], [57, .13], [58, 0]],
  loopFrames: 60,           // 一輪 60 幀（2 秒）
};
// =================================

const q = new URLSearchParams(location.search);
const Z = +(q.get('z') || 1);
const card = document.getElementById('card'), cv = document.getElementById('cv');
card.style.cssText += `width:${CFG.W*Z}px;height:${CFG.H*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width = CFG.W * Z; cv.height = CFG.H * Z;
const ctx = cv.getContext('2d');

const sstep = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const table = (t, f) => { // 折線表內插
  if (f <= t[0][0]) return t[0][1];
  for (let i = 1; i < t.length; i++) if (f <= t[i][0]) { const [a, b] = [t[i-1], t[i]]; return a[1] + (b[1] - a[1]) * (f - a[0]) / (b[0] - a[0]); }
  return t[t.length-1][1];
};

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  ctx.setTransform(Z, 0, 0, Z, 0, 0);
  ctx.fillStyle = CFG.bg; ctx.fillRect(0, 0, CFG.W, CFG.H);
  ctx.fillStyle = CFG.dot;
  const R = CFG.speed * (f - CFG.startFrame);
  const m = table(CFG.shrink, f);
  for (let r = -1; r < 10; r++) for (let c = -1; c < 26; c++) {
    const x = CFG.x0 + c * CFG.px, y = CFG.y0 + r * CFG.py;
    const e = R - Math.hypot(x - CFG.center[0], y - CFG.center[1]);
    let rad = CFG.baseR + (CFG.maxR - CFG.baseR) * sstep((e + CFG.lead) / CFG.soft);
    rad = CFG.baseR + (rad - CFG.baseR) * m;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.2832); ctx.fill();
  }
}

if (q.has('t')) render(+q.get('t'));
else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
</script>
</body>
</html>
