<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B25 Circle Pop</title>
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; transform-origin:0 0; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="card"><canvas id="cv"></canvas></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#14181e',
  purple: '#ad8df3', cream: '#efeae2',
  shade: 'rgba(20,24,30,.36)',        // 蓋在別的圓上的暗色圓（蓋在奶油上變灰、蓋在紫上變深紫，蓋在底上幾乎看不見）
  ghost: 'rgba(5,6,12,.17)',           // 單獨一顆比底色略深的暗圓
  // 彈簧：幀（從出現算起）→ 倍率，先衝過頭 1.23 再回穩
  spring: [[0,0],[1,.33],[2,.96],[3,1.23],[4,1.2],[5,1.08],[6,1.02],[7,1]],
  // 每顆圓：[顏色, 圓心 x, 圓心 y, 半徑, 出現幀, 開始縮回的幀]；依出現順序畫（後出現的蓋在上面）
  circles: [
    ['purple', 262, 58, 26, 1,    55],
    ['cream',   97, 19, 29, 4,    56.3],
    ['purple', 149, 38, 22, 7,    57.5],
    ['ghost',   63, 76, 25, 10,   56],
    ['purple',  85, 48, 20, 15.5, 54.7],
    ['cream',  295, 85, 20, 19,   56],
    ['purple', 253, 83, 33, 21.5, 57],
    ['cream',   57, 38, 13, 25,   56],
    ['shade',   62, 35, 13, 27.5, 56],
    ['purple',  42, 88, 27, 30,   58],
    ['cream',  259, 46, 20, 32.5, 57],
    ['purple', 122, 89, 17, 36,   57.8],
    ['cream',  151, 60, 15, 38.5, 54.6],
    ['shade',  263, 42, 20, 40.5, 57],
    ['purple', 199, 62, 33, 44,   58.5],
  ],
  outEnd: 63, outPow: 1.3,            // 縮回：從開始幀到第 63 幀線性掉到 0，再取 1.3 次方（先慢後快）
  loopFrames: 62.7,
};
// =================================

const q = new URLSearchParams(location.search);
const Z = +(q.get('z') || 1);
const card = document.getElementById('card'), cv = document.getElementById('cv');
card.style.cssText += `width:${CFG.W*Z}px;height:${CFG.H*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width = CFG.W * Z; cv.height = CFG.H * Z;
const ctx = cv.getContext('2d');

const table = (t, x) => {
  if (x <= t[0][0]) return t[0][1];
  for (let i = 1; i < t.length; i++) if (x <= t[i][0]) { const [a, b] = [t[i-1], t[i]]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]); }
  return t[t.length-1][1];
};

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  ctx.setTransform(Z, 0, 0, Z, 0, 0);
  ctx.fillStyle = CFG.bg; ctx.fillRect(0, 0, CFG.W, CFG.H);
  for (const [col, x, y, R, tA, tS] of CFG.circles) {
    if (f < tA) continue;
    let s = table(CFG.spring, f - tA);
    if (f > tS) s *= Math.pow(Math.max(0, 1 - (f - tS) / (CFG.outEnd - tS)), CFG.outPow);
    const r = R * s;
    if (r < .4) continue;
    ctx.fillStyle = CFG[col];
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }
}

if (q.has('t')) render(+q.get('t'));
else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
</script>
</body>
</html>
