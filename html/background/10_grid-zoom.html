<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B10 Grid Zoom</title>
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; transform-origin:0 0; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="card"><canvas id="cv"></canvas></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#18d4c4',            // 底色（青綠）
  line: '#0b2b31',          // 格線色（深色）
  dot: '#126463',           // 中央圓點色
  origin: [160.6, 55],      // 放大的中心（格線一定穿過這裡）
  pitch: 26.75,             // 靜止時的格距
  lineWidth: 1.8,
  dotC: [160.6, 55], dotR0: 5.5, dotR1: 1.4, dotPeriod: 30, dotPeak: 8,   // 圓點半徑 = 5.5 + 1.4 × cos(2π (幀 − 8) ÷ 30)，一輪呼吸 2 次
  // 放大倍率（幀 → 倍率），倍率到 2 時，加進來的半格距格線就變成新的主格線
  zoom: [[0,1],[8,1],[10,1.019],[12,1.034],[14,1.045],[16,1.075],[18,1.108],[20,1.146],[22,1.194],[24,1.257],[26,1.325],[28,1.407],[30,1.511],[32,1.604],[34,1.679],[36,1.754],[38,1.81],[40,1.866],[42,1.903],[44,1.948],[46,1.978],[48,1.992],[50,2.02],[60,2.02]],
  subFrom: 12, subTo: 44,   // 半格距格線由淡入到全濃的幀
  loopFrames: 60,
};
// =================================

const q = new URLSearchParams(location.search);
const Z = +(q.get('z') || 1);
const card = document.getElementById('card'), cv = document.getElementById('cv');
card.style.cssText += `width:${CFG.W*Z}px;height:${CFG.H*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width = CFG.W * Z; cv.height = CFG.H * Z;
const ctx = cv.getContext('2d');

const table = (t, f) => {
  if (f <= t[0][0]) return t[0][1];
  for (let i = 1; i < t.length; i++) if (f <= t[i][0]) { const [a, b] = [t[i-1], t[i]]; return a[1] + (b[1] - a[1]) * (f - a[0]) / (b[0] - a[0]); }
  return t[t.length-1][1];
};
const sstep = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

function grid(p, alpha) {      // 以 origin 為中心、格距 p 的方格線
  ctx.globalAlpha = alpha; ctx.strokeStyle = CFG.line; ctx.lineWidth = CFG.lineWidth;
  const [ox, oy] = CFG.origin;
  ctx.beginPath();
  for (let k = -Math.ceil(ox / p) - 1; k <= Math.ceil((CFG.W - ox) / p) + 1; k++) { const x = ox + k * p; ctx.moveTo(x, -2); ctx.lineTo(x, CFG.H + 2); }
  for (let k = -Math.ceil(oy / p) - 1; k <= Math.ceil((CFG.H - oy) / p) + 1; k++) { const y = oy + k * p; ctx.moveTo(-2, y); ctx.lineTo(CFG.W + 2, y); }
  ctx.stroke(); ctx.globalAlpha = 1;
}

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  ctx.setTransform(Z, 0, 0, Z, 0, 0);
  ctx.fillStyle = CFG.bg; ctx.fillRect(0, 0, CFG.W, CFG.H);
  const s = table(CFG.zoom, f), p = CFG.pitch * s;
  grid(p, .95);                                              // 原本的格線隨拍子放大
  grid(p / 2, .95 * sstep((f - CFG.subFrom) / (CFG.subTo - CFG.subFrom)));   // 新長出來的半格距格線
  const r = CFG.dotR0 + CFG.dotR1 * Math.cos(2 * Math.PI * (f - CFG.dotPeak) / CFG.dotPeriod);
  ctx.fillStyle = CFG.dot; ctx.beginPath(); ctx.arc(CFG.dotC[0], CFG.dotC[1], r, 0, 6.2832); ctx.fill();
}

if (q.has('t')) render(+q.get('t'));
else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
</script>
</body>
</html>
