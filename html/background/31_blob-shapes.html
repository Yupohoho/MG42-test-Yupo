<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B31 Blob Shapes</title>
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; transform-origin:0 0; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="card"><canvas id="cv"></canvas></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#f4f0e6',
  purple: '#b898fd', dark: '#302f32',
  // 四團軟塊：圓心 x、y、半徑 r、橢圓變形 a2、b2 都是隨時間的曲線
  // 係數 = [平均, cos1, sin1, cos2, sin2]：值(幀) = 平均 + cos1×cos(2π·幀÷60) + sin1×sin(2π·幀÷60) + cos2×cos(4π·幀÷60) + sin2×sin(4π·幀÷60)
  // 輪廓 = r(θ) = 半徑 + a2×cos 2θ + b2×sin 2θ（θ 是繞圓心的角度），所以是半徑起伏約 ±3 px、被擠成斜橢圓的圓
  blobs: [
    { color: 'purple', x: [74.251,-0.082,16.071], y: [53.488,9.125,0.009],
      r: [26.828,0.03,0.05,-0.162,2.896], a2: [0.006,0.009,-0.008,0.036,0.027], b2: [-0.258,-0.98,-0.092,1.414,-0.014] },
    { color: 'purple', x: [154.258,14.306,-6.855], y: [73.42,-8.714,2.251],
      r: [23.421,0.048,-0.079,2.129,-1.08], a2: [0.084,-0.156,0.039,0.119,-0.004], b2: [-0.125,0.924,0.034,1.195,0.021] },
    { color: 'dark', x: [220.85,13.617,8.495], y: [40.231,-1.029,-9.015],
      r: [30.052,0.009,-0.054,2.934,1.814], a2: [0.004,0.017,-0.05,0.029,-0.002], b2: [-0.251,0.034,1.138,-1.569,0.026] },
    { color: 'dark', x: [280.888,1.882,-15.554], y: [73.504,3.445,8.441],
      r: [20.046,-0.047,0.024,0.427,-2.176], a2: [-0.002,-0.021,0,0.026,0.015], b2: [-0.194,0.093,-0.741,-1.035,0.003] },
  ],
  loopFrames: 60,
};
// =================================

const q = new URLSearchParams(location.search);
const Z = +(q.get('z') || 1);
const card = document.getElementById('card'), cv = document.getElementById('cv');
card.style.cssText += `width:${CFG.W*Z}px;height:${CFG.H*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width = CFG.W * Z; cv.height = CFG.H * Z;
const ctx = cv.getContext('2d');

const TAU = Math.PI * 2;
const series = (c, f) => { let v = c[0]; for (let h = 1; 2 * h < c.length; h++) v += c[2 * h - 1] * Math.cos(TAU * h * f / 60) + c[2 * h] * Math.sin(TAU * h * f / 60); return v; };

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  ctx.setTransform(Z, 0, 0, Z, 0, 0);
  ctx.fillStyle = CFG.bg; ctx.fillRect(0, 0, CFG.W, CFG.H);
  for (const b of CFG.blobs) {
    const cx = series(b.x, f), cy = series(b.y, f), r = series(b.r, f), a2 = series(b.a2, f), b2 = series(b.b2, f);
    ctx.fillStyle = CFG[b.color]; ctx.beginPath();
    for (let i = 0; i <= 72; i++) { const a = i / 72 * TAU, rr = r + a2 * Math.cos(2 * a) + b2 * Math.sin(2 * a); const x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.closePath(); ctx.fill();
  }
}

if (q.has('t')) render(+q.get('t'));
else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
</script>
</body>
</html>
