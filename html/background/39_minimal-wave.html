<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B39 Minimal Wave</title>
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; transform-origin:0 0; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="card"><canvas id="cv"></canvas></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#f4f0e8',
  orange: '#ff883c', orangeWidth: 17.3,       // 上面那條粗橘色波線
  gray: '#706b64', grayWidth: 2.2,            // 下面那條細灰線（跟橘線同一種波，只是往下平移）
  wavelength: 186.5, amp: 22.2,
  midOrange: 53.5, midGray: 81.4,
  phase0: .24,                                // 第 0 幀的相位（弧度）
  loopFrames: 59,                             // 一輪：波整體往右剛好移一個波長
};
// =================================

const q = new URLSearchParams(location.search);
const Z = +(q.get('z') || 1);
const card = document.getElementById('card'), cv = document.getElementById('cv');
card.style.cssText += `width:${CFG.W*Z}px;height:${CFG.H*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width = CFG.W * Z; cv.height = CFG.H * Z;
const ctx = cv.getContext('2d');

function wave(mid, color, width, ph) {
  const k = 2 * Math.PI / CFG.wavelength;
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
  ctx.beginPath();
  for (let x = -12; x <= CFG.W + 12; x += 2) { const y = mid + CFG.amp * Math.sin(k * x + ph); x === -12 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke();
}

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames, ph = CFG.phase0 - 2 * Math.PI * f / CFG.loopFrames;
  ctx.setTransform(Z, 0, 0, Z, 0, 0);
  ctx.fillStyle = CFG.bg; ctx.fillRect(0, 0, CFG.W, CFG.H);
  wave(CFG.midGray, CFG.gray, CFG.grayWidth, ph);
  wave(CFG.midOrange, CFG.orange, CFG.orangeWidth, ph);
}

if (q.has('t')) render(+q.get('t'));
else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
</script>
</body>
</html>
