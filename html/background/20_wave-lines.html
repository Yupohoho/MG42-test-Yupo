<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B20 Wave Lines</title>
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; transform-origin:0 0; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="card"><canvas id="cv"></canvas></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#14181e',
  yellow: [255, 200, 40], white: [245, 245, 250],
  lambda: 224,                 // 波長（px），每一條線都是同一個波長的正弦曲線
  loopFrames: 58,              // 一輪：整片波往左剛好走一個波長
  // 10 條線由上往下，第 0、3、6、9 條是黃線，其餘是白線；越下面越亮、越粗（不透明度 0.5 → 1）
  alpha0: .5, alphaStep: .055, width0: 1.5, widthStep: .08,
  // 每條線：y(x, 幀) = 平均高度 + Re[ (c1·e^{iθ} + c0 + cm·e^{−iθ}) · e^{i2πx/λ} ]，θ = 2π × 幀 ÷ 一輪
  // m0 平均高度，m1 = 平均高度隨一輪的上下起伏（複數 [實, 虛]）；
  // c1 = 往左跑的主波，c0 = 不動的波，cm = 往右跑的小波（三個都是複數 [實, 虛]，單位 px）
  lines: [
    { m0: 17.29, m1: [4.79,0.66], c1: [-1.86,-8.43], c0: [1.73,0.15], cm: [-0.89,0.53] },
    { m0: 25.68, m1: [4.5,0.79], c1: [2.75,-9.46], c0: [1.23,0.17], cm: [-1.33,0.34] },
    { m0: 33.88, m1: [4.41,0.34], c1: [7.85,-8.36], c0: [0.53,0.16], cm: [-1.45,0.39] },
    { m0: 41.82, m1: [4.11,-0.75], c1: [11.33,-4.79], c0: [-0.55,0.39], cm: [-1.35,1.1] },
    { m0: 50.11, m1: [4.01,-1.47], c1: [12.44,0.67], c0: [-1.04,0.52], cm: [-1.23,1.47] },
    { m0: 58.9, m1: [4.1,-1.52], c1: [10.96,6.67], c0: [-0.96,0.19], cm: [-1.29,1.41] },
    { m0: 68.45, m1: [4.35,-0.53], c1: [7.03,12.07], c0: [-0.16,-0.41], cm: [-1.38,0.68] },
    { m0: 77.2, m1: [4.03,-0.38], c1: [1.28,14.18], c0: [0.06,-0.53], cm: [-1.7,1.03] },
    { m0: 84.05, m1: [4.18,-0.16], c1: [-8.85,11.73], c0: [0.02,-0.92], cm: [-1.54,0.49] },
    { m0: 93.24, m1: [4.91,-0.52], c1: [-10.97,6.49], c0: [1.53,-1.41], cm: [-1.13,-0.93] },
  ],
};
// =================================

const q = new URLSearchParams(location.search);
const Z = +(q.get('z') || 1);
const card = document.getElementById('card'), cv = document.getElementById('cv');
card.style.cssText += `width:${CFG.W*Z}px;height:${CFG.H*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width = CFG.W * Z; cv.height = CFG.H * Z;
const ctx = cv.getContext('2d');

const mul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  const th = 2 * Math.PI * f / CFG.loopFrames, e1 = [Math.cos(th), Math.sin(th)], em = [Math.cos(th), -Math.sin(th)];
  ctx.setTransform(Z, 0, 0, Z, 0, 0);
  ctx.fillStyle = CFG.bg; ctx.fillRect(0, 0, CFG.W, CFG.H);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  CFG.lines.forEach((ln, i) => {
    const c = [0, 1].map(k => mul(ln.c1, e1)[k] + ln.c0[k] + mul(ln.cm, em)[k]);
    const m = ln.m0 + mul(ln.m1, e1)[0];
    const [r, g, b] = i % 3 === 0 ? CFG.yellow : CFG.white;
    ctx.strokeStyle = `rgba(${r},${g},${b},${Math.min(1, CFG.alpha0 + CFG.alphaStep * i).toFixed(3)})`;
    ctx.lineWidth = CFG.width0 + CFG.widthStep * i;
    ctx.beginPath();
    for (let x = -2; x <= CFG.W + 2; x += 2) {
      const a = 2 * Math.PI * x / CFG.lambda;
      const y = m + c[0] * Math.cos(a) - c[1] * Math.sin(a);
      x === -2 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  });
}

if (q.has('t')) render(+q.get('t'));
else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
</script>
</body>
</html>
