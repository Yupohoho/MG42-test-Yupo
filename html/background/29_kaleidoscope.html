<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B29 Kaleidoscope</title>
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; transform-origin:0 0; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="card"><canvas id="cv"></canvas></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#14181e',
  cream: '#d2cfca', purple: '#b595fb',
  center: [162.3, 53.3],
  petals: 8,                             // 8 片三角形，每 45° 一片，奇偶交替奶油、紫
  baseW: 40,                             // 每片三角形外緣（底邊）的寬度，固定不變；尖端在中心
  spin: .7532,                           // 整體每幀順時針轉 0.7532°，60 幀轉 45°
  // 以下四條是「第 0–59 幀」逐幀的值：
  reach: [86.1,86.9,89.1,90.5,92.6,93.9,96.5,98.5,100,101.2,101,101.5,103,105.5,107,107.1,106.5,106.5,105.6,104.7,103.1,101.8,100.7,99,97.6,95.8,94.2,92.2,89.6,87.3,84.6,82.7,80.5,79.1,76.7,74.8,72.9,71.8,70.3,68.7,67.4,66.2,65.3,63.9,63.2,62.5,62.8,63.8,64.6,65.8,67.1,68,68.5,69.6,71.9,74.1,75.3,76.3,78.3,79.5],   // 三角形長度（中心到底邊），在 62–107 之間一伸一縮
  dotR: [57.3,57.2,57.4,57,55.9,56,58.4,62.3,65.7,68.1,68.8,68.5,66.8,67.4,68.5,69.2,70,70.1,70,67.5,67,66.1,65.2,63.4,62.4,62.3,61.5,60.1,59.4,57.6,57.2,56.1,57.3,56.6,54.6,50.8,47.3,45.5,44.5,44.1,43.7,43.3,42.7,41.8,41,40.4,41,40.6,41.5,42.1,43.5,44.3,44.9,45.6,46.8,48.4,50.3,51.6,52.7,53],   // 黑點到中心的距離
  dotAng: [12.6,12.4,13.1,14.4,18.9,23.9,28,29.7,30.2,31.5,34.6,38.1,41,43,45,46.3,46.1,46.7,47.6,49.4,50.2,50.8,53.5,55.3,56.7,55.4,56.3,56.1,56.8,56.6,57.1,56.4,57,57.2,56.7,56.4,56.4,57,53.7,51.9,49.8,49.8,48.8,47.7,46.5,44.7,43.4,41.2,40,38.3,37.3,36.1,35.4,35.2,34.4,33.9,32.9,33.1,32.5,33],   // 黑點相對自己那片三角形軸線的偏角（度）：奶油片往 +、紫片往 −，兩邊鏡像
  dotSize: [8.3,8.3,8.4,8.2,8.1,7.8,7.7,7.5,7.5,7.6,8,8.3,8.4,8.3,8.4,8.5,8.8,9,9.4,9.5,9.6,9.6,9.6,9.5,9.3,8.9,8.6,8.4,8.5,8.5,8.6,8.7,8.9,9,8.8,8.6,8.3,7.9,7.4,6.7,6.5,6.4,6.9,7.4,7.9,8.3,8.6,9.1,9,9,8.7,8.8,8.6,8.5,8.5,8.4,8.3,7.8,8,8],   // 黑點半徑（約 8.4）
  loopFrames: 60,                        // 第 60 幀直接切回第 0 幀（原片就是硬切：轉角 45° 加上奇偶兩色互換，看起來幾乎一樣）
};
// =================================

const q = new URLSearchParams(location.search);
const Z = +(q.get('z') || 1);
const card = document.getElementById('card'), cv = document.getElementById('cv');
card.style.cssText += `width:${CFG.W*Z}px;height:${CFG.H*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width = CFG.W * Z; cv.height = CFG.H * Z;
const ctx = cv.getContext('2d');

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  ctx.setTransform(Z, 0, 0, Z, 0, 0);
  ctx.fillStyle = CFG.bg; ctx.fillRect(0, 0, CFG.W, CFG.H);
  const [cx, cy] = CFG.center, L = CFG.reach[f], psi = CFG.spin * f, n = CFG.petals, hw = CFG.baseW / 2;
  for (let k = 0; k < n; k++) {
    const a = (psi + 360 / n * k) * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a), vx = -uy, vy = ux;
    ctx.fillStyle = k % 2 ? CFG.purple : CFG.cream;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + L * ux + hw * vx, cy + L * uy + hw * vy); ctx.lineTo(cx + L * ux - hw * vx, cy + L * uy - hw * vy); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = CFG.bg;                                    // 黑點其實是和背景同色的圓，蓋在三角形上挖出缺口
  for (let k = 0; k < n; k++) {
    const a = (psi + 360 / n * k + (k % 2 ? -1 : 1) * CFG.dotAng[f]) * Math.PI / 180;
    ctx.beginPath(); ctx.arc(cx + CFG.dotR[f] * Math.cos(a), cy + CFG.dotR[f] * Math.sin(a), CFG.dotSize[f], 0, 6.2832); ctx.fill();
  }
}

if (q.has('t')) render(+q.get('t'));
else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
</script>
</body>
</html>
