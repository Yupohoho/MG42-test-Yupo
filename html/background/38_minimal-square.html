<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B38 Minimal Square</title>
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; transform-origin:0 0; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="card"><canvas id="cv"></canvas></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#ff883c',
  cream: '#f4f0e6', ink: '#0c0e12',
  center: [161.5, 53.5],
  creamSide: 56,                 // 奶油色實心方塊的邊長
  frameSide: 78, frameWidth: 3,  // 黑色外框方塊（只有線）
  // 一次「卡」的轉動：進度（幀 → 倍率，1 = 90°）；先衝過頭約 12° 再彈回來
  click: [[0,0],[1,.41],[2,.71],[3,.93],[4,1.06],[5,1.115],[6,1.127],[7,1.108],[8,1.073],[9,1.032],[10,1.01],[11,1.003],[12,1]],
  // 奶油方塊：第 0 幀起先往反方向「溜」8.3°（9 幀、先快後慢），第 15 幀起順時針卡到 90°
  windUp: -8.3, windFrames: 9, creamClick: 15,
  // 外框：沒有溜，第 18 幀起順時針卡到 90°（比奶油方塊晚 3 幀）
  frameClick: 18,
  loopFrames: 30,                // 一輪 30 幀：兩個方塊各轉 90°（正方形轉 90° 與原樣重疊，所以接得起來）
};
// =================================

const q = new URLSearchParams(location.search);
const Z = +(q.get('z') || 1);
const card = document.getElementById('card'), cv = document.getElementById('cv');
card.style.cssText += `width:${CFG.W*Z}px;height:${CFG.H*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width = CFG.W * Z; cv.height = CFG.H * Z;
const ctx = cv.getContext('2d');

const table = (t, f) => {
  if (f <= t[0][0]) return t[0][1];
  for (let i = 1; i < t.length; i++) if (f <= t[i][0]) { const [a, b] = [t[i-1], t[i]]; return a[1] + (b[1] - a[1]) * (f - a[0]) / (b[0] - a[0]); }
  return t[t.length-1][1];
};
const creamAngle = f => {
  const w = CFG.windUp * (1 - Math.pow(1 - Math.min(f, CFG.windFrames) / CFG.windFrames, 2));
  return f < CFG.creamClick ? w : CFG.windUp + (90 - CFG.windUp) * table(CFG.click, f - CFG.creamClick);
};
const frameAngle = f => f < CFG.frameClick ? 0 : 90 * table(CFG.click, f - CFG.frameClick);

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames, [cx, cy] = CFG.center, rad = Math.PI / 180;
  ctx.setTransform(Z, 0, 0, Z, 0, 0);
  ctx.fillStyle = CFG.bg; ctx.fillRect(0, 0, CFG.W, CFG.H);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(frameAngle(f) * rad);
  ctx.strokeStyle = CFG.ink; ctx.lineWidth = CFG.frameWidth; ctx.lineJoin = 'miter';
  const a = CFG.frameSide / 2; ctx.strokeRect(-a, -a, CFG.frameSide, CFG.frameSide);
  ctx.restore();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(creamAngle(f) * rad);
  ctx.fillStyle = CFG.cream; const b = CFG.creamSide / 2; ctx.fillRect(-b, -b, CFG.creamSide, CFG.creamSide);
  ctx.restore();
}

if (q.has('t')) render(+q.get('t'));
else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
</script>
</body>
</html>
