<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B24 Crosshatch</title>
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; transform-origin:0 0; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="card"><canvas id="cv"></canvas></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#1a181c',
  // 兩層 45° 斜線：黃色層「／」、白色層「＼」，兩層橫向間距都是 13.333 px（沿垂直線方向約 9.43 px）。
  // 黃色層整層往右下平移、白色層往左下平移，速度一樣（每幀 0.3175 px），所以兩層交叉點的位置一直在變，像莫列波紋閃動。
  pitch: 13.3333,
  yellow: { color: [224, 210, 110],  width: 1.3, c0: 6.8 },   // 黃線：x + y = c0 + 速度 × 幀 + 13.333 × 整數
  white:  { color: [248, 244, 238], width: 1.3, c0: 9.8 },   // 白線：x − y = c0 − 速度 × 幀 + 13.333 × 整數
  speed: .3175,
  loopFrames: 42,                                           // 一輪 42 幀：兩層各剛好平移一格（13.333 px）
};
// =================================

const q = new URLSearchParams(location.search);
const Z = +(q.get('z') || 1);
const card = document.getElementById('card'), cv = document.getElementById('cv');
card.style.cssText += `width:${CFG.W*Z}px;height:${CFG.H*Z}px;border-radius:${12*Z}px;background:${CFG.bg}`;
cv.width = CFG.W * Z; cv.height = CFG.H * Z;
const ctx = cv.getContext('2d');

function family(layer, sign, f) {
  // sign = +1：x + y = c（／）；sign = −1：x − y = c（＼）
  const P = CFG.pitch, shift = CFG.speed * f * (sign > 0 ? 1 : -1);
  ctx.strokeStyle = `rgb(${layer.color})`; ctx.lineWidth = layer.width;
  ctx.beginPath();
  const y0 = -10, y1 = CFG.H + 10;
  for (let m = -12; m <= 36; m++) {
    const c = layer.c0 + shift + P * m;
    if (sign > 0) { ctx.moveTo(c - y0, y0); ctx.lineTo(c - y1, y1); }
    else { ctx.moveTo(c + y0, y0); ctx.lineTo(c + y1, y1); }
  }
  ctx.stroke();
}
function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  ctx.setTransform(Z, 0, 0, Z, 0, 0);
  ctx.fillStyle = CFG.bg; ctx.fillRect(0, 0, CFG.W, CFG.H);
  family(CFG.yellow, +1, f);
  family(CFG.white, -1, f);
}

if (q.has('t')) render(+q.get('t'));
else { const t0 = performance.now(); (function f(now){ render((now - t0) / 1000); requestAnimationFrame(f); })(t0); }
</script>
</body>
</html>
