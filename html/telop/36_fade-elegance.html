<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TL36 Fade Elegance</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #txt { position:absolute; white-space:nowrap; line-height:1; font-family:'Noto Serif JP',serif; font-weight:500; }
</style>
</head>
<body>
<div id="card"><div id="txt"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'ゆっくりと現れる',
  W: 324, H: 106,
  bg: '#14181e',
  color: '#eef0f4',        // 字色（偏白）
  fontSize: 30, spacing: 3.1, cx: 159.5, cy: 53.5,
  // 入場：第 6 幀起，由很糊、很淡慢慢變清楚、變實（約 20 幀）；字位置不動
  inFrom: 6,
  inOpacity: [.24,.32,.38,.45,.51,.58,.62,.68,.71,.77,.79,.83,.85,.89,.9,.93,.94,.97,.97,1.0],
  inBlur: [6,5.5,5,4.2,3.3,3.0,2.7,2.4,2.1,1.95,1.8,1.55,1.3,1.15,1.0,.9,.85,.65,.5,.35,.2,.1],   // 已用「文字邊緣銳利度」量測校準
  // 收尾：第 54–58 幀逐步變淡，同時略微變糊（模糊 0 → 約 1.5px）
  fade: [.84,.6,.34,.2,.04], fadeBlur: [0,.5,1,1.2,1.5], fadeFrom: 54,
  loopFrames: 59,          // 一輪 59 幀（約 1.97 秒）
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), txt = document.getElementById('txt');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
txt.textContent = CFG.text;
Object.assign(txt.style, { color: CFG.color, fontSize: CFG.fontSize+'px', letterSpacing: CFG.spacing+'px' });
function place() { txt.style.left = (CFG.cx - txt.offsetWidth/2 + CFG.spacing/2)+'px'; txt.style.top = (CFG.cy - txt.offsetHeight/2)+'px'; }

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  const k = f - CFG.inFrom;
  let o = 0, bl = 0;
  if (k >= 0) { const i = Math.min(k, CFG.inOpacity.length - 1); o = CFG.inOpacity[i]; bl = k < CFG.inBlur.length ? CFG.inBlur[k] : 0; }
  if (f >= CFG.fadeFrom) { const j = f - CFG.fadeFrom; o = j < CFG.fade.length ? CFG.fade[j] : 0; bl = j < CFG.fadeBlur.length ? CFG.fadeBlur[j] : 0; }
  txt.style.opacity = o; txt.style.filter = bl ? `blur(${bl}px)` : 'none';
}

const start = () => {
  place();
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function r(now){ render((now - t0) / 1000); requestAnimationFrame(r); })(t0); }
};
document.fonts.load(`500 ${CFG.fontSize}px "Noto Serif JP"`, CFG.text).then(start);
</script>
</body>
</html>
