<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TL12 Highlight Marker</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #mk { position:absolute; transform-origin:0 50%; }
  #txt { position:absolute; left:0; top:0; width:0; height:0; }
  #txt svg { position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; }
</style>
</head>
<body>
<div id="card"><div id="mk"></div><div id="txt"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'ここがポイント',
  W: 324, H: 106,
  bg: '#14161c',
  color: '#f2efe6',        // 字色
  stroke: '#0c0d10', strokeW: 2.5,   // 字的深色描邊（在深色底上看不見，壓在螢光筆上才顯出來）
  marker: '#ffc83a',       // 螢光筆色
  mx: 36, my: 49, mw: 251, mh: 20,   // 螢光筆（終點位置與大小）
  fontSize: 35, weight: 900, cx: 161, cy: 53, spacing: 0,
  // 文字：第 4–11 幀由淡到實，同時由下往上微升 4px
  textFrom: 4, textIn: 8, rise: 4,
  // 螢光筆：第 15 幀起從左往右刷出（走完全程的比例，先慢、中間快、尾端慢）
  markFrom: 15, markProg: [0,.03,.09,.18,.36,.62,.79,.88,.96,.985,1],
  // 收尾：第 54–57 幀文字與螢光筆一起逐步變淡，第 58 幀消失
  fade: [.55,.38,.22,.1], fadeFrom: 54,
  loopFrames: 59,          // 一輪 59 幀（約 1.97 秒）
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), mk = document.getElementById('mk'), txt = document.getElementById('txt');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
Object.assign(mk.style, { left: CFG.mx+'px', top: CFG.my+'px', width: CFG.mw+'px', height: CFG.mh+'px', background: CFG.marker });
// 字用 SVG 文字＋圓角描邊（HTML 文字描邊轉折會長尖刺）
const NS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(NS, 'svg');
for (const [fill, sw] of [[CFG.stroke, CFG.strokeW*2], [CFG.color, 0]]) {
  const tx = document.createElementNS(NS, 'text'); tx.textContent = CFG.text;
  for (const [k, v] of Object.entries({ x: 0, y: 0, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-family': "'Zen Maru Gothic',sans-serif", 'font-weight': CFG.weight,
    'font-size': CFG.fontSize, 'letter-spacing': CFG.spacing, fill, stroke: sw ? fill : 'none', 'stroke-width': sw,
    'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'paint-order': 'stroke fill' })) tx.setAttribute(k, v);
  svg.appendChild(tx);
}
txt.appendChild(svg);
txt.style.left = CFG.cx+'px'; txt.style.top = CFG.cy+'px';

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  let g = 1;
  if (f >= CFG.fadeFrom) g = f - CFG.fadeFrom < CFG.fade.length ? CFG.fade[f - CFG.fadeFrom] : 0;
  // 文字
  const k = f - CFG.textFrom;
  let o = k < 0 ? 0 : Math.min(1, (k + 1) / CFG.textIn), dy = k < 0 ? CFG.rise : CFG.rise * Math.max(0, 1 - (k + 1) / CFG.textIn);
  txt.style.opacity = o * g; txt.style.transform = `translateY(${dy}px)`;
  // 螢光筆
  const m = f - CFG.markFrom;
  const p = m < 0 ? 0 : m >= CFG.markProg.length ? 1 : CFG.markProg[m];
  mk.style.transform = `scaleX(${Math.max(p, 0.0001)})`; mk.style.opacity = (p > 0 ? 1 : 0) * g;
}

const start = () => {
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function r(now){ render((now - t0) / 1000); requestAnimationFrame(r); })(t0); }
};
document.fonts.load(`${CFG.weight} ${CFG.fontSize}px "Zen Maru Gothic"`, CFG.text).then(start);
</script>
</body>
</html>
