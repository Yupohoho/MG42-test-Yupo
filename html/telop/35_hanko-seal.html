<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TL35 Hanko Seal</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #seal { position:absolute; left:0; top:0; width:0; height:0; }
  #seal > div { position:absolute; box-sizing:border-box; }
  .ch { position:absolute; width:40px; text-align:center; line-height:1; font-family:'Noto Serif JP',serif; font-weight:900; }
</style>
</head>
<body>
<div id="card"><div id="seal"><div id="outer"></div><div id="inner"></div><div id="c1" class="ch"></div><div id="c2" class="ch"></div></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  chars: ['承', '認'],
  W: 324, H: 106,
  bg: '#f6f0e6',
  red: '#d8302d',          // 朱色
  size: 79.7, outerW: 4, outerR: 11,     // 朱印外框：邊長、外框粗細、圓角
  innerInset: 9, innerW: 1.3, innerR: 5, // 內框：離外框的距離、粗細、圓角
  fontSize: 27, charY: [-17, 16],        // 兩個字的大小與垂直位置（相對印中心，上下各一個）
  cx: 163.5, cy: 53.5,
  rot: -3.5,               // 印整體略微逆時針傾斜（度）
  // 蓋章：第 9 幀起從超大、模糊、很淡的狀態「啪」地落下：[大小, 不透明度, 模糊px, 傾斜度]
  stamp: [[2.5,.25,6,-2.6],[1.95,.49,3,-2.6],[1.114,1,0,-2.6],[1.04,1,0,-3.5],[1.056,1,0,-3.5],[1.05,1,0,-3.5],[1.015,1,0,-3.5]],
  stampFrom: 9,
  // 收尾：第 54–56 幀整個印逐步變淡（第 56 幀略縮小到 0.95），第 57 幀起空白
  fade: [.88,.64,.4], fadeScale: [1,1,.95], fadeFrom: 54,
  loopFrames: 59,          // 一輪 59 幀（約 1.97 秒）
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), seal = document.getElementById('seal');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
seal.style.left = CFG.cx+'px'; seal.style.top = CFG.cy+'px';
const S = CFG.size;
Object.assign(document.getElementById('outer').style, { left: -S/2+'px', top: -S/2+'px', width: S+'px', height: S+'px', border: `${CFG.outerW}px solid ${CFG.red}`, borderRadius: CFG.outerR+'px' });
const ii = S - CFG.innerInset * 2;
Object.assign(document.getElementById('inner').style, { left: -ii/2+'px', top: -ii/2+'px', width: ii+'px', height: ii+'px', border: `${CFG.innerW}px solid ${CFG.red}`, borderRadius: CFG.innerR+'px' });
[document.getElementById('c1'), document.getElementById('c2')].forEach((el, i) => {
  el.textContent = CFG.chars[i]; Object.assign(el.style, { color: CFG.red, fontSize: CFG.fontSize+'px', left: '-20px', top: (CFG.charY[i] - CFG.fontSize/2)+'px' });
});

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  let s = 1, o = 0, bl = 0, rot = CFG.rot;
  const k = f - CFG.stampFrom;
  if (k >= 0) { const i = Math.min(k, CFG.stamp.length - 1); [s, o, bl, rot] = CFG.stamp[i]; }
  if (f >= CFG.fadeFrom) { const j = f - CFG.fadeFrom; if (j < CFG.fade.length) { o = CFG.fade[j]; s = CFG.fadeScale[j]; bl = 0; rot = CFG.rot; } else o = 0; }
  seal.style.opacity = o; seal.style.filter = bl ? `blur(${bl}px)` : 'none';
  seal.style.transform = `rotate(${rot}deg) scale(${s})`;
}

const start = () => {
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function r(now){ render((now - t0) / 1000); requestAnimationFrame(r); })(t0); }
};
document.fonts.load('900 27px "Noto Serif JP"', CFG.chars.join('')).then(start);
</script>
</body>
</html>
