<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TL40 End Credit</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #list { position:absolute; left:0; top:0; width:100%; height:100%; }
  .row { position:absolute; left:0; width:100%; display:flex; justify-content:center; align-items:center; gap:20px; white-space:nowrap; line-height:1;
         font-family:'Noto Sans JP',sans-serif; font-weight:700; letter-spacing:3px; color:#ffffff; }
</style>
</head>
<body>
<div id="card"><div id="list"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  // 每列：[職稱, 姓名]；依序由上往下排，捲完一圈（5 列 × 24px = 120px）剛好接回開頭
  rows: [['出演', '山田 太郎'], ['撮影', '佐藤 花子'], ['編集', '鈴木 一郎'], ['音楽', '田中 美咲'], ['制作', 'ゆのん']],
  W: 324, H: 106,
  bg: '#15191f',
  fontSize: 14,
  pitch: 24,               // 列距（px）
  y0: 22,                  // 第 0 幀第一列的垂直中心
  cx: 160.5,               // 列的水平中心（整列置中：職稱＋間隔＋姓名）
  speed: 2,                // 往上捲動，每幀 2px
  // 上下邊緣淡出：上方 0–20px 由透明到不透明，下方 86–106px 由不透明到透明
  fadeTop: 20, fadeBottomFrom: 86,
  loopFrames: 60,          // 一輪 60 幀（2 秒），一輪剛好捲動 120px = 5 列
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), list = document.getElementById('list');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
const m = `linear-gradient(to bottom, transparent 0, #000 ${CFG.fadeTop}px, #000 ${CFG.fadeBottomFrom}px, transparent ${CFG.H}px)`;
list.style.webkitMaskImage = m; list.style.maskImage = m;
const rows = CFG.rows.map(([a, b]) => {
  const el = document.createElement('div'); el.className = 'row'; el.style.fontSize = CFG.fontSize+'px';
  el.style.left = (CFG.cx - CFG.W/2)+'px';   // 水平中心偏移
  const s1 = document.createElement('span'); s1.textContent = a; const s2 = document.createElement('span'); s2.textContent = b;
  el.appendChild(s1); el.appendChild(s2); list.appendChild(el); return el;
});
const total = CFG.pitch * CFG.rows.length;

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  rows.forEach((el, k) => {
    const y = (((CFG.y0 + CFG.pitch * k - CFG.speed * f) % total) + total) % total;
    el.style.top = (y - el.offsetHeight/2)+'px';
    el.style.visibility = y < CFG.H + 12 ? 'visible' : 'hidden';
  });
}

const start = () => {
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function r(now){ render((now - t0) / 1000); requestAnimationFrame(r); })(t0); }
};
document.fonts.load(`700 ${CFG.fontSize}px "Noto Sans JP"`, '出演山田太郎撮影佐藤花子編集鈴木一郎音楽田中美咲制作ゆのん').then(start);
</script>
</body>
</html>
