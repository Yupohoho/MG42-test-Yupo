<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TL19 Yellow Subtitle</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #sub { position:absolute; left:0; top:0; width:0; height:0; }
  #sub svg { position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; }
</style>
</head>
<body>
<div id="card"><div id="sub"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: '映画風の黄色字幕',
  W: 324, H: 106,
  bg: '#f4f0e6',
  color: '#fbe14c',        // 字色（黃）
  stroke: '#20160c', strokeW: 1.8,   // 深色描邊
  shadow: 'rgba(32,22,12,.55)', shadowDx: 1, shadowDy: 1.5,  // 往右下的影子
  fontSize: 24, spacing: 1, cx: 163, cy: 76,
  // 入場：第 5 幀起由淡到實（約 10 幀），位置不動
  inFrom: 5, inOpacity: [.3,.45,.52,.6,.67,.76,.87,.93,.97,1.0],
  // 淡出：第 54–57 幀逐步變淡並微微模糊，第 58 幀消失
  fade: [.87,.6,.46,.33], blur: [0,.5,1,1.5], fadeFrom: 54,
  loopFrames: 60,          // 一輪 60 幀（約 2.0 秒）
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), sub = document.getElementById('sub');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
sub.style.left = CFG.cx+'px'; sub.style.top = CFG.cy+'px';
// 描邊字用 SVG 文字＋圓角連接（HTML 文字的描邊轉折會長尖刺）
const NS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(NS, 'svg');
const layers = [
  { fill: CFG.shadow, sw: CFG.strokeW*2, dx: CFG.shadowDx, dy: CFG.shadowDy },
  { fill: CFG.stroke, sw: CFG.strokeW*2, dx: 0, dy: 0 },
  { fill: CFG.color, sw: 0, dx: 0, dy: 0 },
];
for (const L of layers) {
  const tx = document.createElementNS(NS, 'text'); tx.textContent = CFG.text;
  for (const [k, v] of Object.entries({ x: L.dx + CFG.spacing/2, y: L.dy, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-family': "'Noto Sans JP',sans-serif", 'font-weight': 900,
    'font-size': CFG.fontSize, 'letter-spacing': CFG.spacing, fill: L.fill, stroke: L.sw ? L.fill : 'none', 'stroke-width': L.sw, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'paint-order': 'stroke fill' })) tx.setAttribute(k, v);
  svg.appendChild(tx);
}
sub.appendChild(svg);

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  const k = f - CFG.inFrom;
  let o = k < 0 ? 0 : CFG.inOpacity[Math.min(k, CFG.inOpacity.length - 1)], bl = 0;
  if (f >= CFG.fadeFrom) { const j = f - CFG.fadeFrom; o = j < CFG.fade.length ? CFG.fade[j] : 0; bl = j < CFG.blur.length ? CFG.blur[j] : 0; }
  sub.style.opacity = o; sub.style.filter = bl ? `blur(${bl}px)` : 'none';
}

const start = () => {
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function r(now){ render((now - t0) / 1000); requestAnimationFrame(r); })(t0); }
};
document.fonts.load(`900 ${CFG.fontSize}px "Noto Sans JP"`, CFG.text).then(start);
</script>
</body>
</html>
