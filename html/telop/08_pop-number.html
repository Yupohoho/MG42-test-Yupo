<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TL08 Pop Number</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #card > div { position:absolute; left:0; top:0; white-space:nowrap; line-height:1; transform-origin:50% 50%; }
  .dela { font-family:'Dela Gothic One',sans-serif; }
</style>
</head>
<body>
<div id="card"><div id="n" class="dela"></div><div id="d" class="dela"></div><div id="u" class="dela"></div><div id="r"></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  W: 324, H: 106,
  bg: '#14161c',
  num:  { text: '1',  color: '#ff5a5f', shadow: '#0a0b10', fontSize: 106, cx: 141.5, cy: 55 },  // 大數字（中心）
  pre:  { text: '第',  color: '#f4efe4', fontSize: 22, cx: 91,  cy: 33 },                         // 數字左上的小字
  post: { text: '位',  color: '#f4efe4', fontSize: 34, cx: 191, cy: 81 },                         // 數字右下的單位
  sub:  { text: '人気ランキング', color: '#f4efe4', fontSize: 16, right: 310, cy: 54.5 },         // 右側說明（右緣對齊）
  // 數字彈出：從第 4 幀起每幀縮放（以數字中心為準），先小、過衝、回穩
  numPop: [.36,.62,.84,.97,1.08,1.13,1.15,1.11,1.08,1.05,1.03,1.01,1.0],   // 只彈一次，過衝後平順回穩
  numCy:  [50.5,52,53,54,55],           // 前 5 幀中心 y 逐步下移到定位
  // 「第」「位」：第 11 幀起從上方滑下＋輕微模糊淡入 [不透明度, 往上偏移px, 模糊px]
  sideFrom: 11, side: [[.5,-21,1.2],[.8,-9,.6],[1,-3,.2],[1,0,0]],
  // 說明文字：第 16 幀起淡入並往左滑進 [不透明度, 往右偏移px]
  subFrom: 16, subIn: [[.3,7],[.5,6.5],[.65,5],[.78,4],[.88,3],[.94,2],[.97,1.2],[1,.5],[1,0]],
  // 淡出：第 54–57 幀整組逐步變淡，第 58 幀消失
  fade: [.84,.59,.34,.15], fadeFrom: 54,
  popAt: 4,
  loopFrames: 59,          // 一輪 59 幀（約 1.97 秒）
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
const E = { n: document.getElementById('n'), d: document.getElementById('d'), u: document.getElementById('u'), r: document.getElementById('r') };
const setup = (el, c) => { el.textContent = c.text; Object.assign(el.style, { color: c.color, fontSize: c.fontSize+'px' }); };
setup(E.n, CFG.num); setup(E.d, CFG.pre); setup(E.u, CFG.post); setup(E.r, CFG.sub);
E.n.style.textShadow = `-3px 3px 0 ${CFG.num.shadow}`;
Object.assign(E.r.style, { fontFamily: "'Noto Sans JP',sans-serif", fontWeight: 700 });
const place = (el, cx, cy, extra) => { el.style.transform = `translate(${cx - el.offsetWidth/2}px,${cy - el.offsetHeight/2}px) ${extra || ''}`; };

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  let g = 1;
  if (f >= CFG.fadeFrom) { const j = f - CFG.fadeFrom; g = j < CFG.fade.length ? CFG.fade[j] : 0; }
  const k = f - CFG.popAt;
  // 大數字
  let s = 1, cy = CFG.num.cy, no = 1;
  if (k < 0) no = 0; else { if (k < CFG.numPop.length) s = CFG.numPop[k]; if (k < CFG.numCy.length) cy = CFG.numCy[k]; }
  place(E.n, CFG.num.cx, cy, `scale(${s})`); E.n.style.opacity = no * g;
  // 第／位
  const sj = f - CFG.sideFrom;
  let so = 0, sdy = 0, sb = 0;
  if (sj >= 0) { const v = CFG.side[Math.min(sj, CFG.side.length - 1)]; so = v[0]; sdy = v[1]; sb = v[2]; }
  for (const [el, c] of [[E.d, CFG.pre], [E.u, CFG.post]]) {
    place(el, c.cx, c.cy + sdy); el.style.opacity = so * g; el.style.filter = sb ? `blur(${sb}px)` : 'none';
  }
  // 說明文字
  const rj = f - CFG.subFrom;
  let ro = 0, rdx = 0;
  if (rj >= 0) { const v = CFG.subIn[Math.min(rj, CFG.subIn.length - 1)]; ro = v[0]; rdx = v[1]; }
  place(E.r, CFG.sub.right - E.r.offsetWidth/2 + rdx, CFG.sub.cy); E.r.style.opacity = ro * g;
}

const start = () => {
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function r(now){ render((now - t0) / 1000); requestAnimationFrame(r); })(t0); }
};
Promise.all([
  document.fonts.load('106px "Dela Gothic One"', '1第位'),
  document.fonts.load('700 16px "Noto Sans JP"', CFG.sub.text),
]).then(start);
</script>
</body>
</html>
