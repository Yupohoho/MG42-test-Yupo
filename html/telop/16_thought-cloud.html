<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TL16 Thought Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#000; }
  /* ?z=2 放大觀看；?t=0.5 定格 */
  #card { position:relative; overflow:hidden; border-radius:12px; transform-origin:0 0; }
  #grp { position:absolute; left:0; top:0; width:0; height:0; }
  #grp svg { position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; }
  #txt { position:absolute; white-space:nowrap; line-height:1; font-family:'Yusei Magic',sans-serif; }
</style>
</head>
<body>
<div id="card"><div id="grp"><svg id="cl"></svg><div id="txt"></div></div></div>
<script>
// ===== 設定區：換內容只改這裡 =====
const CFG = {
  text: 'うーん…',
  W: 324, H: 106,
  bg: '#14181e',
  cloud: '#ffffff',        // 雲與小圓點
  ink: '#222124',          // 字色
  origin: [162, 40],       // 彈出與漂浮的支點（雲的中心附近）
  // 雲：用一組圓（cx, cy, r，座標是畫面 px）疊成，外輪廓 x79–245、y3–74
  lobes: [[101,41,22],[128,28,24],[161,29,26],[196,27,24],[222,36,22],[225,50,21],[198,52,22],[162,50,24],[125,52,22],[110,52,20],[162,42,34]],
  dots: [[111.5,84,5],[98,97,3.5]],     // 往左下的兩個小圓點（cx, cy, r）
  fontSize: 30, cx: 162.5, cy: 44,
  // 彈出：從第 4 幀起，整組以支點等比縮放，過衝後回穩
  pop: [.545,.74,.89,1.0,1.07,1.115,1.13,1.13,1.115,1.085,1.06,1.03,1.01,1.0], popAt: 4,
  // 停住後慢慢上下漂：第 18→52 幀往上飄約 3px 再回到原位（正弦）
  bob: { from: 18, to: 52, amp: 3 },
  // 收尾：第 54–57 幀逐步變淡，第 58 幀消失
  fade: [.78,.52,.33,.15], fadeFrom: 54,
  loopFrames: 59,          // 一輪 59 幀（約 1.97 秒）
};
// =================================

const q = new URLSearchParams(location.search);
const card = document.getElementById('card'), grp = document.getElementById('grp'), cl = document.getElementById('cl'), txt = document.getElementById('txt');
Object.assign(card.style, { width: CFG.W+'px', height: CFG.H+'px', background: CFG.bg, transform: `scale(${+(q.get('z') || 1)})` });
const [ox, oy] = CFG.origin;
grp.style.left = ox+'px'; grp.style.top = oy+'px';
cl.innerHTML = [...CFG.lobes, ...CFG.dots].map(([x, y, r]) => `<circle cx="${x-ox}" cy="${y-oy}" r="${r}" fill="${CFG.cloud}"/>`).join('');
txt.textContent = CFG.text;
Object.assign(txt.style, { color: CFG.ink, fontSize: CFG.fontSize+'px', webkitTextStroke: '1.3px '+CFG.ink });
function place() { txt.style.left = (CFG.cx - ox - txt.offsetWidth/2)+'px'; txt.style.top = (CFG.cy - oy - txt.offsetHeight/2)+'px'; }

function render(t) {
  const f = Math.floor(t * 30 + 1e-6) % CFG.loopFrames;
  const k = f - CFG.popAt;
  let s = 1, o = 1;
  if (k < 0 || f >= CFG.fadeFrom + CFG.fade.length) o = 0;
  else if (k < CFG.pop.length) s = CFG.pop[k];
  if (f >= CFG.fadeFrom && f < CFG.fadeFrom + CFG.fade.length) o = CFG.fade[f - CFG.fadeFrom];
  const b = CFG.bob, dy = (f >= b.from && f <= b.to) ? -b.amp * Math.sin(Math.PI * (f - b.from) / (b.to - b.from)) : 0;
  grp.style.opacity = o; grp.style.transform = `translateY(${dy}px) scale(${s})`;
}

const start = () => {
  place();
  if (q.has('t')) render(+q.get('t'));
  else { const t0 = performance.now(); (function rr(now){ render((now - t0) / 1000); requestAnimationFrame(rr); })(t0); }
};
document.fonts.load(`${CFG.fontSize}px "Yusei Magic"`, CFG.text).then(start);
</script>
</body>
</html>
