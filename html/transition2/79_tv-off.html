<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>S79 TV Off</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0f1015;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  #card{position:relative;width:324px;height:106px;border-radius:12px;overflow:hidden;transform-origin:center;}
  .abs{position:absolute;left:0;top:0;width:324px;height:106px;}
  .letter{display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-weight:700;}
  .wrap{transform-origin:50% 53px;}
  #line{position:absolute;left:0;top:51.5px;width:324px;height:3px;background:#ffffff;z-index:8;display:none;transform-origin:50% 50%;
        box-shadow:0 0 4px 1px rgba(255,255,255,0.8),0 0 10px 3px rgba(255,255,255,0.35);border-radius:2px;}
</style>
</head>
<body>
<div id="card">
  <div class="abs wrap" id="aWrap"><div class="abs" id="aBg"></div><div class="abs letter" id="aLet"></div></div>
  <div class="abs wrap" id="bWrap"><div class="abs" id="bBg"></div><div class="abs letter" id="bLet"></div></div>
  <div id="line"></div>
</div>
<script>
/* ========== CFG：可換內容集中在這裡 ========== */
const CFG = {
  sceneA: { img:'img/A_scene.jpg', bg:'#f4f0e6', letter:'A', color:'#1f1e1e' },   // 轉場前的畫面（底色＋字，或圖）
  sceneB: { img:'img/B_scene.jpg', bg:'#795400', letter:'B', color:'#f4e8d6' },   // 轉場後的畫面
  fontSize: 54,
  frameOpacity: 0.42,   // 內框線（字色的不透明度）
  decoOpacity: 0.8,     // 左上圓點、右下小方塊
  back: '#0b0d12'       // 關機時的黑畫面
};
/* ========== 動態參數（30fps 幀為單位）==========
   一輪 = 53 幀。兩幕直接切換（映像管電視關機→開機）：
   關機：舊畫面整張先過曝變亮（亮度 第 8／9／10 幀 ＝ 1.05／1.6／2 倍），同時以水平中線為軸上下壓扁（高度比 第 7／8／9／10／11 幀 ＝ 1／.98／.80／.52／.03），
   第 10.5 幀起變成一條橫貫全寬的白色亮線（3px＋白光暈），第 12 幀起亮線往中心左右縮短（寬度比 第 12／13／14／15 幀 ＝ 1／.86／.38／.04），縮成一個亮點，第 15～16 幀淡掉，畫面全黑。
   開機：第 16.5 幀中心亮起一點、往左右拉成亮線（寬度比 第 16.5／17／18／18.5 幀 ＝ .05／.69／.97／1），
   第 18.5 幀起新畫面從亮線上下撐開（高度比 第 18.5／19／20／21 幀 ＝ .06／.36／.79／1），剛開時過亮再回正常（亮度 第 18.5／19／20／21／22 幀 ＝ 2／1.77／1.32／1.12／1），亮線第 19 幀淡掉。
   入場（c<27）：A 關機、B 開機；退場（c≥27）：同樣的動作晚 27 幀，B 關機、A 開機。 */
const LOOP = 53, EXIT = 27;
const OFF_SY = [[7,1],[8,.98],[9,.80],[10,.52],[11,.03]];
const OFF_BR = [[7,1],[8,1.05],[9,1.6],[10,2]];
const OFF_LX = [[12,1],[13,.86],[14,.38],[15,.04]];
const ON_LX  = [[16.5,.05],[17,.69],[18,.97],[18.5,1]];
const ON_SY  = [[18.5,.06],[19,.36],[20,.79],[21,1]];
const ON_BR  = [[18.5,2],[19,1.77],[20,1.32],[21,1.12],[22,1]];
const LINE_OP = [[10.4,0],[10.6,1],[15,1],[16,0],[16.4,0],[16.6,1],[18.6,1],[19.2,0]];
function lerpTab(tab, x){
  if (x <= tab[0][0]) return tab[0][1];
  for (let i=1;i<tab.length;i++) if (x <= tab[i][0]){ const a=tab[i-1], b=tab[i]; return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); }
  return tab[tab.length-1][1];
}
const $ = id => document.getElementById(id);
let USEIMG = false;
function paintScene(bg, let_, s){
  bg.innerHTML = '';
  const img = USEIMG && s.img;
  bg.style.background = img ? 'url('+s.img+') center/cover no-repeat' : s.bg;
  if (!img){
    const mk = css => { const d = document.createElement('div'); d.style.cssText = 'position:absolute;'+css; bg.appendChild(d); };
    mk('left:9px;top:8px;width:309px;height:91px;box-sizing:border-box;border:1.5px solid '+s.color+';border-radius:6px;opacity:'+CFG.frameOpacity);
    mk('left:18px;top:18px;width:10px;height:10px;border-radius:50%;background:'+s.color+';opacity:'+CFG.decoOpacity);
    mk('left:298px;top:79px;width:10px;height:10px;background:'+s.color+';opacity:'+CFG.decoOpacity);
  }
  let_.textContent = img ? '' : s.letter; let_.style.color = s.color; let_.style.fontSize = CFG.fontSize+'px';
}
const WR = { a:$('aWrap'), b:$('bWrap') };
function phase(t){
  const c = ((t*30) % LOOP + LOOP) % LOOP;
  return c < EXIT ? { o:'a', n:'b', u:c } : { o:'b', n:'a', u:c-EXIT };
}
function init(){ $('card').style.background = CFG.back; }
function render(t){
  const { o, n, u } = phase(t);
  const wo = WR[o], wn = WR[n], line = $('line');
  // 舊畫面：關機
  if (u < 11){ wo.style.display = ''; wo.style.transform = 'scaleY('+lerpTab(OFF_SY, u).toFixed(4)+')'; wo.style.filter = 'brightness('+lerpTab(OFF_BR, u).toFixed(3)+')'; }
  else wo.style.display = 'none';
  // 新畫面：開機
  if (u >= 18.5){ wn.style.display = ''; wn.style.transform = 'scaleY('+lerpTab(ON_SY, u).toFixed(4)+')'; wn.style.filter = 'brightness('+lerpTab(ON_BR, u).toFixed(3)+')'; }
  else wn.style.display = 'none';
  // 亮線
  const lo = lerpTab(LINE_OP, u);
  line.style.display = lo > 0 ? 'block' : 'none'; line.style.opacity = lo;
  const lx = u < 16.2 ? lerpTab(OFF_LX, u) : lerpTab(ON_LX, u);
  line.style.transform = 'scaleX('+Math.max(lx, 0.012).toFixed(4)+')';
}
/* ========== 外殼 ========== */
(function(){
  const q = new URLSearchParams(location.search);
  const card = $('card');
  if (q.has('m')) { document.body.style.display='block'; document.body.style.minHeight='0'; } // 量測用：卡片貼左上
  USEIMG = q.has('img');   // ?img=1：兩幕改用圖片
  paintScene($('aBg'), $('aLet'), CFG.sceneA); paintScene($('bBg'), $('bLet'), CFG.sceneB);
  init();
  const z = parseFloat(q.get('z')||'1'); if (z !== 1) card.style.transform = 'scale('+z+')';
  const start = () => {
    if (q.has('t')) { render(parseFloat(q.get('t'))); document.title += ' ready'; return; }
    const t0 = performance.now();
    (function loop(){ render((performance.now()-t0)/1000); requestAnimationFrame(loop); })();
  };
  document.fonts.load('700 54px "Roboto Mono"', 'AB').then(start, start);
})();
</script>
</body>
</html>
