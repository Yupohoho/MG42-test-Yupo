<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>S44 Glitch Jump</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0f1015;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  #card{position:relative;width:324px;height:106px;border-radius:12px;overflow:hidden;transform-origin:center;}
  .abs{position:absolute;left:0;top:0;width:324px;height:106px;}
  .scene{position:absolute;left:0;top:0;width:324px;height:106px;overflow:hidden;}
  .letter{display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-weight:700;}
  .deco i{position:absolute;display:block;}
  .frm{left:9px;top:9px;width:309px;height:90px;box-sizing:border-box;border:2px solid currentColor;border-radius:8px;opacity:.38;}
  .dot{left:18px;top:18px;width:10px;height:10px;border-radius:50%;background:currentColor;opacity:.75;}
  .sq{left:298px;top:79px;width:10px;height:10px;background:currentColor;opacity:.75;}
  .blk{position:absolute;z-index:8;}
</style>
</head>
<body>
<div id="card">
  <div class="scene" id="sceneA"><div class="abs" id="aBg"></div><div class="abs deco" id="aDeco"><i class="frm"></i><i class="dot"></i><i class="sq"></i></div><div class="abs letter" id="aLet"></div></div>
  <div class="scene" id="sceneB"><div class="abs" id="bBg"></div><div class="abs deco" id="bDeco"><i class="frm"></i><i class="dot"></i><i class="sq"></i></div><div class="abs letter" id="bLet"></div></div>
</div>
<script>
/* ========== CFG：可換內容集中在這裡 ========== */
const CFG = {
  sceneA: { img:'img/A_scene.jpg', bg:'#14181e', letter:'A', color:'#ffffff' },   // 轉場前的畫面（底色＋字，或圖）
  sceneB: { img:'img/B_scene.jpg', bg:'#2ed7fe', letter:'B', color:'#0b0f14' },   // 轉場後的畫面
  stage: '#08090c',   // 橫條錯開時露出的底色
  fontSize: 52
};
/* ========== 動態參數（30fps 幀為單位）==========
   一輪 52.5 幀，入場 c=0、退場 c=26.25（同一組動作，A、B 角色互換）。
   舊畫面先故障 15 幀再硬切到新畫面（c=15）。故障時畫面切成 7 條橫帶（BANDS），每條各自左右錯開（STEPS 的位移，
   多半每 2 幀換一次，逐幀硬切不補間）；其中 3 次是「強烈幀」（J）：位移更大、對比拉高（深色更深、亮色更亮），
   邊緣還會冒出幾塊新畫面顏色的方塊（BLOCKS）。新畫面出現時是乾淨的，不再故障。 */
const LOOP = 52.5, EXIT = 26.25, SHIFT = 5, CUT = 15;
const BANDS = [[0,26],[26,36],[36,54],[54,71],[71,89],[89,100],[100,106]];
const SET = {
  J1:[6,-30,26,-34,30,-10,4],  S1:[0,-20,-24,20,-26,-4,0],  S2:[0,-18,-20,20,-6,-6,0],
  J2:[-8,22,-30,18,-24,12,-6], S3:[0,-20,12,-28,30,2,14],   S4:[0,6,30,-28,16,6,-16],
  J3:[4,-12,16,-20,10,-6,2],   S5:[0,2,-6,-6,-6,6,-16] };
const BLOCKS = {   // 新畫面顏色的方塊 [x, y, w, h]
  J1:[[0,36,10,18],[310,54,14,17],[300,89,24,11]], S1:[[0,72,8,17]], S2:[],
  J2:[[0,26,12,10],[306,71,18,18]], S3:[[316,36,8,18],[0,89,12,11]], S4:[[318,54,6,17]],
  J3:[[0,54,8,17]], S5:[] };
const STEPS = ['J1','J1','S1','S1','S2','S2','J2','J2','S3','S4','S4','J3','J3','S5','S5'];   // c=0..14
const $ = id => document.getElementById(id);
const SC = { A:$('sceneA'), B:$('sceneB') };
const STRIPS = {};   // 每一幕切好的 7 條橫帶（整張場景複製後各自裁切）
const blkEls = [0,1,2].map(() => { const e = document.createElement('div'); e.className = 'blk'; $('card').appendChild(e); return e; });
function render(t){
  const c = (((t*30 - SHIFT) % LOOP) + LOOP) % LOOP;
  const inn = c < EXIT, cc = inn ? c : c - EXIT;
  const ko = inn ? 'A' : 'B', ki = inn ? 'B' : 'A';
  const k = Math.floor(cc);
  const glitch = k < CUT;
  SC.A.style.visibility = SC.B.style.visibility = 'hidden';
  for (const key of ['A','B']) STRIPS[key].forEach(s => s.style.visibility = 'hidden');
  blkEls.forEach(e => e.style.visibility = 'hidden');
  if (!glitch) { SC[ki].style.visibility = 'visible'; return; }
  const name = STEPS[k], sh = SET[name], jolt = name[0] === 'J';
  STRIPS[ko].forEach((s, i) => {
    s.style.visibility = 'visible';
    s.style.transform = 'translateX('+sh[i]+'px)';
    s.style.filter = jolt ? 'contrast(1.6) saturate(1.4)' : 'none';
  });
  BLOCKS[name].forEach(([x,y,w,h], i) => {
    const e = blkEls[i]; e.style.visibility = 'visible';
    e.style.cssText += ';left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;background:'+(ki==='A'?CFG.sceneA.bg:CFG.sceneB.bg);
  });
}
/* ========== 外殼 ========== */
(function(){
  const q = new URLSearchParams(location.search);
  const card = $('card');
  if (q.has('m')) { document.body.style.display='block'; document.body.style.minHeight='0'; } // 量測用：卡片貼左上
  card.style.background = CFG.stage;
  for (const [p, s] of [['a',CFG.sceneA],['b',CFG.sceneB]]){
    const useImg = q.has('img') && s.img;   // ?img=1：兩幕改用圖片
    $(p+'Bg').style.background = useImg ? 'url('+s.img+') center/cover no-repeat' : s.bg;
    const e = $(p+'Let'); e.textContent = useImg ? '' : s.letter; e.style.color = s.color; e.style.fontSize = CFG.fontSize+'px';
    $(p+'Deco').style.color = s.color; if (useImg) $(p+'Deco').style.display = 'none';
  }
  for (const key of ['A','B']){
    STRIPS[key] = BANDS.map(([y0,y1]) => {
      const s = SC[key].cloneNode(true); s.removeAttribute('id'); s.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
      s.style.clipPath = 'inset('+y0+'px 0 '+(106-y1)+'px 0)'; s.style.zIndex = 3; card.appendChild(s); return s;
    });
  }
  const z = parseFloat(q.get('z')||'1'); if (z !== 1) card.style.transform = 'scale('+z+')';
  const start = () => {
    if (q.has('t')) { render(parseFloat(q.get('t'))); document.title += ' ready'; return; }
    const t0 = performance.now();
    (function loop(){ render((performance.now()-t0)/1000); requestAnimationFrame(loop); })();
  };
  document.fonts.load('700 52px "Roboto Mono"', 'AB').then(start, start);
})();
</script>
</body>
</html>
